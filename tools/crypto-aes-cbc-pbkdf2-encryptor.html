<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto AES-CBC & PBKDF2 Encryptor - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto AES-CBC & PBKDF2 Encryptor","url":"https://salabs.quanxs.com/tools/crypto-aes-cbc-pbkdf2-encryptor.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">AES-CBC & PBKDF2 Password Encryptor</h1></header><main class="container"><input type="password" id="pass-in" value="Passphrase123!"><textarea id="plain-in" rows="3">Payload data to encrypt...</textarea><button onclick="encryptAESCBC()">Derive Key & Encrypt AES-CBC</button><textarea id="cipher-out" rows="3" readonly></textarea></main><script>async function encryptAESCBC(){let pass=document.getElementById('pass-in').value,text=document.getElementById('plain-in').value;if(!pass||!text)return;try{let enc=new TextEncoder(),salt=window.crypto.getRandomValues(new Uint8Array(16)),iv=window.crypto.getRandomValues(new Uint8Array(16));let keyMat=await window.crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);let derivedKey=await window.crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},keyMat,{name:"AES-CBC",length:256},false,["encrypt"]);let encrypted=await window.crypto.subtle.encrypt({name:"AES-CBC",iv:iv},derivedKey,enc.encode(text));let combined=new Uint8Array(salt.length+iv.length+encrypted.byteLength);combined.set(salt,0);combined.set(iv,salt.length);combined.set(new Uint8Array(encrypted),salt.length+iv.length);document.getElementById('cipher-out').value=btoa(String.fromCharCode.apply(null,combined));}catch(e){alert('Encryption Error: '+e.message);}}</script></body></html>
