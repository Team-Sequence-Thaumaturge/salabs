<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JWT RS256 Keypair Generator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JWT RS256 Keypair Generator","url":"https://salabs.quanxs.com/tools/jwt-rs256-key-generator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JWT RS256 Keypair Generator</h1></header><main class="container"><button onclick="generateKeys()">Generate RSA Keypair</button><h3>Public Key</h3><textarea id="pub-key" rows="5" readonly></textarea><h3>Private Key</h3><textarea id="priv-key" rows="5" readonly></textarea></main><script>async function generateKeys(){try{let k=await window.crypto.subtle.generateKey({name:"RSASSSA-PKCS1-v1_5",modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:"SHA-256"},true,["sign","verify"]);let pub=await window.crypto.subtle.exportKey("jwk",k.publicKey);let priv=await window.crypto.subtle.exportKey("jwk",k.privateKey);document.getElementById('pub-key').value=JSON.stringify(pub,null,2);document.getElementById('priv-key').value=JSON.stringify(priv,null,2);}catch(e){alert('Crypto error: '+e.message);}}</script></body></html>
