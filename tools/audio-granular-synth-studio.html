<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Granular Synthesizer Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Granular Synthesizer Studio","url":"https://salabs.quanxs.com/tools/audio-granular-synth-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Granular Synthesizer Studio</h1></header><main class="container"><button onclick="triggerGrainCloud()">Trigger Grain Cloud Burst</button><p>Grain Duration (<span id="grain-dur-val">50</span> ms)</p><input type="range" id="grain-dur" min="10" max="200" value="50" oninput="updateGrain()"></main><script>let audioCtx;function triggerGrainCloud(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();let dur=parseInt(document.getElementById('grain-dur').value)/1000;for(let i=0;i<15;i++){let osc=audioCtx.createOscillator();let gain=audioCtx.createGain();osc.frequency.value=200+Math.random()*800;let startTime=audioCtx.currentTime+i*0.05;gain.gain.setValueAtTime(0.2,startTime);gain.gain.exponentialRampToValueAtTime(0.001,startTime+dur);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(startTime);osc.stop(startTime+dur);}}function updateGrain(){document.getElementById('grain-dur-val').innerText=document.getElementById('grain-dur').value;}</script></body></html>
