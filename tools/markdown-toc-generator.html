<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Markdown Table of Contents (TOC) Generator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Markdown TOC Generator","url":"https://salabs.quanxs.com/tools/markdown-toc-generator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Markdown TOC Generator</h1></header><main class="container"><h3>Markdown Input</h3><textarea id="md-in" rows="6" oninput="generateTOC()"></textarea><h3>Generated TOC</h3><textarea id="toc-out" rows="6" readonly></textarea></main><script>function generateTOC(){let text=document.getElementById('md-in').value;if(!text){document.getElementById('toc-out').value='';return;}let lines=text.split('\n');let toc=[];lines.forEach(line=>{let match=line.match(/^(#{1,6})\s+(.+)$/);if(match){let level=match[1].length;let title=match[2].trim();let slug=title.toLowerCase().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-');let indent='  '.repeat(level-1);toc.push(`${indent}- [${title}](#${slug})`);}});document.getElementById('toc-out').value=toc.join('\n');}generateTOC();</script></body></html>
