<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto AES-KW Key Wrap Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto AES-KW Key Wrap Studio","url":"https://salabs.quanxs.com/tools/crypto-aes-kw-key-wrap.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">AES-KW Key Wrap Studio</h1></header><main class="container"><button onclick="wrapKey()">Generate & Wrap Key Pair</button><textarea id="wrap-out" rows="4" readonly></textarea></main><script>async function wrapKey(){try{let wKey=await window.crypto.subtle.generateKey({name:"AES-KW",length:256},true,["wrapKey","unwrapKey"]);let kToWrap=await window.crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt"]);let wBuf=await window.crypto.subtle.wrapKey("raw",kToWrap,wKey,"AES-KW");let hex=Array.from(new Uint8Array(wBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');document.getElementById('wrap-out').value=hex;}catch(e){alert('Key Wrap Error: '+e.message);}}</script></body></html>
