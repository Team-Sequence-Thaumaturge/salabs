<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas Sprite Sheet Animator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas Sprite Sheet Animator","url":"https://salabs.quanxs.com/tools/html-canvas-sprite-sheet-animator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}canvas{background:#0f172a;border-radius:8px;border:1px solid #334155;}input{margin:0.5rem;background:#0f172a;color:#fff;border:1px solid #334155;padding:0.5rem;border-radius:6px;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas Sprite Sheet Animator</h1></header><main class="container"><input type="file" id="sprite-file" accept="image/*" onchange="loadSprite()"><br><label>FW: <input type="number" id="frame-w" value="64" onchange="resetAnim()"></label><label>FH: <input type="number" id="frame-h" value="64" onchange="resetAnim()"></label><br><canvas id="sprite-canvas" width="200" height="200"></canvas></main><script>let img=new Image(),frameIdx=0,animInterval=null;function loadSprite(){let f=document.getElementById('sprite-file').files[0];if(!f)return;let r=new FileReader();r.onload=e=>{img.onload=()=>resetAnim();img.src=e.target.result;};r.readAsDataURL(f);}function resetAnim(){if(animInterval)clearInterval(animInterval);let fw=parseInt(document.getElementById('frame-w').value)||64;let fh=parseInt(document.getElementById('frame-h').value)||64;let cvs=document.getElementById('sprite-canvas'),ctx=cvs.getContext('2d');let total=Math.max(1,Math.floor(img.width/fw));frameIdx=0;animInterval=setInterval(()=>{ctx.clearRect(0,0,cvs.width,cvs.height);if(img.width>0){ctx.drawImage(img,frameIdx*fw,0,fw,fh,(cvs.width-fw)/2,(cvs.height-fh)/2,fw,fh);frameIdx=(frameIdx+1)%total;}},100);}</script></body></html>
