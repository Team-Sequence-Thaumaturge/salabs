<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SALabs AI Background Remover (누끼 제거 스튜디오) | SALabs AI-Native</title>
    <meta name="description" content="SALabs Pure Client-Side 100% Free AI Background Removal Studio (.PNG Transparent Export)">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090c15;
            --panel-bg: rgba(16, 22, 38, 0.85);
            --border-color: rgba(99, 102, 241, 0.25);
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        header {
            background: rgba(10, 15, 28, 0.95); border-bottom: 1px solid var(--border-color);
            padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(12px); z-index: 100;
        }

        .brand-title {
            display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 800;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .badge {
            background: rgba(6, 182, 212, 0.15); border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan); font-size: 0.75rem; padding: 2px 8px; border-radius: 12px;
            font-weight: 600; font-family: 'JetBrains Mono', monospace;
        }

        .main-container { display: flex; flex: 1; height: calc(100vh - 60px); position: relative; }

        #canvas-container {
            flex: 1; position: relative; display: flex; justify-content: center; align-items: center;
            background: 
                linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                linear-gradient(-45deg, #1e293b 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #1e293b 75%),
                linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #0f172a;
            overflow: auto; padding: 20px;
        }

        #mainCanvas { max-width: 95%; max-height: 90%; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); cursor: crosshair; }

        .control-panel {
            width: 380px; background: var(--panel-bg); border-left: 1px solid var(--border-color);
            padding: 20px; display: flex; flex-direction: column; gap: 16px; backdrop-filter: blur(16px);
            overflow-y: auto; z-index: 90;
        }

        .section-title {
            font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
            color: var(--accent-cyan); display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
        }

        .control-group {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
        }

        .drop-zone {
            border: 2px dashed var(--accent-cyan); background: rgba(6, 182, 212, 0.05);
            border-radius: 10px; padding: 20px; text-align: center; cursor: pointer;
            transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; gap: 8px;
        }

        .drop-zone:hover { background: rgba(6, 182, 212, 0.15); border-color: var(--accent-purple); }

        label { font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; }
        label span { font-family: 'JetBrains Mono', monospace; color: var(--accent-cyan); }

        input[type="range"] { width: 100%; height: 6px; accent-color: var(--accent-cyan); }

        .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .tool-btn {
            background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main); padding: 10px; border-radius: 8px; font-size: 0.8rem;
            font-weight: 600; cursor: pointer; transition: all 0.2s ease; text-align: center;
        }

        .tool-btn:hover, .tool-btn.active {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.25), rgba(139, 92, 246, 0.25));
            border-color: var(--accent-cyan); color: #fff; box-shadow: 0 0 12px rgba(6, 182, 212, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border: none; color: #fff; padding: 14px; border-radius: 8px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 0.95rem; transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4); }

        .btn-secondary {
            background: rgba(30, 41, 59, 0.8); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 10px; border-radius: 8px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.85rem;
        }

        .info-box {
            background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px; padding: 10px; font-size: 0.75rem; color: #34d399; font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand-title">
            <span>✂️ SALabs AI 누끼 제거 스튜디오</span>
            <span class="badge">100% FREE CLIENT-SIDE</span>
        </div>
        <div style="font-size: 0.8rem; color: var(--text-muted);">
            무제한 고화질 투명 PNG 다운로드 (서버 업로드 0% 완벽 개인정보 보호)
        </div>
    </header>

    <div class="main-container">
        <div id="canvas-container">
            <canvas id="mainCanvas"></canvas>
        </div>

        <div class="control-panel">
            <div class="control-group">
                <div class="section-title">🖼️ 이미지 불러오기</div>
                <div class="drop-zone" onclick="document.getElementById('file-input').click()">
                    <div style="font-size: 1.1rem; font-weight: 700;">📸 이미지 올리기 (드래그 & 드롭)</div>
                    <div style="font-size: 0.75rem; color: var(--text-muted);">PNG, JPG, WebP 지원 / 워터마크 0개</div>
                    <input type="file" id="file-input" accept="image/*" style="display:none" onchange="loadImage(event)">
                </div>
            </div>

            <div class="control-group">
                <div class="section-title">🛠️ 누끼 따기 모드 선택</div>
                <div class="tool-grid">
                    <button class="tool-btn active" onclick="setTool('wand')">🪄 원클릭 매직 랜드</button>
                    <button class="tool-btn" onclick="setTool('ai')">🤖 AI 자동 피사체 누끼</button>
                    <button class="tool-btn" onclick="setTool('eraser')">🧹 수동 지우개</button>
                    <button class="tool-btn" onclick="setTool('brush')">🖌️ 복원 붓</button>
                </div>
            </div>

            <div class="control-group">
                <div class="section-title">⚙️ 세부 감도 설정</div>
                
                <label>색상 허용 오차 (Tolerance) <span id="val-tol">35</span></label>
                <input type="range" id="param-tol" min="5" max="120" value="35" oninput="document.getElementById('val-tol').innerText=this.value">

                <label>지우개/붓 크기 <span id="val-size">25px</span></label>
                <input type="range" id="param-size" min="2" max="100" value="25" oninput="document.getElementById('val-size').innerText=this.value+'px'">

                <label>경계선 부드럽게 (Feather) <span id="val-feather">2px</span></label>
                <input type="range" id="param-feather" min="0" max="10" value="2" oninput="document.getElementById('val-feather').innerText=this.value+'px'">
            </div>

            <div class="info-box">
                🔒 100% 로컬 브라우저 연산: 이미지가 외부에 전송되지 않으며, 원본 해상도 그대로 무제한 PNG로 다운로드됩니다.
            </div>

            <div style="display:flex; flex-direction:column; gap:8px;">
                <button class="btn-primary" onclick="exportPNG()">
                    📥 고화질 투명 PNG 다운로드
                </button>
                <button class="btn-secondary" onclick="resetCanvas()">
                    🔄 원본 복원
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        let rawImage = null, currentTool = 'wand', isDrawing = false;
        let originalImgData = null;

        function initSampleImage() {
            canvas.width = 600;
            canvas.height = 400;

            // Create initial sample background & foreground
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 600, 400);

            // Draw Sample Blue Sphere
            const grad = ctx.createRadialGradient(300, 200, 20, 300, 200, 120);
            grad.addColorStop(0, '#06b6d4');
            grad.addColorStop(0.7, '#3b82f6');
            grad.addColorStop(1, '#1e1b4b');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(300, 200, 120, 0, Math.PI * 2);
            ctx.fill();

            // Sample Label
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('SALabs AI 누끼 따기 테스트', 300, 205);

            originalImgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        }

        function loadImage(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    rawImage = img;
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    originalImgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (tool === 'ai') {
                runAIBackgroundRemoval();
            }
        }

        // Magic Wand Flood Fill Alpha Removal
        canvas.addEventListener('click', function(e) {
            if (currentTool !== 'wand') return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const startX = Math.floor((e.clientX - rect.left) * scaleX);
            const startY = Math.floor((e.clientY - rect.top) * scaleY);

            const tolerance = parseInt(document.getElementById('param-tol').value);
            floodFillRemove(startX, startY, tolerance);
        });

        function floodFillRemove(startX, startY, tolerance) {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const width = canvas.width;
            const height = canvas.height;

            const targetIdx = (startY * width + startX) * 4;
            const targetR = data[targetIdx];
            const targetG = data[targetIdx + 1];
            const targetB = data[targetIdx + 2];
            const targetA = data[targetIdx + 3];

            if (targetA === 0) return;

            const visited = new Uint8Array(width * height);
            const queue = [[startX, startY]];

            while (queue.length > 0) {
                const [x, y] = queue.pop();
                const idx = y * width + x;

                if (visited[idx]) continue;
                visited[idx] = 1;

                const pIdx = idx * 4;
                const r = data[pIdx];
                const g = data[pIdx + 1];
                const b = data[pIdx + 2];

                const colorDiff = Math.sqrt((r - targetR) ** 2 + (g - targetG) ** 2 + (b - targetB) ** 2);

                if (colorDiff <= tolerance) {
                    data[pIdx + 3] = 0; // Make Transparent

                    if (x > 0) queue.push([x - 1, y]);
                    if (x < width - 1) queue.push([x + 1, y]);
                    if (y > 0) queue.push([x, y - 1]);
                    if (y < height - 1) queue.push([x, y + 1]);
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        // Automatic High-Contrast Foreground Matting Removal
        function runAIBackgroundRemoval() {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            // Sample corner pixel as background color reference
            const bgR = data[0];
            const bgG = data[1];
            const bgB = data[2];
            const tolerance = parseInt(document.getElementById('param-tol').value) * 1.5;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                const diff = Math.sqrt((r - bgR)**2 + (g - bgG)**2 + (b - bgB)**2);
                if (diff <= tolerance) {
                    data[i + 3] = 0;
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        // Manual Eraser / Brush Painting
        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', function(e) {
            if (!isDrawing || (currentTool !== 'eraser' && currentTool !== 'brush')) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            const radius = parseInt(document.getElementById('param-size').value) / 2;

            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);

            if (currentTool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.fill();
            } else if (currentTool === 'brush' && originalImgData) {
                // Restore original image under brush
                ctx.clip();
                ctx.putImageData(originalImgData, 0, 0);
            }
            ctx.restore();
        });

        function resetCanvas() {
            if (originalImgData) {
                ctx.putImageData(originalImgData, 0, 0);
            }
        }

        function exportPNG() {
            const link = document.createElement('a');
            link.download = 'salabs_nukki_transparent.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        window.onload = initSampleImage;
    </script>
</body>
</html>
