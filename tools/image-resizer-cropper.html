<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Image Resizer & Aspect Ratio Calculator - SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Image Resizer Cropper","url":"https://salabs.quanxs.com/tools/image-resizer-cropper.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input[type="number"],input[type="file"]{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:0.8rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}canvas{max-width:100%;border:1px solid #334155;border-radius:8px;margin-top:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Image Resizer & Aspect Ratio Calculator</h1></header><main class="container"><h3>1. Select Image</h3><input type="file" id="file-input" accept="image/*" onchange="loadImage(event)"><h3>2. Dimensions</h3><div class="grid"><div><label>W (px):</label><input type="number" id="target-w" value="800" oninput="resizeImage()"></div><div><label>H (px):</label><input type="number" id="target-h" value="600" oninput="resizeImage()"></div></div><button onclick="downloadResized()">Download</button><h3>3. Preview</h3><canvas id="preview-canvas"></canvas></main><script>let img=new Image();function loadImage(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(evt){img.onload=function(){document.getElementById('target-w').value=img.width;document.getElementById('target-h').value=img.height;resizeImage();};img.src=evt.target.result;};r.readAsDataURL(f);}function resizeImage(){if(!img.src)return;let c=document.getElementById('preview-canvas');let ctx=c.getContext('2d');let w=parseInt(document.getElementById('target-w').value)||100,h=parseInt(document.getElementById('target-h').value)||100;c.width=w;c.height=h;ctx.drawImage(img,0,0,w,h);}function downloadResized(){let c=document.getElementById('preview-canvas');let a=document.createElement('a');a.download='resized.png';a.href=c.toDataURL('image/png');a.click();}</script></body></html>
