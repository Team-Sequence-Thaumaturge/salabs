<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Delay & Feedback Echo Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Delay & Feedback Echo Studio","url":"https://salabs.quanxs.com/tools/audio-delay-feedback-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Delay & Feedback Echo Studio</h1></header><main class="container"><button onclick="playEchoTone()">Play Pulse Echo</button><p>Delay Time (<span id="delay-val">0.3</span>s)</p><input type="range" id="delay-slider" min="0.05" max="1.0" step="0.05" value="0.3" oninput="updateDelay()"></main><script>let audioCtx,osc,delayNode,feedbackGain;function playEchoTone(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();let now=audioCtx.currentTime;osc=audioCtx.createOscillator();delayNode=audioCtx.createDelay();feedbackGain=audioCtx.createGain();let dTime=parseFloat(document.getElementById('delay-slider').value);delayNode.delayTime.value=dTime;feedbackGain.gain.value=0.4;osc.type='triangle';osc.frequency.value=523.25;osc.connect(audioCtx.destination);osc.connect(delayNode);delayNode.connect(feedbackGain);feedbackGain.connect(delayNode);feedbackGain.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.2);}function updateDelay(){let v=document.getElementById('delay-slider').value;document.getElementById('delay-val').innerText=v;}</script></body></html>
