<script>

    const screen = document.getElementById('asciiScreen');
    const speedSlider = document.getElementById('speedSlider');
    const speedVal = document.getElementById('speedVal');
    const densitySlider = document.getElementById('densitySlider');
    const densityVal = document.getElementById('densityVal');
    const topologySelect = document.getElementById('topologySelect');

    const CHAR_SETS = [
      " .:-=+*#%@",
      " .'`^",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$",
      " .:░▒▓█"
    ];

    let A = 0, B = 0;
    const COLS = 72, ROWS = 36;

    function render() {
      const speed = parseFloat(speedSlider.value);
      speedVal.innerText = speed.toFixed(1) + "x";
      const charset = CHAR_SETS[parseInt(densitySlider.value) - 1];

      A += 0.03 * speed;
      B += 0.02 * speed;

      const zBuffer = new Float32Array(COLS * ROWS);
      const output = new Array(COLS * ROWS).fill(' ');

      const mode = topologySelect.value;

      const uSteps = 40, vSteps = 40;
      for (let i = 0; i < uSteps; i++) {
        const u = (i / uSteps) * Math.PI * 2;
        for (let j = 0; j < vSteps; j++) {
          const v = (j / vSteps) * Math.PI * 2;
          let x = 0, y = 0, z = 0;

          if (mode === 'klein') {
            const r = 2.0;
            x = (r + Math.cos(u / 2) * Math.sin(v) - Math.sin(u / 2) * Math.sin(2 * v)) * Math.cos(u);
            y = (r + Math.cos(u / 2) * Math.sin(v) - Math.sin(u / 2) * Math.sin(2 * v)) * Math.sin(u);
            z = Math.sin(u / 2) * Math.sin(v) + Math.cos(u / 2) * Math.sin(2 * v);
          } else if (mode === 'crosscap') {
            x = Math.sin(u) * Math.sin(2 * v) / 2;
            y = Math.sin(2 * u) * Math.cos(v) * Math.cos(v);
            z = Math.cos(2 * u) * Math.cos(v) * Math.cos(v);
          } else {
            x = Math.cos(u) * Math.sin(v);
            y = Math.sin(u) * Math.sin(v);
            z = Math.cos(v) + Math.sin(u * 2) * 0.5;
          }

          // 3D Rotation (Euler angles)
          let y1 = y * Math.cos(A) - z * Math.sin(A);
          let z1 = y * Math.sin(A) + z * Math.cos(A);
          let x1 = x * Math.cos(B) + z1 * Math.sin(B);
          let z2 = -x * Math.sin(B) + z1 * Math.cos(B);

          const K1 = 30;
          const ooz = 1 / (z2 + 5.5);
          const xp = Math.floor(COLS / 2 + K1 * x1 * ooz * 1.8);
          const yp = Math.floor(ROWS / 2 - K1 * y1 * ooz);

          if (xp >= 0 && xp < COLS && yp >= 0 && yp < ROWS) {
            const idx = xp + yp * COLS;
            if (ooz > zBuffer[idx]) {
              zBuffer[idx] = ooz;
              const luminance = Math.max(0, Math.min(1, (z2 + 2) / 4));
              const charIdx = Math.floor(luminance * (charset.length - 1));
              output[idx] = charset[charIdx];
            }
          } 
        }
      }

      let res = '';
      for (let r = 0; r < ROWS; r++) {
        res += output.slice(r * COLS, (r + 1) * COLS).join('') + '\n';
      }
      screen.textContent = res;
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  
</script>
