    <style>

<script>

        let audioCtx = null;
        let analyser = null;
        let masterGain = null;
        let isRunning = false;
        let isFrozen = false;
        let frozenBuffer = null;
        let grainInterval = null;
        let micStream = null;

        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 1024;
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.75;
            masterGain.connect(audioCtx.destination);
            analyser.connect(masterGain);
        }

        function createSynthGrain() {
            if (!audioCtx || !isRunning) return;
            const now = audioCtx.currentTime;
            const grainDur = parseFloat(document.getElementById('grainSize').value) / 1000;
            const pitchShift = parseFloat(document.getElementById('pitch').value);
            const freq = 220 * Math.pow(2, (pitchShift + (Math.random() * 2 - 1) * (parseFloat(document.getElementById('spray').value) / 20)) / 12);

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = isFrozen ? 'sawtooth' : 'sine';
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.3, now + grainDur * 0.4);
            gain.gain.linearRampToValueAtTime(0, now + grainDur);

            osc.connect(gain);
            gain.connect(analyser);

            osc.start(now);
            osc.stop(now + grainDur);
        }

        function startGrainScheduler() {
            if (grainInterval) clearInterval(grainInterval);
            const density = parseInt(document.getElementById('density').value);
            grainInterval = setInterval(() => {
                createSynthGrain();
            }, 1000 / density);
        }

        document.getElementById('powerBtn').addEventListener('click', () => {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            isRunning = !isRunning;
            if (isRunning) {
                document.getElementById('powerBtn').textContent = '⏹ Stop Synthesizer';
                document.getElementById('freezeBtn').disabled = false;
                startGrainScheduler();
                drawVisualizer();
            } else {
                document.getElementById('powerBtn').textContent = '▶ Start Synthesizer';
                document.getElementById('freezeBtn').disabled = true;
                if (grainInterval) clearInterval(grainInterval);
            }
        });

        document.getElementById('freezeBtn').addEventListener('click', () => {
            isFrozen = !isFrozen;
            const btn = document.getElementById('freezeBtn');
            btn.classList.toggle('active', isFrozen);
            btn.textContent = isFrozen ? '🔥 Unfreeze Spectrum' : '❄ Freeze Spectrum';
        });

        ['grainSize', 'density', 'pitch', 'spray', 'feedback', 'volume'].forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('input', (e) => {
                document.getElementById(id + 'Val').textContent = e.target.value;
                if (id === 'density' && isRunning) startGrainScheduler();
                if (id === 'volume' && masterGain) masterGain.gain.value = e.target.value / 100;
            });
        });

        function drawVisualizer() {
            if (!isRunning) return;
            requestAnimationFrame(drawVisualizer);

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            ctx.fillStyle = 'rgba(5, 8, 15, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / bufferLength) * 2.5;
            let barHeight;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                barHeight = (dataArray[i] / 255) * canvas.height;
                const hue = isFrozen ? 320 + (i / bufferLength) * 60 : 180 + (i / bufferLength) * 120;
                ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
                ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }
    
</script>

                </div>
                <div class="control-group">

                    <input type="range" id="density" min="2" max="60" value="25">
                </div>
                <div class="control-group">
                    <label>Pitch Shift (<span id="pitchVal">0</span> semitones)</label>
                    <input type="range" id="pitch" min="-24" max="24" value="0">
                </div>
                <div class="control-group">
                    <label>Position Spray / Jitter (<span id="sprayVal">30</span>%)</label>
                    <input type="range" id="spray" min="0" max="100" value="30">
                </div>
                <div class="control-group">
                    <label>Harmonic Feedback (<span id="feedbackVal">40</span>%)</label>
                    <input type="range" id="feedback" min="0" max="95" value="40">
                </div>
                <div class="control-group">
                    <label>Master Output Gain (<span id="volumeVal">75</span>%)</label>
                    <input type="range" id="volume" min="0" max="100" value="75">
                </div>
            </div>
        </div>
    </main>
