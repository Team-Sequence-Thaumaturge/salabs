<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto Secp256k1 ECDSA Signer - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto Secp256k1 ECDSA Signer","url":"https://salabs.quanxs.com/tools/crypto-secp256k1-ecdsa-signer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Web Crypto Secp256k1 ECDSA Signer</h1></header><main class="container"><button onclick="generateECKey()">Generate ECDSA Keypair</button><textarea id="payload" rows="3">Bitcoin / Ethereum Web3 Signature Payload</textarea><button onclick="signPayload()">Sign Payload</button><textarea id="sig-out" rows="3" readonly></textarea></main><script>let keyPair=null;async function generateECKey(){try{keyPair=await window.crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign","verify"]);alert("Keypair Generated!");}catch(e){alert(e.message);}}async function signPayload(){if(!keyPair)await generateECKey();try{let msg=document.getElementById('payload').value,enc=new TextEncoder();let sig=await window.crypto.subtle.sign({name:"ECDSA",hash:{name:"SHA-256"}},keyPair.privateKey,enc.encode(msg));document.getElementById('sig-out').value=btoa(String.fromCharCode.apply(null,new Uint8Array(sig)));}catch(e){alert(e.message);}}</script></body></html>
