<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas Color Palette Extractor - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas Color Palette Extractor","url":"https://salabs.quanxs.com/tools/html-canvas-color-palette-extractor.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.palette-row{display:flex;gap:1rem;margin-top:1rem;}.swatch{flex:1;height:80px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-family:monospace;border:1px solid #334155;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas Image Color Palette Extractor</h1></header><main class="container"><input type="file" id="img-file" accept="image/*" onchange="extractPalette()"><div id="swatch-container" class="palette-row"></div></main><script>function extractPalette(){let f=document.getElementById('img-file').files[0];if(!f)return;let img=new Image(),r=new FileReader();r.onload=e=>{img.onload=()=>{let c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=50;c.height=50;ctx.drawImage(img,0,0,50,50);let d=ctx.getImageData(0,0,50,50).data,sw=[];for(let i=0;i<5;i++){let idx=Math.floor(Math.random()*2500)*4;let red=d[idx].toString(16).padStart(2,'0'),grn=d[idx+1].toString(16).padStart(2,'0'),blu=d[idx+2].toString(16).padStart(2,'0');sw.push(`#${red}${grn}${blu}`);}document.getElementById('swatch-container').innerHTML=sw.map(hex=>`<div class="swatch" style="background:${hex};c
