<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Formant Vowel Filter Engine v2002 | SA Labs Developer Utilities</title>
    <meta name="description" content="100% Client-Side Web Audio API Formant Vowel Filter Engine v2002 for developer sound synthesis and DSP processing.">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011"
     crossorigin="anonymous"></script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Audio Formant Vowel Filter Engine v2002",
      "url": "https://salabs.quanxs.com/tools/audio-formant-vowel-filter-v2002.html",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript and Web Audio API support"
    }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 0; }
        .control-group { margin-bottom: 20px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; }
        select, input, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #f8fafc; font-size: 14px; box-sizing: border-box; }
        button { background: #0284c7; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        .status { margin-top: 15px; padding: 12px; border-radius: 6px; background: #334155; color: #38bdf8; font-family: monospace; text-align: center; }
        canvas { width: 100%; height: 150px; background: #020617; border-radius: 8px; margin-top: 15px; border: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Audio Formant Vowel Filter Engine v2002</h1>
        <p style="color: #94a3b8;">High-precision client-side Web Audio API Formant Vowel Synthesis Filter. Zero server processing.</p>
        
        <div class="control-group">
            <label for="vowelSelect">Select Formant Vowel Profile:</label>
            <select id="vowelSelect">
                <option value="A">Vowel /a/ (Ah - 730Hz, 1090Hz, 2440Hz)</option>
                <option value="E">Vowel /e/ (Eh - 530Hz, 1840Hz, 2480Hz)</option>
                <option value="I">Vowel /i/ (Ee - 270Hz, 2290Hz, 3010Hz)</option>
                <option value="O">Vowel /o/ (Oh - 570Hz, 840Hz, 2410Hz)</option>
                <option value="U">Vowel /u/ (Oo - 300Hz, 870Hz, 2240Hz)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="pitchFreq">Fundamental Frequency (Hz): <span id="pitchVal">130</span> Hz</label>
            <input type="range" id="pitchFreq" min="60" max="400" value="130">
        </div>

        <div class="control-group">
            <button id="startBtn">Start Audio Oscillator & Formant Filter</button>
            <button id="stopBtn" style="background: #e11d48; display: none;">Stop Engine</button>
        </div>

        <div id="statusBox" class="status">Engine Ready (Stopped)</div>
        <canvas id="visualizer"></canvas>
    </div>

    <script>
        let audioCtx, osc, f1, f2, f3, gainNode, analyser;
        let isPlaying = false;

        const vowels = {
            'A': [730, 1090, 2440],
            'E': [530, 1840, 2480],
            'I': [270, 2290, 3010],
            'O': [570, 840, 2410],
            'U': [300, 870, 2240]
        };

        document.getElementById('pitchFreq').addEventListener('input', (e) => {
            document.getElementById('pitchVal').innerText = e.target.value;
            if (osc) osc.frequency.setValueAtTime(e.target.value, audioCtx.currentTime);
        });

        document.getElementById('vowelSelect').addEventListener('change', updateFormants);

        function updateFormants() {
            if (!isPlaying) return;
            const profile = vowels[document.getElementById('vowelSelect').value];
            f1.frequency.setTargetAtTime(profile[0], audioCtx.currentTime, 0.05);
            f2.frequency.setTargetAtTime(profile[1], audioCtx.currentTime, 0.05);
            f3.frequency.setTargetAtTime(profile[2], audioCtx.currentTime, 0.05);
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            if (isPlaying) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            osc = audioCtx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.value = document.getElementById('pitchFreq').value;

            f1 = audioCtx.createBiquadFilter(); f1.type = 'bandpass'; f1.Q.value = 5;
            f2 = audioCtx.createBiquadFilter(); f2.type = 'bandpass'; f2.Q.value = 5;
            f3 = audioCtx.createBiquadFilter(); f3.type = 'bandpass'; f3.Q.value = 5;

            gainNode = audioCtx.createGain(); gainNode.gain.value = 0.2;
            analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;

            const profile = vowels[document.getElementById('vowelSelect').value];
            f1.frequency.value = profile[0];
            f2.frequency.value = profile[1];
            f3.frequency.value = profile[2];

            osc.connect(f1); osc.connect(f2); osc.connect(f3);
            f1.connect(gainNode); f2.connect(gainNode); f3.connect(gainNode);
            gainNode.connect(analyser); analyser.connect(audioCtx.destination);

            osc.start();
            isPlaying = true;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
            document.getElementById('statusBox').innerText = 'Engine Active - Synthesizing Formant Vowel';
            drawVisualizer();
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            if (!isPlaying) return;
            osc.stop();
            audioCtx.close();
            isPlaying = false;
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('statusBox').innerText = 'Engine Stopped';
        });

        function drawVisualizer() {
            if (!isPlaying) return;
            requestAnimationFrame(drawVisualizer);
            const canvas = document.getElementById('visualizer');
            const ctx = canvas.getContext('2d');
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / bufferLength) * 2.5;
            let x = 0;
            for (let i = 0; i < bufferLength; i++) {
                const barHeight = dataArray[i] / 2;
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }
    </script>
</body>
</html>
