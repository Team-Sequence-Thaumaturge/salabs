ocument.getElementById('p2y').value;document.getElementById('vp1x').innerText=p1x;document.getElementById('vp1y').innerText=p1y;document.getElementById('vp2x').innerText=p2x;document.getElementById('vp2y').innerText=p2y;let val=`cubic-bezier(${p1x}, ${p1y}, ${p2x}, ${p2y})`;document.getElementById('preview').style.transitionTimingFunction=val;document.getElementById('css-out').value=`transition-timing-function: ${val};`;}function triggerAnim(){let box=document.getElementById('preview');box.style.left=box.style.left==='80%'?'0px':'80%';}updateBezier();</script></body></html>
