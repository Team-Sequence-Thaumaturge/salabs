<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>CSS Flexbox & Grid Realtime Visual Playground - SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"CSS Flexbox Grid Playground","url":"https://salabs.quanxs.com/tools/flex-grid-playground.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1100px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem;background:#0f172a;padding:1rem;border-radius:8px;}select{width:100%;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:6px;padding:0.5rem;}#preview-box{background:#020617;border:2px dashed #38bdf8;border-radius:8px;min-height:200px;padding:1rem;}.box-item{background:#38bdf8;color:#0f172a;font-weight:bold;padding:1rem;border-radius:6px;text-align:center;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;font-family:monospace;box-sizing:border-box;margin-top:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">CSS Flexbox & Grid Visual Playground</h1></header><main class="container"><div class="controls"><div><label>Display</label><select id="ctrl-display" onchange="updateLayout()"><option value="flex">flex</option><option value="grid">grid</option></select></div><div><label>Justify</label><select id="ctrl-justify" onchange="updateLayout()"><option value="center">center</option><option value="flex-start">flex-start</option><option value="space-between">space-between</option></select></div><div><label>Gap</label><select id="ctrl-gap" onchange="updateLayout()"><option value="16px">16px</option><option value="8px">8px</option><option value="24px">24px</option></select></div></div><div id="preview-box"><div class="box-item">Box 1</div><div class="box-item">Box 2</div><div class="box-item">Box 3</div></div><textarea id="css-code" rows="4" readonly></textarea></main><script>function updateLayout(){let d=document.getElementById('ctrl-display').value;let j=document.getElementById('ctrl-justify').value;let g=document.getElementById('ctrl-gap').value;let b=document.getElementById('preview-box');b.style.display=d;b.style.justifyContent=j;b.style.gap=g;if(d==='grid')b.style.gridTemplateColumns='repeat(3, 1fr)';else b.style.gridTemplateColumns='none';document.getElementById('css-code').value='display: '+d+';\njustify-content: '+j+';\ngap: '+g+';';}updateLayout();</script></body></html>
