<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Phase Vocoder & Pitch Multiplier Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Phase Vocoder & Pitch Multiplier Studio","url":"https://salabs.quanxs.com/tools/audio-spectral-vocoder-phase-vocoder.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Phase Vocoder & Pitch Multiplier Studio</h1></header><main class="container"><button onclick="playVocoder()">Play Phase Vocoder Harmonics</button><p>Phase Pitch Multiplier (<span id="p-val">1.5</span>x)</p><input type="range" id="p-slider" min="0.5" max="3.0" step="0.1" value="1.5" oninput="updateVocoder()"></main><script>let audioCtx,osc,filter;function playVocoder(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();osc=audioCtx.createOscillator();filter=audioCtx.createBiquadFilter();let mult=parseFloat(document.getElementById('p-slider').value);osc.type='sawtooth';osc.frequency.value=220*mult;filter.type='bandpass';filter.frequency.value=800*mult;filter.Q.value=4;osc.connect(filter);filter.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.5);}function updateVocoder(){let v=document.getElementById('p-slider').value;document.getElementById('p-val').innerText=v;}</script></body></html>
