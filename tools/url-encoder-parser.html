<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>URL Encoder / Decoder & Query String Parser - SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"URL Encoder Parser","url":"https://salabs.quanxs.com/tools/url-encoder-parser.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-right:0.5rem;}table{width:100%;border-collapse:collapse;margin-top:1rem;}th,td{border:1px solid #334155;padding:0.75rem;text-align:left;font-family:monospace;}th{background:#0f172a;color:#38bdf8;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">URL Encoder / Decoder & Query String Parser</h1></header><main class="container"><h3>1. Input URL</h3><textarea id="url-input" rows="4" placeholder="Paste URL..."></textarea><div><button onclick="encodeURL()">Encode</button><button onclick="decodeURL()">Decode</button><button onclick="parseQueryParams()">Parse Params</button></div><h3>2. Output</h3><textarea id="url-output" rows="4" readonly></textarea><h3>3. Parsed Query Params</h3><table id="params-table"><thead><tr><th>Key</th><th>Value</th></tr></thead><tbody><tr><td colspan="2" style="text-align:center;color:#94a3b8;">No params parsed</td></tr></tbody></table></main><script>function encodeURL(){document.getElementById('url-output').value=encodeURIComponent(document.getElementById('url-input').value);}function decodeURL(){try{document.getElementById('url-output').value=decodeURIComponent(document.getElementById('url-input').value);}catch(e){document.getElementById('url-output').value=e.message;}}function parseQueryParams(){let val=document.getElementById('url-input').value;let tbody=document.querySelector('#params-table tbody');tbody.innerHTML='';try{let urlObj=new URL(val.startsWith('http')?val:'http://dummy.com/'+val);let entries=Array.from(new URLSearchParams(urlObj.search).entries());if(entries.length===0){tbody.innerHTML='<tr><td colspan="2" style="text-align:center;color:#94a3b8;">No query params found</td></tr>';return;}entries.forEach(([k,v])=>{let tr=document.createElement('tr');tr.innerHTML='<td>'+k+'</td><td>'+v+'</td>';tbody.appendChild(tr);});}catch(e){tbody.innerHTML='<tr><td colspan="2" style="color:#ef4444;">Invalid URL</td></tr>';}}</script></body></html>
