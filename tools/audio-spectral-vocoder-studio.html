<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Spectral Vocoder Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Spectral Vocoder Studio","url":"https://salabs.quanxs.com/tools/audio-spectral-vocoder-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Spectral Vocoder Studio</h1></header><main class="container"><button onclick="playSpectralVocoder()">Play Spectral Vocoder Synth</button><p>Carrier Frequency (<span id="band-val">1200</span> Hz)</p><input type="range" id="band-slider" min="200" max="3500" value="1200" oninput="updateBand()"></main><script>let audioCtx,osc,bandFilter;function playSpectralVocoder(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();osc=audioCtx.createOscillator();bandFilter=audioCtx.createBiquadFilter();let freq=parseFloat(document.getElementById('band-slider').value);osc.type='sawtooth';osc.frequency.value=180;bandFilter.type='bandpass';bandFilter.frequency.value=freq;bandFilter.Q.value=8;osc.connect(bandFilter);bandFilter.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.5);}function updateBand(){let v=document.getElementById('band-slider').value;document.getElementById('band-val').innerText=v;if(bandFilter)bandFilter.frequency.value=parseFloat(v);}</script></body></html>
