<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Ring Modulator Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Ring Modulator Studio","url":"https://salabs.quanxs.com/tools/audio-ring-modulator-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Ring Modulator Studio</h1></header><main class="container"><button onclick="playRingMod()">Play Ring Modulated Tone</button><p>Modulation Frequency (<span id="freq-val">30</span> Hz)</p><input type="range" id="freq-slider" min="5" max="200" value="30" oninput="updateFreq()"></main><script>let audioCtx,carrier,modulator,modGain;function playRingMod(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(carrier)carrier.stop();if(modulator)modulator.stop();carrier=audioCtx.createOscillator();modulator=audioCtx.createOscillator();modGain=audioCtx.createGain();carrier.type='sine';carrier.frequency.value=440;let modFreq=parseFloat(document.getElementById('freq-slider').value);modulator.type='sine';modulator.frequency.value=modFreq;modulator.connect(modGain.gain);carrier.connect(modGain);modGain.connect(audioCtx.destination);carrier.start();modulator.start();carrier.stop(audioCtx.currentTime+1.5);modulator.stop(audioCtx.currentTime+1.5);}function updateFreq(){let v=document.getElementById('freq-slider').value;document.getElementById('freq-val').innerText=v;if(modulator)modulator.frequency.value=parseFloat(v);}</script></body></html>
