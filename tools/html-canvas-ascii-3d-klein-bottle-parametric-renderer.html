<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Parametric Klein Bottle ASCII Renderer | Quanxs SA Labs</title>
  <meta name="description" content="Interactive client-side 3D parametric figure-8 Klein Bottle manifold ASCII raymarcher and wireframe topology engine.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "3D Parametric Klein Bottle ASCII Renderer",
    "description": "Real-time client-side 3D non-orientable Klein bottle manifold topology ASCII visualizer.",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>
  <style>
    :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.4; }
    .container { max-width: 900px; margin: 0 auto; }
    header { border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
    h1 { color: #fff; font-size: 1.4rem; margin-bottom: 5px; }
    p.desc { color: #8b949e; font-size: 0.85rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 20px; margin-bottom: 20px; }
    #ascii-display { background: #000; color: #58a6ff; font-size: 10px; line-height: 10px; letter-spacing: -1px; white-space: pre; border-radius: 6px; padding: 15px; border: 1px solid var(--border); overflow-x: auto; text-align: center; min-height: 380px; }
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
    .control-group { display: flex; flex-direction: column; gap: 5px; font-size: 0.85rem; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .stat-badge { display: inline-block; background: #8957e5; color: #fff; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; margin-bottom: 10px; }
  </style>
<script>

    const display = document.getElementById('ascii-display');
    const chars = " .,:;i1tfLCG08@";
    let angleX = 0;
    let angleY = 0;
    let speedX = 0.02;
    let speedY = 0.025;
    let radiusParam = 2.0;

    const width = 64;
    const height = 34;

    function renderFrame() {
      const zBuffer = new Array(width * height).fill(-Infinity);
      const screenBuffer = new Array(width * height).fill(' ');

      const cosX = Math.cos(angleX), sinX = Math.sin(angleX);
      const cosY = Math.cos(angleY), sinY = Math.sin(angleY);

      const stepsU = 45;
      const stepsV = 45;

      for (let i = 0; i < stepsU; i++) {
        const u = (i / stepsU) * 2 * Math.PI;
        for (let j = 0; j < stepsV; j++) {
          const v = (j / stepsV) * 2 * Math.PI;

          const r = radiusParam;
          const x0 = (r + Math.cos(u / 2) * Math.sin(v) - Math.sin(u / 2) * Math.sin(2 * v)) * Math.cos(u);
          const y0 = (r + Math.cos(u / 2) * Math.sin(v) - Math.sin(u / 2) * Math.sin(2 * v)) * Math.sin(u);
          const z0 = Math.sin(u / 2) * Math.sin(v) + Math.cos(u / 2) * Math.sin(2 * v);

          const y1 = y0 * cosX - z0 * sinX;
          const z1 = y0 * sinX + z0 * cosX;
          const x1 = x0 * cosY + z1 * sinY;
          const z2 = -x0 * sinY + z1 * cosY + 7.5;

          const ooz = 1 / z2;
          const xp = Math.floor(width / 2 + x1 * ooz * 38);
          const yp = Math.floor(height / 2 + y1 * ooz * 20);

          if (xp >= 0 && xp < width && yp >= 0 && yp < height) {
            const idx = xp + yp * width;
            if (ooz > zBuffer[idx]) {
              zBuffer[idx] = ooz;
              const luminance = Math.floor(((z0 + 2.5) / 5.0) * (chars.length - 1));
              const charIdx = Math.max(0, Math.min(chars.length - 1, luminance));
              screenBuffer[idx] = chars[charIdx];
            }
          }
        }
      }

      let output = '';
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          output += screenBuffer[x + y * width];
        }
        output += '\n';
      }

      display.textContent = output;
      angleX += speedX;
      angleY += speedY;
      requestAnimationFrame(renderFrame);
    }

    document.getElementById('rot-speed-x').oninput = (e) => {
      speedX = e.target.value / 500;
      document.getElementById('val-speed-x').textContent = (e.target.value / 10).toFixed(1) + 'x';
    };
    document.getElementById('rot-speed-y').oninput = (e) => {
      speedY = e.target.value / 500;
      document.getElementById('val-speed-y').textContent = (e.target.value / 10).toFixed(1) + 'x';
    };
    document.getElementById('manifold-r').oninput = (e) => {
      radiusParam = e.target.value / 10;
      document.getElementById('val-r').textContent = radiusParam.toFixed(1);
    };

    renderFrame();
  
</script>
</head>
<body>
  <div class="container">
    <header>
      <div class="stat-badge">Topological Manifold Raymarcher</div>
      <h1>3D Parametric Klein Bottle ASCII Studio</h1>
      <p class="desc">Real-time 4D-to-3D immersion projection of the Figure-8 Klein Bottle non-orientable surface using ASCII density rendering.</p>
    </header>

    <div class="card">
      <pre id="ascii-display">Calculating manifold coordinates...</pre>
    </div>

    <div class="card">
      <h3>Manifold Rotation &amp; Slice Controls</h3>
      <div class="controls">
        <div class="control-group">
          <label for="rot-speed-x">X-Axis Rotation Speed: <span id="val-speed-x">1.0x</span></label>
          <input type="range" id="rot-speed-x" min="0" max="30" value="10">
        </div>
        <div class="control-group">
          <label for="rot-speed-y">Y-Axis Rotation Speed: <span id="val-speed-y">1.0x</span></label>
          <input type="range" id="rot-speed-y" min="0" max="30" value="10">
        </div>
        <div class="control-group">
          <label for="manifold-r">Figure-8 Radius (r): <span id="val-r">2.0</span></label>
          <input type="range" id="manifold-r" min="10" max="40" value="20">
        </div>
      </div>
    </div>
  </div>

  
</body>
</html>
