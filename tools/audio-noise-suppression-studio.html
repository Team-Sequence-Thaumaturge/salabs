<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Noise Suppression Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Noise Suppression Studio","url":"https://salabs.quanxs.com/tools/audio-noise-suppression-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Noise Suppression Studio</h1></header><main class="container"><button onclick="playAudio()">Test Noise Suppression</button><p>Cutoff: <span id="cut-val">1500</span> Hz</p><input type="range" id="cut-slider" min="200" max="8000" value="1500" oninput="updateFilter()"></main><script>let audioCtx,osc,filter;function playAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();osc=audioCtx.createOscillator();filter=audioCtx.createBiquadFilter();let val=parseFloat(document.getElementById('cut-slider').value);osc.type='sawtooth';osc.frequency.value=300;filter.type='lowpass';filter.frequency.value=val;osc.connect(filter);filter.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.5);}function updateFilter(){let v=document.getElementById('cut-slider').value;document.getElementById('cut-val').innerText=v;if(filter)filter.frequency.value=parseFloat(v);}</script></body></html>
