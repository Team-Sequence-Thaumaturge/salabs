<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>HTML Canvas Signature Pad - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"HTML Canvas Signature Pad","url":"https://salabs.quanxs.com/tools/html-canvas-signature-pad.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}canvas{background:#ffffff;border-radius:8px;cursor:crosshair;display:block;margin-bottom:1rem;width:100%;height:200px;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Digital Signature Pad</h1></header><main class="container"><canvas id="sig-canvas"></canvas><button onclick="clearCanvas()">Clear</button><button onclick="exportPNG()">Export PNG</button></main><script>let cvs=document.getElementById('sig-canvas'),ctx=cvs.getContext('2d'),drawing=false;cvs.width=cvs.offsetWidth;cvs.height=cvs.offsetHeight;ctx.strokeStyle='#0f172a';ctx.lineWidth=3;cvs.addEventListener('mousedown',e=>{drawing=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);});cvs.addEventListener('mousemove',e=>{if(drawing){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();}});cvs.addEventListener('mouseup',()=>drawing=false);function clearCanvas(){ctx.clearRect(0,0,cvs.width,cvs.height);}function exportPNG(){let a=document.createElement('a');a.download='signature.png';a.href=cvs.toDataURL('image/png');a.click();}</script></body></html>
