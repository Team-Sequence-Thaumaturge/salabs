<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>HTML5 Canvas Digital Signature Pad - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"HTML5 Canvas Digital Signature Pad","url":"https://salabs.quanxs.com/tools/html-canvas-signature-pad.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}canvas{background:#ffffff;border-radius:8px;cursor:crosshair;display:block;margin-bottom:1rem;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-top:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Digital Signature Pad</h1></header><main class="container"><canvas id="pad" width="600" height="200"></canvas><div><button onclick="clearPad()">Clear Signature</button><button onclick="exportPNG()">Export Base64 PNG</button></div><textarea id="data-url" rows="4" readonly></textarea></main><script>let cvs=document.getElementById('pad');let ctx=cvs.getContext('2d');let drawing=false;cvs.addEventListener('mousedown',e=>{drawing=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);});cvs.addEventListener('mousemove',e=>{if(drawing){ctx.lineTo(e.offsetX,e.offsetY);ctx.lineWidth=3;ctx.strokeStyle='#0f172a';ctx.stroke();}});cvs.addEventListener('mouseup',()=>drawing=false);function clearPad(){ctx.clearRect(0,0,cvs.width,cvs.height);document.getElementById('data-url').value='';}function exportPNG(){document.getElementById('data-url').value=cvs.toDataURL('image/png');}</script></body></html>
