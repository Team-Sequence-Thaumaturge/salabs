<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto PBKDF2 Password Hasher Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto PBKDF2 Password Hasher Studio","url":"https://salabs.quanxs.com/tools/crypto-pbkdf2-hasher-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input,textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">PBKDF2 Password Key Derivation Studio</h1></header><main class="container"><input type="password" id="pass-in" value="P@ssw0rd123!" oninput="deriveKey()"><input type="text" id="salt-in" value="random_salt_999" oninput="deriveKey()"><input type="number" id="iter-in" value="100000" oninput="deriveKey()"><textarea id="key-out" rows="3" readonly></textarea></main><script>async function deriveKey(){let p=document.getElementById('pass-in').value,s=document.getElementById('salt-in').value,it=parseInt(document.getElementById('iter-in').value)||100000,out=document.getElementById('key-out');if(!p||!s){out.value='';return;}try{let enc=new TextEncoder();let bKey=await window.crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveBits"]);let dBuf=await window.crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(s),iterations:it,hash:"SHA-256"},bKey,256);out.value=Array.from(new Uint8Array(dBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');}catch(e){out.value='Crypto Error: '+e.message;}}deriveKey();</script></body></html>
