  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --accent-glow: rgba(88, 166, 255, 0.3);
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --green: #3fb950;
      --purple: #bc8cff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      padding: 20px;
    }
    header {
      max-width: 1000px;
      margin: 0 auto 20px auto;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-link:hover { text-decoration: underline; }
    h1 {
      font-size: 1.6rem;
      color: var(--text-bright);
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .panel h2 {
      font-size: 1.1rem;
      color: var(--text-bright);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .control-group {
      margin-bottom: 14px;
    }
    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    button {
      background: #21262d;
      color: var(--text-bright);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    button:hover {
      background: #30363d;
      border-color: var(--accent);
    }
    button.primary {
      background: #238636;
      border-color: rgba(240, 246, 252, 0.1);
    }
    button.primary:hover {
      background: #2ea043;
    }
    button.freeze-btn {
      background: #1f6feb;
    }
    button.freeze-btn.active {
      background: #a371f7;
      box-shadow: 0 0 10px rgba(163, 113, 247, 0.5);
    }
    canvas {
      width: 100%;
      height: 180px;
      background: #090d13;
      border: 1px solid var(--border);
      border-radius: 6px;
      display: block;
      margin-top: 10px;
    }
    .stat-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      background: #238636;
      color: #fff;
    }
  </style>
<script>

    let audioCtx = null;
    let isPlaying = false;
    let isFrozen = false;
    let osc1, osc2, osc3, filterNode, mainGain, analyser;
    let delayLeft, delayRight, feedbackLeft, feedbackRight, pannerLeft, pannerRight;

    const playBtn = document.getElementById('play-btn');
    const freezeBtn = document.getElementById('freeze-btn');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;

      filterNode = audioCtx.createBiquadFilter();
      filterNode.type = 'lowpass';
      filterNode.frequency.value = parseFloat(document.getElementById('cutoff-slider').value);

      mainGain = audioCtx.createGain();
      mainGain.gain.value = 0.2;

      // Granular delay network
      delayLeft = audioCtx.createDelay(2.0);
      delayRight = audioCtx.createDelay(2.0);
      delayLeft.delayTime.value = 0.065;
      delayRight.delayTime.value = 0.085;

      feedbackLeft = audioCtx.createGain();
      feedbackRight = audioCtx.createGain();
      feedbackLeft.gain.value = parseFloat(document.getElementById('decay-slider').value);
      feedbackRight.gain.value = parseFloat(document.getElementById('decay-slider').value);

      pannerLeft = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : audioCtx.createGain();
      pannerRight = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : audioCtx.createGain();
      if (pannerLeft.pan) pannerLeft.pan.value = -0.75;
      if (pannerRight.pan) pannerRight.pan.value = 0.75;

      // Cross feedback
      filterNode.connect(delayLeft);
      filterNode.connect(delayRight);
      
      delayLeft.connect(feedbackLeft);
      feedbackLeft.connect(delayRight);
      delayLeft.connect(pannerLeft);

      delayRight.connect(feedbackRight);
      feedbackRight.connect(delayLeft);
      delayRight.connect(pannerRight);

      pannerLeft.connect(mainGain);
      pannerRight.connect(mainGain);
      filterNode.connect(mainGain);

      mainGain.connect(analyser);
      analyser.connect(audioCtx.destination);
    }

    function startOscillators() {
      const baseFreq = parseFloat(document.getElementById('pitch-slider').value);
      osc1 = audioCtx.createOscillator();
      osc2 = audioCtx.createOscillator();
      osc3 = audioCtx.createOscillator();

      osc1.type = 'sawtooth';
      osc2.type = 'triangle';
      osc3.type = 'sine';

      osc1.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
      osc2.frequency.setValueAtTime(baseFreq * 1.5, audioCtx.currentTime);
      osc3.frequency.setValueAtTime(baseFreq * 2.01, audioCtx.currentTime);

      osc1.connect(filterNode);
      osc2.connect(filterNode);
      osc3.connect(filterNode);

      osc1.start();
      osc2.start();
      osc3.start();
    }

    function stopOscillators() {
      if (osc1) { osc1.stop(); osc1.disconnect(); }
      if (osc2) { osc2.stop(); osc2.disconnect(); }
      if (osc3) { osc3.stop(); osc3.disconnect(); }
    }

    playBtn.addEventListener('click', () => {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (!isPlaying) {
        startOscillators();
        isPlaying = true;
        playBtn.textContent = 'Stop Engine';
        playBtn.style.background = '#da3633';
        document.getElementById('status-badge').textContent = 'Live Audio Flow';
        document.getElementById('status-badge').style.background = '#1f6feb';
      } else {
        stopOscillators();
        isPlaying = false;
        playBtn.textContent = 'Start Audio Engine';
        playBtn.style.background = '#238636';
        document.getElementById('status-badge').textContent = 'Standby';
        document.getElementById('status-badge').style.background = '#30363d';
      }
    });

    freezeBtn.addEventListener('click', () => {
      if (!audioCtx || !isPlaying) return;
      isFrozen = !isFrozen;
      if (isFrozen) {
        feedbackLeft.gain.setTargetAtTime(0.999, audioCtx.currentTime, 0.05);
        feedbackRight.gain.setTargetAtTime(0.999, audioCtx.currentTime, 0.05);
        freezeBtn.classList.add('active');
        freezeBtn.textContent = 'Spectrum FROZEN (Click to Release)';
        document.getElementById('status-badge').textContent = 'Spectral Frozen';
        document.getElementById('status-badge').style.background = '#a371f7';
      } else {
        const decay = parseFloat(document.getElementById('decay-slider').value);
        feedbackLeft.gain.setTargetAtTime(decay, audioCtx.currentTime, 0.05);
        feedbackRight.gain.setTargetAtTime(decay, audioCtx.currentTime, 0.05);
        freezeBtn.classList.remove('active');
        freezeBtn.textContent = 'Freeze Spectrum (Hold)';
        document.getElementById('status-badge').textContent = 'Live Audio Flow';
        document.getElementById('status-badge').style.background = '#1f6feb';
      }
    });

    document.getElementById('pitch-slider').addEventListener('input', (e) => {
      const freq = parseFloat(e.target.value);
      document.getElementById('val-pitch').textContent = freq + ' Hz';
      if (isPlaying && osc1) {
        osc1.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.05);
        osc2.frequency.setTargetAtTime(freq * 1.5, audioCtx.currentTime, 0.05);
        osc3.frequency.setTargetAtTime(freq * 2.01, audioCtx.currentTime, 0.05);
      }
    });

    document.getElementById('cutoff-slider').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('val-cutoff').textContent = val + ' Hz';
      if (filterNode) filterNode.frequency.setTargetAtTime(val, audioCtx.currentTime, 0.05);
    });

    document.getElementById('decay-slider').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('val-decay').textContent = Math.round(val * 100) + '%';
      if (feedbackLeft && !isFrozen) {
        feedbackLeft.gain.setTargetAtTime(val, audioCtx.currentTime, 0.05);
        feedbackRight.gain.setTargetAtTime(val, audioCtx.currentTime, 0.05);
      }
    });

    // Visualizer loop
    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      canvas.width = canvas.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.clientHeight * window.devicePixelRatio;

      ctx.fillStyle = '#090d13';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!analyser) return;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      const barWidth = (canvas.width / bufferLength) * 2.5;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;
        const r = Math.min(255, 80 + i * 0.8);
        const g = Math.min(255, 140 + dataArray[i] * 0.5);
        const b = 255;

        ctx.fillStyle = isFrozen ? "rgb(163, 113, 247)" : ("rgb(" + Math.floor(r) + "," + Math.floor(g) + "," + Math.floor(b) + ")");
        ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
        x += barWidth + 1;
      }
    }
    drawVisualizer();
  
</script>
</head>
<body>
  <header>
    <div>
      <a href="/" class="back-link">← Back to Quanxs SA Labs Hub</a>
      <h1>Spectral Freeze & Granular Reverb Studio</h1>
    </div>
    <span class="stat-badge" id="status-badge">Engine Ready</span>
  </header>

  <div class="container">
    <div class="panel">
      <h2>Synthesizer & Audio Input</h2>
      <div class="control-group">
        <label><span>Waveform Oscillator</span><span id="val-wave">Synth Drone (Chordal)</span></label>
        <select id="wave-select" style="width:100%; padding:8px; background:#090d13; color:#fff; border:1px solid var(--border); border-radius:6px;">
          <option value="drone">Polyphonic Harmonic Drone (A2/E3/A3/C#4)</option>
          <option value="saw">Fat Sawtooth Sweeper</option>
          <option value="sine">Pure Sine FM Carrier</option>
          <option value="noise">Pink Noise Burst Loop</option>
        </select>
      </div>

      <div class="control-group">
        <label><span>Base Pitch (Hz)</span><span id="val-pitch">220 Hz (A3)</span></label>
        <input type="range" id="pitch-slider" min="55" max="880" value="220">
      </div>

      <div class="control-group">
        <label><span>Filter Cutoff / Reso</span><span id="val-cutoff">2400 Hz</span></label>
        <input type="range" id="cutoff-slider" min="100" max="10000" value="2400">
      </div>

      <div class="btn-row">
        <button id="play-btn" class="primary">Start Audio Engine</button>
        <button id="freeze-btn" class="freeze-btn">Freeze Spectrum (Hold)</button>
      </div>
    </div>

    <div class="panel">
      <h2>Granular Scrubber & Spatial Reverb</h2>
      <div class="control-group">
        <label><span>Grain Size (ms)</span><span id="val-grain-size">65 ms</span></label>
        <input type="range" id="grain-size-slider" min="10" max="300" value="65">
      </div>
      <div class="control-group">
        <label><span>Grain Density / Rate</span><span id="val-density">28 grains/sec</span></label>
        <input type="range" id="density-slider" min="5" max="80" value="28">
      </div>
      <div class="control-group">
        <label><span>Spatial 3D Binaural Spread</span><span id="val-spread">0.75</span></label>
        <input type="range" id="spread-slider" min="0" max="1" step="0.01" value="0.75">
      </div>
      <div class="control-group">
        <label><span>Feedback Reverb Decay</span><span id="val-decay">85%</span></label>
        <input type="range" id="decay-slider" min="0" max="0.98" step="0.01" value="0.85">
      </div>
    </div>

    <div class="panel" style="grid-column: 1 / -1;">
      <h2>Realtime Spectral FFT & Waveform Scrubber</h2>
      <canvas id="visualizer"></canvas>
    </div>
  </div>

  
</body>
</html>
