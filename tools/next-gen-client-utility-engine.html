<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Next Generation Client-side Utility Engine - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Next Generation Client-side Utility Engine","url":"https://salabs.quanxs.com/tools/next-gen-client-utility-engine.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;border:1px solid #334155;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-right:0.5rem;}.result-box{padding:1rem;border-radius:8px;background:#0f172a;border:1px solid #334155;font-family:monospace;word-break:break-all;margin-top:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Next Generation Client-side Utility Engine</h1></header><main class="container"><h3>Input Data / Text Payload</h3><textarea id="data-input" rows="4" placeholder="Enter JSON, text, or Base64 payload..."></textarea><button onclick="processBase64()">Base64 Encode/Decode</button><button onclick="processSHA256()">SHA-256 Hash</button><button onclick="processMinifyJSON()">Minify JSON</button><h3>Processed Output</h3><div id="output-box" class="result-box">Ready for client-side processing...</div></main><script>function processBase64(){let v=document.getElementById('data-input').value;if(!v)return;try{if(v.startsWith('ey')||v.match(/^[A-Za-z0-9+/=]+$/)){document.getElementById('output-box').innerText=atob(v);}else{document.getElementById('output-box').innerText=btoa(v);}}catch(e){document.getElementById('output-box').innerText='Error: '+e.message;}}async function processSHA256(){let v=document.getElementById('data-input').value;if(!v)return;let msgBuffer=new TextEncoder().encode(v);let hashBuffer=await crypto.subtle.digest('SHA-256',msgBuffer);let hashArray=Array.from(new Uint8Array(hashBuffer));let hashHex=hashArray.map(b=>b.toString(16).padStart(2,'0')).join('');document.getElementById('output-box').innerText='SHA-256: '+hashHex;}function processMinifyJSON(){let v=document.getElementById('data-input').value;if(!v)return;try{let parsed=JSON.parse(v);document.getElementById('output-box').innerText=JSON.stringify(parsed);}catch(e){document.getElementById('output-box').innerText='Invalid JSON: '+e.message;}}</script></body></html>
