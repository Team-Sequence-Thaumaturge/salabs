<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Next Generation Client-side Utility Engine - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Next Generation Client-side Utility Engine","url":"https://salabs.quanxs.com/tools/next-gen-client-utility-engine.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Next Generation Client-side Utility Engine</h1></header><main class="container"><button onclick="runDiagnostics()">Run Diagnostic Engine</button><textarea id="diag-out" rows="6" readonly></textarea><input type="text" id="hash-input" placeholder="Text to hash..." oninput="generateHash()"><input type="text" id="hash-output" readonly></main><script>function runDiagnostics(){let i={userAgent:navigator.userAgent,language:navigator.language,hardwareConcurrency:navigator.hardwareConcurrency||'N/A',deviceMemory:navigator.deviceMemory||'N/A',screenResolution:`${window.screen.width}x${window.screen.height}`,cryptoAvailable:!!window.crypto,webAudioAvailable:!!(window.AudioContext||window.webkitAudioContext)};document.getElementById('diag-out').value=JSON.stringify(i,null,2);}async function generateHash(){let t=document.getElementById('hash-input').value;if(!t){document.getElementById('hash-output').value='';return;}let enc=new TextEncoder();let b=await window.crypto.subtle.digest("SHA-256",enc.encode(t));let h=Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');document.getElementById('hash-output').value=h;}runDiagnostics();</script></body></html>
