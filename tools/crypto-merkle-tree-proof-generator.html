    <style>

        .root-box { background: #070a12; border: 1px solid var(--accent); border-radius: 8px; padding: 14px; font-family: monospace; font-size: 0.9rem; word-break: break-all; color: #a78bfa; }
        .tree-view { display: flex; flex-direction: column; gap: 12px; background: #050811; border-radius: 8px; padding: 16px; border: 1px solid var(--border-color); overflow-x: auto; }
        .tree-level { display: flex; justify-content: center; gap: 12px; }
        .tree-node { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; font-family: monospace; font-size: 0.75rem; color: #cbd5e1; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tree-node.highlight { border-color: #38bdf8; background: #0369a1; color: #fff; }

<script>

        async function sha256(text) {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        let currentTree = [];
        let currentLeaves = [];

        async function buildMerkleTree() {
            const lines = document.getElementById('leafInputs').value.trim().split('\n').filter(l => l.trim().length > 0);
            if(lines.length === 0) return;

            currentLeaves = lines;
            let currentLevel = await Promise.all(lines.map(async line => await sha256(line)));
            currentTree = [currentLevel];

            while(currentLevel.length > 1) {
                let nextLevel = [];
                for(let i = 0; i < currentLevel.length; i += 2) {
                    if(i + 1 < currentLevel.length) {
                        const combined = await sha256(currentLevel[i] + currentLevel[i+1]);
                        nextLevel.push(combined);
                    } else {
                        // Duplicate odd leaf
                        const combined = await sha256(currentLevel[i] + currentLevel[i]);
                        nextLevel.push(combined);
                    }
                }
                currentTree.push(nextLevel);
                currentLevel = nextLevel;
            }

            const rootHash = currentTree[currentTree.length - 1][0];
            document.getElementById('rootDisplay').innerText = rootHash;
            renderTree();
        }

        function renderTree() {
            const container = document.getElementById('treeContainer');
            container.innerHTML = '';

            for(let level = currentTree.length - 1; level >= 0; level--) {
                const row = document.createElement('div');
                row.className = 'tree-level';
                currentTree[level].forEach((hash, idx) => {
                    const node = document.createElement('div');
                    node.className = 'tree-node';
                    node.innerText = `${hash.slice(0, 8)}...${hash.slice(-6)}`;
                    node.title = hash;
                    if(level === 0) {
                        node.style.cursor = 'pointer';
                        node.onclick = () => generateProof(idx);
                    }
                    row.appendChild(node);
                });
                container.appendChild(row);
            }
        }

        async function generateProof(leafIdx) {
            let proof = [];
            let idx = leafIdx;

            for(let level = 0; level < currentTree.length - 1; level++) {
                const isRight = idx % 2 === 1;
                const siblingIdx = isRight ? idx - 1 : (idx + 1 < currentTree[level].length ? idx + 1 : idx);
                proof.push({
                    sibling: currentTree[level][siblingIdx],
                    direction: isRight ? 'left' : 'right'
                });
                idx = Math.floor(idx / 2);
            }

            // Verify Proof
            let hash = currentTree[0][leafIdx];
            for(let p of proof) {
                if(p.direction === 'left') {
                    hash = await sha256(p.sibling + hash);
                } else {
                    hash = await sha256(hash + p.sibling);
                }
            }

            const root = currentTree[currentTree.length - 1][0];
            const isValid = (hash === root);

            document.getElementById('proofText').innerHTML = `
                <div style="color: ${isValid ? '#34d399' : '#f87171'}; font-weight: bold; margin-bottom: 6px;">
                    ${isValid ? '✅ Cryptographic Proof Verified!' : '❌ Proof Verification Failed'}
                </div>
                <div>Target Leaf: "${currentLeaves[leafIdx]}"</div>
                <div>Leaf Hash: ${currentTree[0][leafIdx]}</div>
                <div>Proof Steps: ${proof.length}</div>
                <div style="margin-top: 6px;">Computed Root: ${hash}</div>
                <div>Expected Root: ${root}</div>
            `;
        }

        document.getElementById('buildBtn').addEventListener('click', buildMerkleTree);
        window.addEventListener('DOMContentLoaded', buildMerkleTree);
    
</script>
