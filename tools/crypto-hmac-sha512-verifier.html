<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto HMAC SHA-512 Signature Verifier - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto HMAC SHA-512 Signature Verifier","url":"https://salabs.quanxs.com/tools/crypto-hmac-sha512-verifier.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.result-box{padding:1rem;border-radius:8px;font-weight:bold;margin-top:1rem;background:#334155;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">HMAC SHA-512 Signature Verifier</h1></header><main class="container"><input type="text" id="sec-key" placeholder="Secret Key" oninput="verify512()"><textarea id="payload" rows="4" placeholder="Payload..." oninput="verify512()"></textarea><input type="text" id="expected-sig" placeholder="Expected Hex Signature" oninput="verify512()"><div id="status-out" class="result-box">Enter Secret, Payload, and Expected Signature</div></main><script>async function verify512(){let kStr=document.getElementById('sec-key').value,mStr=document.getElementById('payload').value,exp=document.getElementById('expected-sig').value.trim(),st=document.getElementById('status-out');if(!kStr||!mStr||!exp){st.style.background='#334155';st.innerText='Enter Secret, Payload, and Expected Signature';return;}try{let enc=new TextEncoder();let key=await window.crypto.subtle.importKey("raw",enc.encode(kStr),{name:"HMAC",hash:"SHA-512"},false,["sign"]);let sigBuf=await window.crypto.subtle.sign("HMAC",key,enc.encode(mStr));let calcSig=Array.from(new Uint8Array(sigBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');if(calcSig.toLowerCase()===exp.toLowerCase()){st.style.background='#16a34a';st.innerText='✓ SIGNATURE MATCHED (PASSED)';}else{st.style.background='#dc2626';st.innerText=`✕ SIGNATURE MISMATCH\nCalculated: ${calcSig}`;}}catch(e){st.style.background='#334155';st.innerText='Error: '+e.message;}}</script></body></html>
