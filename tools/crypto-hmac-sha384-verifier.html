<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
.container { max-width: 860px; margin: 0 auto; background: #161b22; padding: 28px; border-radius: 12px; border: 1px solid #30363d; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
h1 { color: #58a6ff; font-size: 22px; margin-top: 0; }
label { display: block; margin-top: 14px; font-weight: 600; color: #8b949e; font-size: 13px; }
input, textarea { width: 100%; box-sizing: border-box; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 14px; margin-top: 6px; }
textarea { height: 90px; resize: vertical; }
.btn-group { margin-top: 18px; display: flex; gap: 10px; }
button { background: #238636; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
button:hover { background: #2ea043; }
button.secondary { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; }
button.secondary:hover { background: #30363d; }
.result-box { margin-top: 20px; padding: 14px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; font-family: monospace; word-break: break-all; }
.verified { color: #3fb950; font-weight: bold; }
.invalid { color: #f85149; font-weight: bold; }
</style>
<script>

async function getKey(keyStr) {
  const enc = new TextEncoder();
  return await crypto.subtle.importKey(
    "raw",
    enc.encode(keyStr),
    { name: "HMAC", hash: "SHA-384" },
    false,
    ["sign", "verify"]
  );
}

async function signHmac() {
  const keyStr = document.getElementById('secretKey').value;
  const msgStr = document.getElementById('message').value;
  const outBox = document.getElementById('statusOutput');
  try {
    const key = await getKey(keyStr);
    const enc = new TextEncoder();
    const sigBuffer = await crypto.subtle.sign("HMAC", key, enc.encode(msgStr));
    const sigArray = Array.from(new Uint8Array(sigBuffer));
    const sigHex = sigArray.map(b => b.toString(16).padStart(2, '0')).join('');
    document.getElementById('signatureInput').value = sigHex;
    outBox.style.display = 'block';
    outBox.innerHTML = '<span class="verified">✔ Successfully signed with HMAC SHA-384 (Length: 96 hex chars / 384 bits).</span>';
  } catch (err) {
    outBox.style.display = 'block';
    outBox.innerHTML = '<span class="invalid">✖ Error: ' + err.message + '</span>';
  }
}

async function verifyHmac() {
  const keyStr = document.getElementById('secretKey').value;
  const msgStr = document.getElementById('message').value;
  const sigHex = document.getElementById('signatureInput').value.trim();
  const outBox = document.getElementById('statusOutput');
  outBox.style.display = 'block';
  if (!sigHex || sigHex.length % 2 !== 0) {
    outBox.innerHTML = '<span class="invalid">✖ Invalid Hex Signature length.</span>';
    return;
  }
  try {
    const key = await getKey(keyStr);
    const sigBytes = new Uint8Array(sigHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
    const enc = new TextEncoder();
    const isValid = await crypto.subtle.verify("HMAC", key, sigBytes, enc.encode(msgStr));
    if (isValid) {
      outBox.innerHTML = '<span class="verified">✔ VALID SIGNATURE: The message integrity and origin are verified.</span>';
    } else {
      outBox.innerHTML = '<span class="invalid">✖ INVALID SIGNATURE: Signature mismatch or altered payload.</span>';
    }
  } catch (err) {
    outBox.innerHTML = '<span class="invalid">✖ Verification failed: ' + err.message + '</span>';
  }
}

</script>
</head>
<body>
<div class="container">
  <h1>🔒 HMAC SHA-384 Signer & Verifier Studio</h1>
  <p style="color:#8b949e; font-size:14px;">100% Client-Side Web Crypto API execution for Cryptographic Authentication & Verification.</p>
  
  <label for="secretKey">Secret Key (String or Hex):</label>
  <input type="text" id="secretKey" placeholder="e.g., my-super-secret-key-123" value="quanxs-secret-key-2026">
  
  <label for="message">Payload Message:</label>
  <textarea id="message" placeholder="Enter message to sign or verify...">{"event":"STATION_PULSE_AUTH","timestamp":1786638000}</textarea>
  
  <div class="btn-group">
    <button onclick="signHmac()">Sign Message (HMAC SHA-384)</button>
    <button class="secondary" onclick="verifyHmac()">Verify with Expected Signature</button>
  </div>
  
  <label for="signatureInput">HMAC-SHA-384 Signature (Hex):</label>
  <input type="text" id="signatureInput" placeholder="Generated signature will appear here...">
  
  <div id="statusOutput" class="result-box" style="display:none;"></div>
</div>


</body>
</html>
