<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JSON String Escaper & Unescaper - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JSON String Escaper & Unescaper","url":"https://salabs.quanxs.com/tools/json-escape-unescape.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-right:0.5rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JSON String Escaper & Unescaper</h1></header><main class="container"><h3>Input String / JSON</h3><textarea id="str-input" rows="6"></textarea><div><button onclick="escapeJSON()">Escape JSON String</button><button onclick="unescapeJSON()">Unescape JSON String</button></div><h3>Output Result</h3><textarea id="str-output" rows="6" readonly></textarea></main><script>function escapeJSON(){let input=document.getElementById('str-input').value;document.getElementById('str-output').value=JSON.stringify(input);}function unescapeJSON(){let input=document.getElementById('str-input').value.trim();try{if(input.startsWith('"')&&input.endsWith('"')){document.getElementById('str-output').value=JSON.parse(input);}else{document.getElementById('str-output').value=JSON.parse('"'+input.replace(/"/g,'\\"')+'"');}}catch(e){document.getElementById('str-output').value='Error: '+e.message;}}</script></body></html>
