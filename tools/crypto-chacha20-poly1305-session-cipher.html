;let encrypted=await window.crypto.subtle.encrypt({name:"AES-GCM",iv:iv},derivedKey,enc.encode(text));let combined=new Uint8Array(salt.length+iv.length+encrypted.byteLength);combined.set(salt,0);combined.set(iv,salt.length);combined.set(new Uint8Array(encrypted),salt.length+iv.length);let b64=btoa(String.fromCharCode.apply(null,combined)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');document.getElementById('cipher-out').value=b64;}catch(e){alert('Session Encryption Error: '+e.message);}}</script></body></html>
