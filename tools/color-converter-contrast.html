<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Color Code Converter & Contrast Ratio Checker - SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Color Converter Contrast","url":"https://salabs.quanxs.com/tools/color-converter-contrast.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:0.8rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.preview-box{padding:2rem;border-radius:8px;text-align:center;font-size:1.2rem;font-weight:bold;margin:1rem 0;border:1px solid #334155;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Color Converter & WCAG Contrast Inspector</h1></header><main class="container"><div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;"><div><h3>Text Color</h3><input type="color" id="fg-color" value="#38bdf8" onchange="convertColor()"><input type="text" id="fg-hex" value="#38bdf8" oninput="updateFromText()"></div><div><h3>Background Color</h3><input type="color" id="bg-color" value="#0f172a" onchange="convertColor()"><input type="text" id="bg-hex" value="#0f172a" oninput="updateFromText()"></div></div><div id="preview" class="preview-box">Sample Preview Text</div><p><strong>RGB:</strong> <span id="rgb-val">rgb(56, 189, 248)</span></p><p><strong>Contrast Ratio:</strong> <span id="contrast-val">10.45 : 1</span> (<span id="wcag-val" style="color:#4ade80;">WCAG AAA Pass</span>)</p></main><script>function hexToRgb(h){let c=h.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');let n=parseInt(c,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};}function getLuminance(r,g,b){let a=[r,g,b].map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return a[0]*0.2126+a[1]*0.7152+a[2]*0.0722;}function convertColor(){let fg=document.getElementById('fg-color').value,bg=document.getElementById('bg-color').value;document.getElementById('fg-hex').value=fg;document.getElementById('bg-hex').value=bg;let prev=document.getElementById('preview');prev.style.color=fg;prev.style.backgroundColor=bg;let rgb=hexToRgb(fg);document.getElementById('rgb-val').innerText='rgb('+rgb.r+', '+rgb.g+', '+rgb.b+')';let l1=getLuminance(rgb.r,rgb.g,rgb.b),bgRgb=hexToRgb(bg),l2=getLuminance(bgRgb.r,bgRgb.g,bgRgb.b);let ratio=Math.round(((Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05))*100)/100;document.getElementById('contrast-val').innerText=ratio+' : 1';let wcag=document.getElementById('wcag-val');if(ratio>=7){wcag.innerText='WCAG AAA Pass';wcag.style.color='#4ade80';}else if(ratio>=4.5){wcag.innerText='WCAG AA Pass';wcag.style.color='#38bdf8';}else{wcag.innerText='WCAG Fail';wcag.style.color='#ef4444';}}function updateFromText(){document.getElementById('fg-color').value=document.getElementById('fg-hex').value;document.getElementById('bg-color').value=document.getElementById('bg-hex').value;convertColor();}convertColor();</script></body></html>
