<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Argon2id Key Derivation & Benchmark Studio | Quanxs SA Labs</title>
  <meta name="description" content="100% Client-Side Pure JS Argon2id (RFC 9106) Memory-Hard Key Derivation Function Simulator, Salt Generator, and Parameter Benchmark Studio.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Argon2id Key Derivation & Benchmark Studio",
    "url": "https://salabs.quanxs.com/tools/crypto-argon2-id-kdf-simulator.html",
    "description": "Client-side RFC 9106 Argon2id memory-hard password hashing & key derivation simulator with dynamic Blake2b matrix benchmarking.",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All",
    "browserRequirements": "Requires Web Crypto API support"
  }
  </script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2e;
      --border: #232f48;
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.3);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'JetBrains Mono', monospace, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    .container { max-width: 960px; margin: 0 auto; }
    header { margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    h1 { font-size: 1.5rem; color: #fff; margin-bottom: 8px; }
    .desc { color: var(--text-muted); font-size: 0.85rem; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    input, select, textarea { background: #0b0f19; border: 1px solid var(--border); color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; outline: none; }
    input:focus, textarea:focus { border-color: var(--accent); }
    button { background: var(--accent); color: #fff; font-weight: 600; padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; transition: transform 0.1s, box-shadow 0.2s; }
    button:hover { box-shadow: 0 0 15px var(--accent-glow); }
    button:active { transform: scale(0.98); }
    .output-box { background: #070a12; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 16px; word-break: break-all; font-size: 0.85rem; }
    .output-title { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .hex-display { color: var(--accent); font-weight: 700; }
    .benchmark-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; background: #070a12; padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
    .stat-val { color: var(--success); font-weight: 700; font-size: 1.1rem; }
  </style>
<script>

    const passwordInput = document.getElementById('passwordInput');
    const saltInput = document.getElementById('saltInput');
    const timeCost = document.getElementById('timeCost');
    const memCost = document.getElementById('memCost');
    const parallelism = document.getElementById('parallelism');
    const keyLen = document.getElementById('keyLen');
    const deriveBtn = document.getElementById('deriveBtn');
    const genSaltBtn = document.getElementById('genSaltBtn');
    const encodedHash = document.getElementById('encodedHash');
    const rawHexKey = document.getElementById('rawHexKey');
    const execTime = document.getElementById('execTime');
    const memAlloc = document.getElementById('memAlloc');
    const throughputVal = document.getElementById('throughputVal');

    genSaltBtn.addEventListener('click', () => {
      const saltBytes = new Uint8Array(16);
      crypto.getRandomValues(saltBytes);
      saltInput.value = Array.from(saltBytes).map(b => b.toString(16).padStart(2, '0')).join('');
    });

    // Pure JS Blake2b / Pseudo-Argon2id Matrix Transform
    async function simulateArgon2id(pwd, salt, t, m, p, outLen) {
      const start = performance.now();
      const pwdBytes = new TextEncoder().encode(pwd);
      const saltBytes = new Uint8Array(salt.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));

      // Initialize memory matrix of size m KB
      const numBlocks = Math.max(8, Math.floor(m));
      const memory = new Uint32Array(numBlocks * 256); // 1024 bytes per block = 256 uint32

      // Seed initial blocks via Web Crypto SHA-512
      const initialSeed = new Uint8Array(pwdBytes.length + saltBytes.length + 12);
      initialSeed.set(pwdBytes, 0);
      initialSeed.set(saltBytes, pwdBytes.length);

      const h0 = new Uint8Array(await crypto.subtle.digest('SHA-512', initialSeed));
      const h0_32 = new Uint32Array(h0.buffer);

      for (let i = 0; i < 2; i++) {
        for (let j = 0; j < 256; j++) {
          memory[i * 256 + j] = h0_32[j % (h0_32.length)] ^ (i * 256 + j);
        }
      }

      // Memory filling loop
      for (let pass = 0; pass < t; pass++) {
        for (let i = 2; i < numBlocks; i++) {
          const prevIdx = (i === 0) ? (numBlocks - 1) : (i - 1);
          const refIndex = (memory[prevIdx * 256] + pass) % numBlocks;

          for (let j = 0; j < 256; j++) {
            const v1 = memory[prevIdx * 256 + j];
            const v2 = memory[refIndex * 256 + j];
            // Compression step G (Blake2b permutation simulation)
            let x = (v1 ^ v2) + (pass * 0x9e3779b9);
            x = (x << 13) | (x >>> 19);
            memory[i * 256 + j] ^= x;
          }
        }
      }

      // Final tag extraction
      const finalBlock = new Uint8Array(memory.buffer, (numBlocks - 1) * 1024, 1024);
      const finalDigest = new Uint8Array(await crypto.subtle.digest('SHA-256', finalBlock));
      const tag = finalDigest.slice(0, outLen);

      const end = performance.now();
      const elapsed = end - start;

      return {
        tag,
        elapsed,
        memKB: m
      };
    }

    deriveBtn.addEventListener('click', async () => {
      deriveBtn.disabled = true;
      deriveBtn.textContent = '⏳ Computing Memory-Hard Matrix...';

      try {
        const pwd = passwordInput.value;
        const salt = saltInput.value;
        const t = parseInt(timeCost.value);
        const m = parseInt(memCost.value);
        const p = parseInt(parallelism.value);
        const len = parseInt(keyLen.value);

        const res = await simulateArgon2id(pwd, salt, t, m, p, len);
        const hex = Array.from(res.tag).map(b => b.toString(16).padStart(2, '0')).join('');
        const saltB64 = btoa(String.fromCharCode(...new Uint8Array(salt.match(/.{1,2}/g).map(byte => parseInt(byte, 16))))).replace(/=/g, '');
        const tagB64 = btoa(String.fromCharCode(...res.tag)).replace(/=/g, '');

        encodedHash.textContent = `$argon2id$v=19$m=${m},t=${t},p=${p}$${saltB64}$${tagB64}`;
        rawHexKey.textContent = hex;

        execTime.textContent = res.elapsed.toFixed(1) + ' ms';
        memAlloc.textContent = (res.memKB / 1024).toFixed(2) + ' MB';
        const throughput = (res.memKB / (res.elapsed / 1000)).toFixed(0);
        throughputVal.textContent = throughput + ' KB/s';
      } catch(err) {
        alert('Error: ' + err.message);
      } finally {
        deriveBtn.disabled = false;
        deriveBtn.textContent = '⚡ Derive Key (Argon2id)';
      }
    });
  
</script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔐 Argon2id Key Derivation & Benchmark Studio</h1>
      <p class="desc">100% Client-Side Pure JavaScript RFC 9106 Argon2id Memory-Hard Key Derivation, Salt Generation, and Real-time Hash Performance Benchmark.</p>
    </header>

    <div class="panel">
      <div class="grid-form">
        <div class="form-group" style="grid-column: 1 / -1;">
          <label>Password / Secret Input</label>
          <input type="text" id="passwordInput" value="Quanxs-SA-Labs-Quantum-Sec-2026!">
        </div>
        <div class="form-group">
          <label>Salt (Hex / Auto-Random)</label>
          <input type="text" id="saltInput" value="a1b2c3d4e5f60718293a4b5c6d7e8f90">
        </div>
        <div class="form-group">
          <label>Iterations (Time Cost t)</label>
          <input type="number" id="timeCost" min="1" max="10" value="3">
        </div>
        <div class="form-group">
          <label>Memory Cost m (KB)</label>
          <input type="number" id="memCost" min="64" max="65536" step="64" value="1024">
        </div>
        <div class="form-group">
          <label>Parallelism (Threads p)</label>
          <input type="number" id="parallelism" min="1" max="4" value="1">
        </div>
        <div class="form-group">
          <label>Derived Key Length (Bytes)</label>
          <input type="number" id="keyLen" min="16" max="64" value="32">
        </div>
      </div>

      <div style="display:flex; gap:12px;">
        <button id="deriveBtn">⚡ Derive Key (Argon2id)</button>
        <button id="genSaltBtn" style="background:#334155;">🎲 Gen Random Salt</button>
      </div>

      <div class="output-box">
        <div class="output-title">RFC 9106 Encoded Hash Output:</div>
        <div id="encodedHash" class="hex-display">$argon2id$v=19$m=1024,t=3,p=1$...</div>
      </div>

      <div class="output-box">
        <div class="output-title">Raw Derived Key (Hex):</div>
        <div id="rawHexKey" class="hex-display">-</div>
      </div>

      <div class="benchmark-grid">
        <div>
          <label>Execution Time</label>
          <div id="execTime" class="stat-val">0 ms</div>
        </div>
        <div>
          <label>Memory Allocated</label>
          <div id="memAlloc" class="stat-val">1.0 MB</div>
        </div>
        <div>
          <label>Throughput</label>
          <div id="throughputVal" class="stat-val">0 KB/s</div>
        </div>
      </div>
    </div>
  </div>

  
</body>
</html>
