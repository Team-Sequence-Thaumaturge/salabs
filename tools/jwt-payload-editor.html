<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JWT Claims & Payload Editor - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JWT Claims Payload Editor","url":"https://salabs.quanxs.com/tools/jwt-payload-editor.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JWT Claims & Payload Editor</h1></header><main class="container"><textarea id="hdr-input" rows="4" oninput="buildToken()">{"alg":"HS256","typ":"JWT"}</textarea><textarea id="payload-input" rows="4" oninput="buildToken()">{"sub":"1234567890","name":"Alice"}</textarea><textarea id="jwt-output" rows="4" readonly></textarea></main><script>function base64url(s){return btoa(encodeURIComponent(s).replace(/%([0-9A-F]{2})/g,(m,p1)=>String.fromCharCode('0x'+p1))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}function buildToken(){try{let h=JSON.stringify(JSON.parse(document.getElementById('hdr-input').value));let p=JSON.stringify(JSON.parse(document.getElementById('payload-input').value));document.getElementById('jwt-output').value=`${base64url(h)}.${base64url(p)}.unsigned_token_signature_placeholder`;}catch(e){document.getElementById('jwt-output').value='Invalid JSON';}}buildToken();</script></body></html>
