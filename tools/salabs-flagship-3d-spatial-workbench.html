<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quanxs Sovereign 3D Spatial & Agentic Intelligence Workbench</title>
  
  <!-- Schema.org WebApplication Metadata -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Quanxs Sovereign 3D Spatial & Agentic Intelligence Workbench",
    "description": "Master Sovereign Workbench integrating 3D Spatial Physics, C++ Rigid Body Dynamics, Inverse Kinematics, WebXR, and x402 Agentic Commerce.",
    "applicationCategory": "EngineeringApplication",
    "operatingSystem": "All"
  }
  </script>

  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            slate: { 900: "#0f172a", 800: "#1e293b", 700: "#334155" },
            cyan: { accent: "#00f2fe", 400: "#22d3ee" },
            blue: { accent: "#4facfe", 400: "#38bdf8" },
            purple: { accent: "#8b5cf6", 400: "#a78bfa" }
          }
        }
      }
    };
  </script>
  <style>
    body {
      margin: 0;
      background-color: #0f172a;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }
    .iframe-container {
      width: 100%;
      height: calc(100vh - 64px);
      border: none;
    }
  </style>
</head>
<body class="flex flex-col h-screen">

  <!-- Top Master Navigation & Tab Switcher -->
  <header class="h-16 bg-slate-900 border-b border-cyan-500/20 px-6 flex items-center justify-between z-50">
    <div class="flex items-center space-x-3">
      <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></div>
      <h1 class="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-400 to-purple-400 tracking-tight">
        Quanxs Sovereign 3D Spatial & Agentic Workbench
      </h1>
      <span class="px-2 py-0.5 text-xs font-mono bg-cyan-950 text-cyan-400 border border-cyan-500/30 rounded-full">v3.0 Flagship</span>
    </div>

    <!-- Interactive View Mode Switcher -->
    <div class="flex bg-slate-800 p-1 rounded-lg border border-slate-700/60 space-x-1">
      <button id="btn-3d" onclick="switchTab('3d')" class="px-4 py-1.5 text-xs font-semibold rounded-md transition-all duration-200 bg-gradient-to-r from-cyan-500 to-blue-500 text-slate-950 shadow-lg shadow-cyan-500/20 flex items-center space-x-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
        <span>3D Spatial Physics Engine</span>
      </button>
      <button id="btn-commerce" onclick="switchTab('commerce')" class="px-4 py-1.5 text-xs font-semibold rounded-md transition-all duration-200 text-slate-400 hover:text-slate-200 hover:bg-slate-700/50 flex items-center space-x-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span>Agentic Commerce & ZK Vault</span>
      </button>
    </div>

    <!-- Back to Portal Home Link -->
    <a href="../index.html" class="text-xs font-semibold text-slate-400 hover:text-cyan-400 transition-colors flex items-center space-x-1">
      <span>Back to Portal</span>
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
    </a>
  </header>

  <!-- Dynamic iFrame Container -->
  <main class="flex-1 relative bg-slate-950">
    <iframe id="workbench-iframe" src="jules-master-3d-spatial-engine-v1-2.html" class="iframe-container" title="Sovereign Workbench View"></iframe>
  </main>

  <script>
    function switchTab(mode) {
      const iframe = document.getElementById("workbench-iframe");
      const btn3D = document.getElementById("btn-3d");
      const btnCommerce = document.getElementById("btn-commerce");

      if (mode === "3d") {
        iframe.src = "jules-master-3d-spatial-engine-v1-2.html";
        btn3D.className = "px-4 py-1.5 text-xs font-semibold rounded-md transition-all duration-200 bg-gradient-to-r from-cyan-500 to-blue-500 text-slate-950 shadow-lg shadow-cyan-500/20 flex items-center space-x-2";
        btnCommerce.className = "px-4 py-1.5 text-xs font-semibold rounded-md transition-all duration-200 text-slate-400 hover:text-slate-200 hover:bg-slate-700/50 flex items-center space-x-2";
      } else {
        iframe.src = "jules-agentic-commerce-dashboard.html";
        btnCommerce.className = "px-4 py-1.5 text-xs font-semibold rounded-md transition-all duration-200 bg-gradient-to-r from-cyan-500 to-blue-500 text-slate-950 shadow-lg shadow-cyan-500/20 flex items-center space-x-2";
        btn3D.className = "px-4 py-1.5 text-xs font-semibold rounded-md transition-all duration-200 text-slate-400 hover:text-slate-200 hover:bg-slate-700/50 flex items-center space-x-2";
      }
    }
  </script>
</body>
</html>
