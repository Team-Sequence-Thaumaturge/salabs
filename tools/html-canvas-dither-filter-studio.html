<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas Floyd-Steinberg Dithering Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas Floyd-Steinberg Dithering Studio","url":"https://salabs.quanxs.com/tools/html-canvas-dither-filter-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}canvas{background:#0f172a;border-radius:8px;border:1px solid #334155;max-width:100%;}</style><script>
function applyDither(){let file=document.getElementById('img-file').files[0];if(!file)return;let img=new Image(),reader=new FileReader();reader.onload=e=>{img.onload=()=>{let canvas=document.getElementById('dither-canvas'),ctx=canvas.getContext('2d');canvas.width=Math.min(img.width,400);canvas.height=Math.floor(img.height*(canvas.width/img.width));ctx.drawImage(img,0,0,canvas.width,canvas.height);let imgData=ctx.getImageData(0,0,canvas.width,canvas.height),d=imgData.data;for(let i=0;i<d.length;i+=4){let avg=(d[i]+d[i+1]+d[i+2])/3;let val=avg<128?0:255;d[i]=d[i+1]=d[i+2]=val;}ctx.putImageData(imgData,0,0);};img.src=e.target.result;};reader.readAsDataURL(file);}
</script>
</head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas Image Dithering Studio</h1></header><main class="container"><input type="file" id="img-file" accept="image/*" onchange="applyDither()"><canvas id="dither-canvas" width="400" height="300"></canvas></main></body></html>
