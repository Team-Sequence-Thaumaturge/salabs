<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Unified Text Diff Checker - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Unified Text Diff Checker","url":"https://salabs.quanxs.com/tools/diff-checker.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}.diff-output{background:#0f172a;padding:1rem;border-radius:8px;border:1px solid #334155;font-family:monospace;}.diff-add{background:#065f46;color:#4ade80;display:block;}.diff-remove{background:#881337;color:#f87171;display:block;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Unified Text Diff Checker</h1></header><main class="container"><div class="grid"><div><h3>Original (A)</h3><textarea id="text-a" rows="8" oninput="compareDiff()"></textarea></div><div><h3>Modified (B)</h3><textarea id="text-b" rows="8" oninput="compareDiff()"></textarea></div></div><div id="diff-view" class="diff-output"></div></main><script>function compareDiff(){let linesA=document.getElementById('text-a').value.split('\n');let linesB=document.getElementById('text-b').value.split('\n');let maxLen=Math.max(linesA.length,linesB.length);let html='';for(let i=0;i<maxLen;i++){let a=linesA[i],b=linesB[i];if(a===b){if(a!==undefined)html+=`<div>  ${a}</div>`;}else{if(a!==undefined)html+=`<span class="diff-remove">- ${a}</span>`;if(b!==undefined)html+=`<span class="diff-add">+ ${b}</span>`;}}document.getElementById('diff-view').innerHTML=html||'No differences.';}compareDiff();</script></body></html>
