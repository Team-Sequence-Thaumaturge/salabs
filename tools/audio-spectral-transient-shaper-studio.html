    <style>
        :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; --green: #3fb950; --red: #f85149; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; padding: 20px; line-height: 1.5; }
        .container { max-width: 960px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.8rem; color: #fff; margin-bottom: 8px; }
        header p { color: #8b949e; font-size: 0.95rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
        .card h2 { font-size: 1.1rem; color: var(--accent); margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .control-group { margin-bottom: 12px; }
        .control-group label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; color: #8b949e; }
        input[type=range] { width: 100%; accent-color: var(--accent); }
        select, button { width: 100%; padding: 8px 12px; background: #21262d; border: 1px solid var(--border); border-radius: 6px; color: #fff; cursor: pointer; font-size: 0.9rem; margin-top: 4px; }
        button.btn-primary { background: #238636; border-color: #2ea043; font-weight: bold; }
        button.btn-primary:hover { background: #2ea043; }
        button.btn-danger { background: #da3633; border-color: #f85149; }
        canvas { width: 100%; height: 220px; background: #000; border-radius: 6px; border: 1px solid var(--border); }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; background: #21262d; color: #8b949e; margin-top: 8px; }
        .status-badge.active { background: #1f6feb; color: #fff; }
    </style>
<script>

        let audioCtx = null;
        let analyser = null;
        let isPlaying = false;

        const playBtn = document.getElementById('playBtn');
        const oscType = document.getElementById('oscType');
        const freqSlider = document.getElementById('freqSlider');
        const attackSlider = document.getElementById('attackSlider');
        const sustainSlider = document.getElementById('sustainSlider');
        const cutoffSlider = document.getElementById('cutoffSlider');
        const statusBadge = document.getElementById('statusBadge');
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');

        freqSlider.oninput = () => document.getElementById('freqVal').textContent = freqSlider.value + ' Hz';
        attackSlider.oninput = () => document.getElementById('attackVal').textContent = (attackSlider.value > 0 ? '+' : '') + attackSlider.value + ' dB';
        sustainSlider.oninput = () => document.getElementById('sustainVal').textContent = (sustainSlider.value > 0 ? '+' : '') + sustainSlider.value + ' dB';
        cutoffSlider.oninput = () => document.getElementById('cutoffVal').textContent = cutoffSlider.value + ' Hz';

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 512;
                drawVisualizer();
            }
        }

        playBtn.onclick = () => {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const gain = audioCtx.createGain();

            osc.type = oscType.value;
            osc.frequency.setValueAtTime(parseFloat(freqSlider.value), now);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(parseFloat(cutoffSlider.value), now);

            const attackGain = Math.pow(10, parseFloat(attackSlider.value) / 20);
            const sustainGain = Math.pow(10, parseFloat(sustainSlider.value) / 20) * 0.3;

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.exponentialRampToValueAtTime(Math.min(attackGain, 2.0), now + 0.02);
            gain.gain.exponentialRampToValueAtTime(Math.max(sustainGain, 0.001), now + 0.15);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(analyser);
            analyser.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.65);

            statusBadge.textContent = 'Transients Firing';
            statusBadge.className = 'status-badge active';
            setTimeout(() => {
                statusBadge.textContent = 'Engine Ready';
                statusBadge.className = 'status-badge';
            }, 650);
        };

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if (!analyser) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteTimeDomainData(dataArray);

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#58a6ff';
            ctx.beginPath();

            const sliceWidth = canvas.width * 1.0 / bufferLength;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * canvas.height / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                x += sliceWidth;
            }
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
        }
    
</script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔊 Audio Spectral Transient Shaper Studio</h1>
            <p>Web Audio API 기반 100% 브라우저 로컬 구동 어택/서스테인 다이내믹 트랜지언트 쉐이퍼</p>
        </header>

        <div class="grid">
            <div class="card">
                <h2>🎛️ Transient & Dynamic Controls</h2>
                <div class="control-group">
                    <label><span>Oscillator Source</span></label>
                    <select id="oscType">
                        <option value="sawtooth">Sawtooth (Rich Harmonics)</option>
                        <option value="square">Square (Punchy Lead)</option>
                        <option value="sine">Sine (Sub Bass)</option>
                        <option value="triangle">Triangle (Smooth)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label><span>Base Frequency</span><span id="freqVal">130 Hz</span></label>
                    <input type="range" id="freqSlider" min="40" max="880" value="130">
                </div>
                <div class="control-group">
                    <label><span>Attack Boost (Transient Punch)</span><span id="attackVal">+6.0 dB</span></label>
                    <input type="range" id="attackSlider" min="-12" max="18" value="6" step="0.5">
                </div>
                <div class="control-group">
                    <label><span>Sustain Gain (Tail Control)</span><span id="sustainVal">0.0 dB</span></label>
                    <input type="range" id="sustainSlider" min="-24" max="12" value="0" step="0.5">
                </div>
                <div class="control-group">
                    <label><span>Spectral Filter Cutoff</span><span id="cutoffVal">2500 Hz</span></label>
                    <input type="range" id="cutoffSlider" min="200" max="12000" value="2500">
                </div>
                <button id="playBtn" class="btn-primary">▶ Trigger Transient Burst</button>
                <div id="statusBadge" class="status-badge">Engine Ready</div>
            </div>

            <div class="card">
                <h2>📊 Realtime Spectral Oscilloscope</h2>
                <canvas id="visualizerCanvas"></canvas>
                <div style="margin-top: 10px; font-size: 0.8rem; color: #8b949e;">
                    * 100% Client-Side Pure JS: Zero external network calls. Web Audio API AnalyserNode FFT visualization.
                </div>
            </div>
        </div>
    </div>
