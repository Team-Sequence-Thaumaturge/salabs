<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JWT Token Debugger & Inspector - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JWT Token Debugger","url":"https://salabs.quanxs.com/tools/jwt-debugger-verifier.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}.label{font-weight:bold;color:#38bdf8;margin-bottom:0.5rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JWT Token Debugger & Inspector</h1></header><main class="container"><h3>1. Encoded JWT Token</h3><textarea id="jwt-input" rows="4" placeholder="Paste encoded JWT..." oninput="debugJWT()"></textarea><h3>2. Decoded Token Claims</h3><div class="grid"><div><div class="label">Header:</div><textarea id="jwt-header" rows="8" readonly></textarea></div><div><div class="label">Payload Claims:</div><textarea id="jwt-payload" rows="8" readonly></textarea></div></div></main><script>function base64UrlDecode(str){let b=str.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return decodeURIComponent(atob(b).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));}function debugJWT(){let t=document.getElementById('jwt-input').value.trim();if(!t){document.getElementById('jwt-header').value='';document.getElementById('jwt-payload').value='';return;}let p=t.split('.');if(p.length!==3){document.getElementById('jwt-header').value='Invalid JWT format';document.getElementById('jwt-payload').value='';return;}try{document.getElementById('jwt-header').value=JSON.stringify(JSON.parse(base64UrlDecode(p[0])),null,2);document.getElementById('jwt-payload').value=JSON.stringify(JSON.parse(base64UrlDecode(p[1])),null,2);}catch(e){document.getElementById('jwt-header').value='Error: '+e.message;document.getElementById('jwt-payload').value='';}}</script></body></html>
