<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Worker Threading Playground - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Worker Threading Playground","url":"https://salabs.quanxs.com/tools/js-web-worker-playground.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-top:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Web Worker Threading Playground</h1></header><main class="container"><button onclick="runWorker()">Run Background Computation</button><p id="status">Status: Idle</p><textarea id="output" rows="6" readonly></textarea></main><script>function runWorker(){let status=document.getElementById('status'),out=document.getElementById('output');status.innerText='Status: Background worker running...';let code=`self.onmessage=function(e){let start=performance.now(),sum=0;for(let i=0;i<50000000;i++)sum+=i;let end=performance.now();self.postMessage({sum:sum,timeMs:(end-start).toFixed(2)});};`;let blob=new Blob([code],{type:'application/javascript'});let worker=new Worker(URL.createObjectURL(blob));worker.onmessage=function(e){status.innerText='Status: Completed!';out.value=`Result: ${e.data.sum}
