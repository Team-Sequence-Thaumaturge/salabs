<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas Contrast Stretching Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas Contrast Stretching Studio","url":"https://salabs.quanxs.com/tools/html-canvas-contrast-stretching.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}canvas{background:#0f172a;border-radius:8px;border:1px solid #334155;max-width:100%;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas Contrast Stretching Studio</h1></header><main class="container"><input type="file" id="img-in" accept="image/*" onchange="applyContrast()"><canvas id="cvs" width="400" height="300"></canvas></main><script>function applyContrast(){let file=document.getElementById('img-in').files[0];if(!file)return;let img=new Image(),reader=new FileReader();reader.onload=e=>{img.onload=()=>{let canvas=document.getElementById('cvs'),ctx=canvas.getContext('2d');canvas.width=Math.min(img.width,400);canvas.height=Math.floor(img.height*(canvas.width/img.width));ctx.drawImage(img,0,0,canvas.width,canvas.height);let imgData=ctx.getImageData(0,0,canvas.width,canvas.height),d=imgData.data;let min=255,max=0;for(let i=0;i<d.length;i+=4){let avg=(d[i]+d[i+1]+d[i+2])/3;if(avg<min)min=avg;if(avg>max)max=avg;}for(let i=0;i<d.length;i+=4){d[i]=((d[i]-min)/(max-min||1))*255;d[i+1]=((d[i+1]-min)/(max-min||1))*255;d[i+2]=((d[i+2]-min)/(max-min||1))*255;}ctx.putImageData(imgData,0,0);};img.src=e.target.result;};reader.readAsDataURL(file);}</script></body></html>
