<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Spatial Panning & HRTF Visualizer - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Spatial Panning & HRTF Visualizer","url":"https://salabs.quanxs.com/tools/audio-spatial-panning-visualizer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Spatial Panning & HRTF Visualizer</h1></header><main class="container"><button onclick="play3DTone()">Play 3D Panned Binaural Tone</button><p>3D Position X (-10 to +10) (<span id="pos-val">0.0</span>)</p><input type="range" id="pos-slider" min="-10" max="10" step="0.5" value="0" oninput="update3DPos()"></main><script>let audioCtx,osc,panner;function play3DTone(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();osc=audioCtx.createOscillator();panner=audioCtx.createPanner();panner.panningModel='HRTF';let xVal=parseFloat(document.getElementById('pos-slider').value);panner.positionX.value=xVal;osc.type='sine';osc.frequency.value=440;osc.connect(panner);panner.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.5);}function update3DPos(){let v=document.getElementById('pos-slider').value;document.getElementById('pos-val').innerText=v;if(panner)panner.positionX.value=parseFloat(v);}</script></body></html>
