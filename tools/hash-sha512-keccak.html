<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>SHA-512 & Web Crypto Hash Calculator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"SHA-512 Web Crypto Hash Calculator","url":"https://salabs.quanxs.com/tools/hash-sha512-keccak.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style><script>
async function computeHashes(){let text=document.getElementById('hash-input').value;if(!text){document.getElementById('sha512-out').value='';document.getElementById('sha384-out').value='';return;}let enc=new TextEncoder();let data=enc.encode(text);let buf512=await crypto.subtle.digest('SHA-512',data);let arr512=Array.from(new Uint8Array(buf512));document.getElementById('sha512-out').value=arr512.map(b=>b.toString(16).padStart(2,'0')).join('');let buf384=await crypto.subtle.digest('SHA-384',data);let arr384=Array.from(new Uint8Array(buf384));document.getElementById('sha384-out').value=arr384.map(b=>b.toString(16).padStart(2,'0')).join('');}
</script>
</head><body><header><h1 style="color:#38bdf8;text-align:center;">SHA-512 & SHA-384 Hash Calculator</h1></header><main class="container"><h3>Plaintext Input</h3><textarea id="hash-input" rows="4" oninput="computeHashes()"></textarea><h3>SHA-512 Digest</h3><input type="text" id="sha512-out" readonly><h3>SHA-384 Digest</h3><input type="text" id="sha384-out" readonly></main></body></html>
