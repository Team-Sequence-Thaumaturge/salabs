69*b2+white*0.153852;b3=0.8665*b3+white*0.3104856;b4=0.55*b4+white*0.5329522;b5=-0.7616*b5-white*0.016898;output[i]=b0+b1+b2+b3+b4+b5+b6+white*0.5362;output[i]*=0.11;b6=white*0.115926;}}else{let lastOutput=0.0;for(let i=0;i<bufferSize;i++){let white=Math.random()*2-1;output[i]=(lastOutput+(0.02*white))/1.02;lastOutput=output[i];output[i]*=3.5;}}noiseNode=audioCtx.createBufferSource();noiseNode.buffer=buffer;noiseNode.loop=true;noiseNode.connect(audioCtx.destination);noiseNode.start();isPlaying=true;btn.innerText='Stop Noise Signal';}else{if(noiseNode)noiseNode.stop();isPlaying=false;btn.innerText='Play Noise Signal';}}</script></body></html>
