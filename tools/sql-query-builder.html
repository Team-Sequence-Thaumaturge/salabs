<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Visual SQL Query Builder - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Visual SQL Query Builder","url":"https://salabs.quanxs.com/tools/sql-query-builder.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input,textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Visual SQL Query Builder</h1></header><main class="container"><h3>Select Columns</h3><input type="text" id="sql-cols" value="id, name, email" oninput="buildSQL()"><h3>Target Table</h3><input type="text" id="sql-table" value="users" oninput="buildSQL()"><h3>WHERE Condition</h3><input type="text" id="sql-where" value="status = 'ACTIVE'" oninput="buildSQL()"><textarea id="sql-output" rows="4" readonly></textarea></main><script>function buildSQL(){let cols=document.getElementById('sql-cols').value.trim()||'*';let tbl=document.getElementById('sql-table').value.trim()||'table';let where=document.getElementById('sql-where').value.trim();let sql=`SELECT ${cols}
