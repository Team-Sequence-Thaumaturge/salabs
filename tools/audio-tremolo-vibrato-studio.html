<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Tremolo & Vibrato Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Tremolo & Vibrato Studio","url":"https://salabs.quanxs.com/tools/audio-tremolo-vibrato-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Tremolo & Vibrato Studio</h1></header><main class="container"><button onclick="playLFO()">Play LFO Tone</button><p>LFO Rate (<span id="lfo-val">5.0</span> Hz)</p><input type="range" id="lfo-slider" min="1" max="20" step="0.5" value="5" oninput="updateLFO()"></main><script>let audioCtx,osc,lfo,gainNode;function playLFO(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();if(lfo)lfo.stop();osc=audioCtx.createOscillator();lfo=audioCtx.createOscillator();gainNode=audioCtx.createGain();let rate=parseFloat(document.getElementById('lfo-slider').value);lfo.frequency.value=rate;osc.frequency.value=440;let lfoGain=audioCtx.createGain();lfoGain.gain.value=0.5;lfo.connect(lfoGain);lfoGain.connect(gainNode.gain);osc.connect(gainNode);gainNode.connect(audioCtx.destination);osc.start();lfo.start();osc.stop(audioCtx.currentTime+2.0);lfo.stop(audioCtx.currentTime+2.0);}function updateLFO(){let v=document.getElementById('lfo-slider').value;document.getElementById('lfo-val').innerText=v;}</script></body></html>
