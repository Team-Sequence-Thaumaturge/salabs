<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JSON Diff & Visual Structural Comparison Utility - SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JSON Diff Utility","url":"https://salabs.quanxs.com/tools/json-diff.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1100px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:1rem;}.diff-result{background:#0f172a;padding:1rem;border-radius:8px;border:1px solid #334155;margin-top:1rem;font-family:monospace;white-space:pre-wrap;min-height:120px;}.added{color:#4ade80;}.removed{color:#f87171;}.changed{color:#fbbf24;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JSON Diff Utility</h1></header><main class="container"><div class="grid"><div><h3>Original JSON (Left)</h3><textarea id="json-left" rows="10" placeholder='{"name": "Stella", "version": "1.0"}'></textarea></div><div><h3>Modified JSON (Right)</h3><textarea id="json-right" rows="10" placeholder='{"name": "Stella OS", "version": "2.0"}'></textarea></div></div><button onclick="compareJSON()">Compare JSON</button><h3>Comparison Result</h3><div id="diff-output" class="diff-result">Paste JSON in both panels...</div></main><script>function compareJSON(){let l=document.getElementById('json-left').value,r=document.getElementById('json-right').value,o=document.getElementById('diff-output');try{let lO=l?JSON.parse(l):{},rO=r?JSON.parse(r):{};let d=getObjectDiff(lO,rO,'');o.innerHTML=d.length===0?'<span style="color:#4ade80;">JSON structures are 100% identical!</span>':d.map(x=>`<div class="${x.type}">[${x.type.toUpperCase()}] ${x.path}: ${x.msg}</div>`).join('');}catch(e){o.innerHTML=`<span style="color:#f87171;">Invalid JSON: ${e.message}</span>`;}}function getObjectDiff(o1,o2,path){let diffs=[];let keys=new Set([...Object.keys(o1||{}),...Object.keys(o2||{})]);keys.forEach(k=>{let p=path?`${path}.${k}`:k,v1=o1?o1[k]:undefined,v2=o2?o2[k]:undefined;if(v1===undefined)diffs.push({type:'added',path:p,msg:`+ Added ${JSON.stringify(v2)}`});else if(v2===undefined)diffs.push({type:'removed',path:p,msg:`- Removed ${JSON.stringify(v1)}`});else if(typeof v1==='object'&&typeof v2==='object'&&v1!==null&&v2!==null)diffs=diffs.concat(getObjectDiff(v1,v2,p));else if(v1!==v2)diffs.push({type:'changed',path:p,msg:`Modified ${JSON.stringify(v1)} -> ${JSON.stringify(v2)}`});});return diffs;}</script></body></html>
