<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JSON Diff & Structure Comparison - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JSON Diff Comparison Utility","url":"https://salabs.quanxs.com/tools/json-diff.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1200px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem;}textarea{width:100%;height:220px;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}.diff-output{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:1.5rem;min-height:150px;font-family:monospace;white-space:pre-wrap;}.added{background:#064e3b;color:#34d399;padding:2px 4px;}.removed{background:#7f1d1d;color:#f87171;padding:2px 4px;}.modified{background:#78350f;color:#fbbf24;padding:2px 4px;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JSON Diff & Structure Comparison Utility</h1></header><main class="container"><div class="grid"><div><h3>Original JSON</h3><textarea id="json-left" placeholder='{"name": "SA Labs"}'></textarea></div><div><h3>Modified JSON</h3><textarea id="json-right" placeholder='{"name": "Quanxs SA Labs"}'></textarea></div></div><div style="text-align:center;"><button onclick="compareJSON()">Compare Differences</button></div><h3>Diff Output</h3><div id="diff-result" class="diff-output">Enter JSON above to compare.</div></main><script>function compareJSON(){let l=document.getElementById('json-left').value.trim(),r=document.getElementById('json-right').value.trim(),out=document.getElementById('diff-result');if(!l||!r){out.innerHTML='Provide JSON in both fields.';return;}try{let d=findDiff(JSON.parse(l),JSON.parse(r),'');out.innerHTML=d.length?d.join('\n'):'<span class="added">Identical JSON structures!</span>';}catch(e){out.innerHTML='JSON Error: '+e.message;}}function findDiff(a,b,p){let diffs=[],keys=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);keys.forEach(k=>{let path=p?p+'.'+k:k,vA=a?a[k]:undefined,vB=b?b[k]:undefined;if(vA===undefined)diffs.push('<span class="added">[+] Added: '+path+' = '+JSON.stringify(vB)+'</span>');else if(vB===undefined)diffs.push('<span class="removed">[-] Removed: '+path+' = '+JSON.stringify(vA)+'</span>');else if(typeof vA==='object'&&typeof vB==='object'&&vA&&vB)diffs.push(...findDiff(vA,vB,path));else if(vA!==vB)diffs.push('<span class="modified">[~] Modified '+path+': '+JSON.stringify(vA)+' -> '+JSON.stringify(vB)+'</span>');});return diffs;}</script></body></html>
