<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JSON Diff & Structural Compare Utility - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JSON Diff Structural Compare Utility","url":"https://salabs.quanxs.com/tools/json-diff.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1100px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}textarea{width:100%;height:250px;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:1rem;margin-bottom:1rem;}.diff-output{background:#0f172a;padding:1rem;border-radius:8px;border:1px solid #334155;min-height:150px;font-family:monospace;white-space:pre-wrap;word-break:break-all;}.add{background:#064e3b;color:#4ade80;padding:2px 4px;border-radius:3px;}.remove{background:#7f1d1d;color:#f87171;padding:2px 4px;border-radius:3px;}.mod{background:#78350f;color:#fde047;padding:2px 4px;border-radius:3px;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JSON Diff & Structural Compare Utility</h1></header><main class="container"><div class="grid"><div><h3>Original JSON</h3><textarea id="json-left" placeholder='{"name": "Alice", "role": "admin"}'></textarea></div><div><h3>Modified JSON</h3><textarea id="json-right" placeholder='{"name": "Alice", "role": "superadmin"}'></textarea></div></div><button onclick="compareJSON()">Compare Differences</button><h3>Structural Delta Result</h3><div id="diff-output" class="diff-output">Click 'Compare Differences'...</div></main><script>function compareJSON(){let leftStr=document.getElementById('json-left').value.trim();let rightStr=document.getElementById('json-right').value.trim();let out=document.getElementById('diff-output');try{let left=leftStr?JSON.parse(leftStr):{};let right=rightStr?JSON.parse(rightStr):{};let diffs=[];let allKeys=new Set([...Object.keys(left),...Object.keys(right)]);allKeys.forEach(key=>{if(!(key in left)){diffs.push(`<span class="add">+ [ADDED] "${key}": ${JSON.stringify(right[key])}</span>`);}else if(!(key in right)){diffs.push(`<span class="remove">- [REMOVED] "${key}": ${JSON.stringify(left[key])}</span>`);}else if(JSON.stringify(left[key])!==JSON.stringify(right[key])){diffs.push(`<span class="mod">~ [MODIFIED] "${key}": ${JSON.stringify(left[key])} -> ${JSON.stringify(right[key])}</span>`);}});out.innerHTML=diffs.length===0?'<span style="color:#4ade80;">✔ Identical!</span>':diffs.join('<br>');}catch(e){out.innerHTML='<span style="color:#f87171;">❌ Invalid JSON Input: '+e.message+'</span>';}}</script></body></html>
