<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JSON Diff & Structure Inspector - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JSON Diff Inspector","url":"https://salabs.quanxs.com/tools/json-diff.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1200px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}textarea{width:100%;height:220px;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:1rem;}.diff-out{margin-top:1.5rem;background:#0f172a;padding:1.5rem;border-radius:8px;font-family:monospace;white-space:pre-wrap;}.added{color:#4ade80;display:block;}.removed{color:#f87171;display:block;}.unchanged{color:#94a3b8;display:block;}</style></head><body><header style="text-align:center;"><h1 style="color:#38bdf8;">JSON Diff Inspector</h1></header><main class="container"><div class="grid"><div><h3>Original JSON</h3><textarea id="json-left"></textarea></div><div><h3>Modified JSON</h3><textarea id="json-right"></textarea></div></div><button onclick="compareJSON()">Compare JSON Diff</button><h3>Diff Results</h3><div id="diff-results" class="diff-out"></div></main><script>function compareJSON(){try{let l=JSON.parse(document.getElementById('json-left').value);let r=JSON.parse(document.getElementById('json-right').value);let lf=JSON.stringify(l,null,2).split('\n');let rf=JSON.stringify(r,null,2).split('\n');let html='';let max=Math.max(lf.length,rf.length);for(let i=0;i<max;i++){let a=lf[i],b=rf[i];if(a===b){if(a!==undefined)html+=`<span class="unchanged">  ${esc(a)}</span>`;}else{if(a!==undefined)html+=`<span class="removed">- ${esc(a)}</span>`;if(b!==undefined)html+=`<span class="added">+ ${esc(b)}</span>`;}}document.getElementById('diff-results').innerHTML=html||'Identical.';}catch(e){document.getElementById('diff-results').innerHTML=`<span style="color:#f87171;">${esc(e.message)}</span>`;}}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}</script></body></html>
