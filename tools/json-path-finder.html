<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JSON Path Finder & Evaluator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JSON Path Finder Evaluator","url":"https://salabs.quanxs.com/tools/json-path-finder.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JSON Path Finder & Evaluator</h1></header><main class="container"><h3>1. JSON Input</h3><textarea id="json-input" rows="6" oninput="evaluatePath()"></textarea><h3>2. Path</h3><input type="text" id="path-input" oninput="evaluatePath()"><h3>3. Result</h3><textarea id="result-output" rows="4" readonly></textarea></main><script>function evaluatePath(){let jsonText=document.getElementById('json-input').value;let pathText=document.getElementById('path-input').value.trim();if(!jsonText||!pathText){document.getElementById('result-output').value='';return;}try{let data=JSON.parse(jsonText);let keys=pathText.replace(/\[(\d+)\]/g,'.$1').split('.').filter(Boolean);let curr=data;for(let k of keys){if(curr!==null&&curr!==undefined&&k in curr)curr=curr[k];else{curr=undefined;break;}}document.getElementById('result-output').value=curr!==undefined?JSON.stringify(curr,null,2):'Path not found';}catch(e){document.getElementById('result-output').value='Invalid JSON: '+e.message;}}</script></body></html>
