<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>CSS Layered Box Shadow Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"CSS Layered Box Shadow Studio","url":"https://salabs.quanxs.com/tools/css-box-shadow-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}.preview-area{height:250px;display:flex;align-items:center;justify-content:center;background:#0f172a;border-radius:8px;margin-bottom:1.5rem;}.box{width:180px;height:120px;background:#1e293b;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#38bdf8;}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;}textarea{width:100%;height:80px;background:#0f172a;color:#38bdf8;border:1px solid #334155;border-radius:8px;padding:1rem;font-family:monospace;box-sizing:border-box;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">CSS Layered Box Shadow Studio</h1></header><main class="container"><div class="preview-area"><div id="target-box" class="box">Shadow Box</div></div><div class="controls"><div><label>Offset X (<span id="v-x">0</span>px)</label><input type="range" id="x" min="-50" max="50" value="0" oninput="updateShadow()"></div><div><label>Offset Y (<span id="v-y">10</span>px)</label><input type="range" id="y" min="-50" max="50" value="10" oninput="updateShadow()"></div><div><label>Blur (<span id="v-blur">25</span>px)</label><input type="range" id="blur" min="0" max="100" value="25" oninput="updateShadow()"></div><div><label>Spread (<span id="v-spread">-5</span>px)</label><input type="range" id="spread" min="-30" max="30" value="-5" oninput="updateShadow()"></div></div><textarea id="css-code" readonly></textarea></main><script>function updateShadow(){let x=document.getElementById('x').value,y=document.getElementById('y').value,blur=document.getElementById('blur').value,spread=document.getElementById('spread').value;document.getElementById('v-x').innerText=x;document.getElementById('v-y').innerText=y;document.getElementById('v-blur').innerText=blur;document.getElementById('v-spread').innerText=spread;let s=`${x}px ${y}px ${blur}px ${spread}px rgba(0,0,0,0.4), 0px 4px 6px -1px rgba(0,0,0,0.2)`;document.getElementById('target-box').style.boxShadow=s;document.getElementById('css-code').value=`box-shadow: ${s};`;}updateShadow();</script></body></html>
