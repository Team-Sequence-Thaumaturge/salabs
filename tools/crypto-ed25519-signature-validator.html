<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto Ed25519 Signature Validator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto Ed25519 Signature Validator","url":"https://salabs.quanxs.com/tools/crypto-ed25519-signature-validator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}.result-box{padding:1rem;border-radius:8px;font-weight:bold;margin-top:1rem;background:#334155;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Web Crypto Ed25519 Signature Validator</h1></header><main class="container"><textarea id="jwk-in" rows="3" placeholder="JWK Public Key..."></textarea><textarea id="msg-in" rows="3" placeholder="Payload..."></textarea><input type="text" id="sig-in" placeholder="Base64URL Signature..."><button onclick="verifyEd25519()">Verify Ed25519 Signature</button><div id="status-box" class="result-box">Ready for Verification</div></main><script>async function verifyEd25519(){let jwkStr=document.getElementById('jwk-in').value,msgStr=document.getElementById('msg-in').value,sigStr=document.getElementById('sig-in').value.trim(),box=document.getElementById('status-box');if(!jwkStr||!msgStr||!sigStr){box.innerText='Please enter JWK Key, Payload, and Signature';return;}try{let jwk=JSON.parse(jwkStr);let key=await window.crypto.subtle.importKey("jwk",jwk,{name:"Ed25519"},false,["verify"]);let rawSig=atob(sigStr.replace(/-/g,'+').replace(/_/g,'/'));let sigBuf=new Uint8Array(rawSig.length);for(let i=0;i<rawSig.length;i++)sigBuf[i]=rawSig.charCodeAt(i);let enc=new TextEncoder();let valid=await window.crypto.subtle.verify("Ed25519",key,sigBuf,enc.encode(msgStr));if(valid){box.style.background='#16a34a';box.innerText='✓ Ed25519 SIGNATURE VERIFIED SUCCESSFULLY';}else{box.style.background='#dc2626';box.innerText='✕ Ed25519 SIGNATURE VERIFICATION FAILED';}}catch(e){box.style.background='#dc2626';box.innerText='Verification Error: '+e.message;}}</script></body></html>
