<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Base Converter (Bin, Oct, Dec, Hex) - Quanxs SA Labs</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Number Base Converter",
      "url": "https://salabs.quanxs.com/tools/number-base-converter.html"
    }
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
        header { text-align: center; margin-bottom: 2rem; }
        h1 { color: #38bdf8; }
        .container { max-width: 1000px; margin: 0 auto; background: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid #334155; }
        input { width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; box-sizing: border-box; font-family: monospace; }
        .badge { display: inline-block; background: #0284c7; color: #fff; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <header>
        <span class="badge">Pure Client-Side JS</span>
        <h1>Number Base Converter</h1>
        <p>Realtime Conversion Across Binary, Octal, Decimal, and Hexadecimal</p>
    </header>
    <main class="container">
        <h3>Decimal (Base 10)</h3>
        <input type="text" id="dec-in" placeholder="255" oninput="convert('dec')">
        <h3>Binary (Base 2)</h3>
        <input type="text" id="bin-in" placeholder="11111111" oninput="convert('bin')">
        <h3>Hexadecimal (Base 16)</h3>
        <input type="text" id="hex-in" placeholder="FF" oninput="convert('hex')">
        <h3>Octal (Base 8)</h3>
        <input type="text" id="oct-in" placeholder="377" oninput="convert('oct')">
    </main>
    <script>
        function convert(source) {
            let decEl = document.getElementById('dec-in');
            let binEl = document.getElementById('bin-in');
            let hexEl = document.getElementById('hex-in');
            let octEl = document.getElementById('oct-in');
            let num = NaN;
            if (source === 'dec') num = parseInt(decEl.value, 10);
            else if (source === 'bin') num = parseInt(binEl.value, 2);
            else if (source === 'hex') num = parseInt(hexEl.value, 16);
            else if (source === 'oct') num = parseInt(octEl.value, 8);

            if (isNaN(num)) {
                if (source !== 'dec') decEl.value = '';
                if (source !== 'bin') binEl.value = '';
                if (source !== 'hex') hexEl.value = '';
                if (source !== 'oct') octEl.value = '';
                return;
            }

            if (source !== 'dec') decEl.value = num.toString(10);
            if (source !== 'bin') binEl.value = num.toString(2);
            if (source !== 'hex') hexEl.value = num.toString(16).toUpperCase();
            if (source !== 'oct') octEl.value = num.toString(8);
        }
    </script>
</body>
</html>
