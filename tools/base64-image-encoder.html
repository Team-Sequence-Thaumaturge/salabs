<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Base64 Image Encoder - Quanxs SA Labs</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Base64 Image Encoder",
      "url": "https://salabs.quanxs.com/tools/base64-image-encoder.html"
    }
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 2rem; border-radius: 12px; }
        textarea, input { width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #334155; padding: 1rem; border-radius: 8px; box-sizing: border-box; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Base64 Image Encoder</h1>
        <input type="file" id="img-input" accept="image/*" onchange="encodeImg()">
        <textarea id="base64-output" rows="6" readonly></textarea>
    </div>
    <script>
        function encodeImg() {
            let file = document.getElementById('img-input').files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('base64-output').value = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
