  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;

    pre#asciiOutput {
      background: #000;

      user-select: none;

    }
    .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
    .control-item { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.85rem; color: #8b949e; display: flex; justify-content: space-between; }
    input[type="range"] { accent-color: var(--accent); width: 100%; }
    select { background: var(--bg); color: #fff; border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; }
    footer { text-align: center; font-size: 0.8rem; color: #8b949e; margin-top: 30px; }
    a { color: var(--accent); text-decoration: none; }
  </style>
<script>

    const CHARS = " .'`^",:;Il!i><~+_-?][}{1)(|\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
    const W = 64;
    const H = 34;
    let rotX = 0.5;
    let rotY = 0.5;

    function maxbox(p, b) {
      const dx = Math.abs(p.x) - b;
      const dy = Math.abs(p.y) - b;
      const dz = Math.abs(p.z) - b;
      return Math.max(dx, Math.max(dy, dz));
    }

    function mapSponge(p, maxIters) {
      let d = maxbox(p, 1.0);
      let s = 1.0;
      for (let m = 0; m < maxIters; m++) {
        let a = {
          x: (p.x * s + 1.0) % 2.0 - 1.0,
          y: (p.y * s + 1.0) % 2.0 - 1.0,
          z: (p.z * s + 1.0) % 2.0 - 1.0
        };
        s *= 3.0;
        let r = {
          x: 1.0 - 3.0 * Math.abs(a.x),
          y: 1.0 - 3.0 * Math.abs(a.y),
          z: 1.0 - 3.0 * Math.abs(a.z)
        };
        let c = (Math.min(Math.max(r.x, r.y), Math.min(Math.max(r.y, r.z), Math.max(r.z, r.x)))) / s;
        d = Math.max(d, c);
      }
      return d;
    }

    function rotateX(p, a) {
      const c = Math.cos(a), s = Math.sin(a);
      return { x: p.x, y: p.y * c - p.z * s, z: p.y * s + p.z * c };
    }
    function rotateY(p, a) {
      const c = Math.cos(a), s = Math.sin(a);
      return { x: p.x * c + p.z * s, y: p.y, z: -p.x * s + p.z * c };
    }

    function renderFrame() {
      const speed = parseFloat(document.getElementById('speedSlider').value) * 0.002;
      const depth = parseInt(document.getElementById('depthSlider').value);
      const camDist = parseFloat(document.getElementById('distSlider').value) * 0.1;

      rotX += speed * 0.7;
      rotY += speed;

      let buffer = "";
      const ro = { x: 0, y: 0, z: -camDist };

      for (let j = 0; j < H; j++) {
        for (let i = 0; i < W; i++) {
          const uvX = (i / W) * 2.0 - 1.0;
          const uvY = (j / H) * 2.0 - 1.0;
          const rd = { x: uvX * 0.8, y: uvY * 0.8, z: 1.0 };
          const len = Math.sqrt(rd.x * rd.x + rd.y * rd.y + rd.z * rd.z);
          rd.x /= len; rd.y /= len; rd.z /= len;

          let t = 0.0;
          let hit = false;
          let normal = { x: 0, y: 0, z: 0 };

          for (let step = 0; step < 32; step++) {
            let p = { x: ro.x + rd.x * t, y: ro.y + rd.y * t, z: ro.z + rd.z * t };
            p = rotateY(rotateX(p, rotX), rotY);
            const d = mapSponge(p, depth);
            if (d < 0.01) {
              hit = true;
              break;
            }
            t += d;
            if (t > 5.0) break;
          }

          if (hit) {
            const light = { x: 0.577, y: 0.577, z: -0.577 };
            const charIdx = Math.min(CHARS.length - 1, Math.max(0, Math.floor((1.0 / (1.0 + t * 0.5)) * (CHARS.length - 1))));
            buffer += CHARS[charIdx];
          } else {
            buffer += " ";
          }
        }
        buffer += "\n";
      }

      document.getElementById('asciiOutput').innerText = buffer;
      requestAnimationFrame(renderFrame);
    }
    renderFrame();

    document.getElementById('themeSelect').addEventListener('change', (e) => {
      document.getElementById('asciiOutput').style.color = e.target.value;
      document.getElementById('themeName').innerText = e.target.options[e.target.selectedIndex].text;
    });
    document.getElementById('speedSlider').addEventListener('input', (e) => {
      document.getElementById('speedVal').innerText = (e.target.value / 10).toFixed(1) + 'x';
    });
    document.getElementById('depthSlider').addEventListener('input', (e) => {
      document.getElementById('depthVal').innerText = 'Level ' + e.target.value;
    });
    document.getElementById('distSlider').addEventListener('input', (e) => {
      document.getElementById('distVal').innerText = (e.target.value / 10).toFixed(1);
    });
  
</script>

<body>
