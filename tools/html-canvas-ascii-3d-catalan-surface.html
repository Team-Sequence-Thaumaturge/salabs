<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Catalan Minimal Surface ASCII Studio - Quanxs SA Labs</title>
  <meta name="description" content="100% Client-Side Pure JS Mathematical Catalan Minimal Surface ASCII/Canvas 3D Projection Studio.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "3D Catalan Minimal Surface ASCII Studio",
    "url": "https://salabs.quanxs.com/tools/html-canvas-ascii-3d-catalan-surface.html",
    "description": "Interactive mathematical 3D Catalan surface wireframe and ASCII raytracer rendering engine.",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All"
  }
  </script>
  <style>
    :root { --bg: #090d13; --card: #121820; --border: #242f3d; --text: #adbac7; --accent: #6cb6ff; --green: #347d39; }
    body { background: var(--bg); color: var(--text); font-family: monospace; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    h1 { color: #fff; font-size: 1.4rem; margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    #asciiScreen { background: #000; color: #7ee787; font-family: monospace; font-size: 11px; line-height: 11px; white-space: pre; padding: 15px; border-radius: 6px; overflow-x: auto; text-align: center; border: 1px solid var(--border); }
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 0.85rem; }
    input[type=range] { width: 100%; }
  </style>
<script>

    const screen = document.getElementById('asciiScreen');
    const WIDTH = 70;
    const HEIGHT = 35;
    const SHADES = ' .:-=+*#%@';

    let angleX = 0.5, angleY = 0.8, angleZ = 0;
    let speed = 1.0, scale = 22, density = 24;

    document.getElementById('speed').addEventListener('input', e => {
      speed = parseFloat(e.target.value);
      document.getElementById('valSpeed').innerText = speed.toFixed(1);
    });
    document.getElementById('scale').addEventListener('input', e => {
      scale = parseInt(e.target.value);
      document.getElementById('valScale').innerText = scale;
    });
    document.getElementById('density').addEventListener('input', e => {
      density = parseInt(e.target.value);
      document.getElementById('valDensity').innerText = density;
    });

    function render() {
      const buffer = Array(HEIGHT).fill(null).map(() => Array(WIDTH).fill(' '));
      const zBuffer = Array(HEIGHT).fill(null).map(() => Array(WIDTH).fill(-1000));

      const uSteps = density;
      const vSteps = density;
      const uMin = -Math.PI, uMax = Math.PI;
      const vMin = -1.5, vMax = 1.5;

      for (let i = 0; i <= uSteps; i++) {
        const u = uMin + (uMax - uMin) * (i / uSteps);
        for (let j = 0; j <= vSteps; j++) {
          const v = vMin + (vMax - vMin) * (j / vSteps);

          let x = u - Math.sin(u) * Math.cosh(v);
          let y = 1 - Math.cos(u) * Math.cosh(v);
          let z = 4 * Math.sin(u / 2) * Math.sinh(v / 2);

          y -= 1.0;

          let x1 = x * Math.cos(angleY) + z * Math.sin(angleY);
          let z1 = -x * Math.sin(angleY) + z * Math.cos(angleY);

          let y2 = y * Math.cos(angleX) - z1 * Math.sin(angleX);
          let z2 = y * Math.sin(angleX) + z1 * Math.cos(angleX);

          let x3 = x1 * Math.cos(angleZ) - y2 * Math.sin(angleZ);
          let y3 = x1 * Math.sin(angleZ) + y2 * Math.cos(angleZ);

          const distance = 8;
          const fov = scale;
          const projX = Math.floor(WIDTH / 2 + (x3 * fov) / (z2 + distance));
          const projY = Math.floor(HEIGHT / 2 + (y3 * (fov * 0.55)) / (z2 + distance));

          if (projX >= 0 && projX < WIDTH && projY >= 0 && projY < HEIGHT) {
            if (z2 > zBuffer[projY][projX]) {
              zBuffer[projY][projX] = z2;
              let shadeIdx = Math.floor(((z2 + 3) / 6) * (SHADES.length - 1));
              shadeIdx = Math.max(0, Math.min(SHADES.length - 1, shadeIdx));
              buffer[projY][projX] = SHADES[shadeIdx];
            }
          }
        }
      }

      screen.innerText = buffer.map(row => row.join('')).join('\n');

      angleX += 0.015 * speed;
      angleY += 0.02 * speed;
      angleZ += 0.008 * speed;

      requestAnimationFrame(render);
    }

    render();
  
</script>
</head>
<body>
  <div class="container">
    <h1>📐 3D Catalan Minimal Surface ASCII Studio</h1>
    <p>수학적 카탈란 극소곡면(Catalan Minimal Surface: x=u-sin(u)cosh(v), y=1-cos(u)cosh(v), z=4sin(u/2)sinh(v/2)) 3D 프로젝션 ASCII 렌더러입니다.</p>
    
    <div id="asciiScreen"></div>

    <div class="controls">
      <div>
        <label>회전 속도 (Rotation Speed): <span id="valSpeed">1.0</span></label>
        <input type="range" id="speed" min="0" max="3" step="0.1" value="1.0">
      </div>
      <div>
        <label>스케일 (Scale): <span id="valScale">22</span></label>
        <input type="range" id="scale" min="10" max="40" step="1" value="22">
      </div>
      <div>
        <label>그리드 밀도 (Grid Density): <span id="valDensity">24</span></label>
        <input type="range" id="density" min="12" max="36" step="2" value="24">
      </div>
    </div>
  </div>

  
</body>
</html>
