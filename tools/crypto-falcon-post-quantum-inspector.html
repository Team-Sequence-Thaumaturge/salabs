<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post-Quantum Falcon Lattice Key Inspector | Quanxs SA Labs</title>
  <meta name="description" content="Explore and inspect NIST Post-Quantum Falcon-512 and Falcon-1024 lattice-based signature key structures, NTRU polynomials, and fast Fourier sampling in pure client-side JS.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Post-Quantum Falcon Lattice Key Inspector",
    "url": "https://salabs.quanxs.com/tools/crypto-falcon-post-quantum-inspector.html",
    "description": "Client-side lattice cryptography simulator analyzing Falcon-512/1024 polynomial structures and Gram-Schmidt orthogonalization vectors.",
    "applicationCategory": "SecurityApplication",
    "operatingSystem": "All"
  }
  </script>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      line-height: 1.6;
    }
    .container { max-width: 960px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 24px; }
    header h1 { font-size: 1.8rem; color: #f0f6fc; margin-bottom: 8px; }
    header p { color: #8b949e; font-size: 0.95rem; }
    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    label { font-size: 0.85rem; color: #8b949e; font-weight: 600; margin-bottom: 6px; display: block; }
    select, textarea, input {
      width: 100%;
      background: #090d13;
      border: 1px solid var(--border);
      color: #c9d1d9;
      padding: 8px 12px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }
    textarea { height: 120px; resize: vertical; }
    button {
      background: #238636;
      color: #fff;
      border: 1px solid rgba(240,246,252,0.1);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    button:hover { background: #2ea043; }
    .output-box {
      background: #090d13;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-all;
      color: #79c0ff;
    }
  </style>
<script>

    document.getElementById('genKeyBtn').addEventListener('click', async () => {
      const N = parseInt(document.getElementById('falconDegree').value);
      const q = 12289;
      
      const seed = crypto.getRandomValues(new Uint8Array(32));
      const hashBuffer = await crypto.subtle.digest('SHA-256', seed);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

      let coeffs = [];
      for (let i = 0; i < 8; i++) {
        coeffs.push((Math.floor(Math.random() * q)).toString(16).padStart(4, '0'));
      }

      const pubKeySummary = `[Falcon-${N} Public Key]\nDegree N: ${N}\nModulus q: ${q}\nSeed Root: 0x${hashHex.slice(0, 24)}...\nFirst 8 Polynomial Coefficients h(x):\n[ 0x${coeffs.join(', 0x')} ... ]\nPublic Key Size: ${N === 512 ? '897 bytes' : '1793 bytes'}\nNTRU Invertibility: OK (det(B) = q^N)`;
      document.getElementById('pubKeyDisplay').textContent = pubKeySummary;

      const gsNorm = (1.17 * Math.sqrt(q)).toFixed(4);
      const privSummary = `[Falcon-${N} Private NTRU Basis (f, g, F, G)]\nGram-Schmidt Bound ||B*||_max <= ${gsNorm}\nFast Fourier Sampling Tree Depth: ${Math.log2(N)}\nTarget Signature Bound: σ_sig = 165.7\nConstant-time Fast Fourier Orthogonalization: PASSED`;
      document.getElementById('privKeyDisplay').textContent = privSummary;
    });
  
</script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Post-Quantum Falcon Lattice Key Inspector</h1>
      <p>Simulate and inspect NIST FIPS 206 Falcon (Fast-Fourier Lattice-based Signatures over NTRU) key structures.</p>
    </header>

    <div class="card">
      <div class="grid">
        <div>
          <label>Security Level Parameter</label>
          <select id="falconDegree">
            <option value="512">Falcon-512 (N=512, NIST Level 1)</option>
            <option value="1024">Falcon-1024 (N=1024, NIST Level 5)</option>
          </select>
        </div>
        <div>
          <label>NTRU Modulus (q)</label>
          <input type="text" value="12289 (Prime with q ≡ 1 mod 2048)" readonly>
        </div>
      </div>

      <button id="genKeyBtn">⚡ Generate Simulated Falcon Keypair</button>
    </div>

    <div class="card">
      <h3 style="color:#f0f6fc; margin-bottom:12px; font-size:1.1rem;">Lattice Structure & Key Inspector</h3>
      <label>Public Key Polynomial h(x) = g * f⁻¹ mod q (Hex/Coeff summary):</label>
      <div id="pubKeyDisplay" class="output-box">Click Generate to inspect Falcon key structure...</div>

      <div style="margin-top:16px;">
        <label>Private Basis (f, g, F, G) Gram-Schmidt Norm Verification:</label>
        <div id="privKeyDisplay" class="output-box">Awaiting key generation...</div>
      </div>
    </div>
  </div>

  
</body>
</html>
