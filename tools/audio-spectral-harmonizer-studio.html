<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Multi-Harmonic Overtone Synthesizer - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Multi-Harmonic Overtone Synthesizer","url":"https://salabs.quanxs.com/tools/audio-spectral-harmonizer-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Multi-Harmonic Overtone Synthesizer</h1></header><main class="container"><button onclick="playHarmonicTone()">Play Harmonic Chord</button><p>Base Frequency (<span id="freq-val">220</span> Hz)</p><input type="range" id="freq-slider" min="110" max="880" value="220" oninput="updateHarmonic()"></main><script>let audioCtx,osc;function playHarmonicTone(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();osc=audioCtx.createOscillator();let freq=parseFloat(document.getElementById('freq-slider').value);let real=new Float32Array([0,1,0.5,0.25,0.125]);let imag=new Float32Array(5);let wave=audioCtx.createPeriodicWave(real,imag);osc.setPeriodicWave(wave);osc.frequency.value=freq;osc.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.5);}function updateHarmonic(){let v=document.getElementById('freq-slider').value;document.getElementById('freq-val').innerText=v;}</script></body></html>
