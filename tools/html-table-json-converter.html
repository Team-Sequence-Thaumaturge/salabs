<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>HTML Table to JSON / CSV Converter - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"HTML Table to JSON Converter","url":"https://salabs.quanxs.com/tools/html-table-json-converter.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-right:0.5rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">HTML Table to JSON & CSV Converter</h1></header><main class="container"><h3>1. HTML Table Input</h3><textarea id="html-input" rows="6" placeholder="Paste <table>...</table> HTML string here..."></textarea><div><button onclick="convertToJSON()">Convert to JSON</button><button onclick="convertToCSV()">Convert to CSV</button></div><h3>2. Result</h3><textarea id="result-output" rows="8" readonly></textarea></main><script>function parseTable(){let html=document.getElementById('html-input').value;let parser=new DOMParser();let doc=parser.parseFromString(html,'text/html');let table=doc.querySelector('table');if(!table)return null;let rows=Array.from(table.querySelectorAll('tr'));if(rows.length===0)return null;let headers=Array.from(rows[0].querySelectorAll('th, td')).map(cell=>cell.textContent.trim());let data=[];for(let i=1;i<rows.length;i++){let cells=Array.from(rows[i].querySelectorAll('td, th')).map(cell=>cell.textContent.trim());if(cells.length===0)continue;let obj={};headers.forEach((h,idx)=>{obj[h||`col_${idx+1}`]=cells[idx]||'';});data.push(obj);}return{headers,data};}function convertToJSON(){let res=parseTable();if(!res){document.getElementById('result-output').value='Error: Valid <table> element not found.';return;}document.getElementById('result-output').value=JSON.stringify(res.data,null,2);}function convertToCSV(){let res=parseTable();if(!res){document.getElementById('result-output').value='Error: Valid <table> element not found.';return;}let csv=[];csv.push(res.headers.map(h=>`"${h.replace(/"/g,'""')}"`).join(','));res.data.forEach(row=>{let line=res.headers.map(h=>`"${(row[h]||'').replace(/"/g,'""')}"`).join(',');csv.push(line);});document.getElementById('result-output').value=csv.join('\n');}</script></body></html>
