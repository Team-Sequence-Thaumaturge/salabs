<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>HTML Canvas Color Picker & Palette Extractor - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"HTML Canvas Color Picker","url":"https://salabs.quanxs.com/tools/html-canvas-color-picker.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}canvas{border:1px solid #334155;border-radius:8px;cursor:crosshair;}.color-info{margin-top:1rem;font-family:monospace;font-size:1.2rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">HTML Canvas Pixel Color Picker</h1></header><main class="container"><input type="file" id="img-file" accept="image/*" onchange="loadImage()"><br><canvas id="pic-canvas" width="600" height="350"></canvas><div class="color-info" id="color-val">Click image to sample color...</div></main><script>let cvs=document.getElementById('pic-canvas'),ctx=cvs.getContext('2d');function loadImage(){let file=document.getElementById('img-file').files[0];if(!file)return;let img=new Image();img.onload=function(){ctx.drawImage(img,0,0,cvs.width,cvs.height);};img.src=URL.createObjectURL(file);}cvs.addEventListener('click',function(e){let rect=cvs.getBoundingClientRect();let x=e.clientX-rect.left,y=e.clientY-rect.top;let pixel=ctx.getImageData(x,y,1,1).data;let hex="#"+((1<<24)+(pixel[0]<<16)+(pixel[1]<<8)+pixel[2]).toString(16).slice(1).toUpperCase();document.getElementById('color-val').innerText=`HEX: ${hex} | RGB: rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;});</script></body></html>
