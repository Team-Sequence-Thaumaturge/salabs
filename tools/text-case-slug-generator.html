<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Text Case & URL Slug Generator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Text Case Slug Generator","url":"https://salabs.quanxs.com/tools/text-case-slug-generator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Text Case & URL Slug Generator</h1></header><main class="container"><h3>Input Text</h3><input type="text" id="text-in" oninput="convertText()"><h3>kebab-case (Slug)</h3><input type="text" id="kebab-out" readonly><h3>snake_case</h3><input type="text" id="snake-out" readonly><h3>camelCase</h3><input type="text" id="camel-out" readonly><h3>PascalCase</h3><input type="text" id="pascal-out" readonly></main><script>function convertText(){let str=document.getElementById('text-in').value.trim();if(!str){document.getElementById('kebab-out').value='';document.getElementById('snake-out').value='';document.getElementById('camel-out').value='';document.getElementById('pascal-out').value='';return;}let words=str.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(Boolean);document.getElementById('kebab-out').value=words.join('-');document.getElementById('snake-out').value=words.join('_');document.getElementById('camel-out').value=words.map((w,i)=>i===0?w:w.charAt(0).toUpperCase()+w.slice(1)).join('');document.getElementById('pascal-out').value=words.map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join('');}</script></body></html>
