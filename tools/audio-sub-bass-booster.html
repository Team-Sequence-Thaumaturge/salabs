<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Sub-Bass Booster Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Sub-Bass Booster Studio","url":"https://salabs.quanxs.com/tools/audio-sub-bass-booster.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Sub-Bass Booster Studio</h1></header><main class="container"><button onclick="playBassTone()">Play Sub-Bass Tone</button><p>Gain Boost (<span id="gain-val">12</span> dB)</p><input type="range" id="gain-slider" min="0" max="24" step="1" value="12" oninput="updateBass()"></main><script>let audioCtx,osc,bassFilter;function playBassTone(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();osc=audioCtx.createOscillator();bassFilter=audioCtx.createBiquadFilter();let g=parseFloat(document.getElementById('gain-slider').value);osc.type='sawtooth';osc.frequency.value=60;bassFilter.type='lowshelf';bassFilter.frequency.value=120;bassFilter.gain.value=g;osc.connect(bassFilter);bassFilter.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.5);}function updateBass(){let v=document.getElementById('gain-slider').value;document.getElementById('gain-val').innerText=v;if(bassFilter)bassFilter.gain.value=parseFloat(v);}</script></body></html>
