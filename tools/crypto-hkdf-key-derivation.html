<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto HKDF Key Derivation Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto HKDF Key Derivation Studio","url":"https://salabs.quanxs.com/tools/crypto-hkdf-key-derivation.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Web Crypto HKDF Key Derivation Studio</h1></header><main class="container"><input type="text" id="ikm-in" placeholder="Input Keying Material (IKM)" oninput="deriveHKDF()"><input type="text" id="salt-in" placeholder="Salt" oninput="deriveHKDF()"><input type="text" id="info-in" placeholder="Info Context" oninput="deriveHKDF()"><textarea id="key-out" rows="2" readonly></textarea></main><script>async function deriveHKDF(){let ikm=document.getElementById('ikm-in').value,salt=document.getElementById('salt-in').value,info=document.getElementById('info-in').value,out=document.getElementById('key-out');if(!ikm){out.value='';return;}try{let enc=new TextEncoder();let baseKey=await window.crypto.subtle.importKey("raw",enc.encode(ikm),"HKDF",false,["deriveBits"]);let bits=await window.crypto.subtle.deriveBits({name:"HKDF",hash:"SHA-256",salt:enc.encode(salt||""),info:enc.encode(info||"")},baseKey,256);out.value=Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');}catch(e){out.value='Error: '+e.message;}}</script></body></html>
