<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas Image Color Quantizer - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas Image Color Quantizer","url":"https://salabs.quanxs.com/tools/html-canvas-color-quantizer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}canvas{background:#0f172a;border-radius:8px;border:1px solid #334155;max-width:100%;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas Image Color Quantizer</h1></header><main class="container"><input type="file" id="img-in" accept="image/*" onchange="quantizeColors()"><canvas id="q-canvas" width="400" height="300"></canvas></main><script>function quantizeColors(){let file=document.getElementById('img-in').files[0];if(!file)return;let img=new Image(),reader=new FileReader();reader.onload=e=>{img.onload=()=>{let canvas=document.getElementById('q-canvas'),ctx=canvas.getContext('2d');canvas.width=Math.min(img.width,400);canvas.height=Math.floor(img.height*(canvas.width/img.width));ctx.drawImage(img,0,0,canvas.width,canvas.height);let imgData=ctx.getImageData(0,0,canvas.width,canvas.height),d=imgData.data;for(let i=0;i<d.length;i+=4){d[i]=Math.round(d[i]/64)*64;d[i+1]=Math.round(d[i+1]/64)*64;d[i+2]=Math.round(d[i+2]/64)*64;}ctx.putImageData(imgData,0,0);};img.src=e.target.result;};reader.readAsDataURL(file);}</script></body></html>
