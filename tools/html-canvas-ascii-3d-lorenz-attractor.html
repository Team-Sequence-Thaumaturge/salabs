  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-bright: #58a6ff;

      --accent-hover: #2ea043;

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {

    .container {

      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;

    }
    h1 {
      font-size: 1.5rem;

    }
    p.desc {
      font-size: 0.9rem;

    }
    .viewport {
      background: #000;

      border-radius: 6px;

      user-select: none;

      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

      display: flex;
      flex-direction: column;
      gap: 4px;
    }

      font-size: 0.8rem;
      color: var(--text);
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--text-bright);
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 8px;
    }
    button {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);

      background: var(--accent-hover);

<script>

    const COLS = 70;
    const ROWS = 35;
    const asciiScreen = document.getElementById("asciiScreen");

    let x = 0.1, y = 0.0, z = 0.0;
    let points = [];
    const MAX_POINTS = 500;
    let angleY = 0;
    let angleX = 0.3;

    const sigmaInput = document.getElementById("sigma");
    const rhoInput = document.getElementById("rho");
    const betaInput = document.getElementById("beta");
    const rotSpeedInput = document.getElementById("rotSpeed");

    sigmaInput.addEventListener("input", (e) => document.getElementById("valSigma").textContent = e.target.value);
    rhoInput.addEventListener("input", (e) => document.getElementById("valRho").textContent = e.target.value);
    betaInput.addEventListener("input", (e) => document.getElementById("valBeta").textContent = e.target.value);
    rotSpeedInput.addEventListener("input", (e) => document.getElementById("valRot").textContent = e.target.value);

    document.getElementById("resetBtn").addEventListener("click", () => {
      x = 0.1 + (Math.random() - 0.5) * 0.1;
      y = 0.0;
      z = 0.0;
      points = [];
    });

    function lorenzDeriv(px, py, pz, s, r, b) {
      return [
        s * (py - px),
        px * (r - pz) - py,
        px * py - b * pz
      ];
    }

    function rk4Step(dt, s, r, b) {
      const [k1x, k1y, k1z] = lorenzDeriv(x, y, z, s, r, b);
      const [k2x, k2y, k2z] = lorenzDeriv(x + 0.5 * dt * k1x, y + 0.5 * dt * k1y, z + 0.5 * dt * k1z, s, r, b);
      const [k3x, k3y, k3z] = lorenzDeriv(x + 0.5 * dt * k2x, y + 0.5 * dt * k2y, z + 0.5 * dt * k2z, s, r, b);
      const [k4x, k4y, k4z] = lorenzDeriv(x + dt * k3x, y + dt * k3y, z + dt * k3z, s, r, b);

      x += (dt / 6) * (k1x + 2 * k2x + 2 * k3x + k4x);
      y += (dt / 6) * (k1y + 2 * k2y + 2 * k3y + k4y);
      z += (dt / 6) * (k1z + 2 * k2z + 2 * k3z + k4z);
    }

    const DENSITY_CHARS = " .:-=+*#%@";

    function loop() {
      const s = parseFloat(sigmaInput.value);
      const r = parseFloat(rhoInput.value);
      const b = parseFloat(betaInput.value);
      const rot = parseFloat(rotSpeedInput.value);

      for (let i = 0; i < 4; i++) {
        rk4Step(0.01, s, r, b);
        points.push({ x, y, z: z - 25 });
        if (points.length > MAX_POINTS) points.shift();
      }

      angleY += 0.015 * rot;

      const grid = Array.from({ length: ROWS }, () => Array(COLS).fill(" "));
      const zBuffer = Array.from({ length: ROWS }, () => Array(COLS).fill(-Infinity));

      const cosY = Math.cos(angleY), sinY = Math.sin(angleY);
      const cosX = Math.cos(angleX), sinX = Math.sin(angleX);

      for (let i = 0; i < points.length; i++) {
        const pt = points[i];
        const x1 = pt.x * cosY - pt.y * sinY;
        const y1 = pt.x * sinY + pt.y * cosY;
        const z1 = pt.z;

        const y2 = y1 * cosX - z1 * sinX;
        const z2 = y1 * sinX + z1 * cosX;
        const x2 = x1;

        const fov = 60;
        const dist = 70;
        const screenX = Math.floor(COLS / 2 + (x2 * fov) / (z2 + dist) * 1.8);
        const screenY = Math.floor(ROWS / 2 - (y2 * fov) / (z2 + dist));

        if (screenX >= 0 && screenX < COLS && screenY >= 0 && screenY < ROWS) {
          if (z2 > zBuffer[screenY][screenX]) {
            zBuffer[screenY][screenX] = z2;
            const intensity = Math.floor((i / points.length) * (DENSITY_CHARS.length - 1));
            grid[screenY][screenX] = DENSITY_CHARS[intensity];
          } 
        }
      }

      asciiScreen.textContent = grid.map(row => row.join("")).join("\n");
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  
</script>

<body>
  <div class="container">
    <h1>Canvas ASCII 3D 로렌츠 어트랙터 카오스 시뮬레이터</h1>
    <p class="desc">dx/dt = σ(y - x), dy/dt = x(ρ - z) - y, dz/dt = xy - βz 미분방정식을 Runge-Kutta 4차 기법으로 적분하여 3차원 ASCII 공간에 실시간 투영합니다.</p>
    
    <div class="viewport">
      <pre id="asciiScreen"></pre>
    </div>

    <div class="controls">
      <div class="control-group">
        <label>시그마 (σ = <span id="valSigma">10.0</span>)</label>
        <input type="range" id="sigma" min="5" max="25" step="0.5" value="10">
      </div>
      <div class="control-group">
        <label>로우 (ρ = <span id="valRho">28.0</span>)</label>
        <input type="range" id="rho" min="10" max="50" step="0.5" value="28">
      </div>
      <div class="control-group">
        <label>베타 (β = <span id="valBeta">2.67</span>)</label>
        <input type="range" id="beta" min="1" max="5" step="0.05" value="2.67">
      </div>
      <div class="control-group">
        <label>회전 속도 (<span id="valRot">1.0</span>x)</label>
        <input type="range" id="rotSpeed" min="0.2" max="3.0" step="0.1" value="1.0">
      </div>
    </div>

    <div class="btn-group">
      <button id="resetBtn">궤적 초기화 (Reset Trajectory)</button>
    </div>
  </div>

  
</body>
