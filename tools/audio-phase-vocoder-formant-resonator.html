<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option PH: Phase Vocoder & Formant Resonator Studio - Quanxs SA Labs</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Phase Vocoder & Formant Resonator Studio",
  "url": "https://salabs.quanxs.com/tools/audio-phase-vocoder-formant-resonator.html",
  "applicationCategory": "DeveloperApplication",
  "operatingSystem": "All",
  "browserRequirements": "Requires JavaScript. Requires HTML5 AudioContext.",
  "author": {
    "@type": "Organization",
    "name": "Quanxs SA Labs"
  }
}
</script>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
h1 { color: #38bdf8; font-size: 24px; margin-bottom: 12px; text-align: center; }
p { color: #94a3b8; text-align: center; margin-bottom: 24px; }
.control-group { margin-bottom: 18px; }
label { display: block; margin-bottom: 6px; font-weight: 600; color: #cbd5e1; }
input[type="range"] { width: 100%; accent-color: #38bdf8; }
.btn { background: #0284c7; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; font-weight: 600; transition: background 0.2s; }
.btn:hover { background: #0369a1; }
canvas { width: 100%; height: 160px; background: #0b0f19; border-radius: 8px; margin-top: 20px; display: block; border: 1px solid #334155; }
.stats { margin-top: 15px; font-family: monospace; color: #4ade80; background: #0b0f19; padding: 12px; border-radius: 6px; }
</style>
<script>

let audioCtx = null, osc = null, f1 = null, f2 = null, analyser = null, isPlaying = false, animId = null;
function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  osc = audioCtx.createOscillator();
  osc.type = 'sawtooth';
  f1 = audioCtx.createBiquadFilter();
  f1.type = 'bandpass';
  f1.Q.value = 8.0;
  f2 = audioCtx.createBiquadFilter();
  f2.type = 'bandpass';
  f2.Q.value = 6.0;
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  const merger = audioCtx.createGain();
  merger.gain.value = 0.5;
  osc.connect(f1);
  osc.connect(f2);
  f1.connect(merger);
  f2.connect(merger);
  merger.connect(analyser);
  analyser.connect(audioCtx.destination);
  osc.start();
  updateAudio();
}
function updateAudio() {
  const baseFreqVal = parseFloat(document.getElementById('baseFreq').value);
  const f1Val = parseFloat(document.getElementById('formantF1').value);
  const f2Val = parseFloat(document.getElementById('formantF2').value);
  document.getElementById('freqLabel').textContent = 'Base Carrier Frequency: ' + baseFreqVal + ' Hz';
  document.getElementById('f1Label').textContent = 'Formant Resonator F1: ' + f1Val + ' Hz (Q: 8.0)';
  document.getElementById('f2Label').textContent = 'Formant Resonator F2: ' + f2Val + ' Hz (Q: 6.0)';
  if (audioCtx && isPlaying) {
    osc.frequency.setValueAtTime(baseFreqVal, audioCtx.currentTime);
    f1.frequency.setValueAtTime(f1Val, audioCtx.currentTime);
    f2.frequency.setValueAtTime(f2Val, audioCtx.currentTime);
  }
}
function toggleSynthesizer() {
  if (!isPlaying) {
    if (!audioCtx) initAudio();
    else audioCtx.resume();
    isPlaying = true;
    document.getElementById('toggleBtn').textContent = 'Stop Vocoder Resonator';
    document.getElementById('stats').textContent = 'Status: RUNNING (Dual Resonator Active)';
    drawVisualizer();
  } else {
    audioCtx.suspend();
    isPlaying = false;
    document.getElementById('toggleBtn').textContent = 'Start Vocoder Resonator';
    document.getElementById('stats').textContent = 'Status: PAUSED';
    cancelAnimationFrame(animId);
  }
}
function drawVisualizer() {
  const canvas = document.getElementById('spectrumCanvas');
  const ctx = canvas.getContext('2d');
  const bufferLength = analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);
  function render() {
    animId = requestAnimationFrame(render);
    analyser.getByteFrequencyData(dataArray);
    ctx.fillStyle = '#0b0f19';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const barWidth = (canvas.width / bufferLength) * 2.5;
    let x = 0;
    for (let i = 0; i < bufferLength; i++) {
      const barHeight = (dataArray[i] / 255) * canvas.height;
      ctx.fillStyle = 'rgb(' + (dataArray[i] + 50) + ', 56, 248)';
      ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
      x += barWidth + 1;
    }
  }
  render();
}

</script>
</head>
<body>
<div class="container">
<h1>🎛️ Phase Vocoder & Formant Resonator Studio</h1>
<p>100% Client-Side Pure Web Audio API Phase Shifting & Dual Formant Resonant Synthesis</p>
<div class="control-group">
<label id="freqLabel">Base Carrier Frequency: 220 Hz</label>
<input type="range" id="baseFreq" min="55" max="880" value="220" oninput="updateAudio()">
</div>
<div class="control-group">
<label id="f1Label">Formant Resonator F1 (Vowel Peak): 730 Hz (Resonance: 8.0)</label>
<input type="range" id="formantF1" min="200" max="1200" value="730" oninput="updateAudio()">
</div>
<div class="control-group">
<label id="f2Label">Formant Resonator F2 (Cavity Peak): 1090 Hz (Resonance: 6.0)</label>
<input type="range" id="formantF2" min="800" max="3000" value="1090" oninput="updateAudio()">
</div>
<button id="toggleBtn" class="btn" onclick="toggleSynthesizer()">Start Vocoder Resonator</button>
<canvas id="spectrumCanvas"></canvas>
<div id="stats" class="stats">Status: Ready (AudioContext Standby)</div>
</div>

</body>
</html>
