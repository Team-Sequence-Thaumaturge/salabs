<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Markdown Table Generator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Markdown Table Generator","url":"https://salabs.quanxs.com/tools/markdown-table-generator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #334155;padding:0.5rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Markdown Table Generator</h1></header><main class="container"><table id="table-grid"><thead><tr><th><input type="text" value="Header 1" oninput="generateMD()"></th><th><input type="text" value="Header 2" oninput="generateMD()"></th></tr></thead><tbody><tr><td><input type="text" value="Data 1" oninput="generateMD()"></td><td><input type="text" value="Data 2" oninput="generateMD()"></td></tr></tbody></table><textarea id="md-output" rows="6" readonly></textarea></main><script>function generateMD(){let t=document.getElementById('table-grid');let h=Array.from(t.querySelectorAll('thead th input')).map(i=>i.value.trim()||' ');let r=Array.from(t.querySelectorAll('tbody tr')).map(tr=>Array.from(tr.querySelectorAll('td input')).map(i=>i.value.trim()||' '));let m='| '+h.join(' | ')+' |\n| '+h.map(()=>'---').join(' | ')+' |\n';for(let row of r)m+='| '+row.join(' | ')+' |\n';document.getElementById('md-output').value=m;}generateMD();</script></body></html>
