<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Formant Vowel Filter - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Formant Vowel Filter","url":"https://salabs.quanxs.com/tools/audio-formant-vowel-filter.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}select{padding:0.8rem;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:8px;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Formant Vowel Filter</h1></header><main class="container"><select id="vowel-sel"><option value="A">/a/</option><option value="I">/i/</option><option value="U">/u/</option></select><br><button onclick="playVowel()">Play Formant Vowel Tone</button></main><script>let audioCtx,osc,f1,f2;let formants={'A':[800,1200],'I':[300,2300],'U':[300,800]};function playVowel(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();let v=document.getElementById('vowel-sel').value,freqs=formants[v];osc=audioCtx.createOscillator();f1=audioCtx.createBiquadFilter();f2=audioCtx.createBiquadFilter();osc.type='sawtooth';osc.frequency.value=130;f1.type='bandpass';f1.frequency.value=freqs[0];f1.Q.value=5;f2.type='bandpass';f2.frequency.value=freqs[1];f2.Q.value=5;osc.connect(f1);osc.connect(f2);f1.connect(audioCtx.destination);f2.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.2);}</script></body></html>
