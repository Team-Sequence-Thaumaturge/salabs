<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>CSV Delimiter & Transposer - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"CSV Delimiter Transposer","url":"https://salabs.quanxs.com/tools/csv-delimiter-converter.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,select,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">CSV Delimiter & Transposer</h1></header><main class="container"><h3>1. Input Data</h3><textarea id="csv-input" rows="6" oninput="processCSV()"></textarea><select id="delim-select" onchange="processCSV()"><option value=";">Semicolon (;)</option><option value="&#9;">Tab (\t)</option><option value="|">Pipe (|)</option><option value=",">Comma (,)</option></select><textarea id="csv-output" rows="6" readonly></textarea></main><script>function processCSV(){let input=document.getElementById('csv-input').value;let delim=document.getElementById('delim-select').value;if(!input){document.getElementById('csv-output').value='';return;}let lines=input.trim().split('\n');let result=lines.map(line=>{let parts=line.split(/[,;\t|]/);return parts.join(delim);}).join('\n');document.getElementById('csv-output').value=result;}</script></body></html>
