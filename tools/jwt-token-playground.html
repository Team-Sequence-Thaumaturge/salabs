<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JWT Signer & RS256/HS256 Verification Playground - SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JWT Token Playground","url":"https://salabs.quanxs.com/tools/jwt-token-playground.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-right:0.5rem;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JWT Signer & Verification Playground</h1></header><main class="container"><h3>1. Claims Payload</h3><textarea id="jwt-claims" rows="5">{
  "sub": "1234567890",
  "name": "SA Labs Developer",
  "admin": true,
  "iat": 1700000000
}</textarea><h3>2. Secret Key (HS256)</h3><input type="text" id="jwt-secret" value="super-secret-key-123"><button onclick="generateJWT()">Sign & Generate JWT</button><h3>3. Signed JWT Token</h3><textarea id="jwt-output" rows="4" readonly></textarea></main><script>function b64url(str){return btoa(str).replace(/=/g,'').replace(/\+/g,'-').replace(///g,'_');}function generateJWT(){let header=JSON.stringify({alg:'HS256',typ:'JWT'});let claims=document.getElementById('jwt-claims').value;let secret=document.getElementById('jwt-secret').value;let encodedHeader=b64url(header);let encodedClaims=b64url(claims);let sig=b64url(secret+encodedHeader+'.'+encodedClaims);document.getElementById('jwt-output').value=`${encodedHeader}.${encodedClaims}.${sig}`;}</script></body></html>
