  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --heading: #58a6ff;
      --accent: #238636;
      --accent-hover: #2ea043;
      --code-bg: #090d13;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 25px; }
    h1 { color: var(--heading); font-size: 1.8rem; margin-bottom: 8px; }
    p.desc { color: #8b949e; font-size: 0.95rem; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    h2 { color: #f0f6fc; font-size: 1.2rem; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }

    label { display: block; font-weight: 600; margin-bottom: 6px; color: #8b949e; font-size: 0.85rem; }
    input[type="number"], input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #7ee787;
      font-family: monospace;
      font-size: 0.9rem;
    }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .result-box {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      color: #79c0ff;
      word-break: break-all;
      margin-top: 8px;
      font-size: 0.85rem;

<body>
  <div class="container">
    <header>
      <h1>Paillier Homomorphic Encryption Studio</h1>
      <p class="desc">100% Client-Side Additive Homomorphic Encryption using Pure JS BigInt</p>
    </header>

    <div class="ad-container">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-9108438313531011"
           data-ad-slot="auto"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      
    </div>

    <div class="card">
      <h2>1. Key Pair Generation</h2>
      <p style="font-size: 0.85rem; color: #8b949e; margin-bottom: 12px;">Generates Paillier public key (n, g) and private key (λ, μ) locally.</p>
      <button class="btn" id="genKeyBtn">Generate Paillier Key Pair</button>
      <div id="keyInfo" style="margin-top: 15px; display: none;">
        <label>Public Key (n = p * q, n²):</label>
        <div class="result-box" id="pubKeyDisp"></div>
        <label style="margin-top: 8px;">Private Key (λ, μ):</label>
        <div class="result-box" id="privKeyDisp"></div>
      </div>
    </div>

    <div class="card">
      <h2>2. Homomorphic Encryption & Homomorphic Addition</h2>
      <div class="grid-2">
        <div class="form-group">
          <label>Plaintext m1 (Integer):</label>
          <input type="number" id="m1Input" value="42">
        </div>
        <div class="form-group">
          <label>Plaintext m2 (Integer):</label>
          <input type="number" id="m2Input" value="58">
        </div>
      </div>
      <button class="btn" id="calcBtn">Encrypt & Compute Homomorphic Sum</button>

      <div id="calcResults" style="margin-top: 15px; display: none;">
        <label>Ciphertext c1 = Enc(m1):</label>
        <div class="result-box" id="c1Disp"></div>
        <label style="margin-top: 8px;">Ciphertext c2 = Enc(m2):</label>
        <div class="result-box" id="c2Disp"></div>
        <label style="margin-top: 8px;">Homomorphic Addition c_sum = (c1 * c2) mod n²:</label>
        <div class="result-box" id="cSumDisp"></div>
        <label style="margin-top: 8px;">Decrypted Sum Dec(c_sum):</label>
        <div class="result-box" id="decSumDisp" style="color: #56d364; font-size: 1.1rem; font-weight: bold;"></div>
      </div>
    </div>
  </div>
