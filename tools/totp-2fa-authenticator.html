cret);let epoch=Math.round(new Date().getTime()/1000.0);let time=leftpad(dec2hex(Math.floor(epoch/30)),16,'0');let keyBytes=new Uint8Array(key.match(/[\da-f]{2}/gi).map(h=>parseInt(h,16)));let timeBytes=new Uint8Array(time.match(/[\da-f]{2}/gi).map(h=>parseInt(h,16)));let cryptoKey=await crypto.subtle.importKey('raw',keyBytes,{name:'HMAC',hash:'SHA-1'},false,['sign']);let sig=await crypto.subtle.sign('HMAC',cryptoKey,timeBytes);let hash=new Uint8Array(sig);let offset=hash[hash.length-1]&0xf;let otp=(((hash[offset]&0x7f)<<24)|((hash[offset+1]&0xff)<<16)|((hash[offset+2]&0xff)<<8)|(hash[offset+3]&0xff))%1000000;document.getElementById('token-box').innerText=String(otp).padStart(6,'0');}catch(e){document.getElementById('token-box').innerText='ERROR';}}function leftpad(str,len,pad){if(len+1>=str.length){str=Array(len+1-str.length).join(pad||'0')+str;}return str;}generateTOTP();setInterval(generateTOTP,1000);</script></body></html>
