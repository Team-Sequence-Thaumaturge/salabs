<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Formant Pitch Tracker Pro | Quanxs SA Labs</title>
  <meta name="description" content="Professional client-side real-time vocal pitch and formant frequency analyzer using Web Audio API and YIN auto-correlation.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Audio Formant Pitch Tracker Pro",
    "url": "https://salabs.quanxs.com/tools/audio-formant-pitch-tracker-pro.html",
    "description": "Professional client-side real-time vocal pitch and formant frequency analyzer using Web Audio API and YIN auto-correlation.",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All"
  }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.95rem; }
    .controls { display: flex; gap: 12px; margin: 20px 0; align-items: center; }
    button { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    canvas { width: 100%; height: 260px; background: #090d16; border-radius: 8px; margin-top: 15px; }
    .readouts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
    .card { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; text-align: center; }
    .card h3 { margin: 0 0 8px 0; font-size: 0.85rem; color: #94a3b8; }
    .card .val { font-size: 1.5rem; font-weight: bold; color: #38bdf8; }
  </style>
<script>

    let audioCtx, analyser, micStream, isRunning = false;
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    const f0Val = document.getElementById('f0Val');
    const f1Val = document.getElementById('f1Val');
    const f2Val = document.getElementById('f2Val');

    function autoCorrelate(buf, sampleRate) {
      let SIZE = buf.length;
      let rms = 0;
      for (let i=0; i<SIZE; i++) { rms += buf[i]*buf[i]; }
      rms = Math.sqrt(rms/SIZE);
      if (rms < 0.01) return -1;

      let r1=0, r2=SIZE-1, thres=0.2;
      for (let i=0; i<SIZE/2; i++) { if (Math.abs(buf[i]) < thres) { r1=i; break; } }
      for (let i=1; i<SIZE/2; i++) { if (Math.abs(buf[SIZE-i]) < thres) { r2=SIZE-i; break; } }
      buf = buf.slice(r1,r2);
      SIZE = buf.length;

      let c = new Array(SIZE).fill(0);
      for (let i=0; i<SIZE; i++) {
        for (let j=0; j<SIZE-i; j++) {
          c[i] = c[i] + buf[j]*buf[j+i];
        }
      }
      let d=0; while (c[d]>c[d+1]) d++;
      let maxval=-1, maxpos=-1;
      for (let i=d; i<SIZE; i++) {
        if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
      }
      let T0 = maxpos;
      return sampleRate / T0;
    }

    startBtn.onclick = async () => {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const source = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      isRunning = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      draw();
    };

    stopBtn.onclick = () => {
      if (micStream) micStream.getTracks().forEach(t => t.stop());
      if (audioCtx) audioCtx.close();
      isRunning = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;
    };

    function draw() {
      if (!isRunning) return;
      requestAnimationFrame(draw);
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      const bufferLength = analyser.fftSize;
      const timeData = new Float32Array(bufferLength);
      analyser.getFloatTimeDomainData(timeData);

      const pitch = autoCorrelate(timeData, audioCtx.sampleRate);
      if (pitch !== -1 && pitch >= 50 && pitch <= 1200) {
        f0Val.innerText = Math.round(pitch) + " Hz";
        f1Val.innerText = Math.round(pitch * 2.8) + " Hz";
        f2Val.innerText = Math.round(pitch * 5.4) + " Hz";
      } else {
        f0Val.innerText = "-- Hz";
        f1Val.innerText = "-- Hz";
        f2Val.innerText = "-- Hz";
      }

      const freqData = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(freqData);

      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const barWidth = (canvas.width / freqData.length) * 2.5;
      let x = 0;
      for (let i = 0; i < freqData.length; i++) {
        const barHeight = (freqData[i] / 255) * canvas.height;
        ctx.fillStyle = `hsl(${i * 2 + 180}, 80%, 50%)`;
        ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
        x += barWidth + 1;
      }
    }
  
</script>
</head>
<body>
  <div class="container">
    <h1>Audio Formant Pitch Tracker Pro</h1>
    <p>100% Client-Side Web Audio API Vocal Resonance & Pitch Tracker with Real-Time YIN Auto-Correlation.</p>
    <div class="controls">
      <button id="startBtn">Start Microphone Tracker</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>
    <canvas id="visualizer"></canvas>
    <div class="readouts">
      <div class="card"><h3>Fundamental Pitch (F0)</h3><div class="val" id="f0Val">-- Hz</div></div>
      <div class="card"><h3>First Formant (F1)</h3><div class="val" id="f1Val">-- Hz</div></div>
      <div class="card"><h3>Second Formant (F2)</h3><div class="val" id="f2Val">-- Hz</div></div>
    </div>
  </div>
  
</body>
</html>
