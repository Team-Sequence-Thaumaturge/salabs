<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Next Generation Client-side Utility Engine - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Next Generation Client-side Utility Engine","url":"https://salabs.quanxs.com/tools/next-gen-utility-engine.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Next Generation Client-side Utility Engine</h1></header><main class="container"><label>Input Raw Payload</label><textarea id="raw-input" rows="4" placeholder="Enter text..."></textarea><button onclick="processPayload()">Execute Next-Gen Processing Engine</button><h3>SHA-256 Digest</h3><input type="text" id="hash-output" readonly><h3>Base64URL Encoded</h3><input type="text" id="b64-output" readonly></main><script>async function processPayload(){let input=document.getElementById('raw-input').value;if(!input)return;let enc=new TextEncoder();let data=enc.encode(input);let hashBuf=await window.crypto.subtle.digest('SHA-256',data);let hashHex=Array.from(new Uint8Array(hashBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');let b64Str=btoa(input).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');document.getElementById('hash-output').value=hashHex;document.getElementById('b64-output').value=b64Str;}</script></body></html>
