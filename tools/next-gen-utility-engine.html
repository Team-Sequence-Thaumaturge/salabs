<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Next Generation Client-side Utility Engine - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Next Generation Client-side Utility Engine","url":"https://salabs.quanxs.com/tools/next-gen-utility-engine.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-right:0.5rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Next Generation Client-side Utility Engine</h1></header><main class="container"><h3>Input Data / Code Payload</h3><textarea id="input-data" rows="6" placeholder="Enter JSON, Code, or Text string..."></textarea><button onclick="processUtility('format')">Beautify JSON</button><button onclick="processUtility('minify')">Minify Code</button><button onclick="processUtility('hash')">SHA-256 Hash</button><h3>Processed Engine Output</h3><textarea id="output-data" rows="6" readonly></textarea></main><script>async function processUtility(action){let src=document.getElementById('input-data').value,out=document.getElementById('output-data');if(!src)return;try{if(action==='format'){out.value=JSON.stringify(JSON.parse(src),null,2);}else if(action==='minify'){out.value=src.replace(/\s+/g,' ').trim();}else if(action==='hash'){let enc=new TextEncoder(),buf=await window.crypto.subtle.digest("SHA-256",enc.encode(src));out.value=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}}catch(e){out.value='Engine Error: '+e.message;}}</script></body></html>
