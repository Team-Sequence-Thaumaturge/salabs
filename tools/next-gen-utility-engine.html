<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Next-Gen Client-Side Developer Utility Engine - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Next-Gen Client-Side Developer Utility Engine","url":"https://salabs.quanxs.com/tools/next-gen-utility-engine.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-right:0.5rem;margin-bottom:0.5rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Next-Gen Client-Side Utility Engine</h1></header><main class="container"><label>Input Workspace Payload</label><textarea id="main-input" rows="6" placeholder="Paste JSON, String, or Encoded Text here..."></textarea><div><button onclick="transformFormat('beautify')">Format JSON</button><button onclick="transformFormat('base64enc')">Base64 Encode</button><button onclick="transformFormat('base64dec')">Base64 Decode</button><button onclick="transformFormat('uppercase')">UPPERCASE</button><button onclick="transformFormat('lowercase')">lowercase</button></div><label>Engine Output</label><textarea id="main-output" rows="6" readonly placeholder="Output will appear here..."></textarea></main><script>function transformFormat(a){let v=document.getElementById('main-input').value,o=document.getElementById('main-output');try{if(a==='beautify')o.value=JSON.stringify(JSON.parse(v),null,2);else if(a==='base64enc')o.value=btoa(unescape(encodeURIComponent(v)));else if(a==='base64dec')o.value=decodeURIComponent(escape(atob(v)));else if(a==='uppercase')o.value=v.toUpperCase();else if(a==='lowercase')o.value=v.toLowerCase();}catch(e){o.value="Engine Error: "+e.message;}}</script></body></html>
