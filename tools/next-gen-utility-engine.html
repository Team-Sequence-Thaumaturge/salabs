<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Next Generation Client-side Utility Engine - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Next Generation Client-side Utility Engine","url":"https://salabs.quanxs.com/tools/next-gen-utility-engine.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Next Generation Client-side Utility Engine</h1></header><main class="container"><div class="grid"><div><textarea id="raw-in" rows="8" placeholder="Enter text..."></textarea><button onclick="processBase64()">Base64</button><button onclick="processSHA256()">SHA-256</button><button onclick="processSanitize()">Sanitize</button></div><div><textarea id="engine-out" rows="8" readonly></textarea></div></div></main><script>function processBase64(){let i=document.getElementById('raw-in').value;try{document.getElementById('engine-out').value=btoa(unescape(encodeURIComponent(i)));}catch(e){document.getElementById('engine-out').value=e.message;}}async function processSHA256(){let i=document.getElementById('raw-in').value;let b=new TextEncoder().encode(i);let h=await window.crypto.subtle.digest('SHA-256',b);document.getElementById('engine-out').value=Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');}function processSanitize(){let i=document.getElementById('raw-in').value,t=document.createElement('div');t.textContent=i;document.getElementById('engine-out').value=t.innerHTML;}</script></body></html>
