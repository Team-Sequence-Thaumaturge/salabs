<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>QR Code & Barcode Generator - SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"QR Barcode Generator","url":"https://salabs.quanxs.com/tools/qr-barcode-generator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}.qr-output{display:flex;justify-content:center;align-items:center;background:#ffffff;padding:1.5rem;border-radius:8px;margin-top:1rem;min-height:200px;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">QR Code & Barcode Generator</h1></header><main class="container"><h3>1. Content</h3><textarea id="qr-input" rows="3" placeholder="Enter text or URL..." oninput="generateQR()"></textarea><button onclick="generateQR()">Generate QR</button><h3>2. Result</h3><div id="qr-container" class="qr-output"><span>QR preview</span></div></main><script>function generateQR(){let val=document.getElementById('qr-input').value.trim()||'https://salabs.quanxs.com';let c=document.getElementById('qr-container');try{let qr=qrcode(0,'M');qr.addData(val);qr.make();c.innerHTML=qr.createImgTag(5);}catch(e){c.innerHTML='Error: '+e.message;}}generateQR();</script></body></html>
