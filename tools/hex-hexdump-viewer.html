<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Hexdump Inspector - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Hexdump Inspector","url":"https://salabs.quanxs.com/tools/hex-hexdump-viewer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Hexdump Inspector</h1></header><main class="container"><h3>Raw Text</h3><textarea id="raw-text" rows="4" oninput="generateHexdump()"></textarea><h3>Hexdump</h3><textarea id="hexdump-out" rows="8" readonly></textarea></main><script>function generateHexdump(){let str=document.getElementById('raw-text').value;if(!str){document.getElementById('hexdump-out').value='';return;}let encoder=new TextEncoder();let bytes=encoder.encode(str);let out='';for(let i=0;i<bytes.length;i+=16){let addr=i.toString(16).padStart(8,'0');let chunk=bytes.slice(i,i+16);let hexStr=Array.from(chunk).map(b=>b.toString(16).padStart(2,'0')).join(' ').padEnd(48,' ');let asciiStr=Array.from(chunk).map(b=>(b>=32&&b<=126)?String.fromCharCode(b):'.').join('');out+=`${addr}  ${hexStr}  |${asciiStr}|\n`;}document.getElementById('hexdump-out').value=out;}generateHexdump();</script></body></html>
