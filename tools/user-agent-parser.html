<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Agent Parser & Device Detector - Quanxs SA Labs</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "User Agent Parser & Device Detector",
      "url": "https://salabs.quanxs.com/tools/user-agent-parser.html"
    }
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
        header { text-align: center; margin-bottom: 2rem; }
        h1 { color: #38bdf8; }
        .container { max-width: 1000px; margin: 0 auto; background: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid #334155; }
        textarea, input { width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; box-sizing: border-box; font-family: monospace; }
        .badge { display: inline-block; background: #0284c7; color: #fff; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; margin-bottom: 1rem; }
        .result-card { background: #0f172a; padding: 1rem; border-radius: 8px; border: 1px solid #334155; margin-top: 1rem; }
    </style>
</head>
<body>
    <header>
        <span class="badge">Pure Client-Side JS</span>
        <h1>User Agent Parser & Device Detector</h1>
        <p>Analyze Browser, OS, Engine, and Device Details Instantly</p>
    </header>
    <main class="container">
        <h3>User Agent String</h3>
        <textarea id="ua-input" rows="3" placeholder="User Agent String..." oninput="parseUA()"></textarea>
        <h3>Parsed Breakdown</h3>
        <div id="ua-output" class="result-card"></div>
    </main>
    <script>
        document.getElementById('ua-input').value = navigator.userAgent;
        function parseUA() {
            let ua = document.getElementById('ua-input').value;
            let browser = 'Unknown Browser';
            let os = 'Unknown OS';
            if (ua.indexOf('Firefox/') !== -1) browser = 'Mozilla Firefox';
            else if (ua.indexOf('Edg/') !== -1) browser = 'Microsoft Edge';
            else if (ua.indexOf('Chrome/') !== -1) browser = 'Google Chrome';
            else if (ua.indexOf('Safari/') !== -1 && ua.indexOf('Chrome') === -1) browser = 'Apple Safari';

            if (ua.indexOf('Win') !== -1) os = 'Windows';
            else if (ua.indexOf('Mac') !== -1) os = 'macOS';
            else if (ua.indexOf('Linux') !== -1) os = 'Linux';
            else if (ua.indexOf('Android') !== -1) os = 'Android';
            else if (ua.indexOf('iPhone') !== -1 || ua.indexOf('iPad') !== -1) os = 'iOS';

            let isMobile = Boolean(ua.match(/Mobi|Android|iPhone|iPad/i));
            document.getElementById('ua-output').innerHTML = '<p><strong>Browser:</strong> ' + browser + '</p><p><strong>Operating System:</strong> ' + os + '</p><p><strong>Mobile Device:</strong> ' + (isMobile ? 'Yes' : 'No') + '</p><p><strong>Raw UA Length:</strong> ' + ua.length + ' characters</p>';
        }
        parseUA();
    </script>
</body>
</html>
