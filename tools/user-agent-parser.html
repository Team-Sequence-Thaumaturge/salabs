<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>User Agent Parser & Device Detector - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"User Agent Parser & Device Detector","url":"https://salabs.quanxs.com/tools/user-agent-parser.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.result-card{background:#0f172a;padding:1rem;border-radius:8px;border:1px solid #334155;margin-top:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">User Agent Parser & Device Detector</h1></header><main class="container"><h3>User Agent String</h3><textarea id="ua-input" rows="3" oninput="parseUA()"></textarea><div id="ua-output" class="result-card"></div></main><script>document.getElementById('ua-input').value=navigator.userAgent;function parseUA(){let ua=document.getElementById('ua-input').value;let browser='Unknown Browser';let os='Unknown OS';if(ua.includes('Firefox/'))browser='Mozilla Firefox';else if(ua.includes('Edg/'))browser='Microsoft Edge';else if(ua.includes('Chrome/'))browser='Google Chrome';else if(ua.includes('Safari/')&&!ua.includes('Chrome'))browser='Apple Safari';if(ua.includes('Win'))os='Windows';else if(ua.includes('Mac'))os='macOS';else if(ua.includes('Linux'))os='Linux';else if(ua.includes('Android'))os='Android';else if(ua.includes('iPhone')||ua.includes('iPad'))os='iOS';document.getElementById('ua-output').innerHTML=`<p><strong>Browser:</strong> ${browser}</p><p><strong>Operating System:</strong> ${os}</p><p><strong>Mobile Device:</strong> ${/Mobi|Android|iPhone|iPad/i.test(ua)?'Yes':'No'}</p>`;}parseUA();</script></body></html>
