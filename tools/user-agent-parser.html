<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>User Agent Parser - Quanxs SA Labs</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "User Agent Parser",
      "url": "https://salabs.quanxs.com/tools/user-agent-parser.html"
    }
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 2rem; border-radius: 12px; }
        textarea { width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #334155; padding: 1rem; border-radius: 8px; box-sizing: border-box; }
        .card { background: #0f172a; padding: 1rem; border-radius: 8px; border: 1px solid #334155; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>User Agent Parser</h1>
        <textarea id="ua-input" rows="3" oninput="parseUA()"></textarea>
        <div id="ua-output" class="card"></div>
    </div>
    <script>
        document.getElementById('ua-input').value = navigator.userAgent;
        function parseUA() {
            let ua = document.getElementById('ua-input').value;
            let browser = 'Unknown Browser';
            let os = 'Unknown OS';
            if (ua.includes('Firefox/')) browser = 'Mozilla Firefox';
            else if (ua.includes('Edg/')) browser = 'Microsoft Edge';
            else if (ua.includes('Chrome/')) browser = 'Google Chrome';
            else if (ua.includes('Safari/') && !ua.includes('Chrome')) browser = 'Apple Safari';
            if (ua.includes('Win')) os = 'Windows';
            else if (ua.includes('Mac')) os = 'macOS';
            else if (ua.includes('Linux')) os = 'Linux';
            else if (ua.includes('Android')) os = 'Android';
            else if (ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';
            document.getElementById('ua-output').innerHTML = '<p><strong>Browser:</strong> ' + browser + '</p><p><strong>OS:</strong> ' + os + '</p>';
        }
        parseUA();
    </script>
</body>
</html>
