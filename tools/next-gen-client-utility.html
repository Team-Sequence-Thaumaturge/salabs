<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Next-Gen Client-Side Utility Engine - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Next-Gen Client-Side Utility Engine","url":"https://salabs.quanxs.com/tools/next-gen-client-utility.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Next-Gen Client-Side Utility Engine</h1></header><main class="container"><textarea id="raw-input" rows="8" placeholder="Enter text or JSON..."></textarea><button onclick="runNextGenEngine()">Execute Analysis Engine</button><textarea id="output-log" rows="8" readonly></textarea></main><script>async function runNextGenEngine(){let v=document.getElementById('raw-input').value,log=document.getElementById('output-log');if(!v){log.value='Input is empty.';return;}let bLen=new TextEncoder().encode(v).length,cLen=v.length,lines=v.split('\n').length,isJson=false;try{JSON.parse(v);isJson=true;}catch(e){}let hashBuf=await window.crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));let sha256=Array.from(new Uint8Array(hashBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');log.value=[`--- Next-Gen Utility Engine Audit ---`,`Character Count: ${cLen}`,`Byte Size: ${bLen} bytes`,`Line Count: ${lines}`,`Valid JSON Syntax: ${isJson?'YES':'NO'}`,`SHA-256 Digest: ${sha256}`].join('\n');}</script></body></html>
