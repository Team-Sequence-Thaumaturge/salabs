<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JavaScript Event KeyCode Inspector - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JavaScript Event KeyCode Inspector","url":"https://salabs.quanxs.com/tools/js-event-key-code.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}.key-display{font-size:5rem;font-weight:bold;color:#38bdf8;margin:1rem 0;}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:2rem;}.card{background:#0f172a;padding:1rem;border-radius:8px;border:1px solid #334155;}</style></head><body><header><h1 style="color:#38bdf8;">JavaScript Event KeyCode Inspector</h1></header><main class="container"><p>Press any key on your keyboard...</p><div class="key-display" id="key-val">-</div><div class="grid"><div class="card"><label>event.key</label><br><span id="k-key">-</span></div><div class="card"><label>event.code</label><br><span id="k-code">-</span></div><div class="card"><label>event.keyCode</label><br><span id="k-keycode">-</span></div></div></main><script>window.addEventListener('keydown',function(e){e.preventDefault();document.getElementById('key-val').innerText=e.key===' '?'Space':e.key;document.getElementById('k-key').innerText=JSON.stringify(e.key);document.getElementById('k-code').innerText=e.code;document.getElementById('k-keycode').innerText=e.keyCode;});</script></body></html>
