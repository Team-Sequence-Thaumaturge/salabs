e(text));let combined=new Uint8Array(iv.length+encrypted.byteLength);combined.set(iv,0);combined.set(new Uint8Array(encrypted),iv.length);document.getElementById('cipher-out').value=btoa(String.fromCharCode.apply(null,combined));}catch(e){alert('ChaCha AEAD Error: '+e.message);}}</script></body></html>
