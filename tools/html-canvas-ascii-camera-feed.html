<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas ASCII Live Camera Feed - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas ASCII Live Camera Feed","url":"https://salabs.quanxs.com/tools/html-canvas-ascii-camera-feed.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}video{display:none;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas ASCII Live Camera Feed</h1></header><main class="container"><button onclick="startWebcamASCII()">Start Live Camera Feed</button><video id="video-stream" autoplay playsinline></video><textarea id="ascii-feed" rows="14" readonly></textarea></main><script>async function startWebcamASCII(){try{let stream=await navigator.mediaDevices.getUserMedia({video:{width:80,height:40}});let video=document.getElementById('video-stream');video.srcObject=stream;let canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=70;canvas.height=30;function renderFrame(){ctx.drawImage(video,0,0,70,30);let imgData=ctx.getImageData(0,0,70,30).data,chars=' @%#*+=-:. ',ascii='';for(let y=0;y<30;y++){for(let x=0;x<70;x++){let idx=(y*70+x)*4;let avg=(imgData[idx]+imgData[idx+1]+imgData[idx+2])/3;let cIdx=Math.floor((avg/255)*(chars.length-1));ascii+=chars[cIdx];}ascii+='\n';}document.getElementById('ascii-feed').value=ascii;requestAnimationFrame(renderFrame);}renderFrame();}catch(e){alert('Camera Error: '+e.message);}}</script></body></html>
