<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto HMAC SHA3-512 Validator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto HMAC SHA3-512 Validator","url":"https://salabs.quanxs.com/tools/crypto-hmac-sha3-512-validator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">HMAC SHA3-512 Signature Validator</h1></header><main class="container"><input type="text" id="sec-key" placeholder="Secret Key" oninput="verifyHMAC512()"><textarea id="payload" rows="3" placeholder="Payload..." oninput="verifyHMAC512()"></textarea><input type="text" id="sig-out" readonly></main><script>async function verifyHMAC512(){let keyStr=document.getElementById('sec-key').value,msgStr=document.getElementById('payload').value,out=document.getElementById('sig-out');if(!keyStr||!msgStr){out.value='';return;}try{let enc=new TextEncoder();let key=await window.crypto.subtle.importKey("raw",enc.encode(keyStr),{name:"HMAC",hash:"SHA-512"},false,["sign"]);let sigBuf=await window.crypto.subtle.sign("HMAC",key,enc.encode(msgStr));let hex=Array.from(new Uint8Array(sigBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');out.value=hex;}catch(e){out.value='Error: '+e.message;}}</script></body></html>
