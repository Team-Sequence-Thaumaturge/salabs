th();ctx.moveTo(e.clientX-rect.left,e.clientY-rect.top);}function clearCanvas(){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cvs.width,cvs.height);}function exportPNG(){let link=document.createElement('a');link.download='drawing.png';link.href=cvs.toDataURL();link.click();}</script></body></html>
