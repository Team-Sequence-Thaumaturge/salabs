<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Voice Pitch Detector - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Voice Pitch Detector","url":"https://salabs.quanxs.com/tools/audio-voice-pitch-detector.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}.pitch-display{font-size:2.5rem;font-weight:bold;color:#38bdf8;margin:1.5rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Voice Pitch Detector</h1></header><main class="container"><button id="start-btn" onclick="startPitchDetection()">Start Pitch Detection</button><div id="pitch-out" class="pitch-display">-- Hz</div></main><script>let audioCtx,analyser,buf;async function startPitchDetection(){try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=new(window.AudioContext||window.webkitAudioContext)();let src=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=2048;src.connect(analyser);buf=new Float32Array(2048);document.getElementById('start-btn').innerText='Detecting Microphone Pitch...';detectPitch();}catch(e){alert('Microphone Error: '+e.message);}}function detectPitch(){analyser.getFloatTimeDomainData(buf);let ac=autoCorrelate(buf,audioCtx.sampleRate);if(ac!==-1)document.getElementById('pitch-out').innerText=Math.round(ac)+' Hz';requestAnimationFrame(detectPitch);}function autoCorrelate(buf,sampleRate){let SIZE=buf.length,rms=0;for(let i=0;i<SIZE;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/SIZE);if(rms<0.01)return -1;let r1=0,r2=SIZE-1,thres=0.2;for(let i=0;i<SIZE/2;i++){if(Math.abs(buf[i])<thres){r1=i;break;}}for(let i=1;i<SIZE/2;i++){if(Math.abs(buf[SIZE-i])<thres){r2=SIZE-i;break;}}buf=buf.slice(r1,r2);SIZE=buf.length;let c=new Array(SIZE).fill(0);for(let i=0;i<SIZE;i++){for(let j=0;j<SIZE-i;j++)c[i]+=buf[j]*buf[j+i];}let d=0;while(c[d]>c[d+1])d++;let maxval=-1,maxpos=-1;for(let i=d;i<SIZE;i++){if(c[i]>maxval){maxval=c[i];maxpos=i;}}return sampleRate/maxpos;}</script></body></html>
