<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas Seamless Grid & Pattern Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas Seamless Grid & Pattern Studio","url":"https://salabs.quanxs.com/tools/html-canvas-grid-pattern-generator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}canvas{background:#0f172a;border-radius:8px;border:1px solid #334155;width:100%;height:300px;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas Seamless Grid & Pattern Studio</h1></header><main class="container"><label>Grid Cell Size (<span id="v-size">20</span>px)</label><input type="range" id="size-range" min="10" max="60" value="20" oninput="drawGrid()"><canvas id="grid-canvas" width="800" height="300"></canvas></main><script>function drawGrid(){let sz=parseInt(document.getElementById('size-range').value);document.getElementById('v-size').innerText=sz;let cvs=document.getElementById('grid-canvas'),ctx=cvs.getContext('2d');ctx.clearRect(0,0,cvs.width,cvs.height);ctx.strokeStyle='#334155';ctx.lineWidth=1;for(let x=0;x<=cvs.width;x+=sz){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cvs.height);ctx.stroke();}for(let y=0;y<=cvs.height;y+=sz){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cvs.width,y);ctx.stroke();}}drawGrid();</script></body></html>
