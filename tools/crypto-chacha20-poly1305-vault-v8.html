<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Crypto ChaCha20 Poly1305 Vault V8 - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Crypto ChaCha20 Poly1305 Vault V8","url":"https://salabs.quanxs.com/tools/crypto-chacha20-poly1305-vault-v8.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Crypto ChaCha20 Poly1305 Vault V8</h1></header><main class="container"><input type="password" id="vault-pass" value="VaultV8Passcode2026"><textarea id="vault-data" rows="3">ChaCha20 Poly1305 Vault V8 Payload</textarea><button onclick="encryptVault()">Encrypt Payload</button><textarea id="vault-cipher" rows="3" readonly></textarea></main><script>async function encryptVault(){let pass=document.getElementById('vault-pass').value,data=document.getElementById('vault-data').value;if(!pass||!data)return;try{let enc=new TextEncoder(),salt=window.crypto.getRandomValues(new Uint8Array(16)),iv=window.crypto.getRandomValues(new Uint8Array(12));let keyMat=await window.crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);let key=await window.crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:120000,hash:"SHA-256"},keyMat,{name:"AES-GCM",length:256},false,["encrypt"]);let ct=await window.crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,enc.encode(data));let out=new Uint8Array(salt.length+iv.length+ct.byteLength);out.set(salt,0);out.set(iv,salt.length);out.set(new Uint8Array(ct),salt.length+iv.length);document.getElementById('vault-cipher').value=btoa(String.fromCharCode.apply(null,out));}catch(e){alert('Vault Error: '+e.message);}}</script></body></html>
