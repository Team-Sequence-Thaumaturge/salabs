<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Micro-Performance & Structured Schema Optimizer - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Micro-Performance & Structured Schema Optimizer","url":"https://salabs.quanxs.com/tools/micro-performance-optimizer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Micro-Performance & Schema Optimizer</h1></header><main class="container"><textarea id="code-in" rows="4" placeholder="Math.sqrt(123456789)"></textarea><button onclick="runBenchmark()">Run Micro-Benchmark</button><textarea id="res-out" rows="6" readonly></textarea></main><script>function runBenchmark(){let expr=document.getElementById('code-in').value||'Math.sqrt(123456789)',iter=10000;let t0=performance.now();try{let fn=new Function(`for(let i=0;i<${iter};i++){ ${expr}; }`);fn();let t1=performance.now(),total=(t1-t0).toFixed(4),perOp=((t1-t0)/iter*1000).toFixed(6);document.getElementById('res-out').value=[`--- Micro-Performance Benchmark Output ---`,`Iterations: ${iter.toLocaleString()} runs`,`Total Latency: ${total} ms`,`Mean Time Per Operation: ${perOp} µs`,`Execution Status: PASSED (0 Errors)`].join('\n');}catch(e){document.getElementById('res-out').value=`Benchmark Error: ${e.message}`;}}</script></body></html>
