<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Speech Synthesis Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Speech Synthesis Studio","url":"https://salabs.quanxs.com/tools/web-speech-synthesis-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,select,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Web Speech Synthesis Studio</h1></header><main class="container"><textarea id="tts-input" rows="4">Quanxs SA Labs Speech Synthesis Engine.</textarea><select id="voice-select"></select><button onclick="speakText()">Speak</button><button onclick="stopSpeech()">Stop</button></main><script>let synth=window.speechSynthesis,voices=[];function populateVoices(){voices=synth.getVoices();let s=document.getElementById('voice-select');s.innerHTML='';voices.forEach((v,i)=>{let o=document.createElement('option');o.value=i;o.innerText=`${v.name} (${v.lang})`;s.appendChild(o);});}populateVoices();if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=populateVoices;function speakText(){if(synth.speaking)synth.cancel();let u=new SpeechSynthesisUtterance(document.getElementById('tts-input').value);let i=document.getElementById('voice-select').value;if(voices[i])u.voice=voices[i];synth.speak(u);}function stopSpeech(){synth.cancel();}</script></body></html>
