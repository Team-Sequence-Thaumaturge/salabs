<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Mid/Side Spatial Processor - Quanxs SA Labs</title>
  <meta name="description" content="100% Client-Side Pure JS Audio Mid/Side Spatial Processor & Stereo Balance Studio using Web Audio API.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Audio Mid/Side Spatial Processor",
    "url": "https://salabs.quanxs.com/tools/audio-mid-side-spatial-processor.html",
    "description": "Professional client-side Mid/Side audio encoding, decoding, independent gain/EQ and spatial stereo widening processor.",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All"
  }
  </script>
  <style>
    :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; --green: #238636; --red: #da3633; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
    h1 { color: #fff; font-size: 1.5rem; margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .panel { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
    .panel h3 { margin-top: 0; color: var(--accent); font-size: 1.1rem; }
    label { display: block; margin-top: 10px; font-size: 0.9rem; }
    input[type=range] { width: 100%; }
    button { background: var(--green); color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 8px; margin-top: 10px; }
    button:hover { opacity: 0.9; }
    .btn-stop { background: var(--red); }
    canvas { width: 100%; height: 160px; background: #000; border-radius: 6px; margin-top: 15px; }
    .meter-box { display: flex; gap: 10px; align-items: center; margin-top: 10px; font-family: monospace; font-size: 0.85rem; }
  </style>
<script>

    let audioCtx = null;
    let oscL = null, oscR = null, isPlaying = false;
    let midGainNode, sideGainNode, midHpFilter, sideShelfFilter;
    let analyserMid, analyserSide;

    const canvas = document.getElementById('scopeCanvas');
    const ctx = canvas.getContext('2d');

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      midGainNode = audioCtx.createGain();
      sideGainNode = audioCtx.createGain();
      midGainNode.gain.value = 1.0;
      sideGainNode.gain.value = 1.0;

      midHpFilter = audioCtx.createBiquadFilter();
      midHpFilter.type = 'highpass';
      midHpFilter.frequency.value = 20;

      sideShelfFilter = audioCtx.createBiquadFilter();
      sideShelfFilter.type = 'highshelf';
      sideShelfFilter.frequency.value = 8000;
      sideShelfFilter.gain.value = 0;

      analyserMid = audioCtx.createAnalyser();
      analyserSide = audioCtx.createAnalyser();
      analyserMid.fftSize = 256;
      analyserSide.fftSize = 256;
    }

    document.getElementById('btnTone').addEventListener('click', () => {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (isPlaying) return;

      oscL = audioCtx.createOscillator();
      oscR = audioCtx.createOscillator();
      oscL.type = 'sawtooth';
      oscR.type = 'sawtooth';
      oscL.frequency.setValueAtTime(220, audioCtx.currentTime);
      oscR.frequency.setValueAtTime(221.5, audioCtx.currentTime);

      const merger = audioCtx.createChannelMerger(2);
      oscL.connect(merger, 0, 0);
      oscR.connect(merger, 0, 1);

      const splitter = audioCtx.createChannelSplitter(2);
      merger.connect(splitter);

      const midSum = audioCtx.createGain();
      midSum.gain.value = 0.5;
      const sideSub = audioCtx.createGain();
      sideSub.gain.value = 0.5;
      const invR = audioCtx.createGain();
      invR.gain.value = -1.0;

      splitter.connect(midSum, 0);
      splitter.connect(midSum, 1);

      splitter.connect(sideSub, 0);
      splitter.connect(invR, 1);
      invR.connect(sideSub);

      midSum.connect(midHpFilter);
      midHpFilter.connect(midGainNode);
      midGainNode.connect(analyserMid);

      sideSub.connect(sideShelfFilter);
      sideShelfFilter.connect(sideGainNode);
      sideGainNode.connect(analyserSide);

      const finalMerger = audioCtx.createChannelMerger(2);
      const decL = audioCtx.createGain();
      const decR = audioCtx.createGain();
      const invSide = audioCtx.createGain();
      invSide.gain.value = -1.0;

      midGainNode.connect(decL);
      sideGainNode.connect(decL);

      midGainNode.connect(decR);
      sideGainNode.connect(invSide);
      invSide.connect(decR);

      decL.connect(finalMerger, 0, 0);
      decR.connect(finalMerger, 0, 1);

      const masterVol = audioCtx.createGain();
      masterVol.gain.value = 0.15;
      finalMerger.connect(masterVol);
      masterVol.connect(audioCtx.destination);

      oscL.start();
      oscR.start();
      isPlaying = true;
      document.getElementById('statusText').innerText = '재생 중 (Mid/Side 실시간 인코딩/디코딩)';
      drawScope();
    });

    document.getElementById('btnStop').addEventListener('click', () => {
      if (isPlaying) {
        oscL.stop();
        oscR.stop();
        oscL.disconnect();
        oscR.disconnect();
        isPlaying = false;
        document.getElementById('statusText').innerText = '정지됨';
      }
    });

    document.getElementById('midGain').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('valMidGain').innerText = val.toFixed(2);
      if (midGainNode) midGainNode.gain.setValueAtTime(val, audioCtx.currentTime);
      updateRatio();
    });

    document.getElementById('sideGain').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('valSideGain').innerText = val.toFixed(2);
      if (sideGainNode) sideGainNode.gain.setValueAtTime(val, audioCtx.currentTime);
      updateRatio();
    });

    document.getElementById('midHp').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('valMidHp').innerText = val;
      if (midHpFilter) midHpFilter.frequency.setValueAtTime(val, audioCtx.currentTime);
    });

    document.getElementById('sideShelf').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('valSideShelf').innerText = val.toFixed(1);
      if (sideShelfFilter) sideShelfFilter.gain.setValueAtTime(val, audioCtx.currentTime);
    });

    function updateRatio() {
      const mg = parseFloat(document.getElementById('midGain').value);
      const sg = parseFloat(document.getElementById('sideGain').value);
      document.getElementById('msRatio').innerText = `${mg.toFixed(2)} : ${sg.toFixed(2)}`;
    }

    function drawScope() {
      if (!isPlaying) return;
      requestAnimationFrame(drawScope);

      const midData = new Uint8Array(analyserMid.frequencyBinCount);
      const sideData = new Uint8Array(analyserSide.frequencyBinCount);
      analyserMid.getByteTimeDomainData(midData);
      analyserSide.getByteTimeDomainData(sideData);

      ctx.fillStyle = '#0a0d12';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.lineWidth = 2;
      ctx.strokeStyle = '#58a6ff';
      ctx.beginPath();
      let sliceWidth = canvas.width / midData.length;
      let x = 0;
      for (let i = 0; i < midData.length; i++) {
        let v = midData[i] / 128.0;
        let y = (v * canvas.height) / 2;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        x += sliceWidth;
      }
      ctx.stroke();

      ctx.strokeStyle = '#f0883e';
      ctx.beginPath();
      x = 0;
      for (let i = 0; i < sideData.length; i++) {
        let v = sideData[i] / 128.0;
        let y = (v * canvas.height) / 2;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        x += sliceWidth;
      }
      ctx.stroke();
    }
  
</script>
</head>
<body>
  <div class="container">
    <h1>🎧 Audio Mid/Side Spatial Processor & Studio</h1>
    <p>100% 브라우저 Web Audio API 기반의 Mid/Side (중앙/측면 신호) 분리 및 독립 스테레오 공간감 제어 프로세서입니다.</p>
    
    <div>
      <button id="btnTone">테스트 듀얼 오실레이터 재생</button>
      <button id="btnStop" class="btn-stop">정지</button>
    </div>

    <canvas id="scopeCanvas"></canvas>

    <div class="control-grid">
      <div class="panel">
        <h3>Mid Signal (중앙 모노 성분)</h3>
        <label>Mid Gain: <span id="valMidGain">1.0</span></label>
        <input type="range" id="midGain" min="0" max="2" step="0.05" value="1.0">
        <label>Mid Low Cut (Hz): <span id="valMidHp">20</span> Hz</label>
        <input type="range" id="midHp" min="20" max="500" step="5" value="20">
      </div>
      <div class="panel">
        <h3>Side Signal (측면 스테레오 성분)</h3>
        <label>Side Gain (Stereo Width): <span id="valSideGain">1.0</span></label>
        <input type="range" id="sideGain" min="0" max="2.5" step="0.05" value="1.0">
        <label>Side High Shelf (Air Boost): <span id="valSideShelf">0</span> dB</label>
        <input type="range" id="sideShelf" min="-12" max="12" step="0.5" value="0">
      </div>
    </div>

    <div class="meter-box">
      <span>상태: <strong id="statusText">대기 중</strong></span> |
      <span>M/S 비율: <span id="msRatio">1.00 : 1.00</span></span>
    </div>
  </div>

  
</body>
</html>
