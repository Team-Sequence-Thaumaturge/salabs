t buf=new Uint8Array(salt.length+iv.length+encrypted.byteLength);buf.set(salt,0);buf.set(iv,salt.length);buf.set(new Uint8Array(encrypted),salt.length+iv.length);document.getElementById('cipher-out').value=btoa(String.fromCharCode.apply(null,buf));}catch(e){alert('Vault Error: '+e.message);}}</script></body></html>
