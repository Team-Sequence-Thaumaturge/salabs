<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Impulse Response Reverb Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Impulse Response Reverb Studio","url":"https://salabs.quanxs.com/tools/audio-reverb-impulse-response-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Impulse Response Reverb Studio</h1></header><main class="container"><button onclick="playReverbTone()">Play Reverb Synth Sample</button><p>Decay Time (<span id="decay-val">2.5</span>s)</p><input type="range" id="decay-slider" min="0.5" max="5.0" step="0.1" value="2.5" oninput="updateDecay()"></main><script>let audioCtx;function updateDecay(){document.getElementById('decay-val').innerText=document.getElementById('decay-slider').value;}function createImpulseResponse(dur,dec){let sr=audioCtx.sampleRate,len=sr*dur,imp=audioCtx.createBuffer(2,len,sr),L=imp.getChannelData(0),R=imp.getChannelData(1);for(let i=0;i<len;i++){L[i]=(Math.random()*2-1)*Math.pow(1-i/len,dec);R[i]=(Math.random()*2-1)*Math.pow(1-i/len,dec);}return imp;}function playReverbTone(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();let osc=audioCtx.createOscillator(),conv=audioCtx.createConvolver(),dec=parseFloat(document.getElementById('decay-slider').value);conv.buffer=createImpulseResponse(dec,2.0);osc.type='triangle';osc.frequency.value=523.25;osc.connect(conv);conv.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+0.3);}</script></body></html>
