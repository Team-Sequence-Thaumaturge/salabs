<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas ASCII 3D Pyramid Renderer v2 - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas ASCII 3D Pyramid Renderer v2","url":"https://salabs.quanxs.com/tools/html-canvas-ascii-3d-pyramid-v2.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}textarea{width:100%;background:#0f172a;color:#38bdf8;border:1px solid #334155;border-radius:8px;padding:1rem;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas ASCII 3D Pyramid Renderer v2</h1></header><main class="container"><textarea id="ascii-box" rows="16" readonly></textarea></main><script>let angle=0;function render3DPyramid(){angle+=0.05;let nodes=[{x:0,y:1.2,z:0},{x:-1,y:-1,z:-1},{x:1,y:-1,z:-1},{x:1,y:-1,z:1},{x:-1,y:-1,z:1}];let rotated=nodes.map(p=>{let x=p.x*Math.cos(angle)-p.z*Math.sin(angle);return{x:Math.round(x*12+25),y:Math.round(p.y*6+10)};});let grid=Array.from({length:20},()=>Array(50).fill(' '));for(let p of rotated){if(p.y>=0&&p.y<20&&p.x>=0&&p.x<50)grid[p.y][p.x]='*';}document.getElementById('ascii-box').value=grid.map(r=>r.join('')).join('\n');requestAnimationFrame(render3DPyramid);}render3DPyramid();</script></body></html>
