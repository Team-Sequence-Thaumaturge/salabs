<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio 3D Spatial Binaural Beat Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio 3D Spatial Binaural Beat Studio","url":"https://salabs.quanxs.com/tools/audio-spatial-3d-binaural-beat-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio 3D Spatial Binaural Beat Studio</h1></header><main class="container"><button onclick="playBinaural()">Play 10Hz Alpha Binaural Beats</button><p>Base Frequency (<span id="base-val">200</span> Hz)</p><input type="range" id="base-slider" min="100" max="500" value="200" oninput="updateFreq()"></main><script>let audioCtx,oscL,oscR;function playBinaural(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(oscL)oscL.stop();if(oscR)oscR.stop();let base=parseFloat(document.getElementById('base-slider').value);let merger=audioCtx.createChannelMerger(2);oscL=audioCtx.createOscillator();oscR=audioCtx.createOscillator();oscL.frequency.value=base;oscR.frequency.value=base+10;oscL.connect(merger,0,0);oscR.connect(merger,0,1);merger.connect(audioCtx.destination);oscL.start();oscR.start();oscL.stop(audioCtx.currentTime+2.0);oscR.stop(audioCtx.currentTime+2.0);}function updateFreq(){let v=document.getElementById('base-slider').value;document.getElementById('base-val').innerText=v;}</script></body></html>
