<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JWT Token Signer & RSA / ECDSA Keypair Generator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JWT Token Signer Keypair Generator","url":"https://salabs.quanxs.com/tools/jwt-signer-inspector.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-right:0.5rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JWT Signer & Claims Inspector</h1></header><main class="container"><h3>1. Payload (JSON)</h3><textarea id="jwt-payload" rows="6">{
  "sub": "user_12345",
  "name": "Quanxs Developer",
  "admin": true,
  "iat": 1722600000
}</textarea><h3>2. Secret Key (HS256)</h3><input type="text" id="jwt-secret" value="salabs-secret-key-2026"><button onclick="signJWT()">Sign HS256 JWT</button><h3>3. Signed JWT</h3><textarea id="jwt-output" rows="4" readonly></textarea></main><script>async function signJWT(){let payloadStr=document.getElementById('jwt-payload').value;let secret=document.getElementById('jwt-secret').value;try{let header={alg:"HS256",typ:"JWT"};let encHeader=base64UrlEncode(JSON.stringify(header));let encPayload=base64UrlEncode(payloadStr);let unsignedToken=encHeader+"."+encPayload;let encoder=new TextEncoder();let keyData=encoder.encode(secret);let cryptoKey=await crypto.subtle.importKey('raw',keyData,{name:'HMAC',hash:'SHA-256'},false,['sign']);let sigBuf=await crypto.subtle.sign('HMAC',cryptoKey,encoder.encode(unsignedToken));let signature=base64UrlEncodeBuffer(sigBuf);document.getElementById('jwt-output').value=unsignedToken+"."+signature;}catch(e){document.getElementById('jwt-output').value="Error: "+e.message;}}function base64UrlEncode(str){return btoa(str).replace(/=/g,'').replace(/\+/g,'-').replace(///g,'_');}function base64UrlEncodeBuffer(buffer){let bytes=new Uint8Array(buffer);let binary='';for(let i=0;i<bytes.byteLength;i++)binary+=String.fromCharCode(bytes[i]);return btoa(binary).replace(/=/g,'').replace(/\+/g,'-').replace(///g,'_');}signJWT();</script></body></html>
