<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JWT Signature Validator Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JWT Signature Validator Studio","url":"https://salabs.quanxs.com/tools/jwt-rs256-signature-validator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.card{background:#0f172a;padding:1rem;border-radius:8px;border:1px solid #334155;margin-top:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JWT Signature Validator Studio</h1></header><main class="container"><h3>Encoded JWT Token</h3><textarea id="jwt-token" rows="3" oninput="validateJwt()"></textarea><h3>Secret / Public Key</h3><input type="text" id="jwt-secret" oninput="validateJwt()"><div id="jwt-result" class="card"></div></main><script>function validateJwt(){let token=document.getElementById('jwt-token').value.trim();let secret=document.getElementById('jwt-secret').value.trim();let out=document.getElementById('jwt-result');if(!token){out.innerHTML='Enter a JWT token above.';return;}let parts=token.split('.');if(parts.length!==3){out.innerHTML='<span style="color:#ef4444;">Invalid JWT structure</span>';return;}try{let header=JSON.parse(atob(parts[0].replace(/-/g,'+').replace(/_/g,'/')));let payload=JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));out.innerHTML=`<p><strong>Header:</strong> ${JSON.stringify(header)}</p><p><strong>Payload:</strong> ${JSON.stringify(payload)}</p><p style="color:#22c55e;"><strong>Structure Status:</strong> Valid Token Structure</p>`;}catch(e){out.innerHTML=`<span style="color:#ef4444;">Decode Error: ${e.message}</span>`;}}</script></body></html>
