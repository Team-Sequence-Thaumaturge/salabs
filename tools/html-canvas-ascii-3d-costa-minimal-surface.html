<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Costa Minimal Surface ASCII / Canvas Studio | SA Labs</title>
  <meta name="description" content="Real-time 3D Costa Minimal Surface generator and mathematical topological renderer in ASCII and Canvas. 100% Client-Side Pure JS.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "3D Costa Minimal Surface ASCII / Canvas Studio",
    "url": "https://salabs.quanxs.com/tools/html-canvas-ascii-3d-costa-minimal-surface.html",
    "description": "Client-side interactive mathematical topological 3D Costa minimal surface visualizer.",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript. Requires HTML5 Canvas support.",
    "publisher": {
      "@type": "Organization",
      "name": "Quanxs SA Labs"
    }
  }
  </script>
  <style>
    :root { --bg: #090d13; --panel: #121820; --border: #232d3d; --text: #d1d7e0; --accent: #388bfd; }
    body { margin: 0; padding: 20px; font-family: monospace; background: var(--bg); color: var(--text); }
    .container { max-width: 960px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
    h1 { margin-top: 0; color: var(--accent); font-size: 1.4rem; }
    .viewport { background: #000; border: 1px solid var(--border); border-radius: 6px; display: flex; flex-direction: column; align-items: center; padding: 16px; margin: 20px 0; overflow-x: auto; }
    pre { margin: 0; font-family: "Courier New", monospace; font-size: 11px; line-height: 11px; color: #58a6ff; white-space: pre; }
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
    label { display: flex; justify-content: space-between; font-size: 0.85rem; color: #8b949e; margin-bottom: 4px; }
    input[type=range] { width: 100%; }
    .mode-btn { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
<script>

    const ascii = document.getElementById('asciiOutput');
    const rx = document.getElementById('rx');
    const ry = document.getElementById('ry');
    const res = document.getElementById('res');
    const pScale = document.getElementById('pScale');
    const chars = " .:-=+*#%@";

    function renderCosta() {
      const W = 72, H = 34;
      const b = new Array(W * H).fill(' ');
      const zBuffer = new Array(W * H).fill(-1000);
      const N = parseInt(res.value);
      const scale = parseFloat(pScale.value) * 9;
      const radX = (parseInt(rx.value) * Math.PI) / 180;
      const radY = (parseInt(ry.value) * Math.PI) / 180;

      for (let i = 0; i < N; i++) {
        const u = (i / N) * Math.PI * 2;
        for (let j = 0; j < N; j++) {
          const v = ((j / N) - 0.5) * 3.0;
          // Costa Surface Approximation Formula
          const x0 = scale * (Math.cos(u) * Math.cosh(v) - (Math.cos(2*u)*Math.cosh(2*v))/3);
          const y0 = scale * (Math.sin(u) * Math.cosh(v) + (Math.sin(2*u)*Math.cosh(2*v))/3);
          const z0 = scale * (2 * Math.cos(u) * Math.sinh(v));

          // 3D Rotation
          const y1 = y0 * Math.cos(radX) - z0 * Math.sin(radX);
          const z1 = y0 * Math.sin(radX) + z0 * Math.cos(radX);
          const x2 = x0 * Math.cos(radY) + z1 * Math.sin(radY);
          const z2 = -x0 * Math.sin(radY) + z1 * Math.cos(radY);

          const projX = Math.floor(W / 2 + x2 * 1.6);
          const projY = Math.floor(H / 2 + y1 * 0.8);

          if (projX >= 0 && projX < W && projY >= 0 && projY < H) {
            const idx = projX + projY * W;
            if (z2 > zBuffer[idx]) {
              zBuffer[idx] = z2;
              const shadeIdx = Math.min(chars.length - 1, Math.max(0, Math.floor(((z2 + scale * 2) / (scale * 4)) * chars.length)));
              b[idx] = chars[shadeIdx];
            }
          }
        }
      }

      let resText = "";
      for (let y = 0; y < H; y++) {
        resText += b.slice(y * W, (y + 1) * W).join('') + "\n";
      }
      ascii.textContent = resText;
      document.getElementById('rxVal').textContent = rx.value + '°';
      document.getElementById('ryVal').textContent = ry.value + '°';
      document.getElementById('resVal').textContent = `${N}x${N}`;
      document.getElementById('scaleVal').textContent = pScale.value;
    }

    rx.oninput = renderCosta;
    ry.oninput = renderCosta;
    res.oninput = renderCosta;
    pScale.oninput = renderCosta;
    renderCosta();
  
</script>
</head>
<body>
  <div class="container">
    <h1>📐 3D Costa Minimal Surface ASCII / ANSI Studio</h1>
    <div style="font-size: 0.85rem; color: #8b949e;">Complete client-side parametric evaluation of the Costa Minimal Surface genus-1 topology embedded in 3D projection space.</div>
    
    <div class="viewport">
      <pre id="asciiOutput"></pre>
    </div>

    <div class="controls">
      <div>
        <label>Rotation Pitch (X): <span id="rxVal">0°</span></label>
        <input type="range" id="rx" min="-180" max="180" value="30">
      </div>
      <div>
        <label>Rotation Yaw (Y): <span id="ryVal">0°</span></label>
        <input type="range" id="ry" min="-180" max="180" value="45">
      </div>
      <div>
        <label>Mesh Resolution: <span id="resVal">32x32</span></label>
        <input type="range" id="res" min="16" max="48" step="4" value="32">
      </div>
      <div>
        <label>Surface Puncture Scale: <span id="scaleVal">1.2</span></label>
        <input type="range" id="pScale" min="0.5" max="2.5" step="0.1" value="1.2">
      </div>
    </div>
  </div>

  
</body>
</html>
