<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>HTML Canvas Image Filter Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"HTML Canvas Image Filter Studio","url":"https://salabs.quanxs.com/tools/html-canvas-image-filters.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input{width:100%;margin-bottom:1rem;}canvas{max-width:100%;border-radius:8px;border:1px solid #334155;background:#0f172a;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">HTML Canvas Image Filter Studio</h1></header><main class="container"><input type="file" id="img-in" accept="image/*" onchange="loadImage()"><label>Grayscale: <span id="v-gray">0</span>%</label><input type="range" id="gray" min="0" max="100" value="0" oninput="applyFilters()"><label>Sepia: <span id="v-sepia">0</span>%</label><input type="range" id="sepia" min="0" max="100" value="0" oninput="applyFilters()"><canvas id="img-canvas"></canvas></main><script>let img=new Image();function loadImage(){let f=document.getElementById('img-in').files[0];if(!f)return;let r=new FileReader();r.onload=e=>{img.onload=()=>applyFilters();img.src=e.target.result;};r.readAsDataURL(f);}function applyFilters(){let cvs=document.getElementById('img-canvas'),ctx=cvs.getContext('2d');if(!img.src)return;cvs.width=img.width;cvs.height=img.height;let g=document.getElementById('gray').value,s=document.getElementById('sepia').value;document.getElementById('v-gray').innerText=g;document.getElementById('v-sepia').innerText=s;ctx.filter=`grayscale(${g}%) sepia(${s}%)`;ctx.drawImage(img,0,0);}</script></body></html>
