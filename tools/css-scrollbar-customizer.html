<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>CSS Custom Scrollbar Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"CSS Custom Scrollbar Studio","url":"https://salabs.quanxs.com/tools/css-scrollbar-customizer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input{width:100%;margin-bottom:1rem;}.preview-box{height:120px;overflow-y:scroll;background:#0f172a;padding:1rem;border-radius:8px;border:1px solid #334155;margin:1rem 0;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">CSS Custom Scrollbar Studio</h1></header><main class="container"><label>Width: <span id="v-w">10</span>px</label><input type="range" id="sb-w" min="4" max="24" value="10" oninput="updateScrollbar()"><label>Thumb Color</label><input type="color" id="sb-thumb" value="#38bdf8" oninput="updateScrollbar()"><label>Track Color</label><input type="color" id="sb-track" value="#0f172a" oninput="updateScrollbar()"><div id="demo-scroll" class="preview-box"><p>Preview...</p><p>Line 1</p><p>Line 2</p><p>Line 3</p></div><textarea id="css-out" rows="6" readonly></textarea></main><script>function updateScrollbar(){let w=document.getElementById('sb-w').value,thumb=document.getElementById('sb-thumb').value,track=document.getElementById('sb-track').value;document.getElementById('v-w').innerText=w;let s=`::-webkit-scrollbar { width: ${w}px; }
