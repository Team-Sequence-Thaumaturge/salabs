<script>

function runProfilerV5() {
  const code = document.getElementById('codeSnippet').value;
  const start = performance.now();
  try {
    eval(code);
    const end = performance.now();
    const duration = (end - start).toFixed(3);
    document.getElementById('timeVal').innerText = duration + ' ms';
    document.getElementById('opsVal').innerText = duration > 0 ? (1000 / duration).toFixed(0) : '∞';
    if(performance.memory) {
      document.getElementById('memVal').innerText = (performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(2) + ' MB';
    }
  } catch(e) { alert('Execution error: ' + e.message); }
}

</script>
