<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRTF 3D Binaural Spatial Audio Studio | Quanxs SA Labs</title>
  <meta name="description" content="Simulate real-time 3D spatial audio positioning and HRTF binaural sound localization with Web Audio API. 100% client-side.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "HRTF 3D Binaural Spatial Audio Studio",
    "url": "https://salabs.quanxs.com/tools/audio-spatial-hrtf-binaural-studio.html",
    "description": "Interactive Web Audio API HRTF 3D spatial panner and listener coordinate simulator.",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All"
  }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; font-size: 1.8rem; margin-top: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: #0f172a; padding: 16px; border-radius: 8px; border: 1px solid #334155; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-top: 10px; }
    input[type=range] { width: 100%; }
    button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 8px; }
    button:hover { background: #7dd3fc; }
    canvas { background: #020617; border-radius: 8px; width: 100%; height: 260px; display: block; border: 1px solid #1e293b; }
    .readout { font-family: monospace; color: #34d399; font-size: 0.9rem; margin-top: 8px; }
  </style>
<script>

    let audioCtx = null;
    let oscNode = null;
    let pannerNode = null;
    let gainNode = null;

    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const posX = document.getElementById('posX');
    const posY = document.getElementById('posY');
    const posZ = document.getElementById('posZ');
    const valX = document.getElementById('valX');
    const valY = document.getElementById('valY');
    const valZ = document.getElementById('valZ');
    const oscType = document.getElementById('oscType');
    const radarCanvas = document.getElementById('radarCanvas');
    const ctx = radarCanvas.getContext('2d');

    function updatePanner() {
      const x = parseFloat(posX.value);
      const y = parseFloat(posY.value);
      const z = parseFloat(posZ.value);
      valX.textContent = x.toFixed(1);
      valY.textContent = y.toFixed(1);
      valZ.textContent = z.toFixed(1);
      if (pannerNode && audioCtx) {
        if (pannerNode.positionX) {
          pannerNode.positionX.setValueAtTime(x, audioCtx.currentTime);
          pannerNode.positionY.setValueAtTime(y, audioCtx.currentTime);
          pannerNode.positionZ.setValueAtTime(z, audioCtx.currentTime);
        } else {
          pannerNode.setPosition(x, y, z);
        }
      }
      drawRadar(x, z);
    }

    function drawRadar(sx, sz) {
      ctx.clearRect(0, 0, radarCanvas.width, radarCanvas.height);
      const cx = radarCanvas.width / 2;
      const cy = radarCanvas.height / 2;
      ctx.strokeStyle = '#334155';
      ctx.beginPath();
      ctx.arc(cx, cy, 40, 0, Math.PI * 2);
      ctx.arc(cx, cy, 80, 0, Math.PI * 2);
      ctx.arc(cx, cy, 110, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(cx, cy, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#94a3b8';
      ctx.font = '10px sans-serif';
      ctx.fillText('Listener (You)', cx - 30, cy + 20);
      const scale = 10;
      const px = cx + sx * scale;
      const py = cy + sz * scale;
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(px, py, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f87171';
      ctx.fillText('Source (' + sx.toFixed(1) + ', ' + sz.toFixed(1) + ')', px + 8, py + 4);
    }

    btnStart.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        pannerNode = audioCtx.createPanner();
        pannerNode.panningModel = 'HRTF';
        pannerNode.distanceModel = 'inverse';
        pannerNode.refDistance = 1;
        pannerNode.maxDistance = 10000;
        pannerNode.rolloffFactor = 1;
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.3;
        oscNode = audioCtx.createOscillator();
        oscNode.type = oscType.value;
        oscNode.frequency.setValueAtTime(440, audioCtx.currentTime);
        oscNode.connect(pannerNode);
        pannerNode.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscNode.start();
        updatePanner();
        document.getElementById('statusReadout').textContent = 'Status: Playing HRTF Binaural Stream';
      }
    });

    btnStop.addEventListener('click', () => {
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
        pannerNode = null;
        oscNode = null;
        document.getElementById('statusReadout').textContent = 'Status: Stopped';
      }
    });

    posX.addEventListener('input', updatePanner);
    posY.addEventListener('input', updatePanner);
    posZ.addEventListener('input', updatePanner);
    oscType.addEventListener('change', () => {
      if (oscNode) oscNode.type = oscType.value;
    });

    drawRadar(0, -2);
  
</script>
</head>
<body>
  <div class="container">
    <h1>HRTF 3D Binaural Spatial Audio Studio</h1>
    <p style="color: #94a3b8; font-size: 0.95rem;">Position sound sources in full 3D space relative to the listener using high-precision HRTF (Head-Related Transfer Function) spatial audio algorithms.</p>
    <div style="margin-bottom: 16px;">
      <button id="btnStart">Start Audio</button>
      <button id="btnStop" style="background: #ef4444; color: #fff;">Stop Audio</button>
    </div>
    <div class="grid">
      <div class="card">
        <h3>Spatial Coordinates (Source)</h3>
        <label>X-Axis (Left / Right): <span id="valX" class="readout">0.0</span></label>
        <input type="range" id="posX" min="-10" max="10" step="0.1" value="0">
        <label>Y-Axis (Up / Down): <span id="valY" class="readout">0.0</span></label>
        <input type="range" id="posY" min="-10" max="10" step="0.1" value="0">
        <label>Z-Axis (Front / Back): <span id="valZ" class="readout">-2.0</span></label>
        <input type="range" id="posZ" min="-10" max="10" step="0.1" value="-2">
        <label>Sound Generator Waveform:</label>
        <select id="oscType" style="width: 100%; padding: 8px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 6px;">
          <option value="sine">Sine Wave (440 Hz)</option>
          <option value="triangle">Triangle Wave (520 Hz)</option>
          <option value="sawtooth">Sawtooth Synth (220 Hz)</option>
          <option value="square">Square Lead (330 Hz)</option>
        </select>
      </div>
      <div class="card">
        <h3>Top-Down Soundstage Radar</h3>
        <canvas id="radarCanvas" width="400" height="260"></canvas>
        <div class="readout" id="statusReadout">Status: Ready (HRTF Model: Active)</div>
      </div>
    </div>
  </div>
  
</body>
</html>
