<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio 3D Environment Spatializer - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio 3D Environment Spatializer","url":"https://salabs.quanxs.com/tools/audio-spatial-3d-environment-panner.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio 3D Environment Spatializer</h1></header><main class="container"><button onclick="play3DSound()">Play 3D Spatial Audio</button><p>X Position (<span id="x-val">0.0</span>)</p><input type="range" id="x-pos" min="-10" max="10" step="0.5" value="0" oninput="update3D()"></main><script>let audioCtx,osc,pannerNode;function play3DSound(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();osc=audioCtx.createOscillator();pannerNode=audioCtx.createPanner();let x=parseFloat(document.getElementById('x-pos').value);pannerNode.setPosition(x,0,-1);osc.type='sawtooth';osc.frequency.value=330;osc.connect(pannerNode);pannerNode.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.5);}function update3D(){let v=document.getElementById('x-pos').value;document.getElementById('x-val').innerText=v;if(pannerNode)pannerNode.setPosition(parseFloat(v),0,-1);}</script></body></html>
