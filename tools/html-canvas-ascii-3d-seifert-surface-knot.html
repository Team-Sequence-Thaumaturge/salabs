<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII 3D Seifert Surface Knot Studio - Quanxs SA Labs</title>
  <meta name="description" content="Interactive ASCII 3D Seifert Surface & Topology Fiber Knot Generator with real-time 3D rotation, ray-surface slicing, and ASCII frame rendering.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "ASCII 3D Seifert Surface Knot Studio",
    "description": "Client-side 3D ASCII topology visualizer for Seifert surfaces, Trefoil knots, and algebraic manifolds.",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All",
    "author": {
      "@type": "Organization",
      "name": "Quanxs SA Labs"
    }
  }
  </script>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #bc8cff;
      --accent-hover: #a371f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 { color: #f0f6fc; font-size: 1.8rem; margin-bottom: 8px; }
    p.subtitle { color: #8b949e; font-size: 0.95rem; }
    .grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }
    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    .card h2 {
      font-size: 1.2rem;
      color: #f0f6fc;
      margin-bottom: 16px;
    }
    .control-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 6px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    select, button {
      width: 100%;
      padding: 10px 14px;
      background: #21262d;
      border: 1px solid var(--border);
      color: #c9d1d9;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #0d1117;
      font-weight: 600;
      border: none;
      margin-top: 8px;
    }
    button.primary:hover {
      background: var(--accent-hover);
    }
    pre.ascii-screen {
      background: #090d13;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      line-height: 11px;
      color: #7ee787;
      white-space: pre;
      overflow: hidden;
      user-select: none;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 380px;
    }
  </style>
<script>

    const width = 64;
    const height = 32;
    let angleX = 0;
    let angleY = 0;
    let angleZ = 0;

    const screen = document.getElementById('asciiOutput');
    const speedSlider = document.getElementById('rotSpeed');
    const densitySlider = document.getElementById('surfaceDensity');
    const manifoldSelect = document.getElementById('manifoldType');
    const charSelect = document.getElementById('charSet');

    speedSlider.addEventListener('input', () => {
      document.getElementById('speedVal').innerText = speedSlider.value + "x";
    });
    densitySlider.addEventListener('input', () => {
      document.getElementById('denseVal').innerText = densitySlider.value;
    });

    const palettes = {
      matrix: " .:-=+*#%@",
      quantum: " ░▒▓█",
      math: " ·°•∆∇∑∏"
    };

    function renderFrame() {
      const spd = parseFloat(speedSlider.value);
      angleX += 0.02 * spd;
      angleY += 0.03 * spd;
      angleZ += 0.01 * spd;

      const buffer = Array(height).fill(0).map(() => Array(width).fill(' '));
      const zBuffer = Array(height).fill(0).map(() => Array(width).fill(-1000));
      const chars = palettes[charSelect.value];
      const density = parseInt(densitySlider.value);
      const manifold = manifoldSelect.value;

      for (let u = 0; u < Math.PI * 2; u += (Math.PI * 2) / density) {
        for (let v = -1; v <= 1; v += 0.1) {
          let x, y, z;
          if (manifold === 'trefoilSeifert') {
            x = Math.sin(u) + 2 * Math.sin(2 * u) + v * Math.cos(3 * u);
            y = Math.cos(u) - 2 * Math.cos(2 * u) + v * Math.sin(3 * u);
            z = -Math.sin(3 * u) + v * 0.8;
          } else if (manifold === 'figureEight') {
            x = (2 + Math.cos(2 * u)) * Math.cos(3 * u) + v * 0.5;
            y = (2 + Math.cos(2 * u)) * Math.sin(3 * u) + v * 0.5;
            z = Math.sin(4 * u);
          } else if (manifold === 'hopfLink') {
            x = Math.cos(u) * (1 + 0.3 * v);
            y = Math.sin(u) * (1 + 0.3 * v);
            z = Math.sin(2 * u) + v;
          } else {
            x = 1.5 * Math.sin(u) + v * Math.cos(u);
            y = 1.5 * Math.cos(u) + v * Math.sin(u);
            z = Math.cos(3 * u) * 1.2;
          }

          // 3D rotation matrix
          // Rotate X
          let y1 = y * Math.cos(angleX) - z * Math.sin(angleX);
          let z1 = y * Math.sin(angleX) + z * Math.cos(angleX);

          // Rotate Y
          let x2 = x * Math.cos(angleY) + z1 * Math.sin(angleY);
          let z2 = -x * Math.sin(angleY) + z1 * Math.cos(angleY);

          // Rotate Z
          let x3 = x2 * Math.cos(angleZ) - y1 * Math.sin(angleZ);
          let y3 = x2 * Math.sin(angleZ) + y1 * Math.cos(angleZ);

          const distance = 5.0;
          const ooz = 1 / (z2 + distance);
          const xp = Math.floor(width / 2 + x3 * ooz * 30 * 1.6);
          const yp = Math.floor(height / 2 + y3 * ooz * 30);

          if (xp >= 0 && xp < width && yp >= 0 && yp < height) {
            if (ooz > zBuffer[yp][xp]) {
              zBuffer[yp][xp] = ooz;
              const lumIndex = Math.floor((z2 + 3) * (chars.length / 6));
              const charIdx = Math.max(0, Math.min(chars.length - 1, lumIndex));
              buffer[yp][xp] = chars[charIdx];
            }
          }
        }
      }

      screen.innerText = buffer.map(row => row.join('')).join('\n');
      requestAnimationFrame(renderFrame);
    }

    document.getElementById('btnCopyAscii').addEventListener('click', () => {
      navigator.clipboard.writeText(screen.innerText).then(() => {
        alert("ASCII Frame snapshot copied to clipboard!");
      });
    });

    renderFrame();
  
</script>
</head>
<body>
  <div class="container">
    <header>
      <h1>ASCII 3D Seifert Surface Knot Studio</h1>
      <p class="subtitle">Interactive Pure JS Algebraic Topology & Raymarching ASCII Projection Engine</p>
    </header>

    <div class="grid">
      <div class="card">
        <h2>Topology Parameters</h2>
        <div class="control-group">
          <label for="manifoldType">Manifold Geometry</label>
          <select id="manifoldType">
            <option value="trefoilSeifert" selected>Trefoil Knot Seifert Surface</option>
            <option value="figureEight">Figure-Eight Knot Boundary</option>
            <option value="hopfLink">Hopf Fibration Surface</option>
            <option value="borromean">Borromean Rings Manifold</option>
          </select>
        </div>
        <div class="control-group">
          <label for="rotSpeed">Rotation Speed: <span id="speedVal">1.0x</span></label>
          <input type="range" id="rotSpeed" min="0" max="3" step="0.1" value="1">
        </div>
        <div class="control-group">
          <label for="surfaceDensity">Mesh Density (Fibers): <span id="denseVal">32</span></label>
          <input type="range" id="surfaceDensity" min="16" max="64" step="4" value="32">
        </div>
        <div class="control-group">
          <label for="charSet">ASCII Shading Palette</label>
          <select id="charSet">
            <option value="matrix">Matrix Glow: " .:-=+*#%@"</option>
            <option value="quantum">Quantum Blocks: " ░▒▓█"</option>
            <option value="math">Math Symbols: " ·°•∆∇∑∏"</option>
          </select>
        </div>
        <button class="primary" id="btnCopyAscii">📋 Copy ASCII Snapshot</button>
      </div>

      <div class="card">
        <h2>Real-Time 3D Projection</h2>
        <pre class="ascii-screen" id="asciiOutput"></pre>
      </div>
    </div>
  </div>

  
</body>
</html>
