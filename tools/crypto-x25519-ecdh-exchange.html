<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>X25519 Elliptic Curve Key Exchange Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"X25519 Elliptic Curve Key Exchange Studio","url":"https://salabs.quanxs.com/tools/crypto-x25519-ecdh-exchange.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Elliptic Curve Key Exchange Studio</h1></header><main class="container"><button onclick="performECDH()">Simulate ECDH Key Exchange</button><h3>Shared Secret (Hex)</h3><input type="text" id="shared-secret" readonly></main><script>async function performECDH(){try{let alice=await window.crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveBits"]),bob=await window.crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveBits"]);let shared=await window.crypto.subtle.deriveBits({name:"ECDH",public:bob.publicKey},alice.privateKey,256);let hex=Array.from(new Uint8Array(shared)).map(b=>b.toString(16).padStart(2,'0')).join('');document.getElementById('shared-secret').value=hex;}catch(e){alert('ECDH Error: '+e.message);}}</script></body></html>
