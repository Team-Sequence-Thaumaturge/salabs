<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>XML JSON Document Converter - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"XML JSON Document Converter","url":"https://salabs.quanxs.com/tools/xml-json-converter.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">XML & JSON Document Converter</h1></header><main class="container"><div class="grid"><div><h3>XML Input</h3><textarea id="xml-input" rows="12" oninput="xmlToJson()"></textarea></div><div><h3>JSON Output</h3><textarea id="json-output" rows="12" readonly></textarea></div></div></main><script>function xmlToJson(){let x=document.getElementById('xml-input').value;if(!x.trim()){document.getElementById('json-output').value='';return;}try{let parser=new DOMParser();let xmlDoc=parser.parseFromString(x,"text/xml");if(xmlDoc.getElementsByTagName("parsererror").length>0){document.getElementById('json-output').value="XML Parsing Error";return;}let obj=nodeToObj(xmlDoc.documentElement);document.getElementById('json-output').value=JSON.stringify({[xmlDoc.documentElement.nodeName]:obj},null,2);}catch(e){document.getElementById('json-output').value="Error: "+e.message;}}function nodeToObj(node){let obj={};if(node.hasChildNodes()){for(let child of node.childNodes){if(child.nodeType===1){let name=child.nodeName;let val=nodeToObj(child);if(obj[name]){if(!Array.isArray(obj[name]))obj[name]=[obj[name]];obj[name].push(val);}else{obj[name]=val;}}else if(child.nodeType===3&&child.nodeValue.trim()){return child.nodeValue.trim();}}}return Object.keys(obj).length>0?obj:"";}</script></body></html>
