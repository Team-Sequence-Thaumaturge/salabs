<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Synthesizer Keyboard & Oscillator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Synthesizer Keyboard","url":"https://salabs.quanxs.com/tools/audio-synth-keyboard.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:1rem 1.2rem;border-radius:6px;font-weight:bold;cursor:pointer;margin:0.3rem;}select{background:#0f172a;color:#fff;padding:0.8rem;border-radius:8px;border:1px solid #334155;margin-bottom:1rem;width:100%;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Synthesizer Keyboard Studio</h1></header><main class="container"><label>Waveform Type</label><select id="wave-type"><option value="sine">Sine Wave</option><option value="square">Square Wave</option><option value="sawtooth">Sawtooth Wave</option><option value="triangle">Triangle Wave</option></select><div style="margin-top:1rem;"><button onclick="playNote(261.63)">C4</button><button onclick="playNote(293.66)">D4</button><button onclick="playNote(329.63)">E4</button><button onclick="playNote(349.23)">F4</button><button onclick="playNote(392.00)">G4</button><button onclick="playNote(440.00)">A4 (440Hz)</button><button onclick="playNote(493.88)">B4</button><button onclick="playNote(523.25)">C5</button></div></main><script>let audioCtx=null;function playNote(freq){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();let wave=document.getElementById('wave-type').value;let osc=audioCtx.createOscillator();let gain=audioCtx.createGain();osc.type=wave;osc.frequency.setValueAtTime(freq,audioCtx.currentTime);gain.gain.setValueAtTime(0.3,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.8);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+0.8);}</script></body></html>
