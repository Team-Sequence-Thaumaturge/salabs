<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Bézier Curve Studio & Code Generator - Quanxs SA Labs</title>

{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Interactive Bézier Curve Studio & Code Generator",

<style>
:root { --bg: #0f172a; --card: #1e293b; --border: #334155; --accent: #38bdf8; --text: #f8fafc; --text-muted: #94a3b8; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background: var(--bg); color: var(--text); padding: 24px 16px; min-height: 100vh; }
.container { max-width: 1000px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
h1 { color: var(--accent); font-size: 1.6rem; margin-bottom: 8px; }
p.desc { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px; }
.workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
@media (max-width: 768px) { .workspace { grid-template-columns: 1fr; } }
canvas { background: #0b1120; border: 1px solid var(--border); border-radius: 8px; width: 100%; height: 360px; cursor: crosshair; touch-action: none; }
.controls { display: flex; flex-direction: column; gap: 14px; }
.btn-group { display: flex; gap: 10px; }
.btn { background: var(--accent); color: var(--bg); border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; }
.btn.secondary { background: #334155; color: var(--text); }
.code-box { background: #0b1120; border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-family: monospace; font-size: 0.85rem; color: #a5f3fc; height: 100px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
.info-row { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-muted); }
</style>
<script>

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
let mode = 'cubic'; // 'cubic' or 'quad'
let points = [];
let draggingPoint = null;

function resetPoints() {
  const w = canvas.width;
  const h = canvas.height;
  if (mode === 'cubic') {
    points = [
      { x: 50, y: h - 50, label: 'P0 (Start)' },
      { x: 120, y: 70, label: 'P1 (Ctrl 1)' },
      { x: 330, y: 70, label: 'P2 (Ctrl 2)' },
      { x: w - 50, y: h - 50, label: 'P3 (End)' }
    ];
  } else {
    points = [
      { x: 50, y: h - 50, label: 'P0 (Start)' },
      { x: w / 2, y: 60, label: 'P1 (Ctrl)' },
      { x: w - 50, y: h - 50, label: 'P2 (End)' }
    ];
  }
  draw();
}

function setMode(m) {
  mode = m;
  document.getElementById('btn-cubic').className = mode === 'cubic' ? 'btn' : 'btn secondary';
  document.getElementById('btn-quad').className = mode === 'quad' ? 'btn' : 'btn secondary';
  resetPoints();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 30) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += 30) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }

  // Handle lines
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) {
    ctx.lineTo(points[i].x, points[i].y);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // Curve
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  if (mode === 'cubic') {
    ctx.bezierCurveTo(points[1].x, points[1].y, points[2].x, points[2].y, points[3].x, points[3].y);
  } else {
    ctx.quadraticCurveTo(points[1].x, points[1].y, points[2].x, points[2].y);
  }
  ctx.stroke();

  // Points
  points.forEach((p, idx) => {
    ctx.fillStyle = (idx === 0 || idx === points.length - 1) ? '#4ade80' : '#f43f5e';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#f8fafc';
    ctx.font = '11px sans-serif';
    ctx.fillText(p.label, p.x + 12, p.y + 4);
  });

  updateCode();
}

function updateCode() {
  const w = canvas.width;
  const h = canvas.height;

  // SVG
  let svgD = '';
  if (mode === 'cubic') {
    svgD = `<path d="M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)} C ${points[1].x.toFixed(1)} ${points[1].y.toFixed(1)}, ${points[2].x.toFixed(1)} ${points[2].y.toFixed(1)}, ${points[3].x.toFixed(1)} ${points[3].y.toFixed(1)}" fill="none" stroke="#38bdf8" stroke-width="3" />`;
  } else {
    svgD = `<path d="M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)} Q ${points[1].x.toFixed(1)} ${points[1].y.toFixed(1)}, ${points[2].x.toFixed(1)} ${points[2].y.toFixed(1)}" fill="none" stroke="#38bdf8" stroke-width="3" />`;
  }
  document.getElementById('code-svg').textContent = svgD;

  // Canvas 2D
  let canvasCode = `ctx.beginPath();\nctx.moveTo(${points[0].x.toFixed(1)}, ${points[0].y.toFixed(1)});\n`;
  if (mode === 'cubic') {
    canvasCode += `ctx.bezierCurveTo(${points[1].x.toFixed(1)}, ${points[1].y.toFixed(1)}, ${points[2].x.toFixed(1)}, ${points[2].y.toFixed(1)}, ${points[3].x.toFixed(1)}, ${points[3].y.toFixed(1)});\n`;
  } else {
    canvasCode += `ctx.quadraticCurveTo(${points[1].x.toFixed(1)}, ${points[1].y.toFixed(1)}, ${points[2].x.toFixed(1)}, ${points[2].y.toFixed(1)});\n`;
  }
  canvasCode += `ctx.strokeStyle = '#38bdf8';\nctx.lineWidth = 3;\nctx.stroke();`;
  document.getElementById('code-canvas').textContent = canvasCode;

  // Normalized CSS cubic-bezier
  if (mode === 'cubic') {
    const x1 = Math.max(0, Math.min(1, (points[1].x - points[0].x) / (points[3].x - points[0].x))).toFixed(3);
    const y1 = ((points[0].y - points[1].y) / (points[0].y - points[3].y || 1)).toFixed(3);
    const x2 = Math.max(0, Math.min(1, (points[2].x - points[0].x) / (points[3].x - points[0].x))).toFixed(3);
    const y2 = ((points[0].y - points[2].y) / (points[0].y - points[3].y || 1)).toFixed(3);
    document.getElementById('code-css').textContent = `transition-timing-function: cubic-bezier(${x1}, ${y1}, ${x2}, ${y2});`;
  } else {
    document.getElementById('code-css').textContent = `/* CSS cubic-bezier requires 4-point cubic curve */`;
  }
}

function getPointerPos(evt) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
  const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function onDown(evt) {
  const pos = getPointerPos(evt);
  for (let p of points) {
    const dist = Math.hypot(p.x - pos.x, p.y - pos.y);
    if (dist <= 15) {
      draggingPoint = p;
      break;
    }
  }
}

function onMove(evt) {
  if (!draggingPoint) return;
  evt.preventDefault();
  const pos = getPointerPos(evt);
  draggingPoint.x = Math.max(10, Math.min(canvas.width - 10, pos.x));
  draggingPoint.y = Math.max(10, Math.min(canvas.height - 10, pos.y));
  draw();
}

function onUp() {
  draggingPoint = null;
}

canvas.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown);
window.addEventListener('touchmove', onMove, { passive: false });
window.addEventListener('touchend', onUp);

resetPoints();

</script>
</head>
<body>
<div class="container">
  <h1>🎨 Interactive Bézier Curve Studio & Code Generator</h1>
  <p class="desc">Interactive 2D Canvas Drag-and-Drop Bézier Visualizer with Instant CSS, SVG, and Canvas 2D Code Export.</p>

  <div class="workspace">
    <div>
      <canvas id="cv" width="450" height="360"></canvas>
    </div>
    <div class="controls">
      <div class="btn-group">
        <button class="btn" id="btn-cubic" onclick="setMode('cubic')">Cubic Bézier (4 Points)</button>
        <button class="btn secondary" id="btn-quad" onclick="setMode('quad')">Quadratic (3 Points)</button>
      </div>
      <div class="info-row">
        <span>Drag the control points on canvas</span>
        <button class="btn secondary" style="padding:4px 10px; font-size:0.8rem;" onclick="resetPoints()">Reset</button>
      </div>
      <div>
        <label style="font-weight:600; font-size:0.85rem; margin-bottom:4px; display:block;">CSS Timing Function:</label>
        <div class="code-box" id="code-css">cubic-bezier(...)</div>
      </div>
      <div>
        <label style="font-weight:600; font-size:0.85rem; margin-bottom:4px; display:block;">SVG Path String:</label>
        <div class="code-box" id="code-svg">&lt;path d="..." /&gt;</div>
      </div>
      <div>
        <label style="font-weight:600; font-size:0.85rem; margin-bottom:4px; display:block;">HTML5 Canvas 2D Context Code:</label>
        <div class="code-box" id="code-canvas">ctx.beginPath();...</div>
      </div>
    </div>
  </div>
</div>


</body>
</html>
