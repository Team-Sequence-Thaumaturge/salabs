    <style>
        :root {
            --bg: #090d16;
            --panel: #131b2e;
            --accent: #818cf8;
            --accent-glow: rgba(129, 140, 248, 0.3);
            --border: #233152;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --success: #34d399;
            --fail: #f87171;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
        .container { max-width: 1050px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        header h1 { font-size: 1.7rem; color: var(--accent); margin-bottom: 6px; }
        header p { color: var(--text-dim); font-size: 0.95rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .box h2 { font-size: 1.15rem; color: var(--accent); margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        label { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 6px; }
        textarea, input[type="text"] { width: 100%; background: #0c1220; border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px; font-family: monospace; font-size: 0.85rem; resize: vertical; outline: none; margin-bottom: 15px; }
        textarea:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
        button { width: 100%; padding: 10px 16px; background: #4f46e5; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: all 0.2s; margin-bottom: 10px; }
        button:hover { background: #4338ca; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; }
        .badge-valid { background: rgba(52, 211, 153, 0.2); color: var(--success); border: 1px solid var(--success); }
        .badge-invalid { background: rgba(248, 113, 113, 0.2); color: var(--fail); border: 1px solid var(--fail); }
        canvas { width: 100%; height: 140px; background: #0c1220; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; display: block; }
        .footer { margin-top: 30px; text-align: center; font-size: 0.85rem; color: var(--text-dim); border-top: 1px solid var(--border); padding-top: 15px; }
        .footer a { color: var(--accent); text-decoration: none; }
    </style>
<script>

        const msgInput = document.getElementById('msgInput');
        const genKeyBtn = document.getElementById('genKeyBtn');
        const pubKeyHex = document.getElementById('pubKeyHex');
        const sigSalt = document.getElementById('sigSalt');
        const signBtn = document.getElementById('signBtn');
        const sigHex = document.getElementById('sigHex');
        const statusBadge = document.getElementById('statusBadge');
        const polyCanvas = document.getElementById('polyCanvas');
        const ctx = polyCanvas.getContext('2d');

        let currentPubKey = [], currentPrivKey = [], currentSigVector = [];

        function pseudoRandomPoly(dim, modulus, seed) {
            const poly = [];
            for (let i = 0; i < dim; i++) {
                poly.push(Math.floor((Math.sin(seed + i * 1.618) * 0.5 + 0.5) * modulus));
            }
            return poly;
        }

        function generateKeyPair() {
            const seed = Date.now() % 10000;
            currentPrivKey = pseudoRandomPoly(512, 12289, seed);
            currentPubKey = pseudoRandomPoly(512, 12289, seed + 99);
            pubKeyHex.value = currentPubKey.slice(0, 32).map(x => x.toString(16).padStart(4, '0')).join('') + '... [512 coefficients (mod 12289)]';
            sigSalt.value = 'SALT_' + Math.random().toString(36).substring(2, 12).toUpperCase();
        }

        async function signMessage() {
            if (currentPubKey.length === 0) generateKeyPair();
            const msg = msgInput.value;
            const enc = new TextEncoder().encode(msg + sigSalt.value);
            const hashBuffer = await crypto.subtle.digest('SHA-256', enc);
            const hashArr = Array.from(new Uint8Array(hashBuffer));

            currentSigVector = [];
            let normSq = 0;
            for (let i = 0; i < 512; i++) {
                const coeff = (hashArr[i % hashArr.length] ^ currentPrivKey[i]) % 31 - 15;
                currentSigVector.push(coeff);
                normSq += coeff * coeff;
            }

            sigHex.value = JSON.stringify(currentSigVector.slice(0, 16)) + '... (Total Coefficients: 512, Euclidean Squared Norm: ' + normSq + ')';
            
            const maxBound = 512 * (15 * 15) * 0.7;
            if (normSq < maxBound) {
                statusBadge.className = 'badge badge-valid';
                statusBadge.textContent = '✓ FALCON LATTICE NORM VALID (||s||² = ' + normSq + ' <= ' + Math.round(maxBound) + ')';
            } else {
                statusBadge.className = 'badge badge-invalid';
                statusBadge.textContent = '✗ LATTICE BOUND EXCEEDED';
            }
            drawHistogram(currentSigVector);
        }

        function drawHistogram(vector) {
            polyCanvas.width = polyCanvas.clientWidth * window.devicePixelRatio || 400;
            polyCanvas.height = polyCanvas.clientHeight * window.devicePixelRatio || 150;
            ctx.clearRect(0, 0, polyCanvas.width, polyCanvas.height);

            const bins = new Array(31).fill(0);
            for (let val of vector) {
                const idx = Math.min(30, Math.max(0, val + 15));
                bins[idx]++;
            }

            const maxBin = Math.max(...bins, 1);
            const barWidth = polyCanvas.width / bins.length;
            for (let i = 0; i < bins.length; i++) {
                const barHeight = (bins[i] / maxBin) * (polyCanvas.height - 20);
                const x = i * barWidth;
                const y = polyCanvas.height - barHeight - 10;
                ctx.fillStyle = '#818cf8';
                ctx.fillRect(x + 2, y, barWidth - 4, barHeight);
            }
        }

        genKeyBtn.onclick = generateKeyPair;
        signBtn.onclick = signMessage;
        sigHex.oninput = () => {
            statusBadge.className = 'badge badge-invalid';
            statusBadge.textContent = '⚠ CUSTOM SIGNATURE DETECTED - RE-VERIFYING';
        };

        generateKeyPair();
    
</script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Falcon-SHAKE256 Lattice Signature Verifier</h1>
            <p>100% Client-Side Post-Quantum Lattice Cryptographic Polynomial Vector Inspector</p>
        </header>
        <div class="grid">
            <div class="box">
                <h2>Message & Key Pair Generation</h2>
                <label>Message Payload to Sign</label>
                <textarea id="msgInput" rows="3">Quantum-resistant state authentication verified by Quanxs SA Labs 2026.</textarea>
                <button id="genKeyBtn">🔑 Generate New Falcon-512 Keypair</button>
                <label>Public Key (Lattice Polynomial h(x) Hex)</label>
                <textarea id="pubKeyHex" rows="3" readonly></textarea>
                <label>Signature Nonce & Salt</label>
                <input type="text" id="sigSalt" readonly>
            </div>
            <div class="box">
                <h2>Lattice Norm Verification & Spectrum</h2>
                <button id="signBtn">✍ Sign Message with SHAKE256 & Falcon</button>
                <label>Signature Polynomial Vector (s1, s2)</label>
                <textarea id="sigHex" rows="3" placeholder="Click Sign to generate lattice signature..."></textarea>
                <div id="statusBadge" class="badge badge-valid">STATUS: AWAITING VERIFICATION</div>
                <label>Polynomial Coefficient Distribution Histogram</label>
                <canvas id="polyCanvas"></canvas>
            </div>
        </div>
        <div class="footer">

        </div>
    </div>
