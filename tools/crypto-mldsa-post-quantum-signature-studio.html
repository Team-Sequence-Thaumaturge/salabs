    <style>
        :root {
            --bg: #0b0f19;
            --panel: #111827;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.25);
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1f2937;
            --success: #10b981;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 960px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
        header { border-bottom: 1px solid var(--border); padding-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.4rem; color: var(--accent); font-weight: 700; }
        .badge { background: var(--panel); border: 1px solid var(--border); padding: 4px 10px; border-radius: 9999px; font-size: 0.75rem; color: var(--text-muted); }
        .workbench { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 768px) { .workbench { grid-template-columns: 1fr; } }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
        .card h3 { font-size: 0.9rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between; align-items: center; }
        textarea, input[type="text"] { width: 100%; background: #030712; border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px; font-family: monospace; font-size: 0.8rem; resize: vertical; }
        textarea:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button { background: var(--accent); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
        button:hover { filter: brightness(1.15); box-shadow: 0 0 12px var(--accent-glow); }
        button.secondary { background: #374151; }
        .status-box { padding: 12px; border-radius: 8px; font-size: 0.85rem; font-family: monospace; display: flex; align-items: center; gap: 8px; }
        .status-valid { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); color: var(--success); }
        .status-invalid { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); }

<body>
<div class="container">
    <header>
        <div>
            <h1>ML-DSA Post-Quantum Signature Studio</h1>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">NIST FIPS 204 Lattice Cryptography Keypair & Verification Engine</p>
        </div>
        <span class="badge">NIST FIPS 204 Ready</span>
    </header>

    <div class="adsense-box">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-9108438313531011" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
        
    </div>

    <div class="workbench">
        <div class="card">
            <h3>1. Lattice Keypair Generation (ML-DSA-65)</h3>
            <div>
                <label style="font-size: 0.75rem; color: var(--text-muted);">Parameter Set</label>
                <input type="text" value="ML-DSA-65 (NIST Security Level 3, Dilithium3 equivalent)" readonly style="margin-top: 4px;">
            </div>
            <div class="btn-group">
                <button id="btnGenKeys">Generate Lattice Keypair</button>
                <button id="btnSampleMsg" class="secondary">Load Sample Message</button>
            </div>
            <div>
                <label style="font-size: 0.75rem; color: var(--text-muted);">Public Key (Matrix A seed + t1 polynomial vector)</label>
                <textarea id="txtPubKey" rows="3" placeholder="Public key hex will appear here..."></textarea>
            </div>
            <div>
                <label style="font-size: 0.75rem; color: var(--text-muted);">Secret Key (s1, s2 polynomial error vectors)</label>
                <textarea id="txtSecKey" rows="3" placeholder="Secret key hex will appear here..."></textarea>
            </div>
        </div>

        <div class="card">
            <h3>2. Sign & Verify Post-Quantum Proof</h3>
            <div>
                <label style="font-size: 0.75rem; color: var(--text-muted);">Payload Message</label>
                <textarea id="txtMsg" rows="3">Quantized state vector validation payload for Quanxs SA Labs post-quantum ledger clearing.</textarea>
            </div>
            <div class="btn-group">
                <button id="btnSign">Sign with Secret Key</button>
                <button id="btnVerify">Verify Signature</button>
                <button id="btnTamper" class="secondary">Tamper Message</button>
            </div>
            <div>
                <label style="font-size: 0.75rem; color: var(--text-muted);">Lattice Signature (z polynomial + hint vector h)</label>
                <textarea id="txtSig" rows="3" placeholder="Digital signature hex..."></textarea>
            </div>
            <div id="verifyStatus" class="status-box" style="display:none;"></div>
        </div>
    </div>
</div>
