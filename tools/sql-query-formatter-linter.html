<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Query Formatter & Linter - Quanxs SA Labs</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "SQL Query Formatter & Linter",
  "url": "https://salabs.quanxs.com/tools/sql-query-formatter-linter.html",
  "applicationCategory": "DeveloperApplication",
  "operatingSystem": "All",
  "browserRequirements": "Requires JavaScript. Requires HTML5.",
  "author": {
    "@type": "Organization",
    "name": "Quanxs SA Labs"
  }
}
</script>
<style>
:root {
  --bg: #0f172a;
  --panel: #1e293b;
  --border: #334155;
  --accent: #38bdf8;
  --accent-hover: #0284c7;
  --text: #f8fafc;
  --muted: #94a3b8;
  --code-bg: #090d16;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 24px 16px; min-height: 100vh; }
.container { max-width: 1000px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
h1 { font-size: 24px; color: var(--accent); margin-bottom: 8px; font-weight: 700; }
p.desc { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; align-items: center; }
.btn { background: var(--accent); color: #0f172a; font-weight: 600; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; transition: background 0.2s; font-size: 14px; }
.btn:hover { background: var(--accent-hover); color: #fff; }
.btn-sec { background: #334155; color: var(--text); }
.btn-sec:hover { background: #475569; }
.editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 768px) { .editor-grid { grid-template-columns: 1fr; } }
label { font-size: 13px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 6px; }
textarea { width: 100%; height: 320px; background: var(--code-bg); color: #e2e8f0; border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; line-height: 1.5; resize: vertical; }
textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
.stats { display: flex; gap: 20px; font-size: 13px; color: var(--muted); padding: 8px 12px; background: var(--code-bg); border-radius: 6px; border: 1px solid var(--border); }
.stats span b { color: var(--accent); }
</style>
<script>

const SQL_KEYWORDS = ['SELECT', 'FROM', 'WHERE', 'LEFT JOIN', 'RIGHT JOIN', 'INNER JOIN', 'OUTER JOIN', 'JOIN', 'ON', 'GROUP BY', 'HAVING', 'ORDER BY', 'LIMIT', 'OFFSET', 'UNION ALL', 'UNION', 'INSERT INTO', 'VALUES', 'UPDATE', 'SET', 'DELETE FROM', 'CREATE TABLE', 'ALTER TABLE', 'DROP TABLE', 'AND', 'OR', 'NOT', 'IN', 'IS NULL', 'IS NOT NULL', 'BETWEEN', 'LIKE', 'EXISTS', 'CASE', 'WHEN', 'THEN', 'ELSE', 'END', 'AS', 'DISTINCT', 'COUNT', 'SUM', 'AVG', 'MIN', 'MAX'];

function formatSQL() {
  const input = document.getElementById('rawSql').value.trim();
  if (!input) return;
  let formatted = input.replace(/\s+/g, ' ');
  const majorClauses = ['SELECT', 'FROM', 'LEFT JOIN', 'RIGHT JOIN', 'INNER JOIN', 'OUTER JOIN', 'JOIN', 'WHERE', 'GROUP BY', 'HAVING', 'ORDER BY', 'LIMIT', 'OFFSET', 'VALUES', 'SET'];
  majorClauses.forEach(k => {
    const reg = new RegExp('\\b' + k + '\\b', 'gi');
    formatted = formatted.replace(reg, '\n' + k.toUpperCase());
  });
  formatted = formatted.replace(/\bAND\b/gi, '\n  AND')
                       .replace(/\bOR\b/gi, '\n  OR')
                       .replace(/\bON\b/gi, ' ON');
  
  formatted = formatted.split('\n').map(line => line.trim()).filter(line => line.length > 0).join('\n');
  document.getElementById('formattedSql').value = formatted;
  updateStats(formatted);
}

function minifySQL() {
  const input = document.getElementById('rawSql').value.trim();
  if (!input) return;
  const minified = input.replace(/\s+/g, ' ').trim();
  document.getElementById('formattedSql').value = minified;
  updateStats(minified);
}

function loadSample() {
  document.getElementById('rawSql').value = "SELECT u.id, u.username, u.email, count(p.id) as total_posts, sum(p.views) as total_views FROM users u LEFT JOIN posts p ON u.id = p.author_id WHERE u.is_active = 1 AND u.created_at >= '2026-01-01' GROUP BY u.id, u.username, u.email HAVING count(p.id) >= 10 ORDER BY total_views DESC LIMIT 50;";
  formatSQL();
}

function copyOutput() {
  const out = document.getElementById('formattedSql');
  out.select();
  navigator.clipboard.writeText(out.value);
  alert('Copied formatted SQL to clipboard!');
}

function updateStats(text) {
  document.getElementById('charCount').textContent = text.length;
  document.getElementById('lineCount').textContent = text ? text.split('\n').length : 0;
  let count = 0;
  SQL_KEYWORDS.forEach(kw => {
    const m = text.match(new RegExp('\\b' + kw + '\\b', 'gi'));
    if (m) count += m.length;
  });
  document.getElementById('kwCount').textContent = count;
}

</script>
</head>
<body>
<div class="container">
  <h1>⚡ SQL Query Formatter & Linter</h1>
  <p class="desc">100% Client-Side Pure JavaScript SQL Formatter, Keyword Normalizer & Structure Beautifier.</p>
  <div class="controls">
    <button class="btn" onclick="formatSQL()">Format SQL</button>
    <button class="btn btn-sec" onclick="minifySQL()">Minify SQL</button>
    <button class="btn btn-sec" onclick="loadSample()">Sample Query</button>
    <button class="btn btn-sec" onclick="copyOutput()">Copy Output</button>
  </div>
  <div class="editor-grid">
    <div>
      <label for="rawSql">Input SQL Query</label>
      <textarea id="rawSql" placeholder="SELECT u.id, u.name, count(o.id) as order_count FROM users u LEFT JOIN orders o ON u.id = o.user_id WHERE u.status = 'active' GROUP BY u.id HAVING count(o.id) > 5 ORDER BY order_count DESC LIMIT 10;"></textarea>
    </div>
    <div>
      <label for="formattedSql">Formatted Result</label>
      <textarea id="formattedSql" readonly placeholder="Formatted SQL query will appear here..."></textarea>
    </div>
  </div>
  <div class="stats">
    <span>Keywords: <b id="kwCount">0</b></span>
    <span>Lines: <b id="lineCount">0</b></span>
    <span>Characters: <b id="charCount">0</b></span>
  </div>
</div>

</body>
</html>
