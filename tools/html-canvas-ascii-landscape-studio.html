<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas ASCII Procedural Landscape Renderer - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas ASCII Procedural Landscape Renderer","url":"https://salabs.quanxs.com/tools/html-canvas-ascii-landscape-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#38bdf8;border:1px solid #334155;border-radius:8px;padding:1rem;box-sizing:border-box;font-family:monospace;font-size:11px;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-bottom:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas ASCII Procedural Landscape Studio</h1></header><main class="container"><button onclick="generateTerrain()">Generate New Terrain</button><textarea id="terrain-out" rows="16" readonly></textarea></main><script>function generateTerrain(){let w=80,h=18;let terrain=Array.from({length:h},()=>Array(w).fill(' '));let chars=' .:-=+*#%@';for(let x=0;x<w;x++){let peak=Math.floor(h/2+Math.sin(x*0.15)*4+Math.cos(x*0.08)*3);for(let y=peak;y<h;y++){let depth=(y-peak)/(h-peak);let cIdx=Math.floor(depth*(chars.length-1));terrain[y][x]=chars[cIdx];}}document.getElementById('terrain-out').value=terrain.map(r=>r.join('')).join('\n');}generateTerrain();</script></body></html>
