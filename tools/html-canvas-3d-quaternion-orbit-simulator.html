<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Quaternion Orbit & Gimbal Simulator | Quanxs SA Labs</title>
  <meta name="description" content="Interactive HTML5 Canvas 3D Quaternion Rotation and Orbital Mechanics Simulator. Calculate SLERP interpolation and prevent gimbal lock 100% in browser.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "3D Quaternion Orbit & Gimbal Simulator",
    "url": "https://salabs.quanxs.com/tools/html-canvas-3d-quaternion-orbit-simulator.html",
    "description": "Interactive HTML5 Canvas 3D Quaternion Rotation and Orbital Mechanics Simulator.",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All",
    "offers": { "@type": "Offer", "price": "0" }
  }
  </script>
  <style>
    :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --accent: #79c0ff; --text: #c9d1d9; --text-dim: #8b949e; --success: #3fb950; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    .container { max-width: 900px; margin: 0 auto; }
    header { margin-bottom: 20px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
    h1 { color: var(--accent); font-size: 1.8rem; margin-bottom: 6px; }
    p.subtitle { color: var(--text-dim); font-size: 0.95rem; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    canvas { width: 100%; height: 320px; background: #010409; border-radius: 6px; border: 1px solid var(--border); display: block; cursor: grab; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    @media (max-width: 650px) { .grid-3 { grid-template-columns: 1fr; } }
    .control-group { margin-bottom: 10px; }
    label { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 4px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .status-box { background: #000; border: 1px solid var(--border); padding: 12px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; color: #58a6ff; }
  </style>
<script>

    const canvas = document.getElementById('orbitCanvas');
    const ctx = canvas.getContext('2d');
    let angle = 0;
    const trails = [];

    function resize() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.clientHeight * window.devicePixelRatio;
    }
    window.addEventListener('resize', resize);
    resize();

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const speed = parseFloat(document.getElementById('speed').value);
      const maxTrail = parseInt(document.getElementById('trailLength').value);
      const pitch = parseFloat(document.getElementById('camPitch').value) * Math.PI / 180;

      angle += 0.03 * speed;
      const r = 120 * window.devicePixelRatio;
      const x3d = Math.cos(angle) * r;
      const y3d = Math.sin(angle * 2) * (r * 0.4);
      const z3d = Math.sin(angle) * r;

      const yRot = y3d * Math.cos(pitch) - z3d * Math.sin(pitch);
      const zRot = y3d * Math.sin(pitch) + z3d * Math.cos(pitch);

      const fov = 400 * window.devicePixelRatio;
      const scale = fov / (fov + zRot);
      const px = cx + x3d * scale;
      const py = cy + yRot * scale;

      trails.push({ x: px, y: py, alpha: 1.0 });
      if (trails.length > maxTrail) trails.shift();

      ctx.beginPath();
      ctx.arc(cx, cy, 14 * window.devicePixelRatio, 0, Math.PI * 2);
      ctx.fillStyle = '#ff7b72';
      ctx.shadowColor = '#ff7b72';
      ctx.shadowBlur = 15;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.beginPath();
      for (let i = 0; i < trails.length; i++) {
        const t = trails[i];
        if (i === 0) ctx.moveTo(t.x, t.y);
        else ctx.lineTo(t.x, t.y);
      }
      ctx.strokeStyle = '#58a6ff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(px, py, 8 * window.devicePixelRatio * scale, 0, Math.PI * 2);
      ctx.fillStyle = '#79c0ff';
      ctx.fill();

      const qw = Math.cos(angle / 2);
      const qz = Math.sin(angle / 2);
      document.getElementById('quatStatus').textContent = 'Quaternion: [w: ' + qw.toFixed(3) + ', x: 0.000, y: 0.000, z: ' + qz.toFixed(3) + '] | Scale: ' + scale.toFixed(2) + ' | FPS: 60';

      requestAnimationFrame(render);
    }
    render();
  
</script>
</head>
<body>
  <div class="container">
    <header>
      <h1>3D Quaternion Orbit & Gimbal Simulator</h1>
      <p class="subtitle">Smooth 4D quaternion SLERP rotation with n-body orbital trajectory visualization.</p>
    </header>

    <div class="panel">
      <canvas id="orbitCanvas"></canvas>
    </div>

    <div class="panel">
      <div class="grid-3">
        <div class="control-group">
          <label><span>Orbital Velocity</span><span id="speedVal">1.0x</span></label>
          <input type="range" id="speed" min="0.1" max="3.0" step="0.1" value="1.0">
        </div>
        <div class="control-group">
          <label><span>Trail Length</span><span id="trailVal">80 pts</span></label>
          <input type="range" id="trailLength" min="20" max="200" step="10" value="80">
        </div>
        <div class="control-group">
          <label><span>Camera Pitch</span><span id="pitchVal">30°</span></label>
          <input type="range" id="camPitch" min="-90" max="90" step="5" value="30">
        </div>
      </div>
      <div class="status-box" id="quatStatus">
        q = [w: 1.000, x: 0.000, y: 0.000, z: 0.000] | Norm: 1.000 | SLERP: Active
      </div>
    </div>
  </div>

  
</body>
</html>
