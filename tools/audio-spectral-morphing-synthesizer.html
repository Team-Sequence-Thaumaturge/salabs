<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectral Morphing Synthesizer | Quanxs SA Labs</title>
  <meta name="description" content="100% Client-Side Web Audio Spectral Morphing Synthesizer. Real-time Fourier harmonic additive synthesis, waveform interpolation, and spectral envelope shaping.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Spectral Morphing Synthesizer",
    "url": "https://salabs.quanxs.com/tools/audio-spectral-morphing-synthesizer.html",
    "description": "Real-time client-side Web Audio spectral morphing synthesizer with zero latency.",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "All",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --success: #238636;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.5rem; color: #fff; }
    .nav-link { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 6px; font-weight: 600; color: #8b949e; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .val-badge { float: right; color: var(--accent); font-family: monospace; }
    button { background: var(--accent); color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
    button:hover { background: var(--accent-hover); }
    button.active { background: #da3633; }
    canvas { width: 100%; height: 180px; background: #000; border-radius: 6px; border: 1px solid var(--border); margin-top: 12px; }
    .info { font-size: 0.85rem; color: #8b949e; margin-top: 12px; }
  </style>
<script>

    let audioCtx = null, osc = null, filterNode = null, gainNode = null, analyser = null, animId = null;
    let isPlaying = false;

    const toggleBtn = document.getElementById('toggleBtn');
    const statusText = document.getElementById('status');
    const freqSlider = document.getElementById('freqSlider');
    const freqVal = document.getElementById('freqVal');
    const morphSlider = document.getElementById('morphSlider');
    const morphVal = document.getElementById('morphVal');
    const partialsSlider = document.getElementById('partialsSlider');
    const partialsVal = document.getElementById('partialsVal');
    const resSlider = document.getElementById('resSlider');
    const resVal = document.getElementById('resVal');
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');

    function createMorphWave(morph, numPartials) {
      const real = new Float32Array(numPartials + 1);
      const imag = new Float32Array(numPartials + 1);
      real[0] = 0;
      imag[0] = 0;

      for (let n = 1; n <= numPartials; n++) {
        let sineAmp = (n === 1) ? 1.0 : 0.0;
        let sawAmp = (2.0 / (Math.PI * n)) * (n % 2 === 1 ? 1 : -1);
        let pulseAmp = (n % 2 === 1) ? (4.0 / (Math.PI * n)) : 0.0;

        let amp = 0;
        if (morph <= 1.0) {
          amp = (1.0 - morph) * sineAmp + morph * sawAmp;
        } else {
          let t = morph - 1.0;
          amp = (1.0 - t) * sawAmp + t * pulseAmp;
        }
        imag[n] = amp;
      }
      return audioCtx.createPeriodicWave(real, imag, { disableNormalization: false });
    }

    function updateSynth() {
      if (!audioCtx || !isPlaying) return;
      const freq = parseFloat(freqSlider.value);
      const morph = parseFloat(morphSlider.value);
      const partials = parseInt(partialsSlider.value);
      const res = parseFloat(resSlider.value);

      freqVal.innerText = freq + " Hz";
      let morphDesc = morph < 0.5 ? "Sine Focus" : morph < 1.5 ? "Sawtooth Spectrum" : "Square/Pulse Dominant";
      morphVal.innerText = morph.toFixed(2) + " (" + morphDesc + ")";
      partialsVal.innerText = partials;
      resVal.innerText = res + " Hz";

      osc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.02);
      filterNode.frequency.setTargetAtTime(res, audioCtx.currentTime, 0.02);
      const wave = createMorphWave(morph, partials);
      osc.setPeriodicWave(wave);
    }

    [freqSlider, morphSlider, partialsSlider, resSlider].forEach(slider => {
      slider.addEventListener('input', updateSynth);
    });

    toggleBtn.addEventListener('click', async () => {
      if (!isPlaying) {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        osc = audioCtx.createOscillator();
        filterNode = audioCtx.createBiquadFilter();
        filterNode.type = 'lowpass';
        filterNode.Q.value = 4.0;

        gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;

        osc.connect(filterNode);
        filterNode.connect(gainNode);
        gainNode.connect(analyser);
        analyser.connect(audioCtx.destination);

        updateSynth();
        osc.start();
        isPlaying = true;
        toggleBtn.innerText = 'Stop Synthesis Engine';
        toggleBtn.classList.add('active');
        statusText.innerText = 'Status: Real-time Synthesis Active (0 Server Overhead)';
        drawSpectrum();
      } else {
        if (osc) {
          osc.stop();
          osc.disconnect();
        }
        isPlaying = false;
        toggleBtn.innerText = 'Start Synthesis Engine';
        toggleBtn.classList.remove('active');
        statusText.innerText = 'Status: Engine Standby';
        cancelAnimationFrame(animId);
      }
    });

    function drawSpectrum() {
      if (!isPlaying) return;
      animId = requestAnimationFrame(drawSpectrum);

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      canvasCtx.fillStyle = '#000';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / bufferLength) * 2.5;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;
        const hue = (i / bufferLength) * 240 + 160;
        canvasCtx.fillStyle = `hsl(${hue}, 80%, 55%)`;
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
        x += barWidth + 1;
      }
    }
  
</script>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Spectral Morphing Synthesizer</h1>
        <p style="color: #8b949e; font-size: 0.85rem;">Option NZ &bull; 100% Client-Side Pure Web Audio API</p>
      </div>
      <a href="../index.html" class="nav-link">&larr; Back to Dashboard</a>
    </header>

    <div class="card">
      <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 16px;">
        <button id="toggleBtn">Start Synthesis Engine</button>
        <span id="status" style="font-size: 0.85rem; color: #8b949e;">Status: Engine Standby</span>
      </div>

      <div class="grid">
        <div>
          <label>Fundamental Pitch (Hz) <span id="freqVal" class="val-badge">220 Hz</span></label>
          <input type="range" id="freqSlider" min="55" max="880" step="1" value="220">
        </div>
        <div>
          <label>Spectral Morph Blend <span id="morphVal" class="val-badge">0.00 (Sine &rarr; Saw &rarr; Pulse)</span></label>
          <input type="range" id="morphSlider" min="0" max="2" step="0.01" value="0.0">
        </div>
        <div>
          <label>Harmonic Richness (Partials) <span id="partialsVal" class="val-badge">16</span></label>
          <input type="range" id="partialsSlider" min="1" max="32" step="1" value="16">
        </div>
        <div>
          <label>Resonance Frequency (Hz) <span id="resVal" class="val-badge">1200 Hz</span></label>
          <input type="range" id="resSlider" min="200" max="5000" step="50" value="1200">
        </div>
      </div>

      <canvas id="visualizer"></canvas>
      <p class="info">&bull; Real-time additive Fourier periodic wave tables generated in browser memory with zero server calls.</p>
    </div>
  </div>

  
</body>
</html>
