<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Realtime 4D-to-3D stereographic Hopf fibration torus manifold raymarcher and ASCII art generator. Pure client-side JavaScript 3D math workstation.">

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <!-- Schema.org JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "3D Hopf Fibrator Manifold Raymarcher",
    "url": "https://salabs.quanxs.com/tools/html-canvas-ascii-3d-hopf-fibrator-manifold.html",
    "description": "Mathematical 4D Hopf Fibration stereographic immersion into 3D Euclidean space with interactive ASCII raymarching.",
    "applicationCategory": "DeveloperApplication, MathApplication",

  }
  </script>
  <style>
    :root {
      --bg: #0b0e14;
      --panel-bg: #151922;
      --border: #2d3342;
      --accent: #58a6ff;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: monospace;
      padding: 20px;
    }
    header {
      max-width: 1050px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .back-link { color: var(--accent); text-decoration: none; font-size: 0.9rem; font-family: sans-serif; }
    .back-link:hover { text-decoration: underline; }
    h1 { font-size: 1.4rem; color: var(--text-bright); }
    .layout {
      max-width: 1050px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }
    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
    }
    .controls {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .controls h2 {
      font-size: 1.1rem;
      color: var(--text-bright);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      font-family: sans-serif;
    }
    .param { margin-bottom: 12px; }
    .param label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      margin-bottom: 4px;
    }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .display-box {
      background: #05070a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #ascii-screen {
      font-size: 8px;
      line-height: 8px;
      letter-spacing: 1px;
      color: #58a6ff;
      white-space: pre;
      user-select: none;
      font-weight: bold;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      background: #21262d;
      color: var(--text-bright);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button:hover { background: #30363d; border-color: var(--accent); }
  </style>
<script>

    const screen = document.getElementById('ascii-screen');
    const width = 80;
    const height = 44;
    let t = 0;
    let running = true;

    const ramps = {
      matrix: " .:-=+*#%@",
      dense: " .'`^",:;Il!i~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$",
      blocks: " ░▒▓█"
    };

    function render() {
      if (running) {
        const speed = parseFloat(document.getElementById('speed-slider').value);
        t += 0.03 * speed;
      }

      const fibers = parseInt(document.getElementById('fiber-slider').value);
      const scale = parseFloat(document.getElementById('scale-slider').value);
      const ramp = ramps[document.getElementById('ramp-select').value] || ramps.matrix;

      const zBuffer = new Float32Array(width * height);
      const charBuffer = new Array(width * height).fill(' ');

      // 4D Hopf Fibration parametric generation
      for (let f = 0; f < fibers; f++) {
        const eta = (f / fibers) * (Math.PI / 2);
        for (let u = 0; u < Math.PI * 2; u += 0.15) {
          for (let v = 0; v < Math.PI * 2; v += 0.15) {
            // S3 Sphere 4D point (w, x, y, z)
            const w4 = Math.cos(u + t * 0.7) * Math.sin(eta);
            const x4 = Math.sin(u + t * 0.7) * Math.sin(eta);
            const y4 = Math.cos(v + t * 0.5) * Math.cos(eta);
            const z4 = Math.sin(v + t * 0.5) * Math.cos(eta);

            // Stereographic projection from S3 to R3: (X, Y, Z) = (x4, y4, z4) / (1 - w4)
            const denom = Math.max(0.2, 1.2 - w4);
            const X = (x4 / denom) * scale;
            const Y = (y4 / denom) * scale;
            const Z = (z4 / denom) * scale;

            // 3D rotation in Euclidean space
            const cosT = Math.cos(t);
            const sinT = Math.sin(t);
            const rotX = X * cosT - Z * sinT;
            const rotZ = X * sinT + Z * cosT + 3.5;
            const rotY = Y;

            // Perspective projection to 2D screen
            const K = 38;
            const projX = Math.floor(width / 2 + (rotX * K) / rotZ * 1.8);
            const projY = Math.floor(height / 2 - (rotY * K) / rotZ);

            if (projX >= 0 && projX < width && projY >= 0 && projY < height) {
              const idx = projY * width + projX;
              const ooz = 1 / rotZ;
              if (ooz > zBuffer[idx]) {
                zBuffer[idx] = ooz;
                const lumIdx = Math.floor(Math.min(ramp.length - 1, Math.max(0, (1 - w4) * (ramp.length / 2))));
                charBuffer[idx] = ramp[lumIdx];
              }
            }
          }
        }
      }

      let out = '';
      for (let r = 0; r < height; r++) {
        for (let c = 0; c < width; c++) {
          out += charBuffer[r * width + c];
        }
        out += '\n';
      }
      screen.textContent = out;

      requestAnimationFrame(render);
    }

    render();

    document.getElementById('pause-btn').addEventListener('click', () => {
      running = !running;
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(screen.textContent);
      alert('ASCII frame copied to clipboard!');
    });

    document.getElementById('fiber-slider').addEventListener('input', (e) => {
      document.getElementById('val-fibers').textContent = e.target.value;
    });
    document.getElementById('speed-slider').addEventListener('input', (e) => {
      document.getElementById('val-speed').textContent = e.target.value + 'x';
    });
    document.getElementById('scale-slider').addEventListener('input', (e) => {
      document.getElementById('val-scale').textContent = e.target.value;
    });
  
</script>
</head>
<body>
  <header>
    <div>
      <a href="/" class="back-link">← Back to Quanxs SA Labs Hub</a>
      <h1>4D Hopf Fibration Manifold ASCII Raymarcher</h1>
    </div>
  </header>

  <div class="layout">
    <div class="controls">
      <h2>Manifold Parameters</h2>
      <div class="param">
        <label><span>Fiber Count (Tori)</span><span id="val-fibers">8</span></label>
        <input type="range" id="fiber-slider" min="3" max="16" value="8">
      </div>
      <div class="param">
        <label><span>4D Orbit Velocity (XY/ZW)</span><span id="val-speed">1.2x</span></label>
        <input type="range" id="speed-slider" min="0.2" max="3.0" step="0.1" value="1.2">
      </div>
      <div class="param">
        <label><span>Stereographic Scale</span><span id="val-scale">1.0</span></label>
        <input type="range" id="scale-slider" min="0.5" max="2.0" step="0.05" value="1.0">
      </div>
      <div class="param">
        <label><span>ASCII Luminance Ramp</span></label>
        <select id="ramp-select" style="width:100%; padding:6px; background:#0b0e14; color:#fff; border:1px solid var(--border); border-radius:4px;">
          <option value="matrix">Matrix ( .:-=+*#%@)</option>
          <option value="dense">Dense ( .'`^",:;Il!i~+_-?][}{1)(|\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$)</option>
          <option value="blocks">Blocks ( ░▒▓█)</option>
        </select>
      </div>
      <div class="btn-row">
        <button id="pause-btn">Pause / Resume</button>
        <button id="copy-btn">Copy ASCII Frame</button>
      </div>
    </div>

    <div class="display-box">
      <pre id="ascii-screen"></pre>
    </div>
  </div>

  
</body>
</html>
