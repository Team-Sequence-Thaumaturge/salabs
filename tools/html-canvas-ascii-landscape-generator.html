<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas ASCII Landscape Generator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas ASCII Landscape Generator","url":"https://salabs.quanxs.com/tools/html-canvas-ascii-landscape-generator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas ASCII Landscape Generator</h1></header><main class="container"><button onclick="generateTerrain()">Generate New Terrain</button><textarea id="terrain-out" rows="12" readonly></textarea></main><script>function generateTerrain(){let w=70,h=18;let grid=Array.from({length:h},()=>Array(w).fill(' '));let baseline=12;for(let x=0;x<w;x++){let yVal=Math.floor(baseline-Math.sin(x*0.15)*4-Math.cos(x*0.08)*3);for(let y=yVal;y<h;y++){grid[y][x]=y===yVal?'^':'#';}}document.getElementById('terrain-out').value=grid.map(row=>row.join('')).join('\n');}generateTerrain();</script></body></html>
