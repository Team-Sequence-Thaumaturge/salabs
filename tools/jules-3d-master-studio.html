<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jules 3D Master Studio - Quantum Relativity</title>

    <!-- Schema.org WebApplication JSON-LD metadata -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Jules 3D Master Studio",
        "url": "https://example.com/tools/jules-3d-master-studio.html",
        "description": "A flagship versioned 3D WebGL Spatial Simulator Studio tool rendering Quantum Relativity space-time curvature and vector topology.",
        "applicationCategory": "DeveloperApplication",
        "genre": "3D Simulator",
        "operatingSystem": "All"
      }
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: {
                900: "#0f172a",
              },
              cyan: {
                400: "#00f2fe",
              },
              blue: {
                500: "#4facfe",
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #0f172a;
        color: #e2e8f0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }
      #webgl-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      #ui-panel {
        position: absolute;
        top: 0;
        left: 0;
        width: 350px;
        height: 100%;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(10px);
        border-right: 1px solid rgba(0, 242, 254, 0.3);
        z-index: 10;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .panel-section {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 15px;
      }
      .section-title {
        color: #00f2fe;
        font-weight: bold;
        font-size: 0.9rem;
        margin-bottom: 10px;
        border-bottom: 1px solid rgba(0, 242, 254, 0.3);
        padding-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .slider-container {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .slider-label {
        font-size: 0.8rem;
        color: #94a3b8;
        display: flex;
        justify-content: space-between;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #00f2fe;
      }

      .color-box {
        width: 100%;
        height: 30px;
        border-radius: 4px;
        margin-bottom: 5px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: background-color 0.3s;
      }

      button {
        background: linear-gradient(90deg, #00f2fe, #4facfe);
        color: #0f172a;
        border: none;
        padding: 8px 12px;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        transition: opacity 0.2s;
        width: 100%;
        margin-top: 10px;
      }
      button:hover {
        opacity: 0.8;
      }

      .data-display {
        font-family: monospace;
        font-size: 0.75rem;
        color: #94a3b8;
        background: rgba(0, 0, 0, 0.3);
        padding: 8px;
        border-radius: 4px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div id="webgl-container"></div>

    <div id="ui-panel">
      <div>
        <h1
          class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-1"
        >
          Jules 3D Studio
        </h1>
        <p class="text-xs text-slate-400">Quantum Relativity Master</p>
      </div>

      <div class="panel-section">
        <div class="section-title">Environment Controls</div>

        <div class="slider-container">
          <div class="slider-label">
            <span>Solar Angle (Time)</span>
            <span id="time-display">12:00</span>
          </div>
          <input
            type="range"
            id="solar-slider"
            min="0"
            max="24"
            step="0.1"
            value="12"
          />
        </div>

        <div class="slider-container mt-4">
          <div class="slider-label">
            <span>Space-Time Curvature</span>
            <span id="curvature-display">1.0</span>
          </div>
          <input
            type="range"
            id="curvature-slider"
            min="0.1"
            max="5.0"
            step="0.1"
            value="1.0"
          />
        </div>
      </div>

      <div class="panel-section">
        <div class="section-title">Semantic Color Matrix</div>
        <div
          id="semantic-color-box"
          class="color-box"
          style="background-color: #00ffff"
        ></div>
        <div class="text-xs text-slate-300 flex justify-between">
          <span>Name:</span>
          <span id="semantic-name" class="font-bold text-cyan-400"
            >bright cyan glowing</span
          >
        </div>
        <div class="text-xs text-slate-300 flex justify-between mt-1">
          <span>HSL:</span>
          <span id="semantic-hsl" class="font-mono">180°, 100%, 50%</span>
        </div>

        <div class="mt-3">
          <label class="text-xs text-slate-400 mb-1 block">Custom Hex:</label>
          <input
            type="color"
            id="custom-color"
            value="#00ffff"
            class="w-full h-8 rounded cursor-pointer bg-transparent border-0 p-0"
          />
        </div>
      </div>

      <div class="panel-section">
        <div class="section-title">Audio & Displacement</div>
        <p class="text-xs text-slate-400 mb-2">
          Use microphone to displace topology.
        </p>
        <button id="audio-toggle">Enable Audio Input</button>

        <div class="mt-3">
          <div class="text-xs text-slate-400 mb-1">Frequency Spectrum</div>
          <div
            class="w-full h-12 bg-black/30 rounded relative overflow-hidden flex items-end px-1"
            id="spectrum-container"
          >
            <!-- Bars will be added here -->
          </div>
        </div>
      </div>

      <div class="panel-section">
        <div class="section-title">Telemetry Matrix</div>
        <div class="data-display" id="telemetry-display">Initializing...</div>
      </div>
    </div>

    <!-- Three.js and Dependencies -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const GlobalState = {
        gravity: 1.0,
        solarAngle: 0,
        topologyDistance: 0,
        audioFrequency: 0,
      };

      // ==========================================
      // Core Math & Architecture
      // ==========================================

      const SemanticColorDictionary = [
        { hex: "#ff0000", name: "vivid crimson red" },
        { hex: "#00ff00", name: "bright neon green" },
        { hex: "#0000ff", name: "deep electric blue" },
        { hex: "#ff00ff", name: "vivid magenta pink" },
        { hex: "#00ffff", name: "bright cyan glowing" },
        { hex: "#ffff00", name: "bright lemon yellow" },
        { hex: "#ffffff", name: "pure platinum white" },
        { hex: "#000000", name: "obsidian black" },
        { hex: "#808080", name: "ash slate gray" },
        { hex: "#ff8c00", name: "dark orange sunset" },
        { hex: "#4b0082", name: "deep indigo violet" },
        { hex: "#ffc0cb", name: "soft pastel pink" },
        { hex: "#ff007f", name: "cyberpunk neon pink" },
      ];

      function hexToRgb(hex) {
        return [
          parseInt(hex.slice(1, 3), 16),
          parseInt(hex.slice(3, 5), 16),
          parseInt(hex.slice(5, 7), 16),
        ];
      }

      function getSemanticColorName(hex) {
        let targetRgb = hexToRgb(hex);
        let closestName = "custom dyed";
        let minDistance = Infinity;
        for (let c of SemanticColorDictionary) {
          let dictRgb = hexToRgb(c.hex);
          let dist =
            Math.pow(targetRgb[0] - dictRgb[0], 2) +
            Math.pow(targetRgb[1] - dictRgb[1], 2) +
            Math.pow(targetRgb[2] - dictRgb[2], 2);
          if (dist < minDistance) {
            minDistance = dist;
            closestName = c.name;
          }
        }
        return closestName;
      }

      function hexToHsl(hex) {
        let [r, g, b] = hexToRgb(hex).map((v) => v / 255);
        let max = Math.max(r, g, b),
          min = Math.min(r, g, b);
        let h,
          s,
          l = (max + min) / 2;
        if (max === min) {
          h = s = 0;
        } else {
          let d = max - min;
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          switch (max) {
            case r:
              h = (g - b) / d + (g < b ? 6 : 0);
              break;
            case g:
              h = (b - r) / d + 2;
              break;
            case b:
              h = (r - g) / d + 4;
              break;
          }
          h /= 6;
        }
        return [h * 360, s, l];
      }

      // Telemetry and Topology Data
      const telemetryData = {
        dataset_name: "target1_3d_robotics_ops",
        spatial_coordinates: {
          x: 102.4,
          y: 45.8,
          z: 890.1,
          orientation_quaternion: [0, 0.7071, 0, 0.7071],
        },
        telemetry_matrix: [
          [1, 0, 0],
          [0, 1, 0],
          [0, 0, 1],
        ],
        hardware_node: "3D_ROBOTICS_ARM_ALPHA",
      };

      document.getElementById("telemetry-display").innerText = JSON.stringify(
        telemetryData,
        null,
        2,
      );

      // ==========================================
      // 3D WebGL Setup (Three.js)
      // ==========================================

      const container = document.getElementById("webgl-container");
      const scene = new THREE.Scene();
      // Use #0f172a (slate-900) as base fog/background
      scene.background = new THREE.Color("#0f172a");
      scene.fog = new THREE.FogExp2("#0f172a", 0.02);

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(0, 15, 30);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);
      window.renderer = renderer;

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // Lighting (Solar Angle integration)
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight(0xffddaa, 1.5);
      sunLight.castShadow = true;
      sunLight.shadow.camera.top = 50;
      sunLight.shadow.camera.bottom = -50;
      sunLight.shadow.camera.left = -50;
      sunLight.shadow.camera.right = 50;
      scene.add(sunLight);

      // Helper to visualize sun
      const sunGeometry = new THREE.SphereGeometry(2, 16, 16);
      const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffddaa });
      const sunMesh = new THREE.Mesh(sunGeometry, sunMaterial);
      scene.add(sunMesh);

      // Particle Field / Vector Topology
      const particlesGeometry = new THREE.BufferGeometry();
      const particleCount = 20000;
      const posArray = new Float32Array(particleCount * 3);
      const originalPosArray = new Float32Array(particleCount * 3);

      // Distribute particles in a topology-like structure
      for (let i = 0; i < particleCount * 3; i += 3) {
        // Base torus/ring structure
        const u = Math.random() * Math.PI * 2;
        const v = Math.random() * Math.PI * 2;
        const r1 = 15;
        const r2 = 5 + Math.random() * 5;

        const x = (r1 + r2 * Math.cos(v)) * Math.cos(u);
        const y = r2 * Math.sin(v);
        const z = (r1 + r2 * Math.cos(v)) * Math.sin(u);

        // Add some noise
        posArray[i] = x + (Math.random() - 0.5) * 2;
        posArray[i + 1] = y + (Math.random() - 0.5) * 2;
        posArray[i + 2] = z + (Math.random() - 0.5) * 2;

        originalPosArray[i] = posArray[i];
        originalPosArray[i + 1] = posArray[i + 1];
        originalPosArray[i + 2] = posArray[i + 2];
      }

      particlesGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(posArray, 3),
      );

      // Base cyan material (#00f2fe)
      const particlesMaterial = new THREE.PointsMaterial({
        size: 0.15,
        color: 0x00f2fe,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending,
      });

      const particleMesh = new THREE.Points(
        particlesGeometry,
        particlesMaterial,
      );
      scene.add(particleMesh);

      // Central "Core" object representing robotics node
      const coreGeometry = new THREE.IcosahedronGeometry(3, 1);
      const coreMaterial = new THREE.MeshStandardMaterial({
        color: 0x4facfe,
        wireframe: true,
        emissive: 0x4facfe,
        emissiveIntensity: 0.5,
      });
      const coreMesh = new THREE.Mesh(coreGeometry, coreMaterial);
      scene.add(coreMesh);

      // Grid helper
      const gridHelper = new THREE.GridHelper(100, 50, 0x00f2fe, 0x00f2fe);
      gridHelper.material.opacity = 0.1;
      gridHelper.material.transparent = true;
      scene.add(gridHelper);

      // ==========================================
      // Web Audio API Integration
      // ==========================================

      let audioContext;
      let analyser;
      let dataArray;
      let isAudioEnabled = false;

      // Setup spectrum UI
      const spectrumContainer = document.getElementById("spectrum-container");
      const numBars = 32;
      for (let i = 0; i < numBars; i++) {
        const bar = document.createElement("div");
        bar.className =
          "w-full bg-cyan-400 mx-[1px] opacity-70 transition-all duration-75";
        bar.style.height = "5%";
        spectrumContainer.appendChild(bar);
      }
      const spectrumBars = spectrumContainer.children;

      document
        .getElementById("audio-toggle")
        .addEventListener("click", async (e) => {
          if (isAudioEnabled) return;

          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              audio: true,
            });
            audioContext = new (
              window.AudioContext || window.webkitAudioContext
            )();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256; // 128 frequency bins

            const source = audioContext.createMediaStreamSource(stream);
            source.connect(analyser);

            dataArray = new Uint8Array(analyser.frequencyBinCount);
            isAudioEnabled = true;

            e.target.innerText = "Audio Active";
            e.target.style.background =
              "linear-gradient(90deg, #10b981, #34d399)";
          } catch (err) {
            console.error("Error accessing microphone:", err);
            alert("Microphone access required for audio displacement feature.");
          }
        });

      // ==========================================
      // UI Interactions & Animation Loop
      // ==========================================

      const timeDisplay = document.getElementById("time-display");
      const solarSlider = document.getElementById("solar-slider");

      const curvatureDisplay = document.getElementById("curvature-display");
      const curvatureSlider = document.getElementById("curvature-slider");

      const colorInput = document.getElementById("custom-color");
      const semanticBox = document.getElementById("semantic-color-box");
      const semanticName = document.getElementById("semantic-name");
      const semanticHsl = document.getElementById("semantic-hsl");

      function updateColor(hex) {
        colorInput.value = hex;
        semanticBox.style.backgroundColor = hex;
        semanticName.innerText = getSemanticColorName(hex);

        const hsl = hexToHsl(hex);
        semanticHsl.innerText = `${Math.round(hsl[0])}°, ${Math.round(hsl[1] * 100)}%, ${Math.round(hsl[2] * 100)}%`;

        particlesMaterial.color.setHex(parseInt(hex.replace("#", "0x")));
      }

      colorInput.addEventListener("input", (e) => {
        updateColor(e.target.value);
      });

      // Resize handler
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Main animation loop
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animation);
      }

      function animation() {
        const time = clock.getElapsedTime();
        const curvature = parseFloat(curvatureSlider.value);
        curvatureDisplay.innerText = curvature.toFixed(1);

        // Update Solar Angle
        const solarTime = parseFloat(solarSlider.value);
        const hours = Math.floor(solarTime);
        const mins = Math.floor((solarTime - hours) * 60);
        timeDisplay.innerText = `${hours.toString().padStart(2, "0")}:${mins.toString().padStart(2, "0")}`;

        // Map 0-24 hours to angle. 12 = noon (overhead)
        const angle = ((solarTime - 6) / 24) * Math.PI * 2;
        const radius = 50;
        sunLight.position.x = Math.cos(angle) * radius;
        sunLight.position.y = Math.sin(angle) * radius;
        sunLight.position.z = 0;
        sunMesh.position.copy(sunLight.position);

        // Change ambient/sky color based on time
        let skyColor = new THREE.Color("#0f172a");
        if (solarTime > 6 && solarTime < 18) {
          // Day
          let intensity = Math.sin(((solarTime - 6) / 12) * Math.PI);
          skyColor.lerp(new THREE.Color("#1e3a8a"), intensity * 0.5);
          ambientLight.intensity = 0.2 + intensity * 0.4;
        } else {
          // Night
          ambientLight.intensity = 0.1;
        }
        scene.background = skyColor;
        scene.fog.color = skyColor;

        // Core rotation
        coreMesh.rotation.x = time * 0.5 * curvature;
        coreMesh.rotation.y = time * 0.3 * curvature;

        // Audio processing
        let avgFreq = 0;
        let audioData = [];

        if (isAudioEnabled && analyser) {
          analyser.getByteFrequencyData(dataArray);

          // Update UI bars
          const step = Math.floor(dataArray.length / numBars);
          for (let i = 0; i < numBars; i++) {
            let sum = 0;
            for (let j = 0; j < step; j++) {
              sum += dataArray[i * step + j];
            }
            const avg = sum / step;
            avgFreq += avg;
            audioData.push(avg);
            const heightPercent = Math.max(5, (avg / 255) * 100);
            spectrumBars[i].style.height = `${heightPercent}%`;

            // Color shift based on amplitude
            if (avg > 150)
              spectrumBars[i].className =
                "w-full bg-blue-500 mx-[1px] opacity-90 transition-all duration-75";
            else
              spectrumBars[i].className =
                "w-full bg-cyan-400 mx-[1px] opacity-70 transition-all duration-75";
          }
          avgFreq /= numBars;
        }

        // Particle displacement
        const positions = particleMesh.geometry.attributes.position.array;

        for (let i = 0; i < particleCount * 3; i += 3) {
          const ox = originalPosArray[i];
          const oy = originalPosArray[i + 1];
          const oz = originalPosArray[i + 2];

          // Base movement (quantum fluctuation)
          let dx = Math.sin(time * 2 + oy) * 0.5 * curvature;
          let dy = Math.cos(time * 1.5 + ox) * 0.5 * curvature;
          let dz = Math.sin(time * 1.8 + oz) * 0.5 * curvature;

          // Audio displacement
          if (isAudioEnabled && avgFreq > 10) {
            // Map particle position to frequency bin
            const distToCenter = Math.sqrt(ox * ox + oy * oy + oz * oz);
            const binIdx = Math.floor((distToCenter / 20) * numBars) % numBars;
            const binVal = audioData[binIdx] || 0;

            const audioForce = (binVal / 255) * 3.0; // scale force

            // Push outward from center
            const dirX = ox / distToCenter;
            const dirY = oy / distToCenter;
            const dirZ = oz / distToCenter;

            dx += dirX * audioForce;
            dy += dirY * audioForce;
            dz += dirZ * audioForce;
          }

          positions[i] = ox + dx;
          positions[i + 1] = oy + dy;
          positions[i + 2] = oz + dz;
        }

        particleMesh.geometry.attributes.position.needsUpdate = true;
        particleMesh.rotation.y = time * 0.1 * curvature;

        controls.update();
        renderer.render(scene, camera);

        requestAnimationFrame(animation);
      }

      // Start animation
      animate();
    </script>
  </body>
</html>
