<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas ASCII 3D Icosahedron Renderer Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas ASCII 3D Icosahedron Renderer Studio","url":"https://salabs.quanxs.com/tools/html-canvas-ascii-3d-icosahedron.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}textarea{width:100%;background:#0f172a;color:#38bdf8;border:1px solid #334155;border-radius:8px;padding:1rem;font-family:monospace;font-size:14px;line-height:14px;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas ASCII 3D Icosahedron Renderer</h1></header><main class="container"><textarea id="ascii-box" rows="18" readonly></textarea></main><script>let angleX=0,angleY=0;let phi=(1+Math.sqrt(5))/2;let vertices=[[-1,phi,0],[1,phi,0],[-1,-phi,0],[1,-phi,0],[0,-1,phi],[0,1,phi],[0,-1,-phi],[0,1,-phi],[phi,0,-1],[phi,0,1],[-phi,0,-1],[-phi,0,1]];function renderFrame(){angleX+=0.03;angleY+=0.02;let grid=Array.from({length:16},()=>Array(40).fill(' '));for(let v of vertices){let x=v[0],y=v[1],z=v[2];let y1=y*Math.cos(angleX)-z*Math.sin(angleX);let z1=y*Math.sin(angleX)+z*Math.cos(angleX);let x2=x*Math.cos(angleY)+z1*Math.sin(angleY);let px=Math.floor(20+x2*6);let py=Math.floor(8+y1*3);if(py>=0&&py<16&&px>=0&&px<40)grid[py][px]='*';}document.getElementById('ascii-box').value=grid.map(r=>r.join('')).join('\n');requestAnimationFrame(renderFrame);}renderFrame();</script></body></html>
