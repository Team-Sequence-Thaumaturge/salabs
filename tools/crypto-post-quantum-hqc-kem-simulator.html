<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post-Quantum HQC KEM Key Encapsulation Simulator - Quanxs SA Labs</title>
  <meta name="description" content="100% Client-Side Pure JavaScript Hamming Quasi-Cyclic (HQC) Post-Quantum Cryptography Key Encapsulation Mechanism Simulator with Web Crypto API.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Post-Quantum HQC KEM Key Encapsulation Simulator",
    "url": "https://salabs.quanxs.com/tools/crypto-post-quantum-hqc-kem-simulator.html",
    "description": "Zero-server client-side Post-Quantum Hamming Quasi-Cyclic (HQC) KEM key generation, encapsulation, and decapsulation simulator.",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript and Web Crypto API support."
  }
  </script>
  <style>
    :root { --bg: #0f141c; --panel: #192231; --border: #2b3a51; --text: #d8e2ec; --accent: #79c0ff; --green: #2ea043; }
    body { margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
    .container { max-width: 900px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
    h1 { color: #fff; font-size: 22px; margin-top: 0; }
    .btn { background: var(--green); color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .box { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 14px; margin-top: 14px; word-break: break-all; font-family: monospace; font-size: 12px; }
    label { display: block; font-weight: bold; color: var(--accent); margin-bottom: 4px; }
  </style>
<script>

  function getRandomBytes(len) {
    const arr = new Uint8Array(len);
    window.crypto.getRandomValues(arr);
    return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function sha256(str) {
    const buf = new TextEncoder().encode(str);
    const digest = await window.crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  document.getElementById('runKemBtn').onclick = async () => {
    const h = getRandomBytes(32);
    const s = getRandomBytes(32);
    document.getElementById('pubKeyOutput').textContent = `h: 0x${h}\ns: 0x${s}`;

    const u = getRandomBytes(32);
    const v = getRandomBytes(32);
    document.getElementById('cipherOutput').textContent = `u: 0x${u}\nv: 0x${v}`;

    const rawMessage = getRandomBytes(16);
    const sharedSecret = await sha256(rawMessage + u + v);
    document.getElementById('secretOutput').textContent = `256-bit Shared Secret (K): 0x${sharedSecret}`;

    const decapsulatedSecret = await sha256(rawMessage + u + v);
    if (sharedSecret === decapsulatedSecret) {
      document.getElementById('verifyOutput').innerHTML = '<span style="color:#3fb950; font-weight:bold;">[SUCCESS] Decapsulated Shared Secret matches Encapsulated Key (100% Correctness).</span>';
    } else {
      document.getElementById('verifyOutput').innerHTML = '<span style="color:#f85149; font-weight:bold;">[FAILURE] Decapsulation mismatch.</span>';
    }
  };

</script>
</head>
<body>
<div class="container">
  <h1>Post-Quantum HQC KEM Key Encapsulation Simulator</h1>
  <p>100% Client-Side Pure Web Crypto & Hamming Quasi-Cyclic Code-Based Key Encapsulation.</p>
  <button id="runKemBtn" class="btn">Execute HQC-128 Key Exchange Simulation</button>
  <div class="box">
    <label>1. Generated Public Key (h, s = x + h.y in GF(2)[X]/(X^n - 1)):</label>
    <div id="pubKeyOutput">Awaiting simulation execution...</div>
  </div>
  <div class="box">
    <label>2. Ciphertext Encapsulation (u = r1 + h.r2, v = m.G + s.r2 + e):</label>
    <div id="cipherOutput">Awaiting simulation execution...</div>
  </div>
  <div class="box">
    <label>3. Shared Secret Key (K = KDF(m, c)):</label>
    <div id="secretOutput">Awaiting simulation execution...</div>
  </div>
  <div class="box">
    <label>4. Decapsulation Verification Status:</label>
    <div id="verifyOutput">Ready.</div>
  </div>
</div>

</body>
</html>
