<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>WebSocket & SSE Client Realtime Tester - SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"WebSocket SSE Tester","url":"https://salabs.quanxs.com/tools/websocket-sse-tester.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input[type="text"],textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:0.8rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-right:0.5rem;}.status{font-weight:bold;padding:0.5rem 1rem;border-radius:6px;display:inline-block;margin-bottom:1rem;}.connected{background:#10b981;color:#0f172a;}.disconnected{background:#ef4444;color:#f8fafc;}.log-box{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:1rem;height:250px;overflow-y:auto;font-family:monospace;font-size:0.9rem;white-space:pre-wrap;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">WebSocket & SSE Realtime Client Tester</h1></header><main class="container"><h3>1. Connection URL</h3><input type="text" id="ws-url" value="wss://echo.websocket.events" placeholder="wss://..."><div><button onclick="connectWS()">Connect WS</button><button onclick="disconnectWS()">Disconnect</button><span id="conn-status" class="status disconnected">Disconnected</span></div><h3 style="margin-top:1.5rem;">2. Send Payload</h3><textarea id="ws-message" rows="3" placeholder='{"event": "ping"}'></textarea><button onclick="sendMessage()">Send</button><button onclick="clearLog()">Clear</button><h3 style="margin-top:1.5rem;">3. Traffic Log</h3><div id="log-box" class="log-box"></div></main><script>let ws=null;function log(msg,type='info'){let box=document.getElementById('log-box');let time=new Date().toLocaleTimeString();let color=type==='sent'?'#38bdf8':type==='recv'?'#34d399':type==='err'?'#f87171':'#94a3b8';box.innerHTML+=`<div style="color:${color};">[${time}] ${msg}</div>`;box.scrollTop=box.scrollHeight;}function connectWS(){let url=document.getElementById('ws-url').value;if(!url)return;disconnectWS();try{ws=new WebSocket(url);ws.onopen=()=>{document.getElementById('conn-status').className='status connected';document.getElementById('conn-status').innerText='Connected';log('Connected to '+url);};ws.onmessage=(evt)=>log('RECV: '+evt.data,'recv');ws.onerror=()=>log('ERROR: Connection Error','err');ws.onclose=()=>{document.getElementById('conn-status').className='status disconnected';document.getElementById('conn-status').innerText='Disconnected';log('Disconnected');};}catch(e){log('Exception: '+e.message,'err');}}function disconnectWS(){if(ws){ws.close();ws=null;}}function sendMessage(){let msg=document.getElementById('ws-message').value;if(ws&&ws.readyState===WebSocket.OPEN){ws.send(msg);log('SENT: '+msg,'sent');}else{log('WebSocket not open','err');}}function clearLog(){document.getElementById('log-box').innerHTML='';}</script></body></html>
