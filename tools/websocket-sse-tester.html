<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>WebSocket & SSE Client Tester - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"WebSocket SSE Tester","url":"https://salabs.quanxs.com/tools/websocket-sse-tester.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-right:0.5rem;}.log{background:#0f172a;border:1px solid #334155;padding:1rem;border-radius:8px;height:200px;overflow-y:auto;font-family:monospace;white-space:pre-wrap;font-size:0.9rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">WebSocket & SSE Client Tester</h1></header><main class="container"><h3>URL</h3><input type="text" id="ws-url" value="wss://echo.websocket.events"><div><button onclick="connectWS()">Connect</button><button onclick="disconnectWS()" style="background:#ef4444;color:#fff;">Disconnect</button></div><h3 style="margin-top:1.5rem;">Message</h3><input type="text" id="msg-input"><button onclick="sendWS()">Send</button><h3 style="margin-top:1.5rem;">Log</h3><div id="event-log" class="log">Ready</div></main><script>let ws=null;function log(m){let el=document.getElementById('event-log');el.innerText+=`\n[${new Date().toLocaleTimeString()}] ${m}`;el.scrollTop=el.scrollHeight;}function connectWS(){let u=document.getElementById('ws-url').value;if(!u)return;try{ws=new WebSocket(u);log('Connecting...');ws.onopen=()=>log('Connected');ws.onmessage=(e)=>log('Recv: '+e.data);ws.onerror=()=>log('Error');ws.onclose=()=>log('Closed');}catch(e){log(e.message);}}function disconnectWS(){if(ws){ws.close();ws=null;}}function sendWS(){let msg=document.getElementById('msg-input').value;if(ws&&ws.readyState===WebSocket.OPEN){ws.send(msg);log('Sent: '+msg);}else{log('Not open');}}</script></body></html>
