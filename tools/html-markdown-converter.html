<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>HTML to Markdown Converter - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"HTML to Markdown Converter","url":"https://salabs.quanxs.com/tools/html-markdown-converter.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">HTML to Markdown Converter</h1></header><main class="container"><div class="grid"><div><h3>HTML Input</h3><textarea id="html-input" rows="12" oninput="convertHtmlToMd()"></textarea></div><div><h3>Markdown Output</h3><textarea id="md-output" rows="12" readonly></textarea></div></div></main><script>function convertHtmlToMd(){let html=document.getElementById('html-input').value;if(!html){document.getElementById('md-output').value='';return;}let md=html.replace(/<h1>(.*?)</h1>/gi,'# $1\n\n').replace(/<h2>(.*?)</h2>/gi,'## $1\n\n').replace(/<h3>(.*?)</h3>/gi,'### $1\n\n').replace(/<b>(.*?)</b>/gi,'**$1**').replace(/<i>(.*?)</i>/gi,'*$1*').replace(/<p>(.*?)</p>/gi,'$1\n\n').replace(/<a href="(.*?)">(.*?)</a>/gi,'[$2]($1)').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'');document.getElementById('md-output').value=md.trim();}convertHtmlToMd();</script></body></html>
