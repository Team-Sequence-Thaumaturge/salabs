<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto RSA-PSS Signature Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto RSA-PSS Signature Studio","url":"https://salabs.quanxs.com/tools/crypto-subtle-rsa-pss-signer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Web Crypto RSA-PSS Signature Studio</h1></header><main class="container"><button onclick="signRSAPSS()">Generate RSA-PSS 2048-bit Key & Sign</button><h3>Payload Message</h3><input type="text" id="msg-in" value="Important API Payload for RSA-PSS"><h3>Signature</h3><textarea id="sig-out" rows="4" readonly></textarea></main><script>async function signRSAPSS(){try{let msgStr=document.getElementById('msg-in').value;let keyPair=await window.crypto.subtle.generateKey({name:"RSA-PSS",modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:"SHA-256"},true,["sign","verify"]);let enc=new TextEncoder();let sigBuf=await window.crypto.subtle.sign({name:"RSA-PSS",saltLength:32},keyPair.privateKey,enc.encode(msgStr));let rawSig=String.fromCharCode.apply(null,new Uint8Array(sigBuf));let b64Sig=btoa(rawSig).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');document.getElementById('sig-out').value=b64Sig;}catch(e){alert('RSA-PSS Error: '+e.message);}}</script></body></html>
