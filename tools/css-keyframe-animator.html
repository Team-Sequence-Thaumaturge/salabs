<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>CSS Keyframe Animation Builder - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"CSS Keyframe Animation Builder","url":"https://salabs.quanxs.com/tools/css-keyframe-animator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,select{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:0.8rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.preview-box{width:100px;height:100px;background:#38bdf8;border-radius:8px;margin:2rem auto;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#0f172a;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">CSS Keyframe Animation Builder</h1></header><main class="container"><h3>Animation Preset</h3><select id="preset-sel" onchange="applyPreset()"><option value="pulse">Pulse Scaling</option><option value="spin">360 Spin</option><option value="bounce">Vertical Bounce</option></select><div id="anim-preview" class="preview-box">Box</div><h3>Generated CSS Rules</h3><textarea id="css-output" rows="6" readonly></textarea></main><style id="dynamic-style"></style><script>function applyPreset(){let p=document.getElementById('preset-sel').value;let css='';if(p==='pulse'){css=`@keyframes customAnim {\n  0% { transform: scale(1); }\n  50% { transform: scale(1.2); }\n  100% { transform: scale(1); }\n}\n.preview-box {\n  animation: customAnim 1.5s infinite ease-in-out;\n}`;}else if(p==='spin'){css=`@keyframes customAnim {\n  0% { transform: rotate(0deg); }\n  100% { transform: rotate(360deg); }\n}\n.preview-box {\n  animation: customAnim 2s infinite linear;\n}`;}else if(p==='bounce'){css=`@keyframes customAnim {\n  0%, 100% { transform: translateY(0); }\n  50% { transform: translateY(-30px); }\n}\n.preview-box {\n  animation: customAnim 1s infinite ease-in-out;\n}`;}document.getElementById('dynamic-style').innerText=css;document.getElementById('css-output').value=css;}applyPreset();</script></body></html>
