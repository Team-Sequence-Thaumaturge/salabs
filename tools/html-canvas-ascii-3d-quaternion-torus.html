<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas ASCII 3D Quaternion Torus Knot | Quanxs SA Labs</title>
  <meta name="description" content="Client-side interactive 3D Quaternion Torus Knot renderer with ASCII shader simulation and real-time matrix transformations.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Canvas ASCII 3D Quaternion Torus Knot",
    "url": "https://salabs.quanxs.com/tools/html-canvas-ascii-3d-quaternion-torus.html",
    "description": "Client-side interactive 3D Quaternion Torus Knot renderer with ASCII shader simulation and real-time matrix transformations.",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All"
  }
  </script>
  <style>
    body { font-family: monospace; background: #050811; color: #38bdf8; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .container { max-width: 860px; width: 100%; background: #0f172a; padding: 24px; border-radius: 12px; border: 1px solid #1e293b; text-align: center; }
    h1 { margin: 0 0 10px 0; font-size: 1.5rem; color: #38bdf8; font-family: sans-serif; }
    p { color: #94a3b8; font-size: 0.9rem; font-family: sans-serif; }
    pre { background: #000; padding: 15px; border-radius: 8px; font-size: 9px; line-height: 9px; letter-spacing: 2px; overflow: hidden; margin: 20px auto; display: inline-block; border: 1px solid #334155; }
    .controls { display: flex; gap: 15px; justify-content: center; margin-top: 10px; font-family: sans-serif; }
    label { color: #cbd5e1; font-size: 0.85rem; }
  </style>
<script>

    const pre = document.getElementById('asciiScreen');
    const speedSlider = document.getElementById('speedSlider');
    const densitySlider = document.getElementById('densitySlider');
    const chars = " .:-=+*#%@";
    let A = 0, B = 0, C = 0;

    function render() {
      const width = 70;
      const height = 35;
      let b = new Array(width * height).fill(' ');
      let z = new Array(width * height).fill(0);

      const p = 2, q = 3;
      const speed = parseFloat(speedSlider.value) * 0.02;
      A += speed;
      B += speed * 0.7;
      C += speed * 0.4;

      for (let u = 0; u < 6.28; u += 0.04) {
        for (let v = 0; v < 6.28; v += 0.1) {
          const r = 0.8 + 0.3 * Math.cos(q * u);
          const x0 = r * Math.cos(p * u) + 0.15 * Math.cos(v) * Math.cos(p * u);
          const y0 = r * Math.sin(p * u) + 0.15 * Math.cos(v) * Math.sin(p * u);
          const z0 = 0.4 * Math.sin(q * u) + 0.15 * Math.sin(v);

          // Quaternion / Euler Rotation
          const x1 = x0 * Math.cos(A) - y0 * Math.sin(A);
          const y1 = x0 * Math.sin(A) + y0 * Math.cos(A);
          const z1 = z0;

          const x2 = x1 * Math.cos(B) + z1 * Math.sin(B);
          const y2 = y1;
          const z2 = -x1 * Math.sin(B) + z1 * Math.cos(B);

          const ooz = 1 / (z2 + 3.2);
          const xp = Math.floor(width / 2 + 35 * ooz * x2 * 1.8);
          const yp = Math.floor(height / 2 - 18 * ooz * y2);

          const L = (Math.cos(v) * Math.cos(A) - Math.sin(v) * Math.sin(B) + Math.cos(u) * 0.5);
          const idx = xp + yp * width;
          if (yp >= 0 && yp < height && xp >= 0 && xp < width) {
            if (ooz > z[idx]) {
              z[idx] = ooz;
              const charIdx = Math.max(0, Math.min(chars.length - 1, Math.floor((L + 1.2) * 3)));
              b[idx] = chars[charIdx];
            }
          }
        }
      }

      let s = "";
      for (let k = 0; k < width * height; k++) {
        s += b[k];
        if (k % width === width - 1) s += "\n";
      }
      pre.textContent = s;
      requestAnimationFrame(render);
    }
    render();
  
</script>
</head>
<body>
  <div class="container">
    <h1>Canvas ASCII 3D Quaternion Torus Knot</h1>
    <p>Real-Time 3D Parametric Quaternion Torus Knot Ray-Casting in Pure JS ASCII Buffer.</p>
    <pre id="asciiScreen"></pre>
    <div class="controls">
      <label>Speed: <input type="range" id="speedSlider" min="1" max="5" value="2"></label>
      <label>Density: <input type="range" id="densitySlider" min="20" max="60" value="40"></label>
    </div>
  </div>
  
</body>
</html>
