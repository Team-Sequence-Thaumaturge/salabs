<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4D-to-3D Clifford Torus Stereographic ASCII Visualizer - Quanxs SA Labs</title>
  <meta name="description" content="Interactive 100% Client-Side 4D Clifford Torus stereographic projection rendered via ASCII art Canvas engine.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "4D-to-3D Clifford Torus Stereographic ASCII Visualizer",
    "url": "https://salabs.quanxs.com/tools/html-canvas-ascii-3d-clifford-torus.html",
    "description": "Interactive 100% Client-Side 4D Clifford Torus stereographic projection rendered via ASCII art Canvas engine.",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All"
  }
  </script>
  <style>
    :root { --bg: #0a0e14; --card: #131920; --border: #232b36; --text: #b3c0d1; --accent: #39bae6; }
    body { background: var(--bg); color: var(--text); font-family: monospace; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; text-align: center; }
    h1 { color: #59c2ff; font-size: 22px; margin-bottom: 8px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    pre#asciiScreen { background: #010409; color: #39bae6; font-size: 10px; line-height: 10px; padding: 15px; border-radius: 6px; border: 1px solid var(--border); overflow-x: auto; text-align: left; display: inline-block; }
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 15px; }
    .control-group { display: flex; flex-direction: column; gap: 4px; text-align: left; }
    label { font-size: 12px; color: #707e94; }
    input[type="range"] { accent-color: var(--accent); }
  </style>
<script>

    const screen = document.getElementById('asciiScreen');
    const WIDTH = 70, HEIGHT = 35;
    const ASCII_CHARS = ' .:-=+*#%@';
    let angleXW = 0, angleYZ = 0;

    function render() {
      const spdXW = parseFloat(document.getElementById('speedXW').value);
      const spdYZ = parseFloat(document.getElementById('speedYZ').value);
      const N = parseInt(document.getElementById('density').value);
      const d4 = parseFloat(document.getElementById('focalDist').value);

      angleXW += spdXW;
      angleYZ += spdYZ;

      const zBuffer = new Array(WIDTH * HEIGHT).fill(-1e9);
      const frameBuffer = new Array(WIDTH * HEIGHT).fill(' ');

      const r = 1.0;
      for (let i = 0; i < N; i++) {
        const u = (i / N) * Math.PI * 2;
        for (let j = 0; j < N; j++) {
          const v = (j / N) * Math.PI * 2;

          let x = r * Math.cos(u) / Math.SQRT2;
          let y = r * Math.sin(u) / Math.SQRT2;
          let z = r * Math.cos(v) / Math.SQRT2;
          let w = r * Math.sin(v) / Math.SQRT2;

          // Rotate in X-W plane
          let x1 = x * Math.cos(angleXW) - w * Math.sin(angleXW);
          let w1 = x * Math.sin(angleXW) + w * Math.cos(angleXW);

          // Rotate in Y-Z plane
          let y1 = y * Math.cos(angleYZ) - z * Math.sin(angleYZ);
          let z1 = y * Math.sin(angleYZ) + z * Math.cos(angleYZ);

          // Stereographic projection 4D -> 3D
          let denom = d4 - w1;
          if (denom <= 0.1) continue;
          let px = x1 / denom;
          let py = y1 / denom;
          let pz = z1 / denom;

          // 3D -> 2D viewport
          let dist3 = 3.0;
          let scX = Math.floor(WIDTH / 2 + (px * dist3) * 16);
          let scY = Math.floor(HEIGHT / 2 + (py * dist3) * 9);

          if (scX >= 0 && scX < WIDTH && scY >= 0 && scY < HEIGHT) {
            let idx = scY * WIDTH + scX;
            if (pz > zBuffer[idx]) {
              zBuffer[idx] = pz;
              let charIdx = Math.floor(((pz + 1.5) / 3.0) * (ASCII_CHARS.length - 1));
              charIdx = Math.max(0, Math.min(ASCII_CHARS.length - 1, charIdx));
              frameBuffer[idx] = ASCII_CHARS[charIdx];
            }
          }
        }
      }

      let output = '';
      for (let row = 0; row < HEIGHT; row++) {
        output += frameBuffer.slice(row * WIDTH, (row + 1) * WIDTH).join('') + '\n';
      }
      screen.textContent = output;
      requestAnimationFrame(render);
    }

    document.getElementById('speedXW').oninput = e => document.getElementById('valXW').textContent = e.target.value;
    document.getElementById('speedYZ').oninput = e => document.getElementById('valYZ').textContent = e.target.value;
    document.getElementById('density').oninput = e => document.getElementById('valDensity').textContent = e.target.value;
    document.getElementById('focalDist').oninput = e => document.getElementById('valFocal').textContent = e.target.value;

    render();
  
</script>
</head>
<body>
  <div class="container">
    <h1>🌀 4D Clifford Torus Stereographic ASCII Engine</h1>
    <p>Real-Time 4-Manifold Hyper-Rotational Ray & Point Projection</p>
    <div class="card">
      <pre id="asciiScreen"></pre>
      <div class="controls">
        <div class="control-group">
          <label>4D XW Rotation Speed: <span id="valXW">0.02</span></label>
          <input type="range" id="speedXW" min="0" max="0.08" step="0.005" value="0.02">
        </div>
        <div class="control-group">
          <label>4D YZ Rotation Speed: <span id="valYZ">0.03</span></label>
          <input type="range" id="speedYZ" min="0" max="0.08" step="0.005" value="0.03">
        </div>
        <div class="control-group">
          <label>Sampling Density: <span id="valDensity">30</span></label>
          <input type="range" id="density" min="15" max="50" step="1" value="30">
        </div>
        <div class="control-group">
          <label>Focal Distance (4D Dist): <span id="valFocal">2.5</span></label>
          <input type="range" id="focalDist" min="1.5" max="4.0" step="0.1" value="2.5">
        </div>
      </div>
    </div>
  </div>
  
</body>
</html>
