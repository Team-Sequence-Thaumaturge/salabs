<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto HKDF-SHA384 Key Derivation Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto HKDF-SHA384 Key Derivation Studio","url":"https://salabs.quanxs.com/tools/crypto-hkdf-sha384-derivation-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">HKDF-SHA384 Key Derivation Studio</h1></header><main class="container"><input type="text" id="ikm-in" value="initial_master_secret_384"><input type="text" id="salt-in" value="salt_string_123"><input type="text" id="info-in" value="hkdf-sha384-expansion-info"><button onclick="deriveHKDF()">Derive Key via HKDF-SHA384</button><textarea id="derived-hex" rows="3" readonly></textarea></main><script>async function deriveHKDF(){let ikm=document.getElementById('ikm-in').value,salt=document.getElementById('salt-in').value,info=document.getElementById('info-in').value;if(!ikm)return;try{let enc=new TextEncoder();let keyMat=await window.crypto.subtle.importKey("raw",enc.encode(ikm),"HKDF",false,["deriveKey"]);let derivedKey=await window.crypto.subtle.deriveKey({name:"HKDF",hash:"SHA-384",salt:enc.encode(salt),info:enc.encode(info)},keyMat,{name:"AES-GCM",length:256},true,["encrypt"]);let raw=await window.crypto.subtle.exportKey("raw",derivedKey);let hex=Array.from(new Uint8Array(raw)).map(b=>b.toString(16).padStart(2,'0')).join('');document.getElementById('derived-hex').value=hex;}catch(e){alert('HKDF Error: '+e.message);}}</script></body></html>
