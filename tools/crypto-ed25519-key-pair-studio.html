<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ed25519 & RSA-PSS Web Crypto Key Pair & Signature Studio | SA Labs</title>
  <meta name="description" content="100% Client-side Web Crypto API Ed25519 & RSA-PSS cryptographic key pair generator, signing, and signature verification studio.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Ed25519 & RSA-PSS Web Crypto Studio",
    "url": "https://salabs.quanxs.com/tools/crypto-ed25519-key-pair-studio.html",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript and Web Crypto API"
  }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    .container { max-width: 960px; margin: 0 auto; background: #1e293b; padding: 32px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 12px; margin-top: 0; }
    .panel { background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; }
    select, button, textarea, input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #f8fafc; font-size: 14px; box-sizing: border-box; }
    textarea { font-family: monospace; height: 100px; resize: vertical; }
    button { background: #0284c7; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    button:hover { background: #0369a1; }
    .status { font-family: monospace; font-size: 14px; padding: 12px; background: #020617; border-radius: 6px; margin-top: 10px; border: 1px solid #1e293b; word-break: break-all; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }
  </style>
<script>

    let currentKeyPair = null;
    let currentAlgo = 'Ed25519';
    let currentSignature = null;

    const algoSelect = document.getElementById('algoSelect');
    const genKeyBtn = document.getElementById('genKeyBtn');
    const pubKeyBox = document.getElementById('pubKeyBox');
    const privKeyBox = document.getElementById('privKeyBox');
    const msgInput = document.getElementById('msgInput');
    const signBtn = document.getElementById('signBtn');
    const sigOutput = document.getElementById('sigOutput');
    const verifyBtn = document.getElementById('verifyBtn');
    const verifyResult = document.getElementById('verifyResult');

    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
      return window.btoa(binary);
    }

    function getParams(algoName) {
      if (algoName === 'Ed25519') return { name: 'Ed25519' };
      if (algoName === 'RSA-PSS') return { name: 'RSA-PSS', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' };
      if (algoName === 'ECDSA') return { name: 'ECDSA', namedCurve: 'P-256' };
    }

    function getSignParams(algoName) {
      if (algoName === 'Ed25519') return { name: 'Ed25519' };
      if (algoName === 'RSA-PSS') return { name: 'RSA-PSS', saltLength: 32 };
      if (algoName === 'ECDSA') return { name: 'ECDSA', hash: { name: 'SHA-256' } };
    }

    genKeyBtn.addEventListener('click', async () => {
      currentAlgo = algoSelect.value;
      try {
        const params = getParams(currentAlgo);
        currentKeyPair = await window.crypto.subtle.generateKey(params, true, ['sign', 'verify']);
        const pubExport = await window.crypto.subtle.exportKey('spki', currentKeyPair.publicKey);
        const privExport = await window.crypto.subtle.exportKey('pkcs8', currentKeyPair.privateKey);
        
        pubKeyBox.value = arrayBufferToBase64(pubExport);
        privKeyBox.value = arrayBufferToBase64(privExport);
        sigOutput.innerText = 'Signature Hex/Base64 will appear here...';
        verifyResult.innerText = 'Key pair generated successfully using ' + currentAlgo + '.';
        verifyResult.style.color = '#38bdf8';
      } catch (err) {
        verifyResult.innerText = 'Error generating key pair: ' + err.message;
        verifyResult.style.color = '#f43f5e';
      }
    });

    signBtn.addEventListener('click', async () => {
      if (!currentKeyPair) { alert('Please generate a key pair first!'); return; }
      try {
        const enc = new TextEncoder();
        const data = enc.encode(msgInput.value);
        const signParams = getSignParams(currentAlgo);
        const sigBuffer = await window.crypto.subtle.sign(signParams, currentKeyPair.privateKey, data);
        currentSignature = sigBuffer;
        sigOutput.innerText = arrayBufferToBase64(sigBuffer);
        verifyResult.innerText = 'Message signed successfully.';
        verifyResult.style.color = '#38bdf8';
      } catch (err) {
        sigOutput.innerText = 'Error signing: ' + err.message;
      }
    });

    verifyBtn.addEventListener('click', async () => {
      if (!currentKeyPair || !currentSignature) { alert('Please generate keys and sign a message first!'); return; }
      try {
        const enc = new TextEncoder();
        const data = enc.encode(msgInput.value);
        const signParams = getSignParams(currentAlgo);
        const isValid = await window.crypto.subtle.verify(signParams, currentKeyPair.publicKey, currentSignature, data);
        if (isValid) {
          verifyResult.innerText = 'VALID SIGNATURE: Authentic signature verified with Public Key.';
          verifyResult.style.color = '#34d399';
        } else {
          verifyResult.innerText = 'INVALID SIGNATURE: Signature verification failed or payload tampered.';
          verifyResult.style.color = '#f43f5e';
        }
      } catch (err) {
        verifyResult.innerText = 'Error verifying signature: ' + err.message;
        verifyResult.style.color = '#f43f5e';
      }
    });
  
</script>
</head>
<body>
  <div class="container">
    <h1>Ed25519 & RSA-PSS Web Crypto Key Pair & Signature Studio</h1>
    <p style="color: #94a3b8;">100% Client-side Web Crypto API cryptographic key generation, message signing, and verification. Zero server communication.</p>
    
    <div class="panel">
      <label for="algoSelect">Cryptographic Algorithm:</label>
      <select id="algoSelect">
        <option value="Ed25519">Ed25519 (EdDSA Curve25519)</option>
        <option value="RSA-PSS">RSA-PSS (2048-bit, SHA-256)</option>
        <option value="ECDSA">ECDSA (P-256 Curve, SHA-256)</option>
      </select>
      <button id="genKeyBtn">Generate Cryptographic Key Pair</button>
    </div>

    <div class="grid">
      <div class="panel">
        <label>Public Key (SPKI / Base64):</label>
        <textarea id="pubKeyBox" readonly placeholder="Click 'Generate Cryptographic Key Pair' to create keys..."></textarea>
      </div>
      <div class="panel">
        <label>Private Key (PKCS8 / Base64):</label>
        <textarea id="privKeyBox" readonly placeholder="Click 'Generate Cryptographic Key Pair' to create keys..."></textarea>
      </div>
    </div>

    <div class="panel">
      <label for="msgInput">Data Message to Sign & Verify:</label>
      <textarea id="msgInput" placeholder="Type or paste payload message here...">Hello, SA Labs Web Crypto Studio!</textarea>
      <button id="signBtn">Sign Message with Private Key</button>
      <div class="status" id="sigOutput">Signature Hex/Base64 will appear here...</div>
    </div>

    <div class="panel">
      <button id="verifyBtn" style="background: #059669;">Verify Signature with Public Key</button>
      <div class="status" id="verifyResult">Verification status pending...</div>
    </div>
  </div>

  
</body>
</html>
