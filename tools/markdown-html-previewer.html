    const defaultSample = `# 🚀 Markdown to HTML Converter

Welcome to **SA Labs** realtime Markdown previewer!

## Features
- **Realtime Preview**: As you type, rendered HTML updates instantly.
- **Full GFM Support**: Headings, lists, code blocks, tables, blockquotes, and strikethroughs.

    let activeTab = 'preview';

    function init() {
      document.getElementById('md-input').value = defaultSample;
    function updatePreview() {
      const src = document.getElementById('md-input').value;
      const html = marked.parse(src);
      document.getElementById('rendered-preview').innerHTML = html;
      document.getElementById('raw-html-output').textContent = html;
    }
      updatePreview();
    }


    function switchTab(tab) {
      activeTab = tab;
      const renderEl = document.getElementById('rendered-preview');
      const codeEl = document.getElementById('raw-html-output');
      const btnPrev = document.getElementById('btn-tab-preview');
      const btnCode = document.getElementById('btn-tab-code');

      if (tab === 'preview') {
        renderEl.style.display = 'block';
        codeEl.style.display = 'none';
        btnPrev.className = 'btn btn-primary';
        btnCode.className = 'btn';
      } else {
        renderEl.style.display = 'none';
        codeEl.style.display = 'block';
        btnPrev.className = 'btn';
        btnCode.className = 'btn btn-primary';
      }
    }

    function loadSampleMarkdown() {
      document.getElementById('md-input').value = defaultSample;
      updatePreview();
    }

    function clearMarkdown() {
      document.getElementById('md-input').value = '';
      updatePreview();
    }

    function copyHTMLOutput() {
      const src = document.getElementById('md-input').value;
      const html = marked.parse(src);
      navigator.clipboard.writeText(html).then(() => {
        alert("📋 Formatted HTML code copied to clipboard!");
      }).catch(err => {
        console.error("Copy failed", err);
      });
    }

    window.onload = init;
