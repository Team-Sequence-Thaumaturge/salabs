<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto X25519 Key Exchange Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto X25519 Key Exchange Studio","url":"https://salabs.quanxs.com/tools/crypto-x25519-key-exchange.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Web Crypto Key Exchange Studio</h1></header><main class="container"><button onclick="generateECDH()">Generate Keypairs & Shared Secret</button><h3>Party A Public Key</h3><textarea id="pub-a" rows="3" readonly></textarea><h3>Party B Public Key</h3><textarea id="pub-b" rows="3" readonly></textarea><h3>Derived Shared Secret</h3><input type="text" id="shared-secret" readonly></main><script>async function generateECDH(){try{let keyA=await window.crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveKey","deriveBits"]);let keyB=await window.crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveKey","deriveBits"]);let jwkA=await window.crypto.subtle.exportKey("jwk",keyA.publicKey);let jwkB=await window.crypto.subtle.exportKey("jwk",keyB.publicKey);document.getElementById('pub-a').value=JSON.stringify(jwkA);document.getElementById('pub-b').value=JSON.stringify(jwkB);let secretBits=await window.crypto.subtle.deriveBits({name:"ECDH",public:keyB.publicKey},keyA.privateKey,256);let secretHex=Array.from(new Uint8Array(secretBits)).map(b=>b.toString(16).padStart(2,'0')).join('');document.getElementById('shared-secret').value=secretHex;}catch(e){alert('ECDH Error: '+e.message);}}</script></body></html>
