<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cryptographic Hash & SHA Checksum Generator - SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Hash SHA Generator","url":"https://salabs.quanxs.com/tools/hash-hmac-generator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">SHA-256 & SHA-512 Checksum Generator</h1></header><main class="container"><h3>Input String</h3><textarea id="hash-input" rows="4" placeholder="Enter text to hash..." oninput="computeHashes()"></textarea><h3>SHA-256</h3><input type="text" id="sha256-output" readonly><h3>SHA-512</h3><input type="text" id="sha512-output" readonly><h3>SHA-1</h3><input type="text" id="sha1-output" readonly></main><script>async function computeHashes(){let text=document.getElementById('hash-input').value;if(!text){document.getElementById('sha256-output').value='';document.getElementById('sha512-output').value='';document.getElementById('sha1-output').value='';return;}let buf=new TextEncoder().encode(text);let h256=await crypto.subtle.digest('SHA-256',buf);document.getElementById('sha256-output').value=buf2hex(h256);let h512=await crypto.subtle.digest('SHA-512',buf);document.getElementById('sha512-output').value=buf2hex(h512);let h1=await crypto.subtle.digest('SHA-1',buf);document.getElementById('sha1-output').value=buf2hex(h1);}function buf2hex(b){return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}</script></body></html>
