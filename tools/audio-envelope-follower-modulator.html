    <style>
        :root {
            --bg-color: #0b0f19;

        select, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #1c2742; color: var(--text-main); font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }

<script>

        let audioCtx = null, isPlaying = false;
        let sourceOsc = null, sourceGain = null, carrierOsc = null, carrierGain = null, analyser = null, envFollowerVal = 0;
        let animFrameId = null;

        const toggleBtn = document.getElementById('toggleAudioBtn');
        const envMeter = document.getElementById('envMeter');
        const scopeCanvas = document.getElementById('scopeCanvas');
        const ctx = scopeCanvas.getContext('2d');
        const carrierFreq = document.getElementById('carrierFreq');
        const freqVal = document.getElementById('freqVal');
        const modDepth = document.getElementById('modDepth');
        const depthVal = document.getElementById('depthVal');
        const attackTime = document.getElementById('attackTime');
        const attackVal = document.getElementById('attackVal');
        const releaseTime = document.getElementById('releaseTime');
        const releaseVal = document.getElementById('releaseVal');
        const carrierType = document.getElementById('carrierType');

        carrierFreq.oninput = () => { freqVal.textContent = carrierFreq.value + ' Hz'; if(carrierOsc) carrierOsc.frequency.setTargetAtTime(parseFloat(carrierFreq.value), audioCtx.currentTime, 0.05); };
        modDepth.oninput = () => { depthVal.textContent = modDepth.value + '%'; };
        attackTime.oninput = () => { attackVal.textContent = attackTime.value + ' ms'; };
        releaseTime.oninput = () => { releaseVal.textContent = releaseTime.value + ' ms'; };
        carrierType.onchange = () => { if(carrierOsc) carrierOsc.type = carrierType.value; };

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 512;

            sourceOsc = audioCtx.createOscillator();
            sourceOsc.type = 'sawtooth';
            sourceOsc.frequency.setValueAtTime(2.5, audioCtx.currentTime);

            sourceGain = audioCtx.createGain();
            sourceGain.gain.setValueAtTime(0.8, audioCtx.currentTime);

            carrierOsc = audioCtx.createOscillator();
            carrierOsc.type = carrierType.value;
            carrierOsc.frequency.setValueAtTime(parseFloat(carrierFreq.value), audioCtx.currentTime);

            carrierGain = audioCtx.createGain();
            carrierGain.gain.setValueAtTime(0.0, audioCtx.currentTime);

            sourceOsc.connect(sourceGain);
            sourceGain.connect(analyser);

            carrierOsc.connect(carrierGain);
            carrierGain.connect(audioCtx.destination);

            sourceOsc.start();
            carrierOsc.start();
            isPlaying = true;
            toggleBtn.textContent = '■ Stop Audio Engine';
            toggleBtn.classList.add('btn-active');
            renderLoop();
        }

        function stopAudio() {
            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }
            isPlaying = false;
            cancelAnimationFrame(animFrameId);
            toggleBtn.textContent = '▶ Start Audio Engine';
            toggleBtn.classList.remove('btn-active');
            envMeter.style.width = '0%';
        }

        toggleBtn.onclick = () => { if (isPlaying) stopAudio(); else initAudio(); };

        const history = new Array(200).fill(0);
        function renderLoop() {
            if (!isPlaying || !analyser) return;
            const buffer = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(buffer);

            let peak = 0;
            for (let i = 0; i < buffer.length; i++) {
                const abs = Math.abs(buffer[i]);
                if (abs > peak) peak = abs;
            }

            const att = parseFloat(attackTime.value) / 1000;
            const rel = parseFloat(releaseTime.value) / 1000;
            const coeff = peak > envFollowerVal ? (1 / (att * 60 + 1)) : (1 / (rel * 60 + 1));
            envFollowerVal += (peak - envFollowerVal) * coeff;

            envMeter.style.width = Math.min(100, Math.round(envFollowerVal * 100)) + '%';

            if (carrierGain && audioCtx) {
                const depth = parseFloat(modDepth.value) / 100;
                const targetGain = Math.min(1.0, envFollowerVal * depth);
                carrierGain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.02);
            }

            history.push(envFollowerVal);
            history.shift();

            scopeCanvas.width = scopeCanvas.clientWidth * window.devicePixelRatio || 300;
            scopeCanvas.height = scopeCanvas.clientHeight * window.devicePixelRatio || 150;
            ctx.clearRect(0, 0, scopeCanvas.width, scopeCanvas.height);

            ctx.beginPath();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            const step = scopeCanvas.width / history.length;
            for (let i = 0; i < history.length; i++) {
                const x = i * step;
                const y = scopeCanvas.height - (history[i] * (scopeCanvas.height - 20) + 10);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            animFrameId = requestAnimationFrame(renderLoop);
        }
    
</script>
