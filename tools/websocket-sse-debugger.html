<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>WebSocket & SSE Realtime Debugger - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"WebSocket SSE Debugger","url":"https://salabs.quanxs.com/tools/websocket-sse-debugger.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1200px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input,textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:0.8rem;box-sizing:border-box;font-family:monospace;margin-bottom:1rem;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-right:0.5rem;}.log-box{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:1rem;height:250px;overflow-y:auto;font-family:monospace;font-size:0.85rem;}.tx{color:#38bdf8;}.rx{color:#34d399;}.err{color:#f87171;}.sys{color:#f59e0b;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">WebSocket & SSE Realtime Debugger</h1></header><main class="container"><h3>Endpoint</h3><input type="text" id="ws-url" value="wss://echo.websocket.events"><div><button onclick="connectWS()">Connect WS</button><button onclick="connectSSE()">Connect SSE</button><button onclick="disconnect()" style="background:#ef4444;color:#fff;">Disconnect</button></div><h3>Payload</h3><textarea id="ws-payload" rows="2" placeholder="Hello WebSocket"></textarea><div><button onclick="sendWS()">Send Payload</button></div><h3>Event Console</h3><div id="log-console" class="log-box">Console ready...</div></main><script>let ws=null,sse=null;function log(t,m){let c=document.getElementById('log-console'),l=document.createElement('div');l.className=t;l.innerText=`[${new Date().toLocaleTimeString()}] [${t.toUpperCase()}] ${m}`;c.appendChild(l);c.scrollTop=c.scrollHeight;}function disconnect(){if(ws){ws.close();ws=null;log('sys','WS Closed');}if(sse){sse.close();sse=null;log('sys','SSE Closed');}}function connectWS(){disconnect();let u=document.getElementById('ws-url').value;ws=new WebSocket(u);ws.onopen=()=>log('sys','WS Connected');ws.onmessage=(e)=>log('rx',e.data);ws.onerror=()=>log('err','WS Error');ws.onclose=()=>log('sys','WS Closed');}function connectSSE(){disconnect();let u=document.getElementById('ws-url').value;sse=new EventSource(u);sse.onopen=()=>log('sys','SSE Opened');sse.onmessage=(e)=>log('rx',e.data);sse.onerror=()=>log('err','SSE Error');}function sendWS(){if(ws&&ws.readyState===WebSocket.OPEN){let text=document.getElementById('ws-payload').value;ws.send(text);log('tx',text);}else{log('err','WS Not Connected');}}</script></body></html>
