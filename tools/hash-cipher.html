<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cryptographic Hash & Digest Generator - SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Crypto Hash Generator","url":"https://salabs.quanxs.com/tools/hash-cipher.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.label{color:#38bdf8;font-weight:bold;margin-bottom:0.3rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Cryptographic Hash Generator</h1></header><main class="container"><h3>Input Text</h3><textarea id="hash-input" rows="4" oninput="computeHashes()"></textarea><div class="label">SHA-256</div><input type="text" id="hash-sha256" readonly><div class="label">SHA-512</div><input type="text" id="hash-sha512" readonly><div class="label">SHA-1</div><input type="text" id="hash-sha1" readonly></main><script>async function computeHashes(){let t=document.getElementById('hash-input').value;if(!t){document.getElementById('hash-sha256').value='';document.getElementById('hash-sha512').value='';document.getElementById('hash-sha1').value='';return;}let u=new TextEncoder().encode(t);let b256=await crypto.subtle.digest('SHA-256',u);document.getElementById('hash-sha256').value=Array.from(new Uint8Array(b256)).map(b=>b.toString(16).padStart(2,'0')).join('');let b512=await crypto.subtle.digest('SHA-512',u);document.getElementById('hash-sha512').value=Array.from(new Uint8Array(b512)).map(b=>b.toString(16).padStart(2,'0')).join('');let b1=await crypto.subtle.digest('SHA-1',u);document.getElementById('hash-sha1').value=Array.from(new Uint8Array(b1)).map(b=>b.toString(16).padStart(2,'0')).join('');}</script></body></html>
