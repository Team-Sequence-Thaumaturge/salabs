<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
h1 { color: #38bdf8; font-size: 24px; margin-bottom: 12px; text-align: center; }
p { color: #94a3b8; text-align: center; margin-bottom: 24px; }
.btn { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 600; margin-right: 10px; margin-bottom: 10px; transition: background 0.2s; }
.btn:hover { background: #2563eb; }
.btn-green { background: #10b981; }
.btn-green:hover { background: #059669; }
textarea { width: 100%; box-sizing: border-box; background: #0f172a; color: #38bdf8; border: 1px solid #334155; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 13px; margin: 8px 0 16px 0; resize: vertical; }
.output { margin-top: 15px; background: #0b0f19; padding: 15px; border-radius: 6px; font-family: monospace; white-space: pre-wrap; word-break: break-all; color: #4ade80; border: 1px solid #334155; font-size: 13px; }
</style>
<script>

let keyPair = null;
async function generateKeys() {
  const out = document.getElementById('resultOutput');
  out.textContent = 'Generating hardware-grade ECDSA P-384 key pair...';
  try {
    keyPair = await crypto.subtle.generateKey(
      { name: 'ECDSA', namedCurve: 'P-384' },
      true,
      ['sign', 'verify']
    );
    const jwkPub = await crypto.subtle.exportKey('jwk', keyPair.publicKey);
    document.getElementById('pubKeyBox').value = JSON.stringify(jwkPub, null, 2);
    out.textContent = 'SUCCESS: ECDSA P-384 Key Pair Generated and Exported (JWK format).';
  } catch (err) {
    out.textContent = 'ERROR: ' + err.message;
  }
}
async function signPayload() {
  const out = document.getElementById('resultOutput');
  if (!keyPair) {
    out.textContent = 'ERROR: Please generate key pair first!';
    return;
  }
  try {
    const payload = document.getElementById('payloadInput').value;
    const encoder = new TextEncoder();
    const data = encoder.encode(payload);
    const signature = await crypto.subtle.sign(
      { name: 'ECDSA', hash: { name: 'SHA-384' } },
      keyPair.privateKey,
      data
    );
    const sigHex = Array.from(new Uint8Array(signature)).map(b => b.toString(16).padStart(2, '0')).join('');
    document.getElementById('sigBox').value = sigHex;
    out.textContent = 'SUCCESS: Payload signed with ECDSA P-384 (SHA-384 digest). Signature length: ' + (signature.byteLength * 8) + ' bits.';
  } catch (err) {
    out.textContent = 'ERROR: ' + err.message;
  }
}
async function verifySignature() {
  const out = document.getElementById('resultOutput');
  if (!keyPair) {
    out.textContent = 'ERROR: Please generate key pair first!';
    return;
  }
  try {
    const payload = document.getElementById('payloadInput').value;
    const sigHex = document.getElementById('sigBox').value.trim();
    if (!sigHex) {
      out.textContent = 'ERROR: No signature to verify!';
      return;
    }
    const sigBytes = new Uint8Array(sigHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
    const encoder = new TextEncoder();
    const data = encoder.encode(payload);
    const isValid = await crypto.subtle.verify(
      { name: 'ECDSA', hash: { name: 'SHA-384' } },
      keyPair.publicKey,
      sigBytes,
      data
    );
    out.textContent = isValid ? 'VALID: Signature successfully verified against Public Key (100% Cryptographic Match).' : 'INVALID: Signature verification failed (Payload or Key mismatch)!';
  } catch (err) {
    out.textContent = 'ERROR: ' + err.message;
  }
}

</script>
</head>
<body>
<div class="container">
<h1>🔐 Web Crypto ECDSA P-384 KeyPair & Signature Studio</h1>
<p>100% Client-Side Pure Web Crypto API Hardware-Grade Elliptic Curve Digital Signature</p>
<button class="btn" onclick="generateKeys()">1. Generate P-384 KeyPair</button>
<button class="btn btn-green" onclick="signPayload()">2. Sign Payload (SHA-384)</button>
<button class="btn" onclick="verifySignature()">3. Verify Signature</button>

<label style="font-weight:600; color:#cbd5e1;">Payload Data to Sign:</label>
<textarea id="payloadInput" rows="3">Quanxs SA Labs Autonomous Verified Payload at 2026-08-14</textarea>

<label style="font-weight:600; color:#cbd5e1;">Public Key (JWK JSON):</label>
<textarea id="pubKeyBox" rows="4" placeholder="Public Key will appear here after generation..."></textarea>

<label style="font-weight:600; color:#cbd5e1;">Cryptographic Signature (Hex Encoded):</label>
<textarea id="sigBox" rows="3" placeholder="Signature will appear here after signing..."></textarea>

<div id="resultOutput" class="output">Ready for ECDSA P-384 cryptographic operations.</div>
</div>

</body>
</html>
