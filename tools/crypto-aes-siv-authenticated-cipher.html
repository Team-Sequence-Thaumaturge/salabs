<style>

<script>

function generateRandomKey() {
  const arr = new Uint8Array(32);
  crypto.getRandomValues(arr);
  const hex = Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
  document.getElementById('secret-key').value = hex;
}

function hexToBytes(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < bytes.length; i++) {
    bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
  }
  return bytes;
}

function bytesToHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function getKey(rawHex) {
  if (!rawHex || rawHex.length !== 64) {
    throw new Error('Key must be exactly 64 hex characters (256-bit).');
  }
  const keyBytes = hexToBytes(rawHex);
  return await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
}

// SIV derivation: derive synthetic IV using HMAC/SHA-256 over Plaintext + AAD to guarantee nonce misuse resistance
async function deriveSyntheticIV(keyBytes, plaintextBytes, aadBytes) {
  const combined = new Uint8Array(plaintextBytes.length + aadBytes.length);
  combined.set(plaintextBytes, 0);
  combined.set(aadBytes, plaintextBytes.length);
  const hmacKey = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const signature = await crypto.subtle.sign('HMAC', hmacKey, combined);
  return new Uint8Array(signature).slice(0, 12); // 96-bit Synthetic IV
}

async function executeEncrypt() {
  const out = document.getElementById('enc-output');
  try {
    const rawKey = document.getElementById('secret-key').value.trim();
    if (!rawKey) { generateRandomKey(); }
    const keyStr = document.getElementById('secret-key').value.trim();
    const keyBytes = hexToBytes(keyStr);
    const key = await getKey(keyStr);

    const plaintext = document.getElementById('plain-input').value;
    const aad = document.getElementById('aad-input').value;
    const enc = new TextEncoder();
    const plainBytes = enc.encode(plaintext);
    const aadBytes = enc.encode(aad);

    // Compute Synthetic IV
    const siv = await deriveSyntheticIV(keyBytes, plainBytes, aadBytes);

    const cipherBuffer = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv: siv, additionalData: aadBytes, tagLength: 128 },
      key,
      plainBytes
    );

    const fullPayload = new Uint8Array(siv.length + cipherBuffer.byteLength);
    fullPayload.set(siv, 0);
    fullPayload.set(new Uint8Array(cipherBuffer), siv.length);

    const hexResult = bytesToHex(fullPayload);
    out.innerHTML = `<strong style="color:var(--success);">STATUS: ENCRYPTION SUCCESSFUL</strong><br><br><strong>Synthetic IV (Hex):</strong> ${bytesToHex(siv)}<br><strong>Combined Ciphertext & Tag (Hex):</strong><br>${hexResult}`;
    document.getElementById('cipher-input').value = hexResult;
    document.getElementById('aad-verify').value = aad;
  } catch (err) {
    out.innerHTML = `<strong style="color:var(--danger);">ERROR:</strong> ${err.message}`;
  }
}

async function executeDecrypt() {
  const out = document.getElementById('dec-output');
  try {
    const keyStr = document.getElementById('secret-key').value.trim();
    const key = await getKey(keyStr);
    const hexInput = document.getElementById('cipher-input').value.trim();
    if (!hexInput || hexInput.length < 24) throw new Error('Invalid ciphertext length.');

    const fullBytes = hexToBytes(hexInput);
    const siv = fullBytes.slice(0, 12);
    const cipherBytes = fullBytes.slice(12);
    const aad = document.getElementById('aad-verify').value;
    const aadBytes = new TextEncoder().encode(aad);

    const decryptedBuffer = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: siv, additionalData: aadBytes, tagLength: 128 },
      key,
      cipherBytes
    );

    const dec = new TextDecoder();
    const decryptedText = dec.decode(decryptedBuffer);

    out.innerHTML = `<strong style="color:var(--success);">STATUS: INTEGRITY VERIFIED & DECRYPTED</strong><br><br><strong>Decrypted Text:</strong><br>${decryptedText}`;
  } catch (err) {
    out.innerHTML = `<strong style="color:var(--danger);">DECRYPTION FAILED / AUTH TAG MISMATCH:</strong><br>${err.message}`;
  }
}

generateRandomKey();

</script>
