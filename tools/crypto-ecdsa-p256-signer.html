ig=await window.crypto.subtle.sign({name:"ECDSA",hash:{name:"SHA-256"}},ecKeyPair.privateKey,enc.encode(mStr));let hex=Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');document.getElementById('ec-sig').value=hex;}</script></body></html>
