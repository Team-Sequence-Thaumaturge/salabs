<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Subharmonic Synthesizer Studio - Quanxs SA Labs</title><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Subharmonic Synthesizer Studio","url":"https://salabs.quanxs.com/tools/audio-subharmonic-synthesizer-studio.html","applicationCategory":"MultimediaApplication","operatingSystem":"All","author":{"@type":"Organization","name":"Quanxs SA Labs"}}</script><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:20px;background:#0d1117;color:#c9d1d9}.container{max-width:800px;margin:0 auto;background:#161b22;padding:24px;border-radius:12px;border:1px solid #30363d}h1{color:#58a6ff}button{background:#238636;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:600;margin-right:10px}button:hover{background:#2ea043}.control{margin:15px 0}label{display:block;margin-bottom:5px;font-size:14px;color:#8b949e}canvas{width:100%;height:120px;background:#0d1117;border:1px solid #30363d;border-radius:6px;margin-top:15px}</style><script>
let audioCtx,osc1,osc2,analyser,dataArray,isPlaying=false,baseFreq=110,ratio=2;function initAudio(){audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=256;dataArray=new Uint8Array(analyser.frequencyBinCount);osc1=audioCtx.createOscillator();osc2=audioCtx.createOscillator();osc1.type='sine';osc2.type='triangle';osc1.frequency.setValueAtTime(baseFreq,audioCtx.currentTime);osc2.frequency.setValueAtTime(baseFreq/ratio,audioCtx.currentTime);const gain1=audioCtx.createGain();const gain2=audioCtx.createGain();gain1.gain.value=0.5;gain2.gain.value=0.5;osc1.connect(gain1);osc2.connect(gain2);gain1.connect(analyser);gain2.connect(analyser);analyser.connect(audioCtx.destination);osc1.start();osc2.start();draw();}function updateFreq(val){baseFreq=parseFloat(val);document.getElementById('freqVal').innerText=val;if(audioCtx&&osc1&&osc2){osc1.frequency.setValueAtTime(baseFreq,audioCtx.currentTime);osc2.frequency.setValueAtTime(baseFreq/ratio,audioCtx.currentTime);}}function updateRatio(val){ratio=parseFloat(val);document.getElementById('ratioVal').innerText='1/'+val;if(audioCtx&&osc2){osc2.frequency.setValueAtTime(baseFreq/ratio,audioCtx.currentTime);}}function togglePlay(){if(!isPlaying){if(!audioCtx)initAudio();else audioCtx.resume();isPlaying=true;document.getElementById('playBtn').innerText='Stop Subharmonic Synth';document.getElementById('playBtn').style.background='#da3633';}else{if(audioCtx)audioCtx.suspend();isPlaying=false;document.getElementById('playBtn').innerText='Start Subharmonic Synth';document.getElementById('playBtn').style.background='#238636';}}function draw(){requestAnimationFrame(draw);if(!analyser)return;analyser.getByteTimeDomainData(dataArray);const canvas=document.getElementById('scope');const ctx=canvas.getContext('2d');ctx.fillStyle='#0d1117';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.lineWidth=2;ctx.strokeStyle='#58a6ff';ctx.beginPath();const sliceWidth=canvas.width*1.0/dataArray.length;let x=0;for(let i=0;i<dataArray.length;i++){const v=dataArray[i]/128.0;const y=v*canvas.height/2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);x+=sliceWidth;}ctx.lineTo(canvas.width,canvas.height/2);ctx.stroke();}
</script>
</head><body><div class="container"><h1>Subharmonic Synthesizer Studio</h1><p>Client-side Subharmonic Frequency Generator with Web Audio Oscillator & Biquad Lowpass Filter.</p><div class="control"><label>Fundamental Frequency (Hz): <span id="freqVal">110</span> Hz</label><input type="range" id="freq" min="40" max="440" value="110" oninput="updateFreq(this.value)" style="width:100%"></div><div class="control"><label>Subharmonic Ratio: <span id="ratioVal">1/2 (Octave Down)</span></label><select id="ratio" onchange="updateRatio(this.value)" style="background:#0d1117;color:#c9d1d9;padding:6px;border:1px solid #30363d;border-radius:4px"><option value="2">1/2 (f0 / 2)</option><option value="3">1/3 (f0 / 3)</option><option value="4">1/4 (f0 / 4)</option><option value="5">1/5 (f0 / 5)</option></select></div><button id="playBtn" onclick="togglePlay()">Start Subharmonic Synth</button><canvas id="scope"></canvas></div></body></html>
