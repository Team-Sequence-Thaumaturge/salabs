<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio ADSR Envelope Synth Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio ADSR Envelope Synth Studio","url":"https://salabs.quanxs.com/tools/audio-envelope-adsr-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:0.5rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio ADSR Envelope Synth Studio</h1></header><main class="container"><button onclick="triggerADSR()">Trigger Synth Note</button><p>Attack: <span id="v-att">0.1</span>s</p><input type="range" id="att" min="0.01" max="1.0" step="0.01" value="0.1" oninput="updateADSR()"><p>Decay: <span id="v-dec">0.2</span>s</p><input type="range" id="dec" min="0.05" max="1.0" step="0.01" value="0.2" oninput="updateADSR()"></main><script>let audioCtx;function updateADSR(){document.getElementById('v-att').innerText=document.getElementById('att').value;document.getElementById('v-dec').innerText=document.getElementById('dec').value;}function triggerADSR(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();let att=parseFloat(document.getElementById('att').value);let dec=parseFloat(document.getElementById('dec').value);let osc=audioCtx.createOscillator();let gain=audioCtx.createGain();let now=audioCtx.currentTime;osc.type='triangle';osc.frequency.value=440;gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(1,now+att);gain.gain.exponentialRampToValueAtTime(0.001,now+att+dec);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+att+dec+0.1);}</script></body></html>
