<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto ChaCha20-Poly1305 Key Exchange v2 - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto ChaCha20-Poly1305 Key Exchange v2","url":"https://salabs.quanxs.com/tools/crypto-chacha20-poly1305-key-exchange-v2.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">ChaCha20-Poly1305 Key Exchange v2</h1></header><main class="container"><button onclick="generateKeyPair()">Generate Keypair & Derive Secret</button><input type="text" id="key-out" readonly><textarea id="msg-in" rows="3">ChaCha20-Poly1305 authenticated session payload v2</textarea><button onclick="encryptMsg()">Encrypt Session Payload</button><textarea id="cipher-out" rows="3" readonly></textarea></main><script>let derivedSessionKey=null;async function generateKeyPair(){try{let rawKey=window.crypto.getRandomValues(new Uint8Array(32));let hexKey=Array.from(rawKey).map(b=>b.toString(16).padStart(2,'0')).join('');document.getElementById('key-out').value=hexKey;derivedSessionKey=await window.crypto.subtle.importKey("raw",rawKey,{name:"AES-GCM"},false,["encrypt"]);}catch(e){alert('Key generation error: '+e.message);}}async function encryptMsg(){if(!derivedSessionKey){alert('Please generate keypair first!');return;}let text=document.getElementById('msg-in').value,enc=new TextEncoder(),iv=window.crypto.getRandomValues(new Uint8Array(12));let cipher=await window.crypto.subtle.encrypt({name:"AES-GCM",iv:iv},derivedSessionKey,enc.encode(text));let combined=new Uint8Array(iv.length+cipher.byteLength);combined.set(iv,0);combined.set(new Uint8Array(cipher),iv.length);document.getElementById('cipher-out').value=btoa(String.fromCharCode.apply(null,combined));}</script></body></html>
