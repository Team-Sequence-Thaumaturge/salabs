</script>
</head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas Image to ASCII Art Converter</h1></header><main class="container"><input type="file" id="img-in" accept="image/*" onchange="convertASCII()"><textarea id="ascii-out" rows="12" readonly></textarea></main></body></html>
