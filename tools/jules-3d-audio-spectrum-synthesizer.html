<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Audio Spectrum Synthesizer - Jules Studio - v3.0</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: {
                900: "#0f172a",
              },
              cyan: {
                400: "#00f2fe",
              },
              blue: {
                500: "#4facfe",
              },
            },
          },
        },
      };
    </script>

    <!-- Schema.org WebApplication JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "3D Audio Spectrum Synthesizer",
        "softwareVersion": "3.0",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "description": "100% client-side WebGL 3D Audio Frequency Spectrum visualizer with Web Audio API tone generator and 3D particle terrain displacement.",
        "publisher": {
          "@type": "Organization",
          "name": "Jules Studio"
        }
      }
    </script>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Google AdSense -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011"
      crossorigin="anonymous"
    ></script>

    <style>
      body {
        background-color: #0f172a;
        color: #cbd5e1;
        margin: 0;
        overflow: hidden;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
      }

      #visualizer-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }

      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 1.5rem;
        box-sizing: border-box;
      }

      .panel {
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(0, 242, 254, 0.3);
        backdrop-filter: blur(12px);
        pointer-events: auto;
        border-radius: 0.75rem;
        padding: 1.5rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        max-width: 400px;
      }

      .btn {
        background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        color: #0f172a;
        font-weight: bold;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
      }

      .btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      .btn:active {
        transform: translateY(1px);
      }

      .btn-outline {
        background: transparent;
        color: #00f2fe;
        border: 1px solid #00f2fe;
      }
      .btn-outline:hover {
        background: rgba(0, 242, 254, 0.1);
      }

      .slider {
        width: 100%;
        accent-color: #00f2fe;
      }

      select,
      input[type="range"] {
        background: rgba(255, 255, 255, 0.1);
        color: #e2e8f0;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 0.25rem;
        padding: 0.25rem;
      }

      select option {
        background: #0f172a;
      }

      #fft-canvas {
        position: absolute;
        bottom: 1.5rem;
        right: 1.5rem;
        width: 400px;
        height: 150px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(0, 242, 254, 0.2);
        border-radius: 0.5rem;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- WebGL 3D Canvas -->
    <canvas
      id="webgl-canvas"
      style="position: absolute; top: 0; left: 0; z-index: 0"
    ></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer">
      <div class="panel">
        <h1 class="text-xl font-bold mb-1 text-cyan-400">
          3D Audio Synthesizer</h1>
        <p class="text-xs text-blue-400 mb-4 font-mono">v3.0 - Jules Studio</p>


        <div class="space-y-4">
          <div>
            <label class="block text-sm mb-1 text-blue-300">Audio Source</label>
            <div class="flex gap-2">
              <button id="btn-synth" class="btn flex-1">Synthesizer</button>
              <button id="btn-mic" class="btn btn-outline flex-1">
                Microphone
              </button>
            </div>
          </div>

          <div id="synth-controls" class="space-y-3">
            <div>
              <label class="block text-sm mb-1 text-blue-300">Waveform</label>
              <select id="osc-type" class="w-full">
                <option value="sine">Sine</option>
                <option value="square">Square</option>
                <option value="sawtooth">Sawtooth</option>
                <option value="triangle">Triangle</option>
              </select>
            </div>

            <div>
              <label class="block text-sm mb-1 text-blue-300"
                >Frequency (<span id="freq-val">440</span> Hz)</label
              >
              <input
                type="range"
                id="osc-freq"
                class="slider"
                min="20"
                max="2000"
                value="440"
              />
            </div>
          </div>

          <div>
            <label class="block text-sm mb-1 text-blue-300"
              >Master Volume (<span id="vol-val">50</span>%)</label
            >
            <input
              type="range"
              id="master-vol"
              class="slider"
              min="0"
              max="100"
              value="50"
            />
          </div>

          <div class="pt-2">
            <button
              id="btn-power"
              class="btn w-full !bg-slate-700 !text-white border border-slate-500"
            >
              Power: OFF
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 2D FFT Canvas -->
    <canvas id="fft-canvas"></canvas>

    <script>
      // --- Web Audio API Setup ---
      let audioCtx;
      let masterGain;
      let analyser;
      let oscillator;
      let micStream;
      let micSource;

      let isPlaying = false;
      let currentSource = "synth"; // 'synth' or 'mic'

      const UI = {
        btnSynth: document.getElementById("btn-synth"),
        btnMic: document.getElementById("btn-mic"),
        btnPower: document.getElementById("btn-power"),
        oscType: document.getElementById("osc-type"),
        oscFreq: document.getElementById("osc-freq"),
        freqVal: document.getElementById("freq-val"),
        masterVol: document.getElementById("master-vol"),
        volVal: document.getElementById("vol-val"),
        synthControls: document.getElementById("synth-controls"),
      };

      function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        masterGain = audioCtx.createGain();
        masterGain.gain.value = UI.masterVol.value / 100;
        masterGain.connect(audioCtx.destination);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.8;

        // Connect analyser to master output if synth is used, mic handles it differently
      }

      async function togglePower() {
        initAudio();

        if (audioCtx.state === "suspended") {
          await audioCtx.resume();
        }

        if (isPlaying) {
          stopAudio();
          UI.btnPower.textContent = "Power: OFF";
          UI.btnPower.className =
            "btn w-full !bg-slate-700 !text-white border border-slate-500";
        } else {
          startAudio();
          UI.btnPower.textContent = "Power: ON";
          UI.btnPower.className = "btn w-full !bg-cyan-500 !text-slate-900";
        }
        isPlaying = !isPlaying;
      }

      async function startAudio() {
        if (currentSource === "synth") {
          oscillator = audioCtx.createOscillator();
          oscillator.type = UI.oscType.value;
          oscillator.frequency.value = UI.oscFreq.value;

          oscillator.connect(analyser);
          analyser.connect(masterGain);

          oscillator.start();
        } else if (currentSource === "mic") {
          try {
            micStream = await navigator.mediaDevices.getUserMedia({
              audio: true,
              video: false,
            });
            micSource = audioCtx.createMediaStreamSource(micStream);

            // Route mic to analyser but NOT to masterGain (to prevent feedback)
            micSource.connect(analyser);
            // Ensure analyser is NOT connected to destination or masterGain here
            try {
              analyser.disconnect();
            } catch (e) {}
          } catch (err) {
            console.error("Microphone access denied:", err);
            alert(
              "Microphone access denied. Please allow microphone permissions.",
            );
            stopAudio();
            isPlaying = false;
            UI.btnPower.textContent = "Power: OFF";
            UI.btnPower.className =
              "btn w-full !bg-slate-700 !text-white border border-slate-500";
          }
        }
      }

      function stopAudio() {
        if (oscillator) {
          oscillator.stop();
          oscillator.disconnect();
          oscillator = null;
        }
        if (micStream) {
          micStream.getTracks().forEach((track) => track.stop());
          micStream = null;
        }
        if (micSource) {
          micSource.disconnect();
          micSource = null;
        }
        try {
          analyser.disconnect();
        } catch (e) {}
      }

      function switchSource(source) {
        if (currentSource === source) return;
        currentSource = source;

        if (source === "synth") {
          UI.btnSynth.className = "btn flex-1";
          UI.btnMic.className = "btn btn-outline flex-1";
          UI.synthControls.style.opacity = "1";
          UI.synthControls.style.pointerEvents = "auto";
        } else {
          UI.btnMic.className = "btn flex-1";
          UI.btnSynth.className = "btn btn-outline flex-1";
          UI.synthControls.style.opacity = "0.5";
          UI.synthControls.style.pointerEvents = "none";
        }

        if (isPlaying) {
          stopAudio();
          startAudio();
        }
      }

      // Event Listeners
      UI.btnPower.addEventListener("click", togglePower);
      UI.btnSynth.addEventListener("click", () => switchSource("synth"));
      UI.btnMic.addEventListener("click", () => switchSource("mic"));

      UI.oscType.addEventListener("change", (e) => {
        if (oscillator) oscillator.type = e.target.value;
      });

      UI.oscFreq.addEventListener("input", (e) => {
        UI.freqVal.textContent = e.target.value;
        if (oscillator)
          oscillator.frequency.setValueAtTime(
            e.target.value,
            audioCtx.currentTime,
          );
      });

      UI.masterVol.addEventListener("input", (e) => {
        UI.volVal.textContent = e.target.value;
        if (masterGain)
          masterGain.gain.setValueAtTime(
            e.target.value / 100,
            audioCtx.currentTime,
          );
      });

      // --- Three.js 3D Terrain Setup ---
      const webglCanvas = document.getElementById("webgl-canvas");
      const renderer = new THREE.WebGLRenderer({ canvas: webglCanvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setClearColor(0x0f172a, 1.0);

      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100.0);
      camera.position.set(0, 1.5, 4.5);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Grid parameters
      const GRID_W = 64; // Frequency bins
      const GRID_H = 64; // Time history
      const NUM_PARTICLES = GRID_W * GRID_H;

      let history = new Array(GRID_H).fill(new Uint8Array(GRID_W));

      const geometry = new THREE.PlaneGeometry(0.04, 0.04);

      // Custom Shader Material for InstancedMesh
      const material = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0.0 },
          uColorLow: { value: new THREE.Color("#4facfe") },
          uColorHigh: { value: new THREE.Color("#00f2fe") }
        },
        vertexShader: `
          varying float vHeight;
          void main() {
            // position is the local vertex of the PlaneGeometry
            // instanceMatrix is automatically injected by THREE for InstancedMesh
            vec4 worldPos = instanceMatrix * vec4(position, 1.0);
            vHeight = worldPos.y; // Capture world Y for coloring
            gl_Position = projectionMatrix * viewMatrix * modelMatrix * worldPos;
          }
        `,
        fragmentShader: `
          uniform vec3 uColorLow;
          uniform vec3 uColorHigh;
          varying float vHeight;
          void main() {
            vec3 color = mix(uColorLow, uColorHigh, clamp(vHeight * 2.0, 0.0, 1.0));
            // Soft circle shape for plane geometry
            vec2 uv = gl_PointCoord - vec2(0.5); // Not applicable for plane, use standard center dist if needed
            // But since we use Plane geometry, we can just use simple rendering or texture.
            // For a soft look on plane:
            // float dist = length(gl_PointCoord - 0.5); // only for gl.POINTS
            // Let's just output the color.
            gl_FragColor = vec4(color, 0.8);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      const instancedMesh = new THREE.InstancedMesh(geometry, material, NUM_PARTICLES);
      scene.add(instancedMesh);

      const dummy = new THREE.Object3D();

      function updateTerrainData(freqData) {
        // Shift history
        history.pop();
        history.unshift(new Uint8Array(freqData));

        let idx = 0;
        for (let z = 0; z < GRID_H; z++) {
          for (let x = 0; x < GRID_W; x++) {
            const normX = (x / (GRID_W - 1)) * 2.0 - 1.0; // -1 to 1
            const normZ = (z / (GRID_H - 1)) * 2.0 - 1.0; // -1 to 1

            const val = history[z][x] / 255.0;
            const height = val * 0.5;

            dummy.position.set(normX * 4.0, height - 0.2, normZ * 4.0);

            // Orient plane to face camera roughly or flat up
            dummy.rotation.x = -Math.PI / 2;
            dummy.scale.set(1.0 + height * 2.0, 1.0 + height * 2.0, 1.0);

            dummy.updateMatrix();
            instancedMesh.setMatrixAt(idx++, dummy.matrix);
          }
        }
        instancedMesh.instanceMatrix.needsUpdate = true;
      }

      // --- 2D FFT Canvas Setup ---
      const fftCanvas = document.getElementById("fft-canvas");
      const fftCtx = fftCanvas.getContext("2d");
      fftCanvas.width = 400;
      fftCanvas.height = 150;

      function drawFFT(dataArray) {
        fftCtx.clearRect(0, 0, fftCanvas.width, fftCanvas.height);

        const barWidth = (fftCanvas.width / dataArray.length) * 2.5;
        let barHeight;
        let x = 0;

        fftCtx.strokeStyle = "rgba(0, 242, 254, 0.1)";
        fftCtx.lineWidth = 1;
        for (let i = 0; i < 4; i++) {
          fftCtx.beginPath();
          fftCtx.moveTo(0, (i * fftCanvas.height) / 4);
          fftCtx.lineTo(fftCanvas.width, (i * fftCanvas.height) / 4);
          fftCtx.stroke();
        }

        for (let i = 0; i < dataArray.length; i++) {
          barHeight = (dataArray[i] / 255) * fftCanvas.height;

          let grad = fftCtx.createLinearGradient(0, fftCanvas.height, 0, fftCanvas.height - barHeight);
          grad.addColorStop(0, "#4facfe");
          grad.addColorStop(1, "#00f2fe");

          fftCtx.fillStyle = grad;
          fftCtx.fillRect(x, fftCanvas.height - barHeight, barWidth, barHeight);

          fftCtx.fillStyle = "#fff";
          fftCtx.fillRect(x, fftCanvas.height - barHeight - 2, barWidth, 2);

          x += barWidth + 1;
        }
      }

      // --- Render Loop ---
      const freqData = new Uint8Array(GRID_W);
      let clock = new THREE.Clock();

      function render() {
        requestAnimationFrame(render);

        const time = clock.getElapsedTime();
        material.uniforms.uTime.value = time;

        if (analyser && isPlaying) {
          const fullData = new Uint8Array(analyser.frequencyBinCount);
          analyser.getByteFrequencyData(fullData);

          const step = Math.floor(fullData.length / GRID_W);
          for (let i = 0; i < GRID_W; i++) {
            freqData[i] = fullData[i * step];
          }

          updateTerrainData(freqData);
          drawFFT(fullData.slice(0, 100));
        } else {
          freqData.fill(0);
          updateTerrainData(freqData);
          drawFFT(new Uint8Array(100));
        }

        // Slowly rotate scene
        scene.rotation.y = time * 0.1;

        controls.update();
        renderer.render(scene, camera);
      }

      render();
    </script>
  </body>
</html>
