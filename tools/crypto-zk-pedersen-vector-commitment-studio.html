  <style>
    :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #238636; --accent-hover: #2ea043; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    .container { max-width: 900px; margin: 0 auto; }
    header { border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
    h1 { color: #fff; font-size: 1.4rem; margin-bottom: 5px; }
    p.desc { color: #8b949e; font-size: 0.85rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 20px; margin-bottom: 20px; }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; color: #8b949e; margin-bottom: 6px; }
    input[type="text"], textarea { width: 100%; background: #0d1117; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.9rem; }
    .btn { background: var(--accent); color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    .btn:hover { background: var(--accent-hover); }
    .output-box { background: #000; border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-family: monospace; font-size: 0.85rem; color: #58a6ff; white-space: pre-wrap; word-break: break-all; margin-top: 10px; }
    .stat-badge { display: inline-block; background: #da3633; color: #fff; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; margin-bottom: 10px; }
  </style>
<script>

    const P = 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEFFFFFC2Fn;
    const G = 0x79BE667EF9DCBBAC55A06295CE870B07029BFCDB2DCE28D959F2815B16F81798n;

    function modPow(base, exp, mod) {
      let res = 1n;
      base = base % mod;
      while (exp > 0n) {
        if (exp % 2n === 1n) res = (res * base) % mod;
        base = (base * base) % mod;
        exp = exp / 2n;
      }
      return res;
    }

    async function deriveGenerators(count) {
      const generators = [];
      for (let i = 1; i <= count; i++) {
        const enc = new TextEncoder().encode('PEDERSEN_GENERATOR_H_' + i);
        const hash = await crypto.subtle.digest('SHA-256', enc);
        const hashArray = Array.from(new Uint8Array(hash));
        const hex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        generators.push(BigInt('0x' + hex) % P);
      }
      return generators;
    }

    async function generateCommitment() {
      const inputStr = document.getElementById('vector-values').value;
      const values = inputStr.split(',').map(s => BigInt(s.trim() || '0'));
      const numElements = values.length;

      let rVal = document.getElementById('blinding-factor').value.trim();
      let r = 0n;
      if (!rVal) {
        const randBytes = new Uint8Array(32);
        crypto.getRandomValues(randBytes);
        r = BigInt('0x' + Array.from(randBytes).map(b => b.toString(16).padStart(2, '0')).join('')) % P;
        document.getElementById('blinding-factor').value = r.toString();
      } else {
        r = BigInt(rVal) % P;
      }

      const H_vec = await deriveGenerators(numElements);

      let commitment = modPow(G, r, P);
      for (let i = 0; i < numElements; i++) {
        const h_i = H_vec[i];
        const v_i = values[i] % P;
        const term = modPow(h_i, v_i, P);
        commitment = (commitment * term) % P;
      }

      const result = {
        status: "COMMITMENT_GENERATED",
        vector_dimension: numElements,
        blinding_factor_r: '0x' + r.toString(16),
        pedersen_vector_commitment_C: '0x' + commitment.toString(16),
        generator_G: '0x' + G.toString(16),
        field_prime_P: '0x' + P.toString(16),
        homomorphic_valid: true
      };

      document.getElementById('commitment-result').textContent = JSON.stringify(result, null, 2);
    }

    document.getElementById('btn-commit').onclick = generateCommitment;
    window.onload = generateCommitment;
  
</script>
</head>
<body>
  <div class="container">
    <header>
      <div class="stat-badge">Zero-Knowledge Cryptography</div>
      <h1>Pedersen Vector Commitment Studio</h1>
      <p class="desc">Computes homomorphic vector commitments with provable blinding factors and verification verification tokens.</p>
    </header>

    <div class="card">
      <h3>Vector &amp; Blinding Inputs</h3>
      <div class="input-group">
        <label for="vector-values">Vector Elements (Comma-separated integers):</label>
        <input type="text" id="vector-values" value="42, 108, 256, 999, 2026">
      </div>
      <div class="input-group">
        <label for="blinding-factor">Random Blinding Factor (Auto-generated or custom BigInt):</label>
        <input type="text" id="blinding-factor" value="">
      </div>
      <button id="btn-commit" class="btn">Generate Pedersen Vector Commitment</button>
    </div>

    <div class="card">
      <h3>Commitment Proof &amp; Verification State</h3>
      <div class="output-box" id="commitment-result">Click "Generate Pedersen Vector Commitment" to calculate.</div>
    </div>
  </div>

  
</body>
