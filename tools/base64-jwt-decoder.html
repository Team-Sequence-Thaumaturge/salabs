    "@context": "https://schema.org",

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --border: #23314d;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --error: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: rgba(21, 29, 48, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.25rem; font-weight: 700; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header nav a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
    header nav a:hover { color: var(--accent); }
    .main-container { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; padding: 1.5rem 2rem; max-width: 1800px; margin: 0 auto; width: 100%; }
    @media (max-width: 1024px) { .main-container { grid-template-columns: 1fr; } }
    .pane { display: flex; flex-direction: column; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .pane-header { background: #111827; padding: 0.75rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem; font-weight: 600; color: var(--text-muted); flex-wrap: wrap; gap: 0.5rem; }
    .toolbar { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .btn { background: #1e293b; color: var(--text); border: 1px solid var(--border); padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .btn:hover { background: var(--border); color: var(--accent); }
    .btn-primary { background: var(--accent); color: #0b0f19; border: none; font-weight: 600; }
    .btn-primary:hover { background: var(--accent-hover); color: #fff; }
    textarea { flex: 1; width: 100%; min-height: 550px; background: transparent; color: #a7f3d0; border: none; padding: 1.25rem; font-family: 'Fira Code', monospace; font-size: 0.9rem; line-height: 1.6; resize: none; outline: none; }
    .status-bar { padding: 0.5rem 1.25rem; font-size: 0.8rem; border-top: 1px solid var(--border); background: #090d16; color: var(--success); font-weight: 500; }
    footer { text-align: center; padding: 1rem; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--border); background: var(--card-bg); }
  </style>
</head>
<body>
  <header>
    <h1>🔐 Base64 & JWT Decoder / Encoder</h1>
    <nav><a href="../index.html">← Back to Portal Dashboard</a></nav>
  </header>

  <main class="main-container">
    <div class="pane">
      <div class="pane-header">
        <span>INPUT (Base64 / JWT Token / UTF-8 Text)</span>
        <div class="toolbar">
          <button class="btn" onclick="loadSampleJWT()">Sample JWT</button>
          <button class="btn" onclick="loadSampleBase64()">Sample Base64</button>
          <button class="btn" onclick="clearAll()">Clear</button>
        </div>
      </div>
      <textarea id="input-text" placeholder="Paste Base64 or JWT string here..." oninput="autoProcess()"></textarea>
      <div class="status-bar" id="input-status">Ready</div>
    </div>

    <div class="pane">
      <div class="pane-header">
        <span>DECODED / ENCODED OUTPUT</span>
        <div class="toolbar">
          <button class="btn btn-primary" onclick="decodeJWT()">Decode JWT</button>
          <button class="btn" onclick="decodeBase64()">Decode Base64</button>
          <button class="btn" onclick="encodeBase64()">Encode Base64</button>
          <button class="btn" onclick="copyOutput()">📋 Copy Output</button>
        </div>
      </div>
      <textarea id="output-text" readonly placeholder="Parsed result will appear here..."></textarea>
      <div class="status-bar" id="output-status">Output Standby</div>
    </div>
  </main>

  <footer>
    <p>© 2026 SA Labs (`salabs.quanxs.com`) - High Performance Client-Side Utilities</p>
  </footer>

  <script>
    const sampleJWT = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IlN0ZWxsYSBBcmNoaXRlY3QiLCJpYXQiOjE1MTYyMzkwMjIsImV4cCI6MTkyNDk2MzIwMH0.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c";
    const sampleBase64 = "U0EgTGFicyAycGhhc2UgdW5tYW5uZWQgYXV0b25vbW91cyB3ZWIgZGV2ZWxvcG1lbnQ=";

    function init() {
      document.getElementById('input-text').value = sampleJWT;
      decodeJWT();
    }

    function b64DecodeUTF8(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) { str += '='; }
      const binary = atob(str);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
      return new TextDecoder('utf-8').decode(bytes);
    }

    function b64EncodeUTF8(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) { binary += String.fromCharCode(bytes[i]); }
      return btoa(binary);
    }

    function autoProcess() {
      const val = document.getElementById('input-text').value.trim();
      if (val.includes('.') && val.split('.').length >= 2) {
        decodeJWT();
      } else if (val) {
        decodeBase64();
      }
    }

    function decodeJWT() {
      const val = document.getElementById('input-text').value.trim();
      const outEl = document.getElementById('output-text');
      const outStatus = document.getElementById('output-status');

      if (!val.includes('.')) {
        outEl.value = "Error: Input does not appear to be a valid JWT (missing '.' separators).";
        outStatus.className = 'status-bar';
        outStatus.textContent = '❌ Invalid JWT Format';
        return;
      }

      const parts = val.split('.');
      try {
        const header = JSON.parse(b64DecodeUTF8(parts[0]));
        const payload = JSON.parse(b64DecodeUTF8(parts[1]));

        let expInfo = "";
        if (payload.exp) {
          const expDate = new Date(payload.exp * 1000);
          const isExpired = Date.now() > payload.exp * 1000;
          expInfo = `\n\n/* Token Expiration */\nExpires At: ${expDate.toLocaleString()}\nStatus: ${isExpired ? 'EXPIRED' : 'ACTIVE / VALID'}`;
        }

        outEl.value = `/* HEADER */\n${JSON.stringify(header, null, 2)}\n\n/* PAYLOAD */\n${JSON.stringify(payload, null, 2)}${expInfo}`;
        outStatus.className = 'status-bar';
        outStatus.textContent = '✓ JWT Successfully Decoded';
      } catch (err) {
        outEl.value = "JWT Decode Error: " + err.message;
        outStatus.className = 'status-bar';
        outStatus.textContent = '❌ JWT Parsing Error';
      }
    }

    function decodeBase64() {
      const val = document.getElementById('input-text').value.trim();
      const outEl = document.getElementById('output-text');
      const outStatus = document.getElementById('output-status');

      try {
        const decoded = b64DecodeUTF8(val);
        outEl.value = decoded;
        outStatus.className = 'status-bar';
        outStatus.textContent = '✓ Base64 Successfully Decoded';
      } catch (err) {
        outEl.value = "Base64 Decode Error: " + err.message;
        outStatus.className = 'status-bar';
        outStatus.textContent = '❌ Base64 Decode Error';
      }
    }

    function encodeBase64() {
      const val = document.getElementById('input-text').value;
      const outEl = document.getElementById('output-text');
      const outStatus = document.getElementById('output-status');

      try {
        const encoded = b64EncodeUTF8(val);
        outEl.value = encoded;
        outStatus.className = 'status-bar';
        outStatus.textContent = '✓ Encoded to Base64 (UTF-8)';
      } catch (err) {
        outEl.value = "Base64 Encode Error: " + err.message;
        outStatus.className = 'status-bar';
        outStatus.textContent = '❌ Base64 Encode Error';
      }
    }

    function loadSampleJWT() { document.getElementById('input-text').value = sampleJWT; decodeJWT(); }
    function loadSampleBase64() { document.getElementById('input-text').value = sampleBase64; decodeBase64(); }
    function clearAll() { document.getElementById('input-text').value = ''; document.getElementById('output-text').value = ''; }
    function copyOutput() { navigator.clipboard.writeText(document.getElementById('output-text').value).then(() => alert('📋 Output copied!')); }

    window.onload = init;
  </script>
</body>
</html>
