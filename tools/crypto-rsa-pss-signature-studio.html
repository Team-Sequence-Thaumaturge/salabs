<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto RSA-PSS Signature & Verification Studio | SA Labs Developer Utilities</title>
  <meta name="description" content="100% Client-Side Web Crypto SubtleCrypto RSA-PSS Signature Generation and Verification Studio for security engineers.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Crypto RSA-PSS Signature & Verification Studio",
    "url": "https://salabs.quanxs.com/tools/crypto-rsa-pss-signature-studio.html",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript and Web Crypto API support"
  }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 0; }
    .control-group { margin-bottom: 20px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; }
    textarea, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #f8fafc; font-size: 14px; box-sizing: border-box; }
    button { background: #0284c7; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .status { margin-top: 15px; padding: 12px; border-radius: 6px; background: #334155; color: #38bdf8; font-family: monospace; word-break: break-all; }
  </style>
<script>

    document.getElementById('genSignBtn').addEventListener('click', async () => {
      const resBox = document.getElementById('sigResult');
      resBox.innerText = 'Generating 2048-bit RSA-PSS keypair...';
      try {
        const keyPair = await window.crypto.subtle.generateKey(
          { name: "RSA-PSS", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" },
          true,
          ["sign", "verify"]
        );
        const encoder = new TextEncoder();
        const data = encoder.encode(document.getElementById('msgInput').value);
        const sig = await window.crypto.subtle.sign(
          { name: "RSA-PSS", saltLength: 32 },
          keyPair.privateKey,
          data
        );
        const sigHex = Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, '0')).join('');
        const isValid = await window.crypto.subtle.verify(
          { name: "RSA-PSS", saltLength: 32 },
          keyPair.publicKey,
          sig,
          data
        );
        resBox.innerText = `✓ RSA-PSS Keypair Generated\n✓ Signature (HEX): ${sigHex.substring(0, 64)}...\n✓ Self-Verification Status: ${isValid ? 'VERIFIED_VALID' : 'FAILED'}`;
      } catch (err) {
        resBox.innerText = 'Error: ' + err.message;
      }
    });
  
</script>
</head>
<body>
  <div class="container">
    <h1>Crypto RSA-PSS Signature & Verification Studio</h1>
    <p style="color: #94a3b8;">Web Crypto API RSA-PSS (2048-bit, SHA-256, Salt length 32) Signature Studio.</p>
    <div class="control-group">
      <label for="msgInput">Payload Message to Sign:</label>
      <textarea id="msgInput" rows="4">Quanxs SA Labs RSA-PSS Security Payload</textarea>
      <button id="genSignBtn">Generate RSA-PSS Keypair & Sign Message</button>
    </div>
    <div class="status" id="sigResult">Awaiting generation...</div>
  </div>
  
</body>
</html>
