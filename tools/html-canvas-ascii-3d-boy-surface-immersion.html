<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boy's Surface 3D ASCII Immersion Studio | Quanxs SA Labs</title>
  <meta name="description" content="Realtime Boy's Surface 3D ASCII Immersion & Quaternion Matrix Renderer. 100% Client-Side Pure JS.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Boy's Surface 3D ASCII Immersion Studio",
    "url": "https://salabs.quanxs.com/tools/html-canvas-ascii-3d-boy-surface-immersion.html",
    "description": "Interactive mathematical 3D immersion of Boy's surface rendered entirely in high-speed ASCII matrix text art.",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All"
  }
  </script>
  <style>
    :root {
      --bg: #090d13;
      --card: #131b26;
      --border: #26354a;
      --text: #d2e0f0;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; text-align: center; }
    h1 { color: #fff; font-size: 1.8rem; margin-bottom: 8px; }
    p.desc { color: #7d8b99; margin-bottom: 20px; font-size: 0.95rem; }
    .canvas-box {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: inline-block;
      margin-bottom: 20px;
    }
    pre#asciiOutput {
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      line-height: 11px;
      color: #39d353;
      text-align: left;
      user-select: none;
      letter-spacing: 2px;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .ctrl-item { background: var(--card); border: 1px solid var(--border); padding: 12px 18px; border-radius: 6px; }
    label { font-size: 0.85rem; color: #8b949e; display: block; margin-bottom: 4px; }
    input[type="range"] { width: 140px; }
    .nav-link { color: var(--accent); text-decoration: none; }
    .nav-link:hover { text-decoration: underline; }
  </style>
<script>

    const pre = document.getElementById('asciiOutput');
    const rotXSlider = document.getElementById('rotX');
    const rotYSlider = document.getElementById('rotY');
    const densitySlider = document.getElementById('density');

    const chars = " .:-=+*#%@";
    let A = 0, B = 0;
    const width = 64, height = 36;

    function renderBoySurface() {
      const zBuffer = new Array(width * height).fill(-Infinity);
      const buffer = new Array(width * height).fill(' ');

      const steps = parseInt(densitySlider.value);
      const uMax = Math.PI, vMax = Math.PI;

      for (let u = 0; u < uMax; u += Math.PI / steps) {
        for (let v = 0; v < vMax; v += Math.PI / steps) {
          // Apery's formulation for Boy's surface
          const cosU = Math.cos(u), sinU = Math.sin(u);
          const cosV = Math.cos(v), sinV = Math.sin(v);
          const sin2U = Math.sin(2 * u), sin3U = Math.sin(3 * u);
          const cos2V = Math.cos(2 * v);

          const d = Math.sqrt(2) * Math.pow(cosV, 3) * cos2V / (2 - Math.sqrt(2) * sin3U * sin2V);
          const x0 = d * (cosU * cosV + Math.sqrt(2) * sinU * sinV);
          const y0 = d * (sinU * cosV - Math.sqrt(2) * cosU * sinV);
          const z0 = Math.sqrt(2) * (cosV * cosV - 1) / (2 - Math.sqrt(2) * sin3U * sin2V);

          // Rotate 3D points
          const x1 = x0 * Math.cos(B) + z0 * Math.sin(B);
          const z1 = -x0 * Math.sin(B) + z0 * Math.cos(B);
          const y1 = y0 * Math.cos(A) - z1 * Math.sin(A);
          const z2 = y0 * Math.sin(A) + z1 * Math.cos(A);

          const dist = 3.5 + z2;
          if (dist > 0.1) {
            const ooz = 1 / dist;
            const xp = Math.floor(width / 2 + x1 * ooz * 45);
            const yp = Math.floor(height / 2 - y1 * ooz * 25);

            if (xp >= 0 && xp < width && yp >= 0 && yp < height) {
              const idx = xp + yp * width;
              if (ooz > zBuffer[idx]) {
                zBuffer[idx] = ooz;
                const lumIdx = Math.min(chars.length - 1, Math.max(0, Math.floor((z2 + 1.5) * 3)));
                buffer[idx] = chars[lumIdx];
              }
            }
          }
        }
      }

      let output = "";
      for (let y = 0; y < height; y++) {
        output += buffer.slice(y * width, (y + 1) * width).join('') + "\n";
      }
      pre.textContent = output;

      A += 0.02 * parseFloat(rotXSlider.value);
      B += 0.03 * parseFloat(rotYSlider.value);
      requestAnimationFrame(renderBoySurface);
    }

    renderBoySurface();
  
</script>
</head>
<body>
  <div class="container">
    <h1>Boy's Surface 3D ASCII Immersion</h1>
    <p class="desc">Non-orientable Real Projective Plane RP² Immersion in 3D Text Matrix (Pure Client-Side Canvas)</p>

    <div class="controls">
      <div class="ctrl-item">
        <label id="lblRotX">Rotation Pitch: 0.5x</label>
        <input type="range" id="rotX" min="0" max="3" step="0.1" value="0.8">
      </div>
      <div class="ctrl-item">
        <label id="lblRotY">Rotation Yaw: 1.0x</label>
        <input type="range" id="rotY" min="0" max="3" step="0.1" value="1.0">
      </div>
      <div class="ctrl-item">
        <label id="lblDensity">Mesh Resolution</label>
        <input type="range" id="density" min="20" max="60" step="5" value="40">
      </div>
    </div>

    <div class="canvas-box">
      <pre id="asciiOutput"></pre>
    </div>

    <div>
      <a href="../index.html" class="nav-link">← Back to SA Labs Central Dashboard</a>
    </div>
  </div>

  
</body>
</html>
