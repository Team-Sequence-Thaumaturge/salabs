<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Audio Tone & Frequency Generator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Audio Tone Frequency Generator","url":"https://salabs.quanxs.com/tools/audio-tone-frequency-generator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input,select{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Tone & Frequency Generator</h1></header><main class="container"><h3>Frequency (<span id="v-freq">440</span> Hz)</h3><input type="range" id="freq" min="20" max="5000" value="440" oninput="updateFreq()"><h3>Waveform</h3><select id="waveform" onchange="updateWave()"><option value="sine">Sine Wave</option><option value="square">Square Wave</option><option value="sawtooth">Sawtooth Wave</option><option value="triangle">Triangle Wave</option></select><div style="margin-top:1.5rem;"><button onclick="startTone()">Start Sound</button><button style="background:#ef4444;color:#fff;" onclick="stopTone()">Stop Sound</button></div></main><script>let audioCtx=null;let osc=null;function startTone(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();osc=audioCtx.createOscillator();osc.type=document.getElementById('waveform').value;osc.frequency.value=document.getElementById('freq').value;osc.connect(audioCtx.destination);osc.start();}function stopTone(){if(osc){osc.stop();osc=null;}}function updateFreq(){let f=document.getElementById('freq').value;document.getElementById('v-freq').innerText=f;if(osc)osc.frequency.value=f;}function updateWave(){if(osc)osc.type=document.getElementById('waveform').value;}</script></body></html>
