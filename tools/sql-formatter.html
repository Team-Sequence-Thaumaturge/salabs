    .sec-badge { display: inline-block; background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.3); font-size: 0.8rem; font-weight: 600; padding: 0.3rem 0.8rem; border-radius: 20px; margin-bottom: 1.5rem; }

    button.action-btn:hover { opacity: 0.9; }
    footer { margin-top: 3rem; text-align: center; color: var(--subtext); font-size: 0.85rem; border-top: 1px solid var(--border); padding-top: 1.5rem; }

<script>




    const KEYWORDS = [
      "SELECT", "FROM", "WHERE", "GROUP BY", "ORDER BY", "HAVING", "LIMIT",
      "JOIN", "LEFT JOIN", "RIGHT JOIN", "INNER JOIN", "OUTER JOIN", "ON",
      "AND", "OR", "IN", "IS NULL", "IS NOT NULL", "INSERT INTO", "VALUES",
      "UPDATE", "SET", "DELETE FROM", "CREATE TABLE", "ALTER TABLE", "DROP TABLE",
      "UNION ALL", "UNION", "AS", "CASE", "WHEN", "THEN", "ELSE", "END"
    ];

    function formatSQL() {
      let sql = document.getElementById('sqlInput').value.trim();
      if (!sql) {
        document.getElementById('sqlOutput').value = '';
        return;
      }

      // Convert keywords to uppercase and insert line breaks
      const majorKeywords = ["SELECT", "FROM", "WHERE", "GROUP BY", "ORDER BY", "HAVING", "LIMIT", "LEFT JOIN", "RIGHT JOIN", "INNER JOIN", "JOIN", "UNION", "VALUES", "SET"];
      
      let formatted = sql;
      majorKeywords.forEach(kw => {
        const regex = new RegExp("\\b" + kw + "\\b", "gi");
        formatted = formatted.replace(regex, "\n" + kw);
      });

      // Handle AND/OR indent
      formatted = formatted.replace(/\bAND\b/gi, "\n  AND")
                           .replace(/\bOR\b/gi, "\n  OR");

      // Clean multiple line breaks
      formatted = formatted.replace(/\n\s*\n/g, "\n").trim();

      document.getElementById('sqlOutput').value = formatted;
    }

    function copySQL() {
      const output = document.getElementById('sqlOutput');
      output.select();
      document.execCommand('copy');
      alert('Formatted SQL copied to clipboard!');
    }

    document.getElementById('sqlInput').addEventListener('input', formatSQL);
  

</script>
</head>
<body>
  <header>
    <span class="badge">Option Q</span>
    <h1>Client-Side SQL Formatter & Beautifier</h1>
    <p class="sub">Format, uppercase keywords, and beautify SQL queries 100% locally in your browser</p>
    <div style="margin-top:0.75rem;"><span class="sec-badge">🔒 100% Client-Side Engine (Zero Database Connection Required)</span></div>
  </header>
  <main class="grid">
    <div class="card">
      <label for="sqlInput">Unformatted SQL Query</label>
      <textarea id="sqlInput" placeholder="select u.id, u.name, o.total_amount from users u join orders o on u.id = o.user_id where o.status = 'completed' and o.created_at >= '2026-01-01' group by u.id, u.name order by o.total_amount desc limit 50;"></textarea>

    <div class="card">
      <label>Formatted SQL Output 
        <div class="btn-group">
          <button class="action-btn" onclick="formatSQL()">Format</button>
          <button class="action-btn" onclick="copySQL()">Copy</button>
        </div>
      </label>
      <textarea id="sqlOutput" readonly placeholder="Formatted SQL query will appear here..."></textarea>
    </div>
  </main>
