<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto SubtleCrypto AES-CTR Stream Cipher - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto SubtleCrypto AES-CTR Stream Cipher","url":"https://salabs.quanxs.com/tools/crypto-subtle-aes-ctr-cipher.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Web Crypto AES-CTR Stream Cipher</h1></header><main class="container"><input type="password" id="pass-in" value="StreamPass2026"><textarea id="plain-in" rows="3">High-speed stream cipher payload test</textarea><button onclick="encryptCTR()">Encrypt Payload (AES-CTR)</button><textarea id="cipher-out" rows="3" readonly></textarea></main><script>async function encryptCTR(){let pass=document.getElementById('pass-in').value;let text=document.getElementById('plain-in').value;if(!pass||!text)return;try{let enc=new TextEncoder();let counter=window.crypto.getRandomValues(new Uint8Array(16));let keyMaterial=await window.crypto.subtle.importKey("raw",enc.encode(pass.padEnd(32,'0').slice(0,32)),"AES-CTR",false,["encrypt"]);let encrypted=await window.crypto.subtle.encrypt({name:"AES-CTR",counter:counter,length:64},keyMaterial,enc.encode(text));let combined=new Uint8Array(counter.length+encrypted.byteLength);combined.set(counter,0);combined.set(new Uint8Array(encrypted),counter.length);document.getElementById('cipher-out').value=btoa(String.fromCharCode.apply(null,combined));}catch(e){alert('Encryption Error: '+e.message);}}</script></body></html>
