    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --accent-green: #39d353;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;

        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;

        header {

        }

        .container {
            max-width: 1200px;

        .viewport {
            background: #000;

            border-radius: 6px;

            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        pre#asciiOutput {
            font-size: 10px;
            line-height: 9px;
            color: var(--accent-green);
            text-align: center;
            user-select: none;
            letter-spacing: 2px;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
        .ctrl-box { display: flex; flex-direction: column; gap: 0.4rem; }
        label { font-size: 0.75rem; color: var(--text-dim); }
        input[type="range"] { accent-color: var(--accent-green); }
        .btn-group {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
        }
        button {
            background: #21262d;
            color: var(--accent-green);
            border: 1px solid #30363d;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #30363d; }
    </style>
<script>

        const chars = " .:-=+*#%@";
        const width = 64;
        const height = 36;
        let scale = -1.5;
        let boxLimit = 1.0;
        let maxIter = 8;
        let speed = 1.0;
        let angle = 0;
        let isAnimating = true;

        function boxFold(v, limit) {
            v.x = Math.max(-limit, Math.min(limit, v.x)) * 2 - v.x;
            v.y = Math.max(-limit, Math.min(limit, v.y)) * 2 - v.y;
            v.z = Math.max(-limit, Math.min(limit, v.z)) * 2 - v.z;
        }

        function sphereFold(v, minR, maxR) {
            const r2 = v.x * v.x + v.y * v.y + v.z * v.z;
            if (r2 < minR) {
                const temp = (maxR / minR);
                v.x *= temp; v.y *= temp; v.z *= temp;
            } else if (r2 < maxR) {
                const temp = (maxR / r2);
                v.x *= temp; v.y *= temp; v.z *= temp;
            }
        }

        function distanceEstimator(x, y, z) {
            let offset = { x: x, y: y, z: z };
            let v = { x: x, y: y, z: z };
            let dr = 1.0;
            const minRadius2 = 0.25;
            const fixedRadius2 = 1.0;

            for (let i = 0; i < maxIter; i++) {
                boxFold(v, boxLimit);
                sphereFold(v, minRadius2, fixedRadius2);
                v.x = scale * v.x + offset.x;
                v.y = scale * v.y + offset.y;
                v.z = scale * v.z + offset.z;
                dr = dr * Math.abs(scale) + 1.0;
            }
            const r = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
            return r / Math.abs(dr);
        }

        function renderFrame() {
            let output = "";
            const ca = Math.cos(angle);
            const sa = Math.sin(angle);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const u = (x / width - 0.5) * 2.2;
                    const v = (y / height - 0.5) * 1.8;

                    let rx = u * ca - sa * 2.5;
                    let ry = v;
                    let rz = u * sa + ca * 2.5;

                    let t = 0.0;
                    let hit = false;
                    let steps = 0;

                    for (let step = 0; step < 24; step++) {
                        const px = rx * (1 + t * 0.1);
                        const py = ry * (1 + t * 0.1);
                        const pz = rz * (1 + t * 0.1) - 3.0;

                        const d = distanceEstimator(px, py, pz);
                        if (d < 0.02) {
                            hit = true;
                            steps = step;
                            break;
                        }
                        t += Math.max(d, 0.04);
                        if (t > 5.0) break;
                    }

                    if (hit) {
                        const charIdx = Math.min(chars.length - 1, Math.floor((1 - steps / 24) * (chars.length - 1)));
                        output += chars[charIdx];
                    } else {
                        output += " ";
                    }
                }
                output += "\n";
            }
            document.getElementById('asciiOutput').textContent = output;

            if (isAnimating) {
                angle += 0.02 * speed;
                requestAnimationFrame(renderFrame);
            }
        }

        document.getElementById('scale').addEventListener('input', (e) => {
            scale = e.target.value / 10;
            document.getElementById('scaleVal').textContent = scale.toFixed(1);
        });
        document.getElementById('boxFold').addEventListener('input', (e) => {
            boxLimit = e.target.value / 10;
            document.getElementById('boxFoldVal').textContent = boxLimit.toFixed(1);
        });
        document.getElementById('iter').addEventListener('input', (e) => {
            maxIter = parseInt(e.target.value);
            document.getElementById('iterVal').textContent = maxIter;
        });
        document.getElementById('speed').addEventListener('input', (e) => {
            speed = e.target.value / 10;
            document.getElementById('speedVal').textContent = speed.toFixed(1);
        });

        document.getElementById('toggleAnim').addEventListener('click', () => {
            isAnimating = !isAnimating;
            document.getElementById('toggleAnim').textContent = isAnimating ? '⏸ Pause Rotation' : '▶ Resume Rotation';
            if (isAnimating) renderFrame();
        });

        renderFrame();
    
</script>

<body>
    <header>

                    <input type="range" id="boxFold" min="5" max="25" value="10">
                </div>
                <div class="ctrl-box">
                    <label>Max Iterations (<span id="iterVal">8</span>)</label>
                    <input type="range" id="iter" min="3" max="16" value="8">
                </div>
                <div class="ctrl-box">
                    <label>Camera Rotation Speed (<span id="speedVal">1.0</span>x)</label>
                    <input type="range" id="speed" min="0" max="30" value="10">
                </div>
            </div>

            <div class="btn-group">
                <button id="toggleAnim">⏸ Pause Rotation</button>
                <button id="resetParams">🔄 Reset Matrix</button>
            </div>
        </div>
