<script>
    let currentLang = 'fetch';

    function parseCurl(curlString) {
      let method = 'GET';
      let url = '';
      const headers = {};
      let body = null;

      // Clean line breaks & backslashes
      const cleanCurl = curlString.replace(/\\\n/g, ' ').replace(/\s+/g, ' ');

      // Extract URL
      const urlMatch = cleanCurl.match(/curl\s+(?:-[^\s]+\s+)*['"]?(https?:\/\/[^\s'"]+)['"]?/);
      if (urlMatch) url = urlMatch[1];

      // Extract Method
      const methodMatch = cleanCurl.match(/-X\s+([A-Z]+)/i) || cleanCurl.match(/--request\s+([A-Z]+)/i);
      if (methodMatch) method = methodMatch[1].toUpperCase();

      // Extract Headers
      const headerRegex = /-H\s+['"]([^'"]+)['"]/g;
      let hMatch;
      while ((hMatch = headerRegex.exec(cleanCurl)) !== null) {
        const parts = hMatch[1].split(':');
        if (parts.length >= 2) {
          const key = parts[0].trim();
          const val = parts.slice(1).join(':').trim();
          headers[key] = val;
        }
      }

      // Extract Data / Body
      const bodyMatch = cleanCurl.match(/(?:-d|--data|--data-raw|--data-binary)\s+['"](.*?)['"](?=\s+-[A-Z]|\s*$)/s);
      if (bodyMatch) {
        body = bodyMatch[1];
        if (method === 'GET') method = 'POST';
      }

      return { method, url, headers, body };
    }

    function generateCode() {
      const input = document.getElementById('curlInput').value.trim();
      const output = document.getElementById('codeOutput');

      if (!input) {
        output.value = '';
        return;
      }

      try {
        const parsed = parseCurl(input);
        if (!parsed.url) {
          output.value = '// Error: Could not parse URL from cURL command.';
          return;
        }

        if (currentLang === 'fetch') {
          let code = `fetch("${parsed.url}", {\n  method: "${parsed.method}",\n`;
          if (Object.keys(parsed.headers).length > 0) {
            code += `  headers: ${JSON.stringify(parsed.headers, null, 4).replace(/\n/g, '\n  ')},\n`;
          }
          if (parsed.body) {
            code += `  body: JSON.stringify(${parsed.body})\n`;
          }
          code += `})\n.then(response => response.json())\n.then(data => console.log(data))\n.catch(error => console.error('Error:', error));`;
          output.value = code;
        } else if (currentLang === 'axios') {
          let code = `axios({\n  method: "${parsed.method.toLowerCase()}",\n  url: "${parsed.url}",\n`;
          if (Object.keys(parsed.headers).length > 0) {
            code += `  headers: ${JSON.stringify(parsed.headers, null, 4).replace(/\n/g, '\n  ')},\n`;
          }
          if (parsed.body) {
            code += `  data: ${parsed.body}\n`;
          }
          code += `})\n.then(response => console.log(response.data))\n.catch(error => console.error(error));`;
          output.value = code;
        } else if (currentLang === 'python') {
          let code = `import requests\n\nurl = "${parsed.url}"\n`;
          if (Object.keys(parsed.headers).length > 0) {
            code += `headers = ${JSON.stringify(parsed.headers, null, 4)}\n`;
          } else {
            code += `headers = {}\n`;
          }
          if (parsed.body) {
            code += `data = '${parsed.body}'\n\nresponse = requests.${parsed.method.toLowerCase()}(url, headers=headers, data=data)\n`;
          } else {
            code += `\nresponse = requests.${parsed.method.toLowerCase()}(url, headers=headers)\n`;
          }
          code += `print(response.text)`;
          output.value = code;
        }
      } catch (err) {
        output.value = '// Error parsing cURL command: ' + err.message;
      }
    }

    function setLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      generateCode();
    }

    function copyCode() {
      const output = document.getElementById('codeOutput');
      output.select();
      document.execCommand('copy');
      alert('Code copied to clipboard!');
    }

    document.getElementById('curlInput').addEventListener('input', generateCode);
  </script>
