<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Unix Timestamp Converter - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Unix Timestamp Converter","url":"https://salabs.quanxs.com/tools/unix-timestamp-converter.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.result-card{background:#0f172a;padding:1rem;border-radius:8px;border:1px solid #334155;margin-top:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Unix Timestamp Converter</h1></header><main class="container"><h3>Current Timestamp</h3><p>Seconds: <strong id="now-sec"></strong> | Milliseconds: <strong id="now-ms"></strong></p><h3>Epoch to Date</h3><input type="number" id="ts-input" oninput="convertTS()"><div id="ts-output" class="result-card"></div><h3>Date to Epoch</h3><input type="datetime-local" id="date-input" oninput="convertDate()"><div id="date-output" class="result-card"></div></main><script>function updateNow(){let n=Date.now();document.getElementById('now-sec').innerText=Math.floor(n/1000);document.getElementById('now-ms').innerText=n;}setInterval(updateNow,1000);updateNow();function convertTS(){let val=parseInt(document.getElementById('ts-input').value,10);if(isNaN(val)){document.getElementById('ts-output').innerHTML='';return;}if(val<10000000000)val*=1000;let d=new Date(val);document.getElementById('ts-output').innerHTML=`<p><strong>UTC:</strong> ${d.toUTCString()}</p><p><strong>ISO 8601:</strong> ${d.toISOString()}</p>`;}function convertDate(){let val=document.getElementById('date-input').value;if(!val){document.getElementById('date-output').innerHTML='';return;}let ms=new Date(val).getTime();document.getElementById('date-output').innerHTML=`<p><strong>Unix Seconds:</strong> ${Math.floor(ms/1000)}</p><p><strong>Unix Milliseconds:</strong> ${ms}</p>`;}</script></body></html>
