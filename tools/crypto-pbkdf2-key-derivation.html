<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto PBKDF2 Key Derivation - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto PBKDF2 Key Derivation","url":"https://salabs.quanxs.com/tools/crypto-pbkdf2-key-derivation.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input,textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Web Crypto PBKDF2 Key Derivation</h1></header><main class="container"><label>Password</label><input type="text" id="pass-in" value="mySecretPassword123" oninput="deriveKey()"><label>Salt</label><input type="text" id="salt-in" value="randomSalt" oninput="deriveKey()"><textarea id="key-out" rows="2" readonly></textarea></main><script>async function deriveKey(){let pwd=document.getElementById('pass-in').value,salt=document.getElementById('salt-in').value;if(!pwd||!salt)return;try{let enc=new TextEncoder();let km=await window.crypto.subtle.importKey("raw",enc.encode(pwd),"PBKDF2",false,["deriveBits"]);let db=await window.crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:100000,hash:"SHA-256"},km,256);let hex=Array.from(new Uint8Array(db)).map(b=>b.toString(16).padStart(2,'0')).join('');document.getElementById('key-out').value=hex;}catch(e){document.getElementById('key-out').value='Derivation Error: '+e.message;}}deriveKey();</script></body></html>
