<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>CSS Inset & Layered Box Shadow Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"CSS Inset Box Shadow Studio","url":"https://salabs.quanxs.com/tools/css-box-shadow-inset-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input[type="range"],input[type="color"]{width:100%;margin-bottom:1rem;}.preview-box{width:220px;height:140px;background:#0f172a;border-radius:12px;margin:2rem auto;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#38bdf8;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;font-family:monospace;}</style><script>
function updateInset(){let x=document.getElementById('x').value,y=document.getElementById('y').value,blur=document.getElementById('blur').value,color=document.getElementById('color').value,inset=document.getElementById('is-inset').value;document.getElementById('v-x').innerText=x;document.getElementById('v-y').innerText=y;document.getElementById('v-blur').innerText=blur;let s=`${inset?'inset ':''}${x}px ${y}px ${blur}px ${color}`;document.getElementById('preview').style.boxShadow=s;document.getElementById('css-out').value=`box-shadow: ${s};`;}updateInset();
</script>
</head><body><header><h1 style="color:#38bdf8;text-align:center;">CSS Inset Box Shadow Studio</h1></header><main class="container"><label>X: <span id="v-x">5</span>px</label><input type="range" id="x" min="-30" max="30" value="5" oninput="updateInset()"><label>Y: <span id="v-y">5</span>px</label><input type="range" id="y" min="-30" max="30" value="5" oninput="updateInset()"><label>Blur: <span id="v-blur">10</span>px</label><input type="range" id="blur" min="0" max="50" value="10" oninput="updateInset()"><label>Color</label><input type="color" id="color" value="#000000" oninput="updateInset()"><select id="is-inset" onchange="updateInset()"><option value="inset">Inset Shadow</option><option value="">Outer Shadow</option></select><div id="preview" class="preview-box">Inset Shadow</div><textarea id="css-out" rows="2" readonly></textarea></main></body></html>
