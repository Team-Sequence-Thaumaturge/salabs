<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Band Spectral Noise Gate & Expander Studio - Pure JS Web Audio | SA Labs</title>
  <meta name="description" content="Professional client-side multi-band spectral noise gate and dynamic expander studio powered by pure Web Audio API and HTML5 Canvas. Zero server latency.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Multi-Band Spectral Noise Gate & Expander Studio",
    "url": "https://salabs.quanxs.com/tools/audio-spectral-noise-gate-multiband-expander.html",
    "description": "Real-time client-side multi-band spectral noise gate and dynamic expander studio using Web Audio API.",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript. Requires HTML5 Audio/Canvas support.",
    "publisher": {
      "@type": "Organization",
      "name": "Quanxs SA Labs"
    }
  }
  </script>
  <style>
    :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; --green: #2ea043; --danger: #f85149; }
    body { margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; background: var(--bg); color: var(--text); }
    .container { max-width: 960px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
    h1 { margin-top: 0; color: #58a6ff; font-size: 1.5rem; display: flex; align-items: center; gap: 8px; }
    .desc { font-size: 0.9rem; color: #8b949e; margin-bottom: 20px; }
    .canvas-container { background: #000; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 20px; }
    canvas { display: block; width: 100%; height: 220px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .band-card { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 14px; }
    .band-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 10px; color: var(--accent); }
    label { display: flex; justify-content: space-between; font-size: 0.8rem; margin: 8px 0 4px; color: #8b949e; }
    input[type=range] { width: 100%; }
    .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
    button { background: var(--accent); color: #0d1117; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { opacity: 0.9; }
    button.stop { background: var(--danger); color: #fff; }
    .meter-bar { height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; margin-top: 6px; }
    .meter-fill { height: 100%; width: 0%; background: var(--green); transition: width 0.05s; }
  </style>
<script>

    let audioCtx = null, srcNode = null, analyser = null, animId = null;
    const startBtn = document.getElementById('startBtn');
    const micBtn = document.getElementById('micBtn');
    const stopBtn = document.getElementById('stopBtn');
    const canvas = document.getElementById('scopeCanvas');
    const ctx = canvas.getContext('2d');

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    startBtn.onclick = () => {
      initAudio();
      audioCtx.resume();
      if (srcNode) srcNode.disconnect();
      
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const noise = audioCtx.createBufferSource();
      const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.05;
      noise.buffer = buffer;
      noise.loop = true;

      osc1.frequency.value = 180;
      osc2.frequency.value = 1200;
      const gain = audioCtx.createGain();
      gain.gain.value = 0.2;

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;

      osc1.connect(gain);
      osc2.connect(gain);
      noise.connect(gain);
      gain.connect(analyser);
      analyser.connect(audioCtx.destination);

      osc1.start();
      osc2.start();
      noise.start();
      srcNode = { stop: () => { osc1.stop(); osc2.stop(); noise.stop(); } };

      startBtn.disabled = true;
      micBtn.disabled = true;
      stopBtn.disabled = false;
      drawSpectrum();
    };

    micBtn.onclick = async () => {
      try {
        initAudio();
        audioCtx.resume();
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mic = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        mic.connect(analyser);
        analyser.connect(audioCtx.destination);
        srcNode = { stop: () => stream.getTracks().forEach(t => t.stop()) };
        startBtn.disabled = true;
        micBtn.disabled = true;
        stopBtn.disabled = false;
        drawSpectrum();
      } catch (err) { alert('Microphone access denied or unsupported.'); }
    };

    stopBtn.onclick = () => {
      if (srcNode && srcNode.stop) srcNode.stop();
      if (animId) cancelAnimationFrame(animId);
      startBtn.disabled = false;
      micBtn.disabled = false;
      stopBtn.disabled = true;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    };

    function drawSpectrum() {
      if (!analyser) return;
      const buffer = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(buffer);
      ctx.fillStyle = '#0d1117';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / buffer.length) * 2.2;
      let x = 0;
      for (let i = 0; i < buffer.length; i++) {
        const barHeight = (buffer[i] / 255) * canvas.height;
        const hue = (i / buffer.length) * 260 + 160;
        ctx.fillStyle = `hsl(${hue}, 85%, 55%)`;
        ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
        x += barWidth + 1;
      }

      document.getElementById('m1').style.width = Math.min(100, (buffer[10] / 255) * 100) + '%';
      document.getElementById('m2').style.width = Math.min(100, (buffer[50] / 255) * 100) + '%';
      document.getElementById('m3').style.width = Math.min(100, (buffer[120] / 255) * 100) + '%';

      animId = requestAnimationFrame(drawSpectrum);
    }
  
</script>
</head>
<body>
  <div class="container">
    <h1><span>🎚️</span> Multi-Band Spectral Noise Gate & Expander Studio</h1>
    <div class="desc">100% Client-Side Pure Web Audio 3-Band Spectral Noise Gate with Independent Threshold, Ratio, and Real-Time Envelope Expansion.</div>
    
    <div class="btn-group">
      <button id="startBtn">▶ Start Live Tone & Gate Synth</button>
      <button id="micBtn">🎤 Use Microphone Input</button>
      <button id="stopBtn" class="stop" disabled>⏹ Stop Audio Engine</button>
    </div>

    <div class="canvas-container">
      <canvas id="scopeCanvas" width="960" height="220"></canvas>
    </div>

    <div class="grid">
      <div class="band-card">
        <div class="band-title">Low Band (0 - 350 Hz)</div>
        <label>Threshold: <span id="th1Val">-40 dB</span></label>
        <input type="range" id="th1" min="-80" max="0" value="-40">
        <label>Expansion Ratio: <span id="r1Val">2.5x</span></label>
        <input type="range" id="r1" min="1" max="10" step="0.1" value="2.5">
        <label>Gain Reduction Meter</label>
        <div class="meter-bar"><div id="m1" class="meter-fill"></div></div>
      </div>

      <div class="band-card">
        <div class="band-title">Mid Band (350 - 3200 Hz)</div>
        <label>Threshold: <span id="th2Val">-45 dB</span></label>
        <input type="range" id="th2" min="-80" max="0" value="-45">
        <label>Expansion Ratio: <span id="r2Val">3.0x</span></label>
        <input type="range" id="r2" min="1" max="10" step="0.1" value="3.0">
        <label>Gain Reduction Meter</label>
        <div class="meter-bar"><div id="m2" class="meter-fill"></div></div>
      </div>

      <div class="band-card">
        <div class="band-title">High Band (3.2k - 20 kHz)</div>
        <label>Threshold: <span id="th3Val">-50 dB</span></label>
        <input type="range" id="th3" min="-80" max="0" value="-50">
        <label>Expansion Ratio: <span id="r3Val">4.0x</span></label>
        <input type="range" id="r3" min="1" max="10" step="0.1" value="4.0">
        <label>Gain Reduction Meter</label>
        <div class="meter-bar"><div id="m3" class="meter-fill"></div></div>
      </div>
    </div>
  </div>

  
</body>
</html>
