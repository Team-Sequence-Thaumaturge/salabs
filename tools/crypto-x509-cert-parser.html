<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>X.509 Certificate & ASN.1 Inspector - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"X.509 Certificate & ASN.1 Inspector","url":"https://salabs.quanxs.com/tools/crypto-x509-cert-parser.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.result-box{background:#0f172a;padding:1rem;border-radius:8px;border:1px solid #334155;margin-top:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">X.509 Certificate & ASN.1 Inspector</h1></header><main class="container"><textarea id="cert-in" rows="6" placeholder="PEM Certificate..." oninput="parseCert()"></textarea><div id="cert-out" class="result-box">Paste certificate...</div></main><script>function parseCert(){let pem=document.getElementById('cert-in').value.trim(),out=document.getElementById('cert-out');if(!pem){out.innerText='Paste certificate...';return;}try{let lines=pem.split('\n').filter(l=>!l.startsWith('---'));let b64=lines.join(''),decoded=atob(b64);out.innerHTML=`<p><strong>Format:</strong> PEM X.509 Certificate</p><p><strong>Byte Length:</strong> ${decoded.length} bytes</p>`;}catch(e){out.innerText='Parsing Error: '+e.message;}}</script></body></html>
