  <style>

<script>

    const viewport = document.getElementById('asciiViewport');
    const degSlider = document.getElementById('degSlider');
    const alphaSlider = document.getElementById('alphaSlider');
    const rotXSlider = document.getElementById('rotXSlider');
    const rotYSlider = document.getElementById('rotYSlider');
    const rampSelect = document.getElementById('rampSelect');
    const toggleAnim = document.getElementById('toggleAnim');

    let isRotating = true;
    let angleX = 0.4, angleY = 0.5;

    toggleAnim.addEventListener('click', () => {
      isRotating = !isRotating;
      toggleAnim.textContent = isRotating ? '⏸ Pause Rotation' : '▶ Resume Rotation';
    });

    degSlider.addEventListener('input', (e) => document.getElementById('degVal').textContent = e.target.value);
    alphaSlider.addEventListener('input', (e) => document.getElementById('alphaVal').textContent = parseFloat(e.target.value).toFixed(2));
    rotXSlider.addEventListener('input', (e) => document.getElementById('rotXVal').textContent = parseFloat(e.target.value).toFixed(1) + 'x');
    rotYSlider.addEventListener('input', (e) => document.getElementById('rotYVal').textContent = parseFloat(e.target.value).toFixed(1) + 'x');

    const ramps = {
      dense: ' .:-=+*#%@',
      matrix: ' 01',
      dots: ' ·∙•●'
    };

    function renderAscii() {
      const width = 64;
      const height = 36;
      const buffer = new Array(width * height).fill(' ');
      const zBuffer = new Array(width * height).fill(-Infinity);

      const n = parseInt(degSlider.value);
      const alpha = parseFloat(alphaSlider.value);
      const ramp = ramps[rampSelect.value];

      const uSteps = 40;
      const vSteps = 40;

      for (let iu = 0; iu < uSteps; iu++) {
        const u = (iu / uSteps) * 2 * Math.PI;
        for (let iv = 0; iv < vSteps; iv++) {
          const v = (iv / vSteps) * 2 * Math.PI;

          // Calabi-Yau 3-Fold 2D Parameterization to R^3 projection
          const r1 = Math.cos(u) * Math.cos(alpha);
          const r2 = Math.sin(u) * Math.sin(alpha);
          const x0 = (Math.cos(v) * r1 + Math.sin(v) * r2) * Math.cos(u / n);
          const y0 = (Math.sin(v) * r1 - Math.cos(v) * r2) * Math.sin(u / n);
          const z0 = Math.sin(n * v) * 0.4 + Math.cos(n * u) * 0.3;

          // 3D Rotation
          const cosX = Math.cos(angleX), sinX = Math.sin(angleX);
          const cosY = Math.cos(angleY), sinY = Math.sin(angleY);

          const y1 = y0 * cosX - z0 * sinX;
          const z1 = y0 * sinX + z0 * cosX;
          const x2 = x0 * cosY + z1 * sinY;
          const z2 = -x0 * sinY + z1 * cosY;

          // Projection
          const scale = 22;
          const px = Math.floor(width / 2 + x2 * scale);
          const py = Math.floor(height / 2 + y1 * (scale * 0.55));

          if (px >= 0 && px < width && py >= 0 && py < height) {
            const idx = py * width + px;
            if (z2 > zBuffer[idx]) {
              zBuffer[idx] = z2;
              const intensity = Math.max(0, Math.min(1, (z2 + 1.5) / 3.0));
              const charIdx = Math.floor(intensity * (ramp.length - 1));
              buffer[idx] = ramp[charIdx];
            }
          }
        }
      }

      let outStr = '';
      for (let r = 0; r < height; r++) {
        outStr += buffer.slice(r * width, (r + 1) * width).join('') + '\n';
      }
      viewport.textContent = outStr;

      if (isRotating) {
        angleX += 0.02 * parseFloat(rotXSlider.value);
        angleY += 0.03 * parseFloat(rotYSlider.value);
      }
      requestAnimationFrame(renderAscii);
    }

    renderAscii();
  
</script>

<body>
  <div class="container">

    </header>

    <div class="grid">
      <div class="card">
        <h2>🎛️ Manifold & Projection Parameters</h2>
        <div class="control-group">
          <label><span>Quintic Degree n</span><span id="degVal">5</span></label>
          <input type="range" id="degSlider" min="2" max="8" value="5">
        </div>
        <div class="control-group">
          <label><span>Phase Slice Alpha (α)</span><span id="alphaVal">0.65</span></label>
          <input type="range" id="alphaSlider" min="0" max="3.14" value="0.65" step="0.05">
        </div>
        <div class="control-group">
          <label><span>Rotation Speed X</span><span id="rotXVal">1.0x</span></label>
          <input type="range" id="rotXSlider" min="0" max="3" value="1" step="0.1">
        </div>
        <div class="control-group">
          <label><span>Rotation Speed Y</span><span id="rotYVal">1.0x</span></label>
          <input type="range" id="rotYSlider" min="0" max="3" value="1" step="0.1">
        </div>
        <div class="control-group">
          <label><span>ASCII Luminance Ramp</span></label>
          <select id="rampSelect" style="width:100%; background:#21262d; border:1px solid var(--border); color:#fff; padding:6px; border-radius:4px;">
            <option value="dense"> .:-=+*#%@ (Standard)</option>
            <option value="matrix"> 01 (Binary Matrix)</option>
            <option value="dots"> ·∙•● (Geometric Dots)</option>
          </select>
        </div>
        <button id="toggleAnim" class="btn-primary">⏸ Pause Rotation</button>
      </div>

      <div class="card">
        <h2>🖥️ ASCII Manifold Viewport</h2>
        <div id="asciiViewport"></div>
      </div>
    </div>
