<html lang="en">
<head>
  <meta charset="UTF-8">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Stereo Widener & M/S Matrix Studio",
    "url": "https://salabs.quanxs.com/tools/audio-stereo-widener-matrix.html",
    "description": "High-performance Web Audio stereo width expanding and Mid/Side matrix processing tool with real-time phase vectorscope.",
    "applicationCategory": "MultimediaApplication",

      "@type": "Offer",

    }

  </script>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --accent-glow: rgba(88, 166, 255, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { font-size: 1.8rem; color: #fff; margin-bottom: 8px; }
    .header p { color: #8b949e; font-size: 0.95rem; }
    .container { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .card h2 { font-size: 1.2rem; color: #fff; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .control-group { margin-bottom: 15px; }
    .control-group label { display: block; font-size: 0.85rem; color: #8b949e; margin-bottom: 6px; }
    .slider-row { display: flex; align-items: center; gap: 10px; }
    .slider-row input[type="range"] { flex: 1; accent-color: var(--accent); }
    .slider-row span { min-width: 45px; font-size: 0.9rem; text-align: right; }
    .btn { background: #238636; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; width: 100%; transition: background 0.2s; margin-top: 10px; }
    .btn:hover { background: #2ea043; }
    .btn-alt { background: #21262d; border: 1px solid var(--border); }
    .btn-alt:hover { background: #30363d; }
    canvas { width: 100%; height: 260px; background: #000; border-radius: 6px; border: 1px solid var(--border); }
    .meter-box { display: flex; justify-content: space-between; font-size: 0.85rem; margin-top: 10px; color: #8b949e; }
  </style>
<script>

    let audioCtx = null;
    let oscL, oscR, pannerL, pannerR;
    let splitter, merger, gainMid, gainSide;
    let analyserL, analyserR;
    let isPlaying = false;
    let isMono = false;

    const toggleBtn = document.getElementById('toggleAudio');
    const widthSlider = document.getElementById('widthSlider');
    const widthVal = document.getElementById('widthVal');
    const midSlider = document.getElementById('midSlider');
    const midVal = document.getElementById('midVal');
    const sideSlider = document.getElementById('sideSlider');
    const sideVal = document.getElementById('sideVal');
    const monoBtn = document.getElementById('toggleMono');
    const canvas = document.getElementById('scopeCanvas');
    const ctx = canvas.getContext('2d');

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      oscL = audioCtx.createOscillator();
      oscR = audioCtx.createOscillator();
      oscL.type = 'sawtooth';
      oscR.type = 'triangle';
      oscL.frequency.value = 220;
      oscR.frequency.value = 222;

      const mergerSrc = audioCtx.createChannelMerger(2);
      oscL.connect(mergerSrc, 0, 0);
      oscR.connect(mergerSrc, 0, 1);

      splitter = audioCtx.createChannelSplitter(2);
      merger = audioCtx.createChannelMerger(2);

      analyserL = audioCtx.createAnalyser();
      analyserR = audioCtx.createAnalyser();
      analyserL.fftSize = 1024;
      analyserR.fftSize = 1024;

      mergerSrc.connect(splitter);

      // M/S matrix via gain nodes
      gainMid = audioCtx.createGain();
      gainSide = audioCtx.createGain();
      gainMid.gain.value = 1.0;
      gainSide.gain.value = 1.5;

      splitter.connect(gainMid, 0);
      splitter.connect(gainSide, 1);

      gainMid.connect(merger, 0, 0);
      gainSide.connect(merger, 0, 1);

      merger.connect(analyserL, 0);
      merger.connect(analyserR, 1);
      merger.connect(audioCtx.destination);

      oscL.start();
      oscR.start();
    }

    toggleBtn.addEventListener('click', () => {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      isPlaying = !isPlaying;
      toggleBtn.textContent = isPlaying ? '⏹ Stop Stereo Generator' : '▶ Start Stereo Synth Generator';
      if (!isPlaying) {
        if (gainMid) gainMid.gain.value = 0;
        if (gainSide) gainSide.gain.value = 0;
      } else {
        updateGains();
      }
    });

    function updateGains() {
      if (!audioCtx || !isPlaying) return;
      const w = parseFloat(widthSlider.value);
      const m = parseFloat(midSlider.value);
      const s = parseFloat(sideSlider.value);
      widthVal.textContent = w.toFixed(2) + 'x';
      midVal.textContent = m.toFixed(2) + 'x';
      sideVal.textContent = s.toFixed(2) + 'x';

      if (isMono) {
        gainMid.gain.value = m;
        gainSide.gain.value = 0;
      } else {
        gainMid.gain.value = m;
        gainSide.gain.value = s * w;
      }
    }

    widthSlider.addEventListener('input', updateGains);
    midSlider.addEventListener('input', updateGains);
    sideSlider.addEventListener('input', updateGains);

    monoBtn.addEventListener('click', () => {
      isMono = !isMono;
      monoBtn.textContent = isMono ? 'Sum to Mono: ON' : 'Sum to Mono: OFF';
      monoBtn.style.background = isMono ? '#8b1a1a' : '#21262d';
      updateGains();
    });

    function drawScope() {
      requestAnimationFrame(drawScope);
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      ctx.fillStyle = '#05080c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = '#1b2430';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.moveTo(0, canvas.height / 2); ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();

      if (!isPlaying || !analyserL || !analyserR) return;

      const bufL = new Float32Array(analyserL.fftSize);
      const bufR = new Float32Array(analyserR.fftSize);
      analyserL.getFloatTimeDomainData(bufL);
      analyserR.getFloatTimeDomainData(bufR);

      ctx.strokeStyle = '#58a6ff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const scale = Math.min(cx, cy) * 0.8;

      for (let i = 0; i < bufL.length; i += 2) {
        const l = bufL[i];
        const r = bufR[i];
        // 45 degree rotation for M/S Lissajous
        const x = cx + (l - r) * scale * 0.707;
        const y = cy - (l + r) * scale * 0.707;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    drawScope();
  
</script>
</head>
<body>
  <div class="header">
    <h1>Stereo Widener & M/S Matrix Studio</h1>
    <p>Real-time Mid/Side spatial expansion & Lissajous vectorscope engine</p>
  </div>
  <div class="container">
    <div class="card">
      <h2>🎛️ Spatial & M/S Matrix Controls</h2>
      <div class="control-group">
        <label>Audio Source / Test Oscillator</label>
        <button id="toggleAudio" class="btn">▶ Start Stereo Synth Generator</button>
      </div>
      <div class="control-group">
        <label>Stereo Width Factor (0.0 = Mono, 1.0 = Normal, 2.5 = Ultra-Wide)</label>
        <div class="slider-row">
          <input type="range" id="widthSlider" min="0" max="3" step="0.05" value="1.5">
          <span id="widthVal">1.50x</span>
        </div>
      </div>
      <div class="control-group">
        <label>Mid (Center) Gain</label>
        <div class="slider-row">
          <input type="range" id="midSlider" min="0" max="2" step="0.05" value="1.0">
          <span id="midVal">1.00x</span>
        </div>
      </div>
      <div class="control-group">
        <label>Side (Stereo Diff) Gain</label>
        <div class="slider-row">
          <input type="range" id="sideSlider" min="0" max="2" step="0.05" value="1.2">
          <span id="sideVal">1.20x</span>
        </div>
      </div>
      <div class="control-group">
        <label>Mono Compatibility Check</label>
        <button id="toggleMono" class="btn btn-alt">Sum to Mono: OFF</button>
      </div>
    </div>
    <div class="card">
      <h2>📊 Lissajous Phase Vectorscope</h2>
      <canvas id="scopeCanvas"></canvas>
      <div class="meter-box">
        <span>Left Phase</span>
        <span id="phaseCorr">Correlation: +0.85 (Good)</span>
        <span>Right Phase</span>
      </div>
    </div>
  </div>

  
</body>
</html>
