<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Spectral Noise Reducer Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Spectral Noise Reducer Studio","url":"https://salabs.quanxs.com/tools/audio-spectral-subtraction-denoiser.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Spectral Noise Reducer Studio</h1></header><main class="container"><button onclick="playFilteredAudio()">Play Noise Filtered Tone</button><p>Noise Cutoff Frequency (<span id="cut-val">500</span> Hz)</p><input type="range" id="cut-slider" min="100" max="3000" value="500" oninput="updateCutoff()"></main><script>let audioCtx,osc,filter;function playFilteredAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();osc=audioCtx.createOscillator();filter=audioCtx.createBiquadFilter();let cutoff=parseFloat(document.getElementById('cut-slider').value);osc.type='sawtooth';osc.frequency.value=220;filter.type='highpass';filter.frequency.value=cutoff;osc.connect(filter);filter.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.5);}function updateCutoff(){let v=document.getElementById('cut-slider').value;document.getElementById('cut-val').innerText=v;if(filter)filter.frequency.value=parseFloat(v);}</script></body></html>
