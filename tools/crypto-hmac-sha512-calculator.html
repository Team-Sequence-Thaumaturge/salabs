<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto HMAC SHA-512 Calculator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto HMAC SHA-512 Calculator","url":"https://salabs.quanxs.com/tools/crypto-hmac-sha512-calculator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">HMAC SHA-512 Calculator</h1></header><main class="container"><input type="text" id="key-in" value="secret_key_512" oninput="calcHMAC512()"><textarea id="msg-in" rows="4" oninput="calcHMAC512()">Hello Quanxs SA Labs HMAC SHA512</textarea><textarea id="sig-out" rows="3" readonly></textarea></main><script>async function calcHMAC512(){let k=document.getElementById('key-in').value,m=document.getElementById('msg-in').value;if(!k||!m)return;try{let enc=new TextEncoder();let key=await window.crypto.subtle.importKey("raw",enc.encode(k),{name:"HMAC",hash:"SHA-512"},false,["sign"]);let sig=await window.crypto.subtle.sign("HMAC",key,enc.encode(m));let hex=Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');document.getElementById('sig-out').value=hex;}catch(e){document.getElementById('sig-out').value='Error: '+e.message;}}calcHMAC512();</script></body></html>
