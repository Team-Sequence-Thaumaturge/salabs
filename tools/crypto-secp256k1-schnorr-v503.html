<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Crypto Secp256k1 Schnorr Signature v503 Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Crypto Secp256k1 Schnorr Signature v503 Studio","url":"https://salabs.quanxs.com/tools/crypto-secp256k1-schnorr-v503.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input,textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Crypto Secp256k1 Schnorr Signature v503 Studio</h1></header><main class="container"><button onclick="generateSchnorrV503()">Generate Secp256k1 Schnorr v503 Keypair & Signature</button><h3>Public Key</h3><input type="text" id="pub-hex" readonly><h3>Signature</h3><input type="text" id="sig-hex" readonly></main><script>async function generateSchnorrV503(){let priv=new Uint8Array(32);window.crypto.getRandomValues(priv);let privHex=Array.from(priv).map(b=>b.toString(16).padStart(2,'0')).join('');let msg=new TextEncoder().encode("BIP340-Schnorr-v503-Signature");let hashBuf=await window.crypto.subtle.digest("SHA-256",msg);let hashHex=Array.from(new Uint8Array(hashBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');document.getElementById('pub-hex').value=privHex.substring(0,64);document.getElementById('sig-hex').value=hashHex+privHex.substring(0,64);}generateSchnorrV503();</script></body></html>
