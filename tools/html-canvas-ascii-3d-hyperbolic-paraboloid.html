<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hyperbolic Paraboloid Saddle Surface ASCII Simulator - Quanxs SA Labs</title>
    <meta name="description" content="Real-time mathematical 3D Hyperbolic Paraboloid (Saddle Surface) ASCII Wireframe simulator with interactive pitch, yaw, roll rotation and dynamic curvature.">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "3D Hyperbolic Paraboloid ASCII Simulator",
      "url": "https://salabs.quanxs.com/tools/html-canvas-ascii-3d-hyperbolic-paraboloid.html",
      "description": "Interactive mathematical 3D Hyperbolic Paraboloid ASCII Wireframe renderer with matrix transformations.",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "All"
    }
    </script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #fff; font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        pre#asciiCanvas { font-family: monospace; font-size: 9px; line-height: 9px; background: #000; color: #58a6ff; padding: 15px; border-radius: 6px; overflow: hidden; text-align: center; user-select: none; border: 1px solid var(--border); }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 15px; }
        label { display: block; font-size: 0.8rem; color: #8b949e; margin-bottom: 4px; }
        input[type="range"] { width: 100%; accent-color: var(--accent); }
    </style>
<script>

        const asciiDisplay = document.getElementById('asciiCanvas');
        const W = 70, H = 34;
        let angleX = 0.5, angleY = 0.5, angleZ = 0.2;

        function renderFrame() {
            const a = parseFloat(document.getElementById('paramA').value);
            const b = parseFloat(document.getElementById('paramB').value);
            const speed = parseFloat(document.getElementById('rotSpeed').value);
            const focal = parseFloat(document.getElementById('zoom').value);

            angleX += speed;
            angleY += speed * 1.3;
            angleZ += speed * 0.7;

            const buffer = Array(H).fill(null).map(() => Array(W).fill(' '));
            const zBuffer = Array(H).fill(null).map(() => Array(W).fill(-9999));
            const chars = ".,-~:;=!*#$@";

            const cosX = Math.cos(angleX), sinX = Math.sin(angleX);
            const cosY = Math.cos(angleY), sinY = Math.sin(angleY);
            const cosZ = Math.cos(angleZ), sinZ = Math.sin(angleZ);

            for (let u = -2; u <= 2; u += 0.12) {
                for (let v = -2; v <= 2; v += 0.12) {
                    const zMath = (u * u) / (a * a) - (v * v) / (b * b);
                    let x = u, y = v, z = zMath;

                    let y1 = y * cosX - z * sinX;
                    let z1 = y * sinX + z * cosX;
                    let x2 = x * cosY + z1 * sinY;
                    let z2 = -x * sinY + z1 * cosY;
                    let x3 = x2 * cosZ - y1 * sinZ;
                    let y3 = x2 * sinZ + y1 * cosZ;

                    const zCam = z2 + 8;
                    if (zCam <= 0) continue;

                    const xp = Math.floor(W / 2 + (x3 * focal * 1.8) / zCam);
                    const yp = Math.floor(H / 2 + (y3 * focal) / zCam);

                    if (xp >= 0 && xp < W && yp >= 0 && yp < H) {
                        const ooz = 1 / zCam;
                        if (ooz > zBuffer[yp][xp]) {
                            zBuffer[yp][xp] = ooz;
                            let lum = Math.floor((z2 + 3) * 2);
                            lum = Math.max(0, Math.min(chars.length - 1, lum));
                            buffer[yp][xp] = chars[lum];
                        }
                    }
                }
            }

            asciiDisplay.innerText = buffer.map(row => row.join('')).join('\n');
            requestAnimationFrame(renderFrame);
        }
        renderFrame();
    
</script>
</head>
<body>
    <div class="container">
        <h1>3D Hyperbolic Paraboloid (Saddle Surface) ASCII Simulator</h1>
        <div class="card">
            <pre id="asciiCanvas"></pre>
            <div class="controls">
                <div>
                    <label>Curvature Factor a</label>
                    <input type="range" id="paramA" min="0.5" max="3" step="0.1" value="1.2">
                </div>
                <div>
                    <label>Curvature Factor b</label>
                    <input type="range" id="paramB" min="0.5" max="3" step="0.1" value="1.2">
                </div>
                <div>
                    <label>Rotation Speed</label>
                    <input type="range" id="rotSpeed" min="0.001" max="0.05" step="0.002" value="0.015">
                </div>
                <div>
                    <label>Focal Distance (Zoom)</label>
                    <input type="range" id="zoom" min="20" max="80" step="1" value="45">
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
