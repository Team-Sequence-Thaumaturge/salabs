<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JWT Signer & Key Pair Generator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JWT Signer Key Pair Generator","url":"https://salabs.quanxs.com/tools/jwt-signer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1100px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:1rem;margin-bottom:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JWT Signer & Secret Key Generator</h1></header><main class="container"><div class="grid"><div><h3>Header (JSON)</h3><textarea id="jwt-header">{"alg": "HS256", "typ": "JWT"}</textarea></div><div><h3>Payload Claims (JSON)</h3><textarea id="jwt-payload">{"sub": "1234567890", "name": "John Doe"}</textarea></div></div><h3>Secret Key</h3><input type="text" id="jwt-secret" value="your-256-bit-secret-key-here"><button onclick="signJWT()">Sign & Generate JWT</button><h3>Generated JWT Token</h3><textarea id="jwt-output" style="height:100px;" readonly placeholder="Signed JWT token..."></textarea></main><script>function base64UrlEncode(str){return btoa(str).replace(/=/g,'').replace(/\+/g,'-').replace(///g,'_');}async function signJWT(){let header=document.getElementById('jwt-header').value.trim();let payload=document.getElementById('jwt-payload').value.trim();let secret=document.getElementById('jwt-secret').value.trim();let out=document.getElementById('jwt-output');try{let hEnc=base64UrlEncode(header);let pEnc=base64UrlEncode(payload);let unsignedToken=`${hEnc}.${pEnc}`;let enc=new TextEncoder();let keyData=enc.encode(secret);let messageData=enc.encode(unsignedToken);let key=await crypto.subtle.importKey("raw",keyData,{name:"HMAC",hash:"SHA-256"},false,["sign"]);let signatureBuf=await crypto.subtle.sign("HMAC",key,messageData);let signatureArr=Array.from(new Uint8Array(signatureBuf));let signatureStr=String.fromCharCode.apply(null,signatureArr);let sEnc=base64UrlEncode(signatureStr);out.value=`${unsignedToken}.${sEnc}`;}catch(e){out.value='❌ Signing Error: '+e.message;}}</script></body></html>
