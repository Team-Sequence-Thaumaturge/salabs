<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JWT Secret Signer & Verification Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JWT Secret Signer","url":"https://salabs.quanxs.com/tools/jwt-signer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header style="text-align:center;"><h1 style="color:#38bdf8;">JWT Secret Signer Studio</h1></header><main class="container"><h3>Payload JSON</h3><textarea id="jwt-payload" rows="5">{"sub":"user_123","role":"admin"}</textarea><h3>Secret Key</h3><input type="text" id="jwt-secret" value="quanxs-secret-key-2026"><button onclick="signJWT()">Generate Signed JWT</button><h3>JWT Token</h3><div id="jwt-output" style="background:#0f172a;padding:1rem;border-radius:8px;word-break:break-all;color:#38bdf8;font-family:monospace;"></div></main><script>async function signJWT(){try{let header={alg:"HS256",typ:"JWT"};let payload=JSON.parse(document.getElementById('jwt-payload').value);let h64=b64Url(JSON.stringify(header));let p64=b64Url(JSON.stringify(payload));let data=`${h64}.${p64}`;let key=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById('jwt-secret').value),{name:"HMAC",hash:"SHA-256"},false,["sign"]);let sig=await crypto.subtle.sign("HMAC",key,new TextEncoder().encode(data));document.getElementById('jwt-output').innerText=`${data}.${b64UrlBuf(sig)}`;}catch(e){document.getElementById('jwt-output').innerText="Error: "+e.message;}}function b64Url(s){return btoa(unescape(encodeURIComponent(s))).replace(/=/g,'').replace(/\+/g,'-').replace(///g,'_');}function b64UrlBuf(b){let bin='';let bytes=new Uint8Array(b);for(let i=0;i<bytes.byteLength;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin).replace(/=/g,'').replace(/\+/g,'-').replace(///g,'_');}</script></body></html>
