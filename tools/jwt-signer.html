<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JWT Signer, Decoder & HMAC Verifier - SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JWT Signer Decoder","url":"https://salabs.quanxs.com/tools/jwt-signer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1100px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JWT Token Signer, Decoder & HMAC Verifier</h1></header><main class="container"><div class="grid"><div><h3>Header (JSON)</h3><textarea id="jwt-header" rows="3">{"alg": "HS256", "typ": "JWT"}</textarea><h3>Payload (JSON)</h3><textarea id="jwt-payload" rows="6">{"sub": "1234567890", "name": "Stella Architect"}</textarea><h3>Secret Key</h3><input type="text" id="jwt-secret" value="your-256-bit-secret"><button onclick="signJWT()">Sign & Generate JWT</button></div><div><h3>Generated / Decoded JWT Token</h3><textarea id="jwt-token" rows="12"></textarea><button onclick="verifyJWT()">Verify Signature</button><div id="verify-result" style="margin-top:1rem;font-weight:bold;"></div></div></div></main><script>function base64UrlEncode(s){return btoa(s).replace(/=/g,'').replace(/\+/g,'-').replace(///g,'_');}function base64UrlDecode(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return atob(s);}async function signJWT(){try{let h=document.getElementById('jwt-header').value,p=document.getElementById('jwt-payload').value,sec=document.getElementById('jwt-secret').value;let eH=base64UrlEncode(JSON.stringify(JSON.parse(h))),eP=base64UrlEncode(JSON.stringify(JSON.parse(p)));let uT=`${eH}.${eP}`;let sig=await computeHMACSHA256(sec,uT);document.getElementById('jwt-token').value=`${uT}.${sig}`;document.getElementById('verify-result').innerHTML='<span style="color:#4ade80;">JWT Signed Successfully!</span>';}catch(e){document.getElementById('verify-result').innerHTML=`<span style="color:#f87171;">Error: ${e.message}</span>`;}}async function verifyJWT(){try{let t=document.getElementById('jwt-token').value.trim(),sec=document.getElementById('jwt-secret').value;let parts=t.split('.');if(parts.length!==3)throw new Error('Invalid JWT');let[eH,eP,eS]=parts;let expSig=await computeHMACSHA256(sec,`${eH}.${eP}`);document.getElementById('jwt-header').value=JSON.stringify(JSON.parse(base64UrlDecode(eH)),null,2);document.getElementById('jwt-payload').value=JSON.stringify(JSON.parse(base64UrlDecode(eP)),null,2);document.getElementById('verify-result').innerHTML=eS===expSig?'<span style="color:#4ade80;">Verified (VALID)</span>':'<span style="color:#f87171;">Invalid Signature</span>';}catch(e){document.getElementById('verify-result').innerHTML=`<span style="color:#f87171;">Error: ${e.message}</span>`;}}async function computeHMACSHA256(sec,d){let enc=new TextEncoder();let k=await crypto.subtle.importKey('raw',enc.encode(sec),{name:'HMAC',hash:'SHA-256'},false,['sign']);let buf=await crypto.subtle.sign('HMAC',k,enc.encode(d));return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/=/g,'').replace(/\+/g,'-').replace(///g,'_');}</script></body></html>
