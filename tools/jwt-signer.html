<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JWT Signer & Inspector - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JWT Signer Inspector","url":"https://salabs.quanxs.com/tools/jwt-signer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1200px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}.status{padding:0.8rem;border-radius:6px;margin-top:1rem;font-weight:bold;}.valid{background:#064e3b;color:#34d399;}.invalid{background:#7f1d1d;color:#f87171;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JWT Signer & Signature Inspector</h1></header><main class="container"><div class="grid"><div><h3>Header</h3><textarea id="jwt-header" rows="3">{"alg": "HS256", "typ": "JWT"}</textarea><h3>Payload</h3><textarea id="jwt-payload" rows="5">{"sub": "1234567890", "name": "Quanxs SA Labs"}</textarea><h3>Secret</h3><input type="text" id="jwt-secret" value="secret"><div style="margin-top:1rem;"><button onclick="signJWT()">Generate Signed JWT</button></div></div><div><h3>Token</h3><textarea id="jwt-output" rows="6"></textarea><div style="margin-top:1rem;"><button onclick="verifyJWT()">Verify Signature</button></div><div id="verify-status"></div></div></div></main><script>function b64u(s){return btoa(s).replace(/=/g,'').replace(/\+/g,'-').replace(///g,'_');}function b64uBuf(b){return btoa(String.fromCharCode(...new Uint8Array(b))).replace(/=/g,'').replace(/\+/g,'-').replace(///g,'_');}async function signJWT(){let h=b64u(document.getElementById('jwt-header').value),p=b64u(document.getElementById('jwt-payload').value),s=document.getElementById('jwt-secret').value;let key=await crypto.subtle.importKey('raw',new TextEncoder().encode(s),{name:'HMAC',hash:'SHA-256'},false,['sign']);let sig=await crypto.subtle.sign('HMAC',key,new TextEncoder().encode(h+'.'+p));document.getElementById('jwt-output').value=h+'.'+p+'.'+b64uBuf(sig);}async function verifyJWT(){let t=document.getElementById('jwt-output').value.trim(),s=document.getElementById('jwt-secret').value,st=document.getElementById('verify-status');let parts=t.split('.');if(parts.length!==3){st.className='status invalid';st.innerText='Invalid JWT';return;}let key=await crypto.subtle.importKey('raw',new TextEncoder().encode(s),{name:'HMAC',hash:'SHA-256'},false,['sign']);let sig=await crypto.subtle.sign('HMAC',key,new TextEncoder().encode(parts[0]+'.'+parts[1]));if(parts[2]===b64uBuf(sig)){st.className='status valid';st.innerText='Signature Valid!';}else{st.className='status invalid';st.innerText='Invalid Signature';}}</script></body></html>
