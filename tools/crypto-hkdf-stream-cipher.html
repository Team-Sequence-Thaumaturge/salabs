<script>

async function runHKDFCryption() {
  const ikm = document.getElementById('ikm').value;
  const salt = document.getElementById('salt').value;
  const info = document.getElementById('info').value;
  const payload = document.getElementById('payload').value;
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(ikm), 'HKDF', false, ['deriveKey', 'deriveBits']);
  const derivedKey = await crypto.subtle.deriveKey(
    {
      name: 'HKDF',
      hash: 'SHA-256',
      salt: enc.encode(salt),
      info: enc.encode(info)
    },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    true,
    ['encrypt', 'decrypt']
  );
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ciphertext = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv: iv },
    derivedKey,
    enc.encode(payload)
  );
  const rawKey = await crypto.subtle.exportKey('raw', derivedKey);
  const toHex = buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  const out = `[HKDF 256-bit Derived Key]:\n${toHex(rawKey)}\n\n[AES-GCM IV (12 bytes)]:\n${toHex(iv)}\n\n[Ciphertext (Hex)]:\n${toHex(ciphertext)}\n\n[Status]: 100% Authenticated Encryption Complete (Zero Server Leaks)`;
  document.getElementById('output').innerText = out;
}
