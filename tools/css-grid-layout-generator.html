<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>CSS Grid Layout Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"CSS Grid Layout Studio","url":"https://salabs.quanxs.com/tools/css-grid-layout-generator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input[type="range"]{width:100%;margin-bottom:1rem;}.grid-preview{display:grid;gap:10px;background:#0f172a;padding:1rem;border-radius:8px;min-height:150px;}.grid-item{background:#0284c7;padding:1rem;text-align:center;border-radius:4px;font-weight:bold;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">CSS Grid Layout Studio</h1></header><main class="container"><label>Columns: <span id="v-cols">3</span></label><input type="range" id="cols" min="1" max="6" value="3" oninput="updateGrid()"><div id="grid-demo" class="grid-preview"></div><textarea id="css-out" rows="3" readonly></textarea></main><script>function updateGrid(){let cols=document.getElementById('cols').value;document.getElementById('v-cols').innerText=cols;let demo=document.getElementById('grid-demo');demo.style.gridTemplateColumns=`repeat(${cols}, 1fr)`;demo.innerHTML='';for(let i=1;i<=cols*2;i++){let div=document.createElement('div');div.className='grid-item';div.innerText=`Item ${i}`;demo.appendChild(div);}document.getElementById('css-out').value=`display: grid;
