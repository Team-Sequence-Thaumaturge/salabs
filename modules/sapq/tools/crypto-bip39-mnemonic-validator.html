<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Crypto BIP-39 Mnemonic Seed Inspector - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Crypto BIP-39 Mnemonic Seed Inspector","url":"https://salabs.quanxs.com/tools/crypto-bip39-mnemonic-validator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.status-box{padding:1rem;border-radius:8px;font-weight:bold;background:#334155;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">BIP-39 Mnemonic Seed Inspector</h1></header><main class="container"><h3>BIP-39 Seed Phrase</h3><textarea id="seed-in" rows="4" placeholder="abandon amount cancel outer echo" oninput="checkSeed()"></textarea><div id="status-out" class="status-box">Enter seed phrase above...</div></main><script>function checkSeed(){let words=document.getElementById('seed-in').value.trim().split(/\s+/).filter(Boolean);let box=document.getElementById('status-out');if(words.length===12||words.length===24){box.style.background='#16a34a';box.innerText=`✓ VALID SEED WORD COUNT (${words.length} Words Detected)`;}else{box.style.background='#334155';box.innerText=`Word Count: ${words.length} (Standard BIP-39 requires 12 or 24 words)`;}}</script></body></html>
