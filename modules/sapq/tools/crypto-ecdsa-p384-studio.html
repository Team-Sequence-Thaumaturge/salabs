<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto ECDSA P-384 Studio | SA Labs Developer Utilities</title>
  <meta name="description" content="100% Client-Side Web Crypto SubtleCrypto ECDSA P-384 Key Pair Generation & SHA-384 Digital Signature Studio.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Crypto ECDSA P-384 Studio",
    "url": "https://salabs.quanxs.com/tools/crypto-ecdsa-p384-studio.html",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript and Web Crypto API support"
  }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; }
    h1 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 0; }
    textarea, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #38bdf8; font-family: monospace; box-sizing: border-box; margin-bottom: 12px; }
    button { background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; border: none; }
    button:hover { background: #0284c7; color: white; }
  </style>
<script>

    async function generateECDSAKeys() {
      let out = document.getElementById('outputLog');
      out.value = 'Generating ECDSA P-384 Key Pair via Web Crypto SubtleAPI...\n';
      try {
        let keyPair = await window.crypto.subtle.generateKey(
          { name: 'ECDSA', namedCurve: 'P-384' },
          true,
          ['sign', 'verify']
        );
        let data = new TextEncoder().encode('SA Labs ECDSA P-384 Verification Payload');
        let sig = await window.crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-384' }, keyPair.privateKey, data);
        let hexSig = Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, '0')).join('');
        let isValid = await window.crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-384' }, keyPair.publicKey, sig, data);
        out.value += '✓ ECDSA P-384 Key Pair Generated Successfully.\n';
        out.value += '✓ SHA-384 Digital Signature: ' + hexSig.substring(0, 48) + '...\n';
        out.value += '✓ Signature Verification: ' + (isValid ? 'VALID (100% Client-Side Verified)' : 'INVALID') + '\n';
      } catch (e) {
        out.value += '✕ Web Crypto Error: ' + e.message;
      }
    }
  
</script>
</head>
<body>
  <div class="container">
    <h1>Crypto ECDSA P-384 Studio</h1>
    <p style="color: #94a3b8;">Client-side Web Crypto ECDSA P-384 Key Pair Generator & Digital Signature Verification Engine.</p>
    <button onclick="generateECDSAKeys()">Generate ECDSA P-384 Key Pair & Sign Benchmark</button>
    <textarea id="outputLog" rows="10" readonly placeholder="Benchmark results will appear here..."></textarea>
  </div>
  
</body>
</html>
