<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JS Object & Key Diff Checker - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JS Object & Key Diff Checker","url":"https://salabs.quanxs.com/tools/js-object-diff-checker.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JS Object & Key Diff Checker</h1></header><main class="container"><div class="grid"><div><h3>Object A</h3><textarea id="obj-a" rows="6" oninput="compareObjects()"></textarea></div><div><h3>Object B</h3><textarea id="obj-b" rows="6" oninput="compareObjects()"></textarea></div></div><h3>Diff Summary</h3><textarea id="diff-out" rows="6" readonly></textarea></main><script>function compareObjects(){let strA=document.getElementById('obj-a').value;let strB=document.getElementById('obj-b').value;if(!strA||!strB)return;try{let a=JSON.parse(strA),b=JSON.parse(strB),diffs=[],keys=new Set([...Object.keys(a),...Object.keys(b)]);for(let k of keys){if(!(k in a))diffs.push(`+ Added in B: ${k}`);else if(!(k in b))diffs.push(`- Missing in B: ${k}`);else if(JSON.stringify(a[k])!==JSON.stringify(b[k]))diffs.push(`~ Changed (${k}): ${JSON.stringify(a[k])} -> ${JSON.stringify(b[k])}`);}document.getElementById('diff-out').value=diffs.length>0?diffs.join('\n'):'Identical!';}catch(e){document.getElementById('diff-out').value='Invalid JSON: '+e.message;}}</script></body></html>
