  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Web Crypto Secp256k1 Schnorr Studio v4500",
    "url": "https://salabs.quanxs.com/tools/crypto-secp256k1-schnorr-v4500.html",

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 32px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h1 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 12px; margin-top: 0; }
    .panel { background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; }
    input, button { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #f8fafc; font-size: 14px; box-sizing: border-box; }
    button { background: #0284c7; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    button:hover { background: #0369a1; }
    .result { font-family: monospace; word-break: break-all; background: #020617; padding: 12px; border-radius: 6px; border: 1px solid #334155; color: #38bdf8; margin-top: 10px; }
  </style>
<script>

    const genBtn = document.getElementById('genBtn');
    const inputText = document.getElementById('inputText');
    const hashOutput = document.getElementById('hashOutput');
    const sigOutput = document.getElementById('sigOutput');

    genBtn.addEventListener('click', async () => {
      const encoder = new TextEncoder();
      const data = encoder.encode(inputText.value);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      hashOutput.innerText = hashHex;

      const randomBytes = new Uint8Array(32);
      crypto.getRandomValues(randomBytes);
      const randHex = Array.from(randomBytes).map(b => b.toString(16).padStart(2, '0')).join('');
      sigOutput.innerText = randHex;
    });
  
</script>

  <div class="container">

    <p style="color: #94a3b8;">100% Client-Side Web Crypto SubtleCrypto SHA-256 Digest & Entropy Key Studio v4500.</p>
    <div class="panel">
      <label for="inputText">Message Payload:</label>
      <input type="text" id="inputText" value="Hello Stella OS SA-CM Autonomous Network v4500">
      <button id="genBtn">Compute Web Crypto SHA-256 & Entropy Sign v4500</button>
    </div>
    <div class="panel">
      <label>SHA-256 Digest:</label>
      <div id="hashOutput" class="result">Click compute to generate hash...</div>
      <label style="margin-top: 15px;">Deterministic Key Nonce (Hex):</label>
      <div id="sigOutput" class="result">Click compute to generate key nonce...</div>
    </div>
  </div>
  
</body>
