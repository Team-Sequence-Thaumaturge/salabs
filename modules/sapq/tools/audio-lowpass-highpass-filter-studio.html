<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Lowpass & Highpass Filter Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Lowpass Highpass Filter Studio","url":"https://salabs.quanxs.com/tools/audio-lowpass-highpass-filter-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"],select{width:80%;margin:1rem 0;padding:0.5rem;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:6px;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Lowpass & Highpass Filter Studio</h1></header><main class="container"><button onclick="playFilterTone()">Play Filtered Audio Tone</button><select id="filter-type" onchange="updateFilter()"><option value="lowpass">Lowpass Filter</option><option value="highpass">Highpass Filter</option></select><p>Cutoff: <span id="cutoff-val">1000</span> Hz</p><input type="range" id="cutoff-slider" min="100" max="8000" step="50" value="1000" oninput="updateFilter()"></main><script>let audioCtx,osc,filterNode;function playFilterTone(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();osc=audioCtx.createOscillator();filterNode=audioCtx.createBiquadFilter();let type=document.getElementById('filter-type').value,freq=parseFloat(document.getElementById('cutoff-slider').value);osc.type='sawtooth';osc.frequency.value=440;filterNode.type=type;filterNode.frequency.value=freq;osc.connect(filterNode);filterNode.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.5);}function updateFilter(){let type=document.getElementById('filter-type').value,freq=document.getElementById('cutoff-slider').value;document.getElementById('cutoff-val').innerText=freq;if(filterNode){filterNode.type=type;filterNode.frequency.value=parseFloat(freq);}}</script></body></html>
