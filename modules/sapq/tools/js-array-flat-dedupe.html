<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JS Array Flattener & Deduplicator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JS Array Flattener & Deduplicator","url":"https://salabs.quanxs.com/tools/js-array-flat-dedupe.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JS Array Flattener & Deduplicator</h1></header><main class="container"><h3>1. Nested Array Input</h3><textarea id="arr-input" rows="6" oninput="processArray()"></textarea><h3>2. Result</h3><textarea id="arr-output" rows="6" readonly></textarea></main><script>function processArray(){let input=document.getElementById('arr-input').value;if(!input.trim()){document.getElementById('arr-output').value='';return;}try{let parsed=JSON.parse(input);if(!Array.isArray(parsed)){document.getElementById('arr-output').value='Error: Must be JSON array.';return;}document.getElementById('arr-output').value=JSON.stringify(Array.from(new Set(parsed.flat(Infinity))),null,2);}catch(e){document.getElementById('arr-output').value='Invalid JSON: '+e.message;}}</script></body></html>
