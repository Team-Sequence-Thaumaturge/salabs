<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Image Color Picker & Eyedropper - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Image Color Picker","url":"https://salabs.quanxs.com/tools/image-color-picker.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;}canvas{max-width:100%;border-radius:8px;border:1px solid #334155;cursor:crosshair;margin-top:1rem;}.color-card{display:flex;align-items:center;gap:1rem;background:#0f172a;padding:1rem;border-radius:8px;border:1px solid #334155;margin-top:1rem;}.swatch{width:48px;height:48px;border-radius:8px;border:1px solid #334155;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Image Color Picker & Eyedropper</h1></header><main class="container"><input type="file" id="file-in" accept="image/*" onchange="loadImage()"><canvas id="img-canvas" style="display:none;"></canvas><div class="color-card"><div id="swatch" class="swatch" style="background:#0f172a;"></div><div><p>HEX: <span id="hex-val">#0F172A</span></p><p>RGB: <span id="rgb-val">rgb(15, 23, 42)</span></p></div></div></main><script>function loadImage(){let f=document.getElementById('file-in').files[0];if(!f)return;let img=new Image();img.onload=function(){let cvs=document.getElementById('img-canvas');let ctx=cvs.getContext('2d');cvs.width=img.width;cvs.height=img.height;ctx.drawImage(img,0,0);cvs.style.display='block';cvs.onclick=function(e){let r=cvs.getBoundingClientRect();let x=Math.floor((e.clientX-r.left)*(cvs.width/r.width));let y=Math.floor((e.clientY-r.top)*(cvs.height/r.height));let p=ctx.getImageData(x,y,1,1).data;let h='#'+[p[0],p[1],p[2]].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();document.getElementById('swatch').style.background=h;document.getElementById('hex-val').innerText=h;document.getElementById('rgb-val').innerText=`rgb(${p[0]}, ${p[1]}, ${p[2]})`;};};img.src=URL.createObjectURL(f);}</script></body></html>
