<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Base64URL Safe Encoder & Decoder - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Base64URL Safe Encoder","url":"https://salabs.quanxs.com/tools/js-base64-url-safe-encoder.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Base64URL Safe Encoder & Decoder</h1></header><main class="container"><h3>Plain String Input</h3><textarea id="plain-in" rows="4" oninput="encodeURL()"></textarea><h3>Base64URL Output</h3><textarea id="b64-out" rows="4" oninput="decodeURL()"></textarea></main><script>function encodeURL(){let txt=document.getElementById('plain-in').value;let b64=btoa(encodeURIComponent(txt).replace(/%([0-9A-F]{2})/g,(match,p1)=>String.fromCharCode('0x'+p1)));let urlSafe=b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');document.getElementById('b64-out').value=urlSafe;}function decodeURL(){let urlSafe=document.getElementById('b64-out').value;let b64=urlSafe.replace(/-/g,'+').replace(/_/g,'/');while(b64.length%4)b64+='=';try{let txt=decodeURIComponent(atob(b64).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));document.getElementById('plain-in').value=txt;}catch(e){document.getElementById('plain-in').value='Invalid Base64URL';}}</script></body></html>
