<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto PBKDF2 Key & Salt Generator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto PBKDF2 Key & Salt Generator","url":"https://salabs.quanxs.com/tools/crypto-pbkdf2-salt-generator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input,textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">PBKDF2 Key Derivation Generator</h1></header><main class="container"><input type="text" id="pass" value="MySecretPassphrase123" oninput="deriveKey()"><input type="text" id="salt" value="a1b2c3d4e5f67890" oninput="deriveKey()"><input type="number" id="iters" value="100000" oninput="deriveKey()"><button onclick="deriveKey()">Derive Key</button><textarea id="key-out" rows="2" readonly></textarea></main><script>async function deriveKey(){let p=document.getElementById('pass').value,sHex=document.getElementById('salt').value.trim(),it=parseInt(document.getElementById('iters').value)||100000,out=document.getElementById('key-out');if(!p||!sHex){out.value='Enter passphrase and salt';return;}try{let enc=new TextEncoder();let baseKey=await window.crypto.subtle.importKey("raw",enc.encode(p),{name:"PBKDF2"},false,["deriveBits"]);let sBuf=new Uint8Array(sHex.match(/.{1,2}/g).map(b=>parseInt(b,16)));let dBuf=await window.crypto.subtle.deriveBits({name:"PBKDF2",salt:sBuf,iterations:it,hash:"SHA-256"},baseKey,256);let hex=Array.from(new Uint8Array(dBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');out.value=hex;}catch(e){out.value='Error: '+e.message;}}deriveKey();</script></body></html>
