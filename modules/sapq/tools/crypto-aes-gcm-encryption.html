<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto AES-GCM Encrypt & Decrypt Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto AES-GCM Encrypt & Decrypt Studio","url":"https://salabs.quanxs.com/tools/crypto-aes-gcm-encryption.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">AES-GCM Authenticated Encryption Studio</h1></header><main class="container"><input type="text" id="pass-key" placeholder="Secret Passphrase"><textarea id="plain-text" rows="3" placeholder="Plaintext"></textarea><button onclick="encryptAES()">Encrypt</button><button onclick="decryptAES()">Decrypt</button><textarea id="cipher-out" rows="4" placeholder="Base64 Ciphertext"></textarea></main><script>async function getAESKey(passStr){let enc=new TextEncoder();let k=await window.crypto.subtle.importKey("raw",enc.encode(passStr),"PBKDF2",false,["deriveKey"]);return window.crypto.subtle.deriveKey({name:"PBKDF2",salt:enc.encode("salabs_aes_salt"),iterations:100000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}async function encryptAES(){let pass=document.getElementById('pass-key').value,text=document.getElementById('plain-text').value;if(!pass||!text)return alert('Enter pass & text');try{let key=await getAESKey(pass),iv=window.crypto.getRandomValues(new Uint8Array(12)),enc=new TextEncoder();let buf=await window.crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,enc.encode(text));let comb=new Uint8Array(iv.length+buf.byteLength);comb.set(iv);comb.set(new Uint8Array(buf),iv.length);document.getElementById('cipher-out').value=btoa(String.fromCharCode.apply(null,comb));}catch(e){alert('Encrypt error: '+e.message);}}async function decryptAES(){let pass=document.getElementById('pass-key').value,c=document.getElementById('cipher-out').value.trim();if(!pass||!c)return alert('Enter pass & cipher');try{let raw=atob(c),buf=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)buf[i]=raw.charCodeAt(i);let iv=buf.slice(0,12),data=buf.slice(12),key=await getAESKey(pass);let dec=await window.crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,data);document.getElementById('plain-text').value=new TextDecoder().decode(dec);}catch(e){alert('Decrypt error: '+e.message);}}</script></body></html>
