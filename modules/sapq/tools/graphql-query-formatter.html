<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>GraphQL Query Formatter - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"GraphQL Query Formatter","url":"https://salabs.quanxs.com/tools/graphql-query-formatter.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">GraphQL Query Formatter</h1></header><main class="container"><h3>Raw Query</h3><textarea id="gql-in" rows="6" oninput="formatGQL()"></textarea><h3>Formatted Query</h3><textarea id="gql-out" rows="8" readonly></textarea></main><script>function formatGQL(){let str=document.getElementById('gql-in').value;if(!str.trim()){document.getElementById('gql-out').value='';return;}let indent=0,formatted='';for(let i=0;i<str.length;i++){let char=str[i];if(char==='{'){indent+=2;formatted+=' {\n'+' '.repeat(indent);}else if(char==='}'){indent=Math.max(0,indent-2);formatted+='\n'+' '.repeat(indent)+'}';}else if(char!=='\n'&&char!=='\r'){formatted+=char;}}document.getElementById('gql-out').value=formatted.replace(/\n\s*\n/g,'\n');}formatGQL();</script></body></html>
