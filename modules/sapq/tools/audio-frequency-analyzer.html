let audioCtx,analyser,dataArray,canvas,ctx;async function startAnalyzer(){try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=new(window.AudioContext||window.webkitAudioContext)();let src=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=64;src.connect(analyser);dataArray=new Uint8Array(analyser.frequencyBinCount);canvas=document.getElementById('fft-canvas');ctx=canvas.getContext('2d');drawFFT();document.getElementById('start-btn').innerText='Analyzing Microphone Audio...';}catch(e){alert('Audio Error: '+e.message);}}function drawFFT(){requestAnimationFrame(drawFFT);analyser.getByteFrequencyData(dataArray);ctx.clearRect(0,0,canvas.width,canvas.height);let barWidth=(canvas.width/dataArray.length)-2;let x=0;for(let i=0;i<dataArray.length;i++){let barHeight=dataArray[i];ctx.fillStyle='#38bdf8';ctx.fillRect(x,canvas.height-barHeight,barWidth,barHeight);x+=barWidth+2;}}
</script>
</head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Frequency Analyzer & FFT Visualizer</h1></header><main class="container"><button id="start-btn" onclick="startAnalyzer()">Start Mic Spectrum</button><canvas id="fft-canvas" width="800" height="300"></canvas></main></body></html>
