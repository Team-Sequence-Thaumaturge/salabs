<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto HKDF-SHA256 Streaming Key Derivation Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto HKDF-SHA256 Streaming Key Derivation Studio","url":"https://salabs.quanxs.com/tools/crypto-hkdf-sha256-streaming-derivation.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input,textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">HKDF-SHA256 Key Derivation Studio</h1></header><main class="container"><label>IKM</label><input type="text" id="ikm-in" value="ikm_secret_key_material_123" oninput="deriveHKDF()"><label>Salt</label><input type="text" id="salt-in" value="salt_456" oninput="deriveHKDF()"><label>Info</label><input type="text" id="info-in" value="handshake_v1" oninput="deriveHKDF()"><button onclick="deriveHKDF()">Derive HKDF Key</button><textarea id="hkdf-out" rows="2" readonly></textarea></main><script>async function deriveHKDF(){let ikm=document.getElementById('ikm-in').value,salt=document.getElementById('salt-in').value,info=document.getElementById('info-in').value,out=document.getElementById('hkdf-out');if(!ikm)return;try{let enc=new TextEncoder();let baseKey=await window.crypto.subtle.importKey("raw",enc.encode(ikm),"HKDF",false,["deriveBits"]);let derivedBuf=await window.crypto.subtle.deriveBits({name:"HKDF",hash:"SHA-256",salt:enc.encode(salt),info:enc.encode(info)},baseKey,256);let hex=Array.from(new Uint8Array(derivedBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');out.value=hex;}catch(e){out.value='HKDF Error: '+e.message;}}deriveHKDF();</script></body></html>
