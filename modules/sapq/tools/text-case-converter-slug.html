<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Text Case Converter & Slugifier - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Text Case Converter & Slugifier","url":"https://salabs.quanxs.com/tools/text-case-converter-slug.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Text Case Converter & URL Slugifier</h1></header><main class="container"><h3>Source Text</h3><textarea id="text-in" rows="3" oninput="convertCases()">Hello World Developer Suite</textarea><h3>camelCase</h3><input type="text" id="out-camel" readonly><h3>kebab-case</h3><input type="text" id="out-kebab" readonly><h3>snake_case</h3><input type="text" id="out-snake" readonly><h3>URL Slug</h3><input type="text" id="out-slug" readonly></main><script>function convertCases(){let s=document.getElementById('text-in').value.trim();if(!s){document.getElementById('out-camel').value='';document.getElementById('out-kebab').value='';document.getElementById('out-snake').value='';document.getElementById('out-slug').value='';return;}let w=s.match(/[A-Z]{2,}(?=[A-Z][a-z]+[0-9]*|\b)|[A-Z]?[a-z]+[0-9]*|[A-Z]+|[0-9]+/g)||[s];let lw=w.map(x=>x.toLowerCase());document.getElementById('out-camel').value=lw.map((x,i)=>i===0?x:x.charAt(0).toUpperCase()+x.slice(1)).join('');document.getElementById('out-kebab').value=lw.join('-');document.getElementById('out-snake').value=lw.join('_');document.getElementById('out-slug').value=lw.join('-').replace(/[^a-z0-9-]/g,'');}convertCases();</script></body></html>
