<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas Image Rotate & Flip Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas Image Rotate Studio","url":"https://salabs.quanxs.com/tools/html-canvas-crop-rotate-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}input[type="file"]{width:100%;margin-bottom:1rem;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}canvas{background:#0f172a;border-radius:8px;border:1px solid #334155;max-width:100%;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas Image Rotate & Flip Studio</h1></header><main class="container"><input type="file" id="img-in" accept="image/*" onchange="loadImage()"><button onclick="rotate(90)">Rotate 90°</button><button onclick="flipH()">Flip Horizontal</button><canvas id="cvs" width="400" height="300"></canvas></main><script>let canvas=document.getElementById('cvs'),ctx=canvas.getContext('2d'),img=new Image(),currentAngle=0,scaleH=1;function loadImage(){let file=document.getElementById('img-in').files[0];if(!file)return;let reader=new FileReader();reader.onload=e=>{img.onload=()=>draw();img.src=e.target.result;};reader.readAsDataURL(file);}function draw(){if(!img.src)return;canvas.width=img.width;canvas.height=img.height;ctx.save();ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(currentAngle*Math.PI/180);ctx.scale(scaleH,1);ctx.drawImage(img,-img.width/2,-img.height/2);ctx.restore();}function rotate(deg){currentAngle+=deg;draw();}function flipH(){scaleH*=-1;draw();}</script></body></html>
