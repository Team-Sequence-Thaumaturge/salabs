<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto AES-GCM Vault Engine - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto AES-GCM Vault Engine","url":"https://salabs.quanxs.com/tools/crypto-aes-gcm-vault-engine.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;border:1px solid #334155;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}textarea,input{width:100%;background:#0f172a;color:#38bdf8;border:1px solid #334155;border-radius:8px;padding:1rem;box-sizing:border-box;font-family:monospace;margin-bottom:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Web Crypto AES-GCM Vault Engine</h1></header><main class="container"><h3>Passphrase / Secret Key</h3><input type="password" id="vault-pass" value="QuanxsSecretPass2026"><h3>Plaintext Message</h3><textarea id="vault-plain" rows="4">Secret Payload Data for Client-Side Vault Engine</textarea><button onclick="encryptAESGCM()">Encrypt Message (AES-GCM)</button><button onclick="decryptAESGCM()">Decrypt Message (AES-GCM)</button><h3>Ciphertext / Result</h3><textarea id="vault-cipher" rows="4" readonly></textarea></main><script>async function getKey(pass,salt){let enc=new TextEncoder();let keyMaterial=await window.crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);return window.crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},keyMaterial,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}async function encryptAESGCM(){let pass=document.getElementById('vault-pass').value,plain=document.getElementById('vault-plain').value;let salt=window.crypto.getRandomValues(new Uint8Array(16)),iv=window.crypto.getRandomValues(new Uint8Array(12));let key=await getKey(pass,salt),enc=new TextEncoder();let cipherBuf=await window.crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,enc.encode(plain));let combined=new Uint8Array(salt.length+iv.length+cipherBuf.byteLength);combined.set(salt,0);combined.set(iv,salt.length);combined.set(new Uint8Array(cipherBuf),salt.length+iv.length);document.getElementById('vault-cipher').value=btoa(String.fromCharCode.apply(null,combined));}async function decryptAESGCM(){let pass=document.getElementById('vault-pass').value,base64=document.getElementById('vault-cipher').value;try{let bytes=new Uint8Array(atob(base64).split("").map(c=>c.charCodeAt(0)));let salt=bytes.slice(0,16),iv=bytes.slice(16,28),data=bytes.slice(28);let key=await getKey(pass,salt);let decBuf=await window.crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,data);document.getElementById('vault-plain').value=new TextDecoder().decode(decBuf);}catch(e){alert("Decryption failed: "+e.message);}}</script></body></html>
