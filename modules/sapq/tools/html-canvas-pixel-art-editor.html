<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas Pixel Art Grid Editor - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas Pixel Art Grid Editor","url":"https://salabs.quanxs.com/tools/html-canvas-pixel-art-editor.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}canvas{background:#0f172a;border-radius:8px;border:1px solid #334155;cursor:crosshair;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas Pixel Art Grid Editor</h1></header><main class="container"><label>Draw Color: </label><input type="color" id="pixel-color" value="#38bdf8"><br><canvas id="pixel-canvas" width="320" height="320"></canvas></main><script>let cvs=document.getElementById('pixel-canvas'),ctx=cvs.getContext('2d'),gridSize=16,pixelSize=20;function drawGrid(){ctx.fillStyle='#0f172a';ctx.fillRect(0,0,cvs.width,cvs.height);ctx.strokeStyle='#334155';for(let i=0;i<=gridSize;i++){ctx.beginPath();ctx.moveTo(i*pixelSize,0);ctx.lineTo(i*pixelSize,cvs.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*pixelSize);ctx.lineTo(cvs.width,i*pixelSize);ctx.stroke();}}drawGrid();cvs.addEventListener('click',e=>{let rect=cvs.getBoundingClientRect();let x=Math.floor((e.clientX-rect.left)/pixelSize),y=Math.floor((e.clientY-rect.top)/pixelSize);ctx.fillStyle=document.getElementById('pixel-color').value;ctx.fillRect(x*pixelSize,y*pixelSize,pixelSize,pixelSize);});</script></body></html>
