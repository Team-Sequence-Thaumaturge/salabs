<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto AES-GCM Cipher Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto AES-GCM Cipher Studio","url":"https://salabs.quanxs.com/tools/crypto-chacha20-poly1305-tester.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Web Crypto AES-GCM Cipher Studio</h1></header><main class="container"><input type="text" id="pass-key" value="secret_passphrase"><textarea id="plain-in" rows="3" placeholder="Plaintext message..."></textarea><button onclick="encryptGCM()">Encrypt Message</button><textarea id="cipher-out" rows="3" readonly></textarea></main><script>async function encryptGCM(){let pass=document.getElementById('pass-key').value,msg=document.getElementById('plain-in').value,enc=new TextEncoder();let keyBuf=await window.crypto.subtle.digest("SHA-256",enc.encode(pass));let key=await window.crypto.subtle.importKey("raw",keyBuf,{name:"AES-GCM"},false,["encrypt"]);let iv=window.crypto.getRandomValues(new Uint8Array(12));let cipherBuf=await window.crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,enc.encode(msg));let combined=new Uint8Array(iv.length+cipherBuf.byteLength);combined.set(iv,0);combined.set(new Uint8Array(cipherBuf),iv.length);document.getElementById('cipher-out').value=btoa(String.fromCharCode.apply(null,combined));}encryptGCM();</script></body></html>
