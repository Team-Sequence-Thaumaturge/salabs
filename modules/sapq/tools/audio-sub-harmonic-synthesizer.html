<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Sub-Harmonic Synthesizer - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Sub-Harmonic Synthesizer","url":"https://salabs.quanxs.com/tools/audio-sub-harmonic-synthesizer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Sub-Harmonic Synthesizer</h1></header><main class="container"><button onclick="playSubHarmonic()">Play Sub-Harmonic Bass</button><p>Base Frequency (<span id="freq-val">110</span> Hz)</p><input type="range" id="freq-slider" min="55" max="440" value="110" oninput="updateSub()"></main><script>let audioCtx,oscMain,oscSub;function playSubHarmonic(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(oscMain)oscMain.stop();if(oscSub)oscSub.stop();let freq=parseFloat(document.getElementById('freq-slider').value);oscMain=audioCtx.createOscillator();oscSub=audioCtx.createOscillator();oscMain.type='sawtooth';oscMain.frequency.value=freq;oscSub.type='sine';oscSub.frequency.value=freq/2;let gain=audioCtx.createGain();gain.gain.value=0.5;oscMain.connect(gain);oscSub.connect(gain);gain.connect(audioCtx.destination);oscMain.start();oscSub.start();oscMain.stop(audioCtx.currentTime+1.5);oscSub.stop(audioCtx.currentTime+1.5);}function updateSub(){let v=document.getElementById('freq-slider').value;document.getElementById('freq-val').innerText=v;}</script></body></html>
