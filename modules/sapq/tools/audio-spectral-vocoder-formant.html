<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Spectral Formant Vocoder - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Spectral Formant Vocoder","url":"https://salabs.quanxs.com/tools/audio-spectral-vocoder-formant.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Spectral Formant Vocoder</h1></header><main class="container"><button onclick="playFormant()">Play Formant Tone</button><p>Formant Frequency (<span id="formant-val">800</span> Hz)</p><input type="range" id="formant-slider" min="200" max="3000" value="800" oninput="updateFormant()"></main><script>let audioCtx,osc,filter;function playFormant(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();osc=audioCtx.createOscillator();filter=audioCtx.createBiquadFilter();let fVal=parseFloat(document.getElementById('formant-slider').value);osc.type='sawtooth';osc.frequency.value=130;filter.type='bandpass';filter.frequency.value=fVal;filter.Q.value=8;osc.connect(filter);filter.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.2);}function updateFormant(){let v=document.getElementById('formant-slider').value;document.getElementById('formant-val').innerText=v;if(filter)filter.frequency.value=parseFloat(v);}</script></body></html>
