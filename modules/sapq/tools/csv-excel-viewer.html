<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>CSV & Spreadsheet Table Viewer - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"CSV Spreadsheet Table Viewer","url":"https://salabs.quanxs.com/tools/csv-excel-viewer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}table{width:100%;border-collapse:collapse;margin-top:1rem;}th,td{border:1px solid #334155;padding:0.5rem;text-align:left;}th{background:#0f172a;color:#38bdf8;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">CSV & Spreadsheet Table Viewer</h1></header><main class="container"><h3>CSV Input</h3><textarea id="csv-in" rows="5" oninput="renderTable()"></textarea><div id="table-out"></div></main><script>function renderTable(){let text=document.getElementById('csv-in').value.trim();if(!text){document.getElementById('table-out').innerHTML='';return;}let lines=text.split('\n');let html='<table>';lines.forEach((line,idx)=>{let cols=line.split(',').map(c=>c.trim());html+='<tr>';cols.forEach(c=>{if(idx===0)html+=`<th>${c}</th>`;else html+=`<td>${c}</td>`;});html+='</tr>';});html+='</table>';document.getElementById('table-out').innerHTML=html;}renderTable();</script></body></html>
