<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto AES-CTR Encryption Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto AES-CTR Encryption Studio","url":"https://salabs.quanxs.com/tools/crypto-aes-ctr-encryptor.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">AES-CTR Stream Encryption Studio</h1></header><main class="container"><input type="password" id="ctr-pass" value="StreamCipherSecret123"><textarea id="ctr-plain" rows="3">Sensitive AES-CTR stream payload</textarea><button onclick="encryptCTR()">Encrypt AES-CTR</button><textarea id="ctr-cipher" rows="3" readonly></textarea></main><script>async function encryptCTR(){let pass=document.getElementById('ctr-pass').value,text=document.getElementById('ctr-plain').value;if(!pass||!text)return;try{let enc=new TextEncoder(),counter=window.crypto.getRandomValues(new Uint8Array(16));let keyMat=await window.crypto.subtle.importKey("raw",enc.encode(pass.padEnd(32,'0').slice(0,32)),{name:"AES-CTR"},false,["encrypt"]);let encrypted=await window.crypto.subtle.encrypt({name:"AES-CTR",counter:counter,length:64},keyMat,enc.encode(text));document.getElementById('ctr-cipher').value=Array.from(new Uint8Array(encrypted)).map(b=>b.toString(16).padStart(2,'0')).join('');}catch(e){alert('CTR Encryption Error: '+e.message);}}</script></body></html>
