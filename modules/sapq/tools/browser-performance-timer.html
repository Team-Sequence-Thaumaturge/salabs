<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Browser Performance & Navigation Timing Benchmarker - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Browser Performance Benchmarker","url":"https://salabs.quanxs.com/tools/browser-performance-timer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}.metric-card{background:#0f172a;padding:1rem;border-radius:8px;border:1px solid #334155;margin-top:1rem;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Browser Performance Benchmarker</h1></header><main class="container"><button onclick="measurePerf()">Measure Performance</button><div id="perf-output" class="metric-card"></div></main><script>function measurePerf(){let [n]=performance.getEntriesByType('navigation');let m=performance.memory?(performance.memory.usedJSHeapSize/1048576).toFixed(2)+' MB':'N/A';document.getElementById('perf-output').innerText=`DNS: ${(n.domainLookupEnd-n.domainLookupStart).toFixed(2)} ms
TCP: ${(n.connectEnd-n.connectStart).toFixed(2)} ms
TTFB: ${(n.responseStart-n.requestStart).toFixed(2)} ms
DOM Interactive: ${(n.domInteractive-n.startTime).toFixed(2)} ms
Heap: ${m}`;}measurePerf();</script></body></html>
