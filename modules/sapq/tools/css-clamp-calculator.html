<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>CSS Clamp() Fluid Typography Calculator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"CSS Clamp Calculator","url":"https://salabs.quanxs.com/tools/css-clamp-calculator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input,textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">CSS Clamp Calculator</h1></header><main class="container"><label>Min Viewport (px)</label><input type="number" id="min-v" value="375" oninput="calcClamp()"><label>Max Viewport (px)</label><input type="number" id="max-v" value="1280" oninput="calcClamp()"><label>Min Size (px)</label><input type="number" id="min-s" value="16" oninput="calcClamp()"><label>Max Size (px)</label><input type="number" id="max-s" value="24" oninput="calcClamp()"><textarea id="clamp-output" rows="3" readonly></textarea></main><script>function calcClamp(){let minV=parseFloat(document.getElementById('min-v').value)||375,maxV=parseFloat(document.getElementById('max-v').value)||1280,minS=parseFloat(document.getElementById('min-s').value)||16,maxS=parseFloat(document.getElementById('max-s').value)||24;let slope=(maxS-minS)/(maxV-minV),yInt=-minV*slope+minS;let res=`font-size: clamp(${(minS/16).toFixed(4)}rem, ${(yInt/16).toFixed(4)}rem + ${(slope*100).toFixed(4)}vw, ${(maxS/16).toFixed(4)}rem);`;document.getElementById('clamp-output').value=res;}calcClamp();</script></body></html>
