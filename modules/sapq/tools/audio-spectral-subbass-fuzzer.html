<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Subbass Fuzzer & Sub-Harmonic Generator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Subbass Fuzzer","url":"https://salabs.quanxs.com/tools/audio-spectral-subbass-fuzzer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Subbass Fuzzer</h1></header><main class="container"><button onclick="playSubbass()">Play Subbass Synth Tone</button><p>Subbass Frequency (<span id="freq-val">55</span> Hz)</p><input type="range" id="freq-slider" min="30" max="120" value="55" oninput="updateSubbass()"></main><script>let audioCtx,osc,filter;function playSubbass(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();osc=audioCtx.createOscillator();filter=audioCtx.createBiquadFilter();let f=parseFloat(document.getElementById('freq-slider').value);osc.type='sine';osc.frequency.value=f;filter.type='lowpass';filter.frequency.value=f*2;osc.connect(filter);filter.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.8);}function updateSubbass(){let v=document.getElementById('freq-slider').value;document.getElementById('freq-val').innerText=v;if(osc)osc.frequency.value=parseFloat(v);}</script></body></html>
