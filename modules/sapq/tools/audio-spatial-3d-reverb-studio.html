<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio 3D Reverb & HRTF Panner Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio 3D Reverb & HRTF Panner Studio","url":"https://salabs.quanxs.com/tools/audio-spatial-3d-reverb-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio 3D Reverb & HRTF Panner Studio</h1></header><main class="container"><button onclick="playHRTF()">Play 3D HRTF Spatial Tone</button><p>Position X (<span id="x-val">0.0</span>)</p><input type="range" id="x-slider" min="-5" max="5" step="0.2" value="0" oninput="updateHRTF()"></main><script>let audioCtx,osc,panner;function playHRTF(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();osc=audioCtx.createOscillator();panner=audioCtx.createPanner();panner.panningModel='HRTF';let xVal=parseFloat(document.getElementById('x-slider').value);panner.positionX.value=xVal;osc.type='sawtooth';osc.frequency.value=320;osc.connect(panner);panner.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.5);}function updateHRTF(){let v=document.getElementById('x-slider').value;document.getElementById('x-val').innerText=v;if(panner)panner.positionX.value=parseFloat(v);}</script></body></html>
