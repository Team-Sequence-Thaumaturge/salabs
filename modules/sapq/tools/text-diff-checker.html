<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Text Diff Checker & Line Comparator - SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Text Diff Checker","url":"https://salabs.quanxs.com/tools/text-diff-checker.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1100px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}textarea{width:100%;height:200px;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:1rem;}.diff-output{margin-top:1.5rem;background:#0f172a;padding:1rem;border-radius:8px;font-family:monospace;min-height:150px;white-space:pre-wrap;}.added{background:#065f46;color:#34d399;display:block;}.removed{background:#991b1b;color:#fca5a5;display:block;}.same{color:#94a3b8;display:block;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Text Diff Checker</h1></header><main class="container"><div class="grid"><div><h3>Text A</h3><textarea id="text-a"></textarea></div><div><h3>Text B</h3><textarea id="text-b"></textarea></div></div><button onclick="compareText()">Compare Differences</button><div id="diff-result" class="diff-output"></div></main><script>function compareText(){let a=document.getElementById('text-a').value.split('\n');let b=document.getElementById('text-b').value.split('\n');let len=Math.max(a.length,b.length);let out=[];for(let i=0;i<len;i++){let la=a[i],lb=b[i];if(la===lb){if(la!==undefined)out.push('<span class="same">  '+esc(la)+'</span>');}else{if(la!==undefined)out.push('<span class="removed">- '+esc(la)+'</span>');if(lb!==undefined)out.push('<span class="added">+ '+esc(lb)+'</span>');}}document.getElementById('diff-result').innerHTML=out.join('');}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}</script></body></html>
