<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Sub-Bass Oscillator Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Sub-Bass Oscillator Studio","url":"https://salabs.quanxs.com/tools/audio-sub-synth-subbass.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Sub-Bass Oscillator Studio</h1></header><main class="container"><button onclick="playSubBass()">Play Sub-Bass Pulse</button><p>Sub Frequency (<span id="sub-val">40</span> Hz)</p><input type="range" id="sub-slider" min="30" max="120" value="40" oninput="updateSub()"></main><script>let audioCtx,osc;function playSubBass(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();osc=audioCtx.createOscillator();let freq=parseFloat(document.getElementById('sub-slider').value);osc.type='sine';osc.frequency.value=freq;osc.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.5);}function updateSub(){let v=document.getElementById('sub-slider').value;document.getElementById('sub-val').innerText=v;if(osc)osc.frequency.value=parseFloat(v);}</script></body></html>
