<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto RSA-OAEP Encryption Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto RSA-OAEP Encryption Studio","url":"https://salabs.quanxs.com/tools/crypto-subtle-rsa-oaep-cipher.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Web Crypto RSA-OAEP Encryption Studio</h1></header><main class="container"><button onclick="genRSAKey()">1. Generate RSA Keypair</button><textarea id="pub-key" rows="4" readonly></textarea><textarea id="plain-text" rows="3">Confidential Web3 payload</textarea><button onclick="encryptRSA()">2. Encrypt Message</button><textarea id="cipher-out" rows="3" readonly></textarea></main><script>let keyPair=null;async function genRSAKey(){try{keyPair=await window.crypto.subtle.generateKey({name:"RSA-OAEP",modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:"SHA-256"},true,["encrypt","decrypt"]);let pubJwk=await window.crypto.subtle.exportKey("jwk",keyPair.publicKey);document.getElementById('pub-key').value=JSON.stringify(pubJwk,null,2);}catch(e){alert('Keygen Error: '+e.message);}}async function encryptRSA(){if(!keyPair){alert('Generate keypair first.');return;}try{let enc=new TextEncoder();let txt=document.getElementById('plain-text').value;let encrypted=await window.crypto.subtle.encrypt({name:"RSA-OAEP"},keyPair.publicKey,enc.encode(txt));document.getElementById('cipher-out').value=btoa(String.fromCharCode.apply(null,new Uint8Array(encrypted)));}catch(e){alert('Encryption Error: '+e.message);}}</script></body></html>
