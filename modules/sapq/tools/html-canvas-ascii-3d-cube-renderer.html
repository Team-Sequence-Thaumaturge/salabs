<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas ASCII 3D Cube Renderer - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas ASCII 3D Cube Renderer","url":"https://salabs.quanxs.com/tools/html-canvas-ascii-3d-cube-renderer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}textarea{width:100%;background:#0f172a;color:#38bdf8;border:1px solid #334155;border-radius:8px;padding:1rem;font-family:monospace;line-height:1;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas ASCII 3D Cube Renderer</h1></header><main class="container"><textarea id="ascii-out" rows="20" readonly></textarea></main><script>let A=0,B=0;function renderCube(){let buffer=Array(20*40).fill(' ');A+=0.05;B+=0.03;let cA=Math.cos(A),sA=Math.sin(A),cB=Math.cos(B),sB=Math.sin(B);for(let x=-10;x<=10;x+=2){for(let y=-10;y<=10;y+=2){for(let z=-10;z<=10;z+=2){if(Math.abs(x)===10||Math.abs(y)===10||Math.abs(z)===10){let x1=x*cB+z*sB,z1=-x*sB+z*cB,y1=y*cA-z1*sA;let px=Math.floor(20+x1*0.8),py=Math.floor(10+y1*0.4);if(px>=0&&px<40&&py>=0&&py<20)buffer[py*40+px]='#';}}}}let str='';for(let i=0;i<20;i++)str+=buffer.slice(i*40,(i+1)*40).join('')+'\n';document.getElementById('ascii-out').value=str;requestAnimationFrame(renderCube);}renderCube();</script></body></html>
