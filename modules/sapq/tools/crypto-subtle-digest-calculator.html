<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto SubtleDigest Multi-Hash Calculator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto SubtleDigest Multi-Hash Calculator","url":"https://salabs.quanxs.com/tools/crypto-subtle-digest-calculator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">SubtleDigest Multi-Hash Calculator</h1></header><main class="container"><h3>Source Text</h3><textarea id="src-in" rows="4" oninput="calcDigests()"></textarea><h3>SHA-256</h3><input type="text" id="sha256-out" readonly><h3>SHA-384</h3><input type="text" id="sha384-out" readonly><h3>SHA-512</h3><input type="text" id="sha512-out" readonly></main><script>async function getDigest(a,d){let b=await window.crypto.subtle.digest(a,d);return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}async function calcDigests(){let t=document.getElementById('src-in').value;if(!t){document.getElementById('sha256-out').value='';document.getElementById('sha384-out').value='';document.getElementById('sha512-out').value='';return;}let enc=new TextEncoder().encode(t);document.getElementById('sha256-out').value=await getDigest("SHA-256",enc);document.getElementById('sha384-out').value=await getDigest("SHA-384",enc);document.getElementById('sha512-out').value=await getDigest("SHA-512",enc);}</script></body></html>
