<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JS Custom Event Playground - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JS Custom Event Playground","url":"https://salabs.quanxs.com/tools/js-event-emitter-playground.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JS Custom Event & Pub/Sub Studio</h1></header><main class="container"><h3>1. Event Name</h3><input type="text" id="evt-name" value="user:login"><h3>2. Payload</h3><textarea id="evt-payload" rows="3">{"userId": 101}</textarea><button onclick="emitCustomEvent()">Emit Event</button><h3>3. Log</h3><textarea id="evt-log" rows="6" readonly></textarea></main><script>let bus=new EventTarget(),logBox=document.getElementById('evt-log');function emitCustomEvent(){let name=document.getElementById('evt-name').value.trim();let rawPayload=document.getElementById('evt-payload').value;try{let payload=JSON.parse(rawPayload);let evt=new CustomEvent(name,{detail:payload});bus.addEventListener(name,function handler(e){logBox.value=`[${new Date().toLocaleTimeString()}] Event '${e.type}': ${JSON.stringify(e.detail)}
`+logBox.value;bus.removeEventListener(name,handler);});bus.dispatchEvent(evt);}catch(e){alert('Invalid JSON Payload: '+e.message);}}</script></body></html>
