<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Phaser & Flanger FX Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Phaser & Flanger FX Studio","url":"https://salabs.quanxs.com/tools/audio-phaser-flanger-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Phaser & Flanger FX Studio</h1></header><main class="container"><button onclick="playPhaserTone()">Play Phaser Tone</button><p>Freq: <span id="freq-val">1000</span> Hz</p><input type="range" id="freq-slider" min="200" max="4000" step="50" value="1000" oninput="updatePhaser()"></main><script>let audioCtx,osc,filter;function playPhaserTone(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();osc=audioCtx.createOscillator();filter=audioCtx.createBiquadFilter();filter.type='allpass';filter.frequency.value=parseFloat(document.getElementById('freq-slider').value);osc.type='sawtooth';osc.frequency.value=220;osc.connect(filter);filter.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.5);}function updatePhaser(){let v=document.getElementById('freq-slider').value;document.getElementById('freq-val').innerText=v;if(filter)filter.frequency.value=parseFloat(v);}</script></body></html>
