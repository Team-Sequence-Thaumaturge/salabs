');}function convertYamlToJson(){let y=document.getElementById('yaml-val').value;if(!y.trim()){document.getElementById('json-val').value='';return;}try{let lines=y.split('
');let obj={};for(let line of lines){let parts=line.split(':');if(parts.length>=2){let k=parts[0].trim();let v=parts.slice(1).join(':').trim();try{v=JSON.parse(v);}catch(e){}if(k)obj[k]=v;}}document.getElementById('json-val').value=JSON.stringify(obj,null,2);}catch(e){document.getElementById('json-val').value='Invalid YAML';}}</script></body></html>
