<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto ChaCha20 Key Derivation Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto ChaCha20 Key Derivation Studio","url":"https://salabs.quanxs.com/tools/crypto-chacha20-poly1305-key-derivation.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">ChaCha20 Key Derivation Studio</h1></header><main class="container"><input type="password" id="pass-in" value="ChaChaSecret2026" oninput="deriveChaChaKey()"><input type="text" id="key-out" readonly><input type="text" id="nonce-out" readonly></main><script>async function deriveChaChaKey(){let pass=document.getElementById('pass-in').value;if(!pass)return;try{let enc=new TextEncoder(),salt=enc.encode("ChaCha20SaltVal");let keyMat=await window.crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveBits"]);let bits=await window.crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:50000,hash:"SHA-256"},keyMat,384);let bytes=new Uint8Array(bits);document.getElementById('key-out').value=Array.from(bytes.slice(0,32)).map(b=>b.toString(16).padStart(2,'0')).join('');document.getElementById('nonce-out').value=Array.from(bytes.slice(32,44)).map(b=>b.toString(16).padStart(2,'0')).join('');}catch(e){}}deriveChaChaKey();</script></body></html>
