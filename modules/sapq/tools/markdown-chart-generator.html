<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Markdown Canvas Chart Generator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Markdown Canvas Chart Generator","url":"https://salabs.quanxs.com/tools/markdown-chart-generator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:900px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;font-family:monospace;}canvas{background:#0f172a;border-radius:8px;width:100%;height:240px;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Markdown Canvas Chart Generator</h1></header><main class="container"><h3>Labels</h3><textarea id="labels-in" rows="2" oninput="renderChart()">Jan, Feb, Mar, Apr, May</textarea><h3>Values</h3><textarea id="values-in" rows="2" oninput="renderChart()">12, 19, 8, 15, 22</textarea><canvas id="chart-canvas" width="600" height="240"></canvas></main><script>function renderChart(){let c=document.getElementById('chart-canvas'),ctx=c.getContext('2d');let l=document.getElementById('labels-in').value.split(',').map(s=>s.trim());let v=document.getElementById('values-in').value.split(',').map(s=>parseFloat(s.trim())||0);ctx.clearRect(0,0,c.width,c.height);let max=Math.max(...v,10),w=(c.width-80)/v.length;v.forEach((val,i)=>{let h=(val/max)*(c.height-60),x=40+i*w,y=c.height-30-h;ctx.fillStyle='#38bdf8';ctx.fillRect(x+10,y,w-20,h);ctx.fillStyle='#f8fafc';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText(l[i]||'',x+w/2,c.height-10);ctx.fillText(val,x+w/2,y-5);});}renderChart();</script></body></html>
