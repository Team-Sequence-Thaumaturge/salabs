</head><body><header><h1 style="color:#38bdf8;text-align:center;">Web Crypto Secure Token Generator</h1></header><main class="container"><label>Token Byte Length</label><input type="number" id="byte-len" value="32" min="8" max="256"><button onclick="generateToken()">Generate Secure Token</button><h3>Hex Token</h3><input type="text" id="hex-out" readonly><h3>Base64URL Token</h3><input type="text" id="base64-out" readonly></main></body></html>
