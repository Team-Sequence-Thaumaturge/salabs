<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Key Derivation & PBKDF2 Password Hash Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Key Derivation Password Hash Studio","url":"https://salabs.quanxs.com/tools/hash-bcrypt-argon-tester.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input,textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Key Derivation & Password Hash Studio</h1></header><main class="container"><h3>Password</h3><input type="text" id="pass-input" value="SecretP@ssw0rd!2026"><h3>Salt</h3><input type="text" id="salt-input" value="salabs_salt_value"><h3>Iterations</h3><input type="number" id="iter-input" value="100000"><button onclick="derivePBKDF2()">Generate PBKDF2 Key</button><textarea id="hash-output" rows="3" readonly></textarea></main><script>async function derivePBKDF2(){let pass=document.getElementById('pass-input').value;let salt=document.getElementById('salt-input').value;let iter=parseInt(document.getElementById('iter-input').value)||100000;let enc=new TextEncoder();let keyMaterial=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits','deriveKey']);let derivedBits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:iter,hash:'SHA-256'},keyMaterial,256);let hashArray=Array.from(new Uint8Array(derivedBits));document.getElementById('hash-output').value=hashArray.map(b=>b.toString(16).padStart(2,'0')).join('');}</script></body></html>
