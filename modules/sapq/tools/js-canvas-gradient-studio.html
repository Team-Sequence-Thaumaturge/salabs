<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas Gradient Mesh Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas Gradient Mesh Studio","url":"https://salabs.quanxs.com/tools/js-canvas-gradient-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}canvas{background:#0f172a;border-radius:8px;border:1px solid #334155;width:100%;height:300px;}input[type="color"]{width:100px;height:40px;border:none;cursor:pointer;margin:0.5rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas Gradient Mesh Studio</h1></header><main class="container"><input type="color" id="c1" value="#38bdf8" oninput="drawGradient()"><input type="color" id="c2" value="#0284c7" oninput="drawGradient()"><input type="color" id="c3" value="#0f172a" oninput="drawGradient()"><br><canvas id="grad-cvs" width="800" height="300"></canvas></main><script>function drawGradient(){let cvs=document.getElementById('grad-cvs'),ctx=cvs.getContext('2d'),c1=document.getElementById('c1').value,c2=document.getElementById('c2').value,c3=document.getElementById('c3').value;let grad=ctx.createLinearGradient(0,0,cvs.width,cvs.height);grad.addColorStop(0,c1);grad.addColorStop(0.5,c2);grad.addColorStop(1,c3);ctx.fillStyle=grad;ctx.fillRect(0,0,cvs.width,cvs.height);}drawGradient();</script></body></html>
