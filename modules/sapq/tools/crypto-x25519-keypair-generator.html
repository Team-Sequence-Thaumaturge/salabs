<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto X25519 Keypair Generator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto X25519 Keypair Generator","url":"https://salabs.quanxs.com/tools/crypto-x25519-keypair-generator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Web Crypto X25519 Keypair Generator</h1></header><main class="container"><button onclick="generateX25519()">Generate New X25519 Keypair</button><h3>Public Key</h3><textarea id="pub-out" rows="4" readonly></textarea><h3>Private Key</h3><textarea id="priv-out" rows="4" readonly></textarea></main><script>async function generateX25519(){try{let keyPair=await window.crypto.subtle.generateKey({name:"X25519"},true,["deriveKey","deriveBits"]);let pubJwk=await window.crypto.subtle.exportKey("jwk",keyPair.publicKey);let privJwk=await window.crypto.subtle.exportKey("jwk",keyPair.privateKey);document.getElementById('pub-out').value=JSON.stringify(pubJwk,null,2);document.getElementById('priv-out').value=JSON.stringify(privJwk,null,2);}catch(e){alert('Crypto Error: '+e.message);}}</script></body></html>
