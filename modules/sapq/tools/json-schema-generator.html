<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JSON to JSON Schema Generator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JSON to JSON Schema Generator","url":"https://salabs.quanxs.com/tools/json-schema-generator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}textarea{width:100%;height:350px;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;font-family:monospace;box-sizing:border-box;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JSON to JSON Schema Generator</h1></header><main class="container"><div class="grid"><div><h3>Input JSON</h3><textarea id="json-input" placeholder='{"name": "Quanxs", "active": true}'></textarea></div><div><h3>Generated JSON Schema</h3><textarea id="schema-output" readonly></textarea></div></div><button onclick="generateSchema()">Generate JSON Schema</button></main><script>function getType(o){if(o===null)return'null';if(Array.isArray(o))return'array';return typeof o;}function createSchema(v){let t=getType(v);if(t==='object'){let p={};for(let k in v)p[k]=createSchema(v[k]);return{type:'object',properties:p,required:Object.keys(v)};}else if(t==='array'){let it=v.length>0?createSchema(v[0]):{type:'string'};return{type:'array',items:it};}else{return{type:t};}}function generateSchema(){try{let raw=document.getElementById('json-input').value;let p=JSON.parse(raw);let s={"$schema":"http://json-schema.org/draft-07/schema#",type:getType(p),...createSchema(p)};document.getElementById('schema-output').value=JSON.stringify(s,null,2);}catch(e){document.getElementById('schema-output').value="Error: "+e.message;}}</script></body></html>
