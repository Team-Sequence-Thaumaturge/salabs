<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>WCAG Color Contrast & Accessibility Checker - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"WCAG Color Contrast Checker","url":"https://salabs.quanxs.com/tools/color-contrast-accessibility-checker.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input[type="color"]{width:100%;height:50px;border:none;border-radius:8px;cursor:pointer;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}.preview-box{padding:2rem;border-radius:8px;margin-top:1rem;text-align:center;font-size:1.2rem;font-weight:bold;border:1px solid #334155;}.score-card{background:#0f172a;padding:1rem;border-radius:8px;border:1px solid #334155;margin-top:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">WCAG Color Contrast Checker</h1></header><main class="container"><div class="grid"><div><h3>Text Color</h3><input type="color" id="text-color" value="#FFFFFF" oninput="calcContrast()"></div><div><h3>Background Color</h3><input type="color" id="bg-color" value="#0F172A" oninput="calcContrast()"></div></div><div id="color-preview" class="preview-box">Sample Text Preview</div><div id="score-output" class="score-card"></div></main><script>function getLum(hex){let r=parseInt(hex.substring(1,3),16)/255,g=parseInt(hex.substring(3,5),16)/255,b=parseInt(hex.substring(5,7),16)/255;let a=[r,g,b].map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));return a[0]*0.2126+a[1]*0.7152+a[2]*0.0722;}function calcContrast(){let t=document.getElementById('text-color').value,bg=document.getElementById('bg-color').value;let prev=document.getElementById('color-preview');prev.style.color=t;prev.style.backgroundColor=bg;let l1=getLum(t),l2=getLum(bg);let ratio=((Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05)).toFixed(2);document.getElementById('score-output').innerHTML=`<p><strong>Contrast Ratio:</strong> ${ratio} : 1</p><p><strong>WCAG AA (>= 4.5):</strong> ${ratio>=4.5?'PASS':'FAIL'}</p><p><strong>WCAG AAA (>= 7.0):</strong> ${ratio>=7.0?'PASS':'FAIL'}</p>`;}calcContrast();</script></body></html>
