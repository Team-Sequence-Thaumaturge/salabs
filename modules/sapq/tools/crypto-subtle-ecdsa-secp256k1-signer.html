<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto SubtleCrypto ECDSA Signer - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto SubtleCrypto ECDSA Signer","url":"https://salabs.quanxs.com/tools/crypto-subtle-ecdsa-secp256k1-signer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Web Crypto SubtleCrypto ECDSA Signer</h1></header><main class="container"><button onclick="generateAndSign()">Generate Keypair & Sign Payload</button><input type="text" id="msg-in" value="Hello SA Labs Autonomous Pipeline"><textarea id="sig-out" rows="3" readonly></textarea></main><script>async function generateAndSign(){try{let k=await window.crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign","verify"]);let msg=document.getElementById('msg-in').value,enc=new TextEncoder();let sig=await window.crypto.subtle.sign({name:"ECDSA",hash:{name:"SHA-256"}},k.privateKey,enc.encode(msg));document.getElementById('sig-out').value=Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');}catch(e){alert('ECDSA Error: '+e.message);}}</script></body></html>
