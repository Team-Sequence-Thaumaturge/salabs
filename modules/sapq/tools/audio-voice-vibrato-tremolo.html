<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Voice Vibrato & Tremolo Studio | SA Labs Developer Utilities</title>
  <meta name="description" content="100% Client-Side Web Audio API Voice Vibrato & Tremolo Modulator Studio for DSP audio processing.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Audio Voice Vibrato & Tremolo Studio",
    "url": "https://salabs.quanxs.com/tools/audio-voice-vibrato-tremolo.html",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript and Web Audio API support"
  }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 0; }
    .control-group { margin-bottom: 20px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; }
    input, select, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #f8fafc; font-size: 14px; box-sizing: border-box; }
    button { background: #0284c7; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .status { margin-top: 15px; padding: 12px; border-radius: 6px; background: #334155; color: #38bdf8; font-family: monospace; text-align: center; }
    canvas { width: 100%; height: 150px; background: #020617; border-radius: 8px; margin-top: 15px; border: 1px solid #334155; }
  </style>
<script>

    let audioCtx, carrier, lfoVib, vibGain, lfoTrem, tremGain, masterGain, analyser;
    let isPlaying = false;
    document.getElementById('vibratoRate').addEventListener('input', (e) => {
      document.getElementById('vibRateVal').innerText = e.target.value;
      if (lfoVib) lfoVib.frequency.setValueAtTime(parseFloat(e.target.value), audioCtx.currentTime);
    });
    document.getElementById('vibratoDepth').addEventListener('input', (e) => {
      document.getElementById('vibDepthVal').innerText = e.target.value;
      if (vibGain) vibGain.gain.setValueAtTime(parseFloat(e.target.value), audioCtx.currentTime);
    });
    document.getElementById('tremoloRate').addEventListener('input', (e) => {
      document.getElementById('tremRateVal').innerText = e.target.value;
      if (lfoTrem) lfoTrem.frequency.setValueAtTime(parseFloat(e.target.value), audioCtx.currentTime);
    });
    document.getElementById('tremoloDepth').addEventListener('input', (e) => {
      document.getElementById('tremDepthVal').innerText = e.target.value;
      if (tremGain) tremGain.gain.setValueAtTime(parseFloat(e.target.value), audioCtx.currentTime);
    });
    document.getElementById('toggleBtn').addEventListener('click', () => {
      if (!isPlaying) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        carrier = audioCtx.createOscillator();
        carrier.frequency.value = 220;
        lfoVib = audioCtx.createOscillator();
        lfoVib.frequency.value = parseFloat(document.getElementById('vibratoRate').value);
        vibGain = audioCtx.createGain();
        vibGain.gain.value = parseFloat(document.getElementById('vibratoDepth').value);
        lfoVib.connect(vibGain);
        vibGain.connect(carrier.frequency);
        lfoTrem = audioCtx.createOscillator();
        lfoTrem.frequency.value = parseFloat(document.getElementById('tremoloRate').value);
        tremGain = audioCtx.createGain();
        tremGain.gain.value = parseFloat(document.getElementById('tremoloDepth').value);
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.5;
        lfoTrem.connect(tremGain);
        tremGain.connect(masterGain.gain);
        analyser = audioCtx.createAnalyser();
        carrier.connect(masterGain);
        masterGain.connect(analyser);
        analyser.connect(audioCtx.destination);
        carrier.start(); lfoVib.start(); lfoTrem.start();
        isPlaying = true;
        document.getElementById('toggleBtn').innerText = 'Stop Engine';
        document.getElementById('toggleBtn').style.background = '#e11d48';
        document.getElementById('statusBox').innerText = 'Audio Engine Running (Live Vibrato & Tremolo)';
        draw();
      } else {
        carrier.stop(); lfoVib.stop(); lfoTrem.stop(); audioCtx.close();
        isPlaying = false;
        document.getElementById('toggleBtn').innerText = 'Start Modulator Engine';
        document.getElementById('toggleBtn').style.background = '#0284c7';
        document.getElementById('statusBox').innerText = 'Engine Stopped';
      }
    });
    function draw() {
      if (!isPlaying) return;
      requestAnimationFrame(draw);
      const canvas = document.getElementById('visualizer');
      const ctx = canvas.getContext('2d');
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteTimeDomainData(dataArray);
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#38bdf8';
      ctx.beginPath();
      const sliceWidth = canvas.width / bufferLength;
      let x = 0;
      for (let i = 0; i < bufferLength; i++) {
        const v = dataArray[i] / 128.0;
        const y = v * canvas.height / 2;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        x += sliceWidth;
      }
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();
    }
  
</script>
</head>
<body>
  <div class="container">
    <h1>Audio Voice Vibrato & Tremolo Studio</h1>
    <p style="color: #94a3b8;">Client-side Web Audio API LFO Pitch Vibrato & Amplitude Tremolo Modulation Engine.</p>
    <div class="control-group">
      <label for="vibratoRate">Vibrato Rate (Hz): <span id="vibRateVal">5.0</span> Hz</label>
      <input type="range" id="vibratoRate" min="0.5" max="15" step="0.1" value="5.0">
    </div>
    <div class="control-group">
      <label for="vibratoDepth">Vibrato Depth (Pitch Shift): <span id="vibDepthVal">10</span> Hz</label>
      <input type="range" id="vibratoDepth" min="0" max="50" value="10">
    </div>
    <div class="control-group">
      <label for="tremoloRate">Tremolo Rate (Hz): <span id="tremRateVal">4.0</span> Hz</label>
      <input type="range" id="tremoloRate" min="0.5" max="20" step="0.1" value="4.0">
    </div>
    <div class="control-group">
      <label for="tremoloDepth">Tremolo Depth (Volume Modulation): <span id="tremDepthVal">0.5</span></label>
      <input type="range" id="tremoloDepth" min="0" max="1" step="0.05" value="0.5">
    </div>
    <div class="control-group">
      <button id="toggleBtn">Start Modulator Engine</button>
    </div>
    <div id="statusBox" class="status">Engine Ready (Stopped)</div>
    <canvas id="visualizer"></canvas>
  </div>
  
</body>
</html>
