<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Spectral Noise Gate Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Spectral Noise Gate Studio","url":"https://salabs.quanxs.com/tools/audio-spectral-noise-gate-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Spectral Noise Gate Studio</h1></header><main class="container"><button onclick="playGatedTone()">Play Noise Gated Synth Tone</button><p>Gate Threshold Level (<span id="thresh-val">-30</span> dB)</p><input type="range" id="thresh-slider" min="-60" max="0" value="-30" oninput="updateGate()"></main><script>let audioCtx,osc,comp;function playGatedTone(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();osc=audioCtx.createOscillator();comp=audioCtx.createDynamicsCompressor();let thresh=parseFloat(document.getElementById('thresh-slider').value);comp.threshold.value=thresh;comp.knee.value=12;comp.ratio.value=12;osc.type='sawtooth';osc.frequency.value=330;osc.connect(comp);comp.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.5);}function updateGate(){let v=document.getElementById('thresh-slider').value;document.getElementById('thresh-val').innerText=v;if(comp)comp.threshold.value=parseFloat(v);}</script></body></html>
