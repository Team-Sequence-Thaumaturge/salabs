<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas Face Portrait to ASCII Art Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas Face Portrait to ASCII Art Studio","url":"https://salabs.quanxs.com/tools/html-canvas-ascii-face-art.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input,textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas Face Portrait to ASCII Art Studio</h1></header><main class="container"><input type="file" id="portrait-file" accept="image/*" onchange="renderASCII()"><textarea id="ascii-out" rows="12" readonly></textarea></main><script>function renderASCII(){let file=document.getElementById('portrait-file').files[0];if(!file)return;let img=new Image(),reader=new FileReader();reader.onload=e=>{img.onload=()=>{let canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),w=100,h=Math.floor(img.height*(w/img.width)*0.5);canvas.width=w;canvas.height=h;ctx.drawImage(img,0,0,w,h);let imgData=ctx.getImageData(0,0,w,h).data,chars='$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrft/\\|()1{}[]?-_+~<>i!lI;:,"^`\'. ',ascii='';for(let y=0;y<h;y++){for(let x=0;x<w;x++){let idx=(y*w+x)*4,avg=(imgData[idx]+imgData[idx+1]+imgData[idx+2])/3,charIdx=Math.floor((avg/255)*(chars.length-1));ascii+=chars[charIdx];}ascii+='\n';}document.getElementById('ascii-out').value=ascii;};img.src=e.target.result;};reader.readAsDataURL(file);}</script></body></html>
