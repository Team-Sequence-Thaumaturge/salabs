<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>SHA-256 & SHA-512 Hash Calculator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"SHA Hash Calculator","url":"https://salabs.quanxs.com/tools/sha256-hash-calculator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">SHA-256 & SHA-512 Hash Calculator</h1></header><main class="container"><h3>Plaintext Input</h3><textarea id="plain-in" rows="4" oninput="calcHashes()"></textarea><h3>SHA-256 Hash</h3><input type="text" id="sha256-out" readonly><h3>SHA-512 Hash</h3><input type="text" id="sha512-out" readonly></main><script>async function calcHashes(){let txt=document.getElementById('plain-in').value;if(!txt){document.getElementById('sha256-out').value='';document.getElementById('sha512-out').value='';return;}let enc=new TextEncoder();let data=enc.encode(txt);let buf256=await crypto.subtle.digest('SHA-256',data);document.getElementById('sha256-out').value=Array.from(new Uint8Array(buf256)).map(b=>b.toString(16).padStart(2,'0')).join('');let buf512=await crypto.subtle.digest('SHA-512',data);document.getElementById('sha512-out').value=Array.from(new Uint8Array(buf512)).map(b=>b.toString(16).padStart(2,'0')).join('');}calcHashes();</script></body></html>
