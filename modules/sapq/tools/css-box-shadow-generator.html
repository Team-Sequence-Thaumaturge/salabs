<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Shadow Generator - Quanxs SA Labs</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CSS Box Shadow Generator",
      "url": "https://salabs.quanxs.com/tools/css-box-shadow-generator.html",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "All"
    }
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
        header { text-align: center; margin-bottom: 2rem; }
        h1 { color: #38bdf8; }
        .container { max-width: 1000px; margin: 0 auto; background: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid #334155; }
        input[type="range"], input[type="color"] { width: 100%; margin-bottom: 1rem; }
        .preview-box { width: 200px; height: 120px; background: #334155; border-radius: 8px; margin: 2rem auto; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        textarea { width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 1rem; font-family: monospace; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .badge { display: inline-block; background: #0284c7; color: #fff; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; margin-bottom: 1rem; }
    </style>
<!-- SAPQ Hoisted Script Gate -->
<script>
        function updateShadow() {
            let x = document.getElementById('shift-x').value;
            let y = document.getElementById('shift-y').value;
            let blur = document.getElementById('blur-r').value;
            let color = document.getElementById('shadow-color').value;

            document.getElementById('v-x').innerText = x;
            document.getElementById('v-y').innerText = y;
            document.getElementById('v-blur').innerText = blur;

            let r = parseInt(color.substring(1,3), 16);
            let g = parseInt(color.substring(3,5), 16);
            let b = parseInt(color.substring(5,7), 16);

            let shadowStr = x + 'px ' + y + 'px ' + blur + 'px rgba(' + r + ', ' + g + ', ' + b + ', 0.5)';
            document.getElementById('target-preview').style.boxShadow = shadowStr;
            document.getElementById('css-output').value = 'box-shadow: ' + shadowStr + ';';
        }
        updateShadow();
    </script>
</head>
<body>
    <header>
        <span class="badge">Pure Client-Side JS</span>
        <h1>CSS Box Shadow Generator</h1>
        <p>Option AA: Realtime Shadow &amp; Border Effects Studio</p>
    </header>
    <main class="container">
        <div class="grid">
            <div>
                <label>X Offset (<span id="v-x">10</span>px)</label>
                <input type="range" id="shift-x" min="-50" max="50" value="10" oninput="updateShadow()">

                <label>Y Offset (<span id="v-y">10</span>px)</label>
                <input type="range" id="shift-y" min="-50" max="50" value="10" oninput="updateShadow()">

                <label>Blur Radius (<span id="v-blur">20</span>px)</label>
                <input type="range" id="blur-r" min="0" max="100" value="20" oninput="updateShadow()">
            </div>
            <div>
                <label>Shadow Color</label>
                <input type="color" id="shadow-color" value="#000000" oninput="updateShadow()">
            </div>
        </div>

        <div id="target-preview" class="preview-box">Box Shadow</div>

        <h3>Generated CSS</h3>
        <textarea id="css-output" rows="3" readonly></textarea>
    </main>
    
</body>
</html>
