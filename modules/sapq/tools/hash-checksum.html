<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cryptographic Hash Generator - SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Hash Generator Checksum","url":"https://salabs.quanxs.com/tools/hash-checksum.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Cryptographic Hash & Checksum Generator</h1></header><main class="container"><h3>1. Input Text</h3><textarea id="hash-input" rows="4" oninput="calculateHashes()"></textarea><h3>2. Hashes</h3><div>SHA-256: <input type="text" id="sha256" readonly></div><div>SHA-512: <input type="text" id="sha512" readonly></div><div>SHA-1: <input type="text" id="sha1" readonly></div></main><script>async function hashText(algo,str){let buf=new TextEncoder().encode(str);let hashBuf=await crypto.subtle.digest(algo,buf);return Array.from(new Uint8Array(hashBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');}async function calculateHashes(){let txt=document.getElementById('hash-input').value;if(!txt)return;document.getElementById('sha256').value=await hashText('SHA-256',txt);document.getElementById('sha512').value=await hashText('SHA-512',txt);document.getElementById('sha1').value=await hashText('SHA-1',txt);}</script></body></html>
