<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto HKDF SHA-256 Key Derivation - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto HKDF SHA-256 Key Derivation","url":"https://salabs.quanxs.com/tools/crypto-hkdf-sha256-key-derivation.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input,textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">HKDF SHA-256 Key Derivation Studio</h1></header><main class="container"><input type="text" id="ikm" value="secret_ikm_string_123"><input type="text" id="salt" value="salt_456"><input type="text" id="info" value="info_789"><button onclick="deriveHKDF()">Derive HKDF SHA-256 Key</button><textarea id="key-out" rows="2" readonly></textarea></main><script>async function deriveHKDF(){let ikmStr=document.getElementById('ikm').value,saltStr=document.getElementById('salt').value,infoStr=document.getElementById('info').value;if(!ikmStr)return;try{let enc=new TextEncoder();let ikmKey=await window.crypto.subtle.importKey("raw",enc.encode(ikmStr),"HKDF",false,["deriveBits"]);let derived=await window.crypto.subtle.deriveBits({name:"HKDF",hash:"SHA-256",salt:enc.encode(saltStr),info:enc.encode(infoStr)},ikmKey,256);let hex=Array.from(new Uint8Array(derived)).map(b=>b.toString(16).padStart(2,'0')).join('');document.getElementById('key-out').value=hex;}catch(e){alert('HKDF Error: '+e.message);}}</script></body></html>
