<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code & Barcode Generator - Quanxs SA Labs</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "QR Code & Barcode Generator",
    "url": "https://salabs.quanxs.com/tools/qr-barcode-generator.html",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All Browser"
  }
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --subtext: #94a3b8;
      --border: #334155;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 2rem 1rem; line-height: 1.5; }
    .container { max-width: 900px; margin: 0 auto; background: var(--card-bg); padding: 2rem; border-radius: 14px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    h1 { color: var(--accent); text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; }
    p.sub { text-align: center; color: var(--subtext); margin-bottom: 1.5rem; font-size: 0.95rem; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    .tab-btn { background: transparent; color: var(--subtext); border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: rgba(56, 189, 248, 0.15); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.4); }
    .input-section { margin-bottom: 1.5rem; }
    label { display: block; color: var(--accent); font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem; }
    textarea, input[type="text"] { width: 100%; background: #0f172a; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem; font-family: monospace; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    textarea:focus, input[type="text"]:focus { border-color: var(--accent); }
    .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .control-item label { color: var(--subtext); font-size: 0.85rem; }
    select, input[type="color"] { width: 100%; background: #0f172a; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem; outline: none; }
    .btn-group { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .btn { background: var(--accent); color: #0f172a; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
    .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
    .btn-secondary { background: #334155; color: var(--text); }
    .toast { display: none; background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.3); padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; margin-left: auto; }
    .result-box { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; padding: 2rem; border-radius: 12px; min-height: 250px; border: 1px solid var(--border); position: relative; }
    .result-box img, .result-box svg { max-width: 100%; height: auto; }
    .result-box span { color: #64748b; font-weight: 500; }
  </style>
<!-- SAPQ Hoisted Script Gate -->

<!-- SAPQ v2.0 Hoisted Script Gate -->

<!-- SAPQ v2.0 Hoisted Script Gate -->
<script>




    let currentMode = 'qr';

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tab-qr').classList.toggle('active', mode === 'qr');
      document.getElementById('tab-barcode').classList.toggle('active', mode === 'barcode');
      document.getElementById('qr-controls').style.display = mode === 'qr' ? 'grid' : 'none';
      document.getElementById('input-label').innerText = mode === 'qr' ? 'QR Content Text or URL' : 'Barcode Value (Alpha-numeric)';
    function generateOutput() {
      const inputVal = document.getElementById('content-input').value.trim() || 'https://salabs.quanxs.com';
      const box = document.getElementById('output-box');

      if (currentMode === 'qr') {
        try {
          const cellSize = parseInt(document.getElementById('cell-size').value, 10);
          const ecLevel = document.getElementById('ec-level').value;
          const qr = qrcode(0, ecLevel);
          qr.addData(inputVal);
          qr.make();
          box.innerHTML = qr.createImgTag(cellSize, 8);
        } catch (e) {
          box.innerHTML = `<span style="color:#ef4444;">Error generating QR: ${e.message}</span>`;
        }
      } else {
        try {
          box.innerHTML = '<svg id="barcode-svg"></svg>';
          JsBarcode("#barcode-svg", inputVal, {
            format: "CODE128",
            lineColor: "#000000",
            width: 2,
            height: 80,
            displayValue: true
          });
        } catch (e) {
          box.innerHTML = `<span style="color:#ef4444;">Error generating Barcode: ${e.message}</span>`;
        }
      }
    }
      generateOutput();
    }

    function onInputChanged() {
      generateOutput();
    }

    function manualGenerate() {
      generateOutput();
    function showToast(msg) {
      const toast = document.getElementById('status-toast');
      toast.innerText = msg;
      toast.style.display = 'inline-block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }
      showToast('⚡ QR / Barcode Generated!');
    }



    function downloadImage() {
      const box = document.getElementById('output-box');
      const img = box.querySelector('img');
      const svg = box.querySelector('svg');

      if (img) {
        const a = document.createElement('a');
        a.href = img.src;
        a.download = `qrcode_${Date.now()}.png`;
        a.click();
        showToast('💾 PNG Downloaded!');
      } else if (svg) {
        const svgData = new XMLSerializer().serializeToString(svg);
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const svgImg = new Image();
        svgImg.onload = function() {
          canvas.width = svgImg.width || 300;
          canvas.height = svgImg.height || 120;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(svgImg, 0, 0);
          const a = document.createElement('a');
          a.href = canvas.toDataURL('image/png');
          a.download = `barcode_${Date.now()}.png`;
          a.click();
          showToast('💾 PNG Downloaded!');
        };
        svgImg.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
      } else {
        alert('No image to download.');
      }
    }

    // Initial render
    generateOutput();
  

</script>
</head>
<body>
  <div class="container">
    <h1>QR Code & Barcode Generator</h1>
    <p class="sub">100% Client-Side Pure JS High-Resolution QR & 1D Barcode Generator</p>

    <div class="tabs">
      <button class="tab-btn active" id="tab-qr" onclick="switchMode('qr')">📱 QR Code</button>
      <button class="tab-btn" id="tab-barcode" onclick="switchMode('barcode')">🏷️ 1D Barcode (Code 128)</button>
    </div>

    <div class="input-section">
      <label id="input-label">Content Text or URL</label>
      <textarea id="content-input" rows="3" placeholder="Enter text, URL, or data..." oninput="onInputChanged()"></textarea>
    </div>

    <div class="controls-grid" id="qr-controls">
      <div class="control-item">
        <label>Cell Size</label>
        <select id="cell-size" onchange="generateOutput()">
          <option value="4">Small (4px)</option>
          <option value="7" selected>Medium (7px)</option>
          <option value="12">Large (12px)</option>
          <option value="16">HD (16px)</option>
        </select>
      </div>
      <div class="control-item">
        <label>Error Correction</label>
        <select id="ec-level" onchange="generateOutput()">
          <option value="L">L (7% Recovery)</option>
          <option value="M" selected>M (15% Recovery)</option>
          <option value="Q">Q (25% Recovery)</option>
          <option value="H">H (30% High Recovery)</option>
        </select>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn" onclick="manualGenerate()">⚡ Generate Now</button>
      <button class="btn btn-secondary" onclick="downloadImage()">💾 Download PNG</button>
      <span class="toast" id="status-toast">✅ Generated Successfully!</span>
    </div>

    <div class="result-box" id="output-box">
      <span>Preview Will Appear Here</span>
    </div>
  </div>

  
</body>
</html>
