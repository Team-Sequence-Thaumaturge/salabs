<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Color Code Converter & WCAG Contrast Inspector - SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Color Converter Contrast Inspector","url":"https://salabs.quanxs.com/tools/color-converter-contrast.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}input[type="color"],input[type="text"]{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.preview-box{padding:2rem;border-radius:8px;text-align:center;font-size:1.2rem;font-weight:bold;margin-top:1rem;border:1px solid #334155;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Color Converter & WCAG Contrast Inspector</h1></header><main class="container"><div class="grid"><div><h3>Text Color</h3><input type="color" id="fg-color" value="#38bdf8" onchange="updateColors()"><input type="text" id="fg-hex" value="#38bdf8" oninput="syncColorInput('fg')"></div><div><h3>Background Color</h3><input type="color" id="bg-color" value="#0f172a" onchange="updateColors()"><input type="text" id="bg-hex" value="#0f172a" oninput="syncColorInput('bg')"></div></div><div class="preview-box" id="contrast-preview">Sample Text Preview</div><h3 style="margin-top:2rem;">WCAG Contrast Rating</h3><p id="contrast-ratio" style="font-size:1.5rem;font-weight:bold;color:#38bdf8;"></p></main><script>function updateColors(){let fg=document.getElementById('fg-color').value;let bg=document.getElementById('bg-color').value;document.getElementById('fg-hex').value=fg;document.getElementById('bg-hex').value=bg;let box=document.getElementById('contrast-preview');box.style.color=fg;box.style.backgroundColor=bg;let ratio=calculateContrastRatio(fg,bg);let rating=ratio>=7?'AAA (Pass)':(ratio>=4.5?'AA (Pass)':'Fail');document.getElementById('contrast-ratio').innerText=ratio.toFixed(2)+':1 - '+rating;}function syncColorInput(t){let hex=document.getElementById(t+'-hex').value;if(/^#[0-9A-F]{6}$/i.test(hex)){document.getElementById(t+'-color').value=hex;updateColors();}}function getLuminance(hex){let rgb=[parseInt(hex.substr(1,2),16)/255,parseInt(hex.substr(3,2),16)/255,parseInt(hex.substr(5,2),16)/255].map(c=>c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4));return 0.2126*rgb[0]+0.7152*rgb[1]+0.0722*rgb[2];}function calculateContrastRatio(h1,h2){let l1=getLuminance(h1);let l2=getLuminance(h2);return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);}updateColors();</script></body></html>
