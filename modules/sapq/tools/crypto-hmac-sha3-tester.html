<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto HMAC SHA256 / SHA512 Calculator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto HMAC Calculator","url":"https://salabs.quanxs.com/tools/crypto-hmac-sha3-tester.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input,textarea,select{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Web Crypto HMAC Calculator</h1></header><main class="container"><label>Secret Key</label><input type="text" id="secret-key" value="secret" oninput="calcHMAC()"><label>Message</label><textarea id="msg-input" rows="3" oninput="calcHMAC()"></textarea><label>Algorithm</label><select id="algo" onchange="calcHMAC()"><option value="SHA-256">HMAC-SHA256</option><option value="SHA-512">HMAC-SHA512</option></select><input type="text" id="hmac-out" readonly></main><script>async function calcHMAC(){let secret=document.getElementById('secret-key').value,msg=document.getElementById('msg-input').value,algo=document.getElementById('algo').value;if(!secret||!msg){document.getElementById('hmac-out').value='';return;}try{let enc=new TextEncoder();let key=await window.crypto.subtle.importKey("raw",enc.encode(secret),{name:"HMAC",hash:{name:algo}},false,["sign"]);let sig=await window.crypto.subtle.sign("HMAC",key,enc.encode(msg));let hex=Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');document.getElementById('hmac-out').value=hex;}catch(e){document.getElementById('hmac-out').value='Crypto error: '+e.message;}}calcHMAC();</script></body></html>
