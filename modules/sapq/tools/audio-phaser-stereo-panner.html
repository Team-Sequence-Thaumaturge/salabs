<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Phaser & Stereo Panner Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Phaser & Stereo Panner Studio","url":"https://salabs.quanxs.com/tools/audio-phaser-stereo-panner.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Phaser & Stereo Panner Studio</h1></header><main class="container"><button onclick="playPhaserTone()">Play Phaser Tone</button><p>Pan Stereo Position (<span id="pan-val">0.0</span>)</p><input type="range" id="pan-slider" min="-1" max="1" step="0.1" value="0" oninput="updatePan()"></main><script>let audioCtx,osc,panner;function playPhaserTone(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();osc=audioCtx.createOscillator();panner=audioCtx.createStereoPanner();panner.pan.value=parseFloat(document.getElementById('pan-slider').value);osc.type='sawtooth';osc.frequency.value=330;osc.connect(panner);panner.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.5);}function updatePan(){let v=document.getElementById('pan-slider').value;document.getElementById('pan-val').innerText=v;if(panner)panner.pan.value=parseFloat(v);}</script></body></html>
