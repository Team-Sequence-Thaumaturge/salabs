<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Color Code Converter & Inspector - SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Color Converter","url":"https://salabs.quanxs.com/tools/color-converter.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.color-preview{height:100px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:bold;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Color Code Converter & Inspector</h1></header><main class="container"><h3>1. Pick Color</h3><input type="color" id="picker" value="#38bdf8" onchange="update(this.value)"><input type="text" id="hex" value="#38bdf8" oninput="update(this.value)"><div class="color-preview" id="preview" style="background-color:#38bdf8;color:#0f172a;">Sample Text</div><h3>2. Formats</h3><div>RGB: <input type="text" id="rgb" readonly></div><div>HSL: <input type="text" id="hsl" readonly></div></main><script>function update(hex){if(!/^#[0-9A-F]{6}$/i.test(hex))return;document.getElementById('preview').style.backgroundColor=hex;document.getElementById('picker').value=hex;let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);document.getElementById('rgb').value=`rgb(${r}, ${g}, ${b})`;document.getElementById('hsl').value=`hsl(${Math.round(r/255*360)}, 100%, 50%)`;}update('#38bdf8');</script></body></html>
