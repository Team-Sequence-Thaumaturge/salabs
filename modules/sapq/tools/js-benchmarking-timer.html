<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JS Code Benchmarking & Execution Timer - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JS Benchmarking Timer","url":"https://salabs.quanxs.com/tools/js-benchmarking-timer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}.res-box{background:#0f172a;padding:1rem;border-radius:8px;border:1px solid #334155;margin-top:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JS Code Benchmarking & Execution Timer</h1></header><main class="container"><textarea id="js-code" rows="6" placeholder="let arr = []; for(let i=0; i<100000; i++) arr.push(i);"></textarea><button onclick="runBenchmark()">Run Benchmark</button><div id="result-out" class="res-box">Execution time will be displayed here...</div></main><script>function runBenchmark(){let c=document.getElementById('js-code').value;if(!c)return;try{let t0=performance.now();new Function(c)();let t1=performance.now();document.getElementById('result-out').innerHTML=`<p style="color:#4ade80;">Execution Time: <strong>${(t1-t0).toFixed(4)} ms</strong></p>`;}catch(e){document.getElementById('result-out').innerHTML=`<p style="color:#f87171;">Error: ${e.message}</p>`;}}</script></body></html>
