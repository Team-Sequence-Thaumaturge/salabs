<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio 5-Band Equalizer Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio 5-Band Equalizer Studio","url":"https://salabs.quanxs.com/tools/audio-equalizer-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}input[type="range"]{width:100%;margin:0.5rem 0;}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;margin-top:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio 5-Band Equalizer Studio</h1></header><main class="container"><input type="file" id="audio-file" accept="audio/*" onchange="loadAudio()"><audio id="audio-player" controls style="width:100%;"></audio><div class="grid"><div><label>60Hz</label><input type="range" id="b-60" min="-20" max="20" value="0" oninput="updateEQ()"></div><div><label>250Hz</label><input type="range" id="b-250" min="-20" max="20" value="0" oninput="updateEQ()"></div><div><label>1kHz</label><input type="range" id="b-1000" min="-20" max="20" value="0" oninput="updateEQ()"></div><div><label>4kHz</label><input type="range" id="b-4000" min="-20" max="20" value="0" oninput="updateEQ()"></div><div><label>16kHz</label><input type="range" id="b-16000" min="-20" max="20" value="0" oninput="updateEQ()"></div></div></main><script>let audioCtx,filters=[];function loadAudio(){let file=document.getElementById('audio-file').files[0];if(!file)return;let player=document.getElementById('audio-player');player.src=URL.createObjectURL(file);if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();let src=audioCtx.createMediaElementSource(player);let freqs=[60,250,1000,4000,16000];filters=freqs.map((f,i)=>{let flt=audioCtx.createBiquadFilter();flt.type=i===0?'lowshelf':i===4?'highshelf':'peaking';flt.frequency.value=f;return flt;});src.connect(filters[0]);for(let i=0;i<filters.length-1;i++)filters[i].connect(filters[i+1]);filters[filters.length-1].connect(audioCtx.destination);}}function updateEQ(){if(!filters.length)return;filters[0].gain.value=parseFloat(document.getElementById('b-60').value);filters[1].gain.value=parseFloat(document.getElementById('b-250').value);filters[2].gain.value=parseFloat(document.getElementById('b-1000').value);filters[3].gain.value=parseFloat(document.getElementById('b-4000').value);filters[4].gain.value=parseFloat(document.getElementById('b-16000').value);}</script></body></html>
