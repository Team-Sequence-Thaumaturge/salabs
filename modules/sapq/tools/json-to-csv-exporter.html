<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JSON to CSV & Excel Exporter - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JSON to CSV Exporter","url":"https://salabs.quanxs.com/tools/json-to-csv-exporter.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JSON to CSV Exporter</h1></header><main class="container"><h3>JSON Input Array</h3><textarea id="json-in" rows="6" oninput="convertJSON()"></textarea><h3>CSV Output</h3><textarea id="csv-out" rows="6" readonly></textarea><button onclick="downloadCSV()">Download CSV File</button></main><script>function convertJSON(){let txt=document.getElementById('json-in').value;if(!txt){document.getElementById('csv-out').value='';return;}try{let data=JSON.parse(txt);if(!Array.isArray(data)||data.length===0){document.getElementById('csv-out').value='Input must be a non-empty array of objects.';return;}let headers=Object.keys(data[0]);let csvRows=[headers.join(',')];for(let row of data){let values=headers.map(h=>{let val=row[h]!==undefined?String(row[h]):'';return `"${val.replace(/"/g,'""')}"`;});csvRows.push(values.join(','));}document.getElementById('csv-out').value=csvRows.join('\n');}catch(e){document.getElementById('csv-out').value='Invalid JSON: '+e.message;}}function downloadCSV(){let csv=document.getElementById('csv-out').value;if(!csv)return;let blob=new Blob([csv],{type:'text/csv'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='data.csv';a.click();}</script></body></html>
