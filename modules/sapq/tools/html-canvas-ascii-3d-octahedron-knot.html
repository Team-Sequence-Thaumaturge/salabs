<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas 3D ASCII Octahedron Knot Visualizer - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas 3D ASCII Octahedron Knot Visualizer","url":"https://salabs.quanxs.com/tools/html-canvas-ascii-3d-octahedron-knot.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}textarea{width:100%;background:#0f172a;color:#38bdf8;border:1px solid #334155;border-radius:8px;padding:1rem;font-family:monospace;font-size:11px;line-height:10px;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas 3D ASCII Octahedron Knot</h1></header><main class="container"><textarea id="ascii-box" rows="20" readonly></textarea></main><script>let angle=0;function render3D(){angle+=0.05;let rows=20,cols=50,grid=Array.from({length:rows},()=>Array(cols).fill(' '));for(let i=0;i<360;i+=15){let rad=i*Math.PI/180;let x=Math.sin(rad+angle)*12+cols/2;let y=Math.cos(rad*2+angle)*6+rows/2;let cx=Math.floor(x),cy=Math.floor(y);if(cy>=0&&cy<rows&&cx>=0&&cx<cols)grid[cy][cx]='*';}document.getElementById('ascii-box').value=grid.map(r=>r.join('')).join('\n');requestAnimationFrame(render3D);}render3D();</script></body></html>
