<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JS LocalStorage Inspector - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JS LocalStorage Inspector","url":"https://salabs.quanxs.com/tools/js-localstorage-session-manager.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input,textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style><script>
function refreshDump(){let d={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);d[k]=localStorage.getItem(k);}document.getElementById('storage-dump').value=JSON.stringify(d,null,2);}function setItem(){let k=document.getElementById('s-key').value,v=document.getElementById('s-val').value;if(k)localStorage.setItem(k,v);refreshDump();}function clearAll(){localStorage.clear();refreshDump();}refreshDump();
</script>
</head><body><header><h1 style="color:#38bdf8;text-align:center;">JS LocalStorage Inspector</h1></header><main class="container"><input type="text" id="s-key" placeholder="Key"><input type="text" id="s-val" placeholder="Value"><button onclick="setItem()">Save Key</button><button onclick="clearAll()">Clear All</button><textarea id="storage-dump" rows="8" readonly></textarea></main></body></html>
