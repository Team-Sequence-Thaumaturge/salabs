<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>3D Rotating ASCII Cube Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"3D Rotating ASCII Cube Studio","url":"https://salabs.quanxs.com/tools/html-canvas-ascii-3d-cube.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}textarea{width:100%;background:#0f172a;color:#38bdf8;border:1px solid #334155;border-radius:8px;padding:1rem;font-family:monospace;font-size:14px;line-height:14px;text-align:center;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">3D Rotating ASCII Cube Studio</h1></header><main class="container"><textarea id="cube-out" rows="20" readonly></textarea></main><script>let A=0,B=0;function renderCube(){let buffer=Array(20).fill().map(()=>Array(40).fill(' '));A+=0.05;B+=0.03;for(let x=-10;x<=10;x+=2){for(let y=-10;y<=10;y+=2){for(let z=-10;z<=10;z+=2){let nx=x*Math.cos(B)-z*Math.sin(B);let nz=x*Math.sin(B)+z*Math.cos(B);let ny=y*Math.cos(A)-nz*Math.sin(A);let px=Math.floor(20+nx*0.8);let py=Math.floor(10+ny*0.4);if(px>=0&&px<40&&py>=0&&py<20){buffer[py][px]='#';}}}}document.getElementById('cube-out').value=buffer.map(r=>r.join('')).join('\n');requestAnimationFrame(renderCube);}renderCube();</script></body></html>
