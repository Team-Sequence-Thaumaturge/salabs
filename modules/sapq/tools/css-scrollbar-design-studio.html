<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>CSS Scrollbar Design Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"CSS Scrollbar Design Studio","url":"https://salabs.quanxs.com/tools/css-scrollbar-design-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input,textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.preview-scroll{height:120px;overflow-y:scroll;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">CSS Scrollbar Design Studio</h1></header><main class="container"><label>Scrollbar Width (px)</label><input type="number" id="sb-width" value="12" min="4" max="30" oninput="updateScrollbar()"><label>Track Color</label><input type="color" id="track-color" value="#0f172a" oninput="updateScrollbar()"><label>Thumb Color</label><input type="color" id="thumb-color" value="#38bdf8" oninput="updateScrollbar()"><div id="demo-box" class="preview-scroll"><p>Scrollable Line 1</p><p>Scrollable Line 2</p><p>Scrollable Line 3</p><p>Scrollable Line 4</p></div><textarea id="css-out" rows="8" readonly></textarea></main><script>function updateScrollbar(){let w=document.getElementById('sb-width').value||12,tc=document.getElementById('track-color').value,thc=document.getElementById('thumb-color').value;document.getElementById('css-out').value=`::-webkit-scrollbar { width: ${w}px; }
::-webkit-scrollbar-track { background: ${tc}; }
::-webkit-scrollbar-thumb { background: ${thc}; border-radius: 6px; }`;}updateScrollbar();</script></body></html>
