<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas Monoscope ASCII Waveform - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas Monoscope ASCII Waveform","url":"https://salabs.quanxs.com/tools/html-canvas-ascii-waveform.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#38bdf8;border:1px solid #334155;border-radius:8px;padding:1rem;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas Monoscope ASCII Waveform</h1></header><main class="container"><textarea id="wave-out" rows="12" readonly></textarea></main><script>let phase=0;function renderWave(){let cols=60,rows=12;let grid=Array.from({length:rows},()=>new Array(cols).fill(' '));for(let x=0;x<cols;x++){let yVal=Math.sin((x+phase)*0.2)*4+5;let y=Math.max(0,Math.min(rows-1,Math.round(yVal)));grid[y][x]='*';}document.getElementById('wave-out').value=grid.map(r=>r.join('')).join('\n');phase+=1;requestAnimationFrame(renderWave);}renderWave();</script></body></html>
