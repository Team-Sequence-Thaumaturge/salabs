<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realtime Web Audio Formant Vowel Filter v4500 Studio | SA Labs</title>
  <meta name="description" content="100% Client-Side Web Audio API Formant Vowel Filter v4500 DSP Studio with Zero-Server Latency.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Web Audio Formant Vowel Filter v4500 Studio",
    "url": "https://salabs.quanxs.com/tools/audio-formant-vowel-filter-v4500.html",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript and Web Audio API"
  }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 32px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h1 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 12px; margin-top: 0; }
    .panel { background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; }
    select, button { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #f8fafc; font-size: 14px; box-sizing: border-box; }
    button { background: #0284c7; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    button:hover { background: #0369a1; }
    .metric { font-family: monospace; font-size: 16px; color: #38bdf8; padding: 12px; background: #020617; border-radius: 6px; margin-top: 10px; text-align: center; border: 1px solid #1e293b; }
    canvas { width: 100%; height: 160px; background: #020617; border-radius: 8px; border: 1px solid #334155; margin-top: 15px; }
  </style>
<script>

    let audioCtx, osc, f1, f2, analyser;
    let isRunning = false;
    const toggleBtn = document.getElementById('toggleBtn');
    const displayBox = document.getElementById('displayBox');
    const vowelSelect = document.getElementById('vowelSelect');
    const canvas = document.getElementById('spectrum');
    const ctx = canvas.getContext('2d');

    const vowelFrequencies = {
      A: { f1: 730, f2: 1090 },
      E: { f1: 530, f2: 1840 },
      I: { f1: 270, f2: 2290 },
      O: { f1: 570, f2: 840 },
      U: { f1: 300, f2: 870 }
    };

    vowelSelect.addEventListener('change', () => {
      if (isRunning && f1 && f2) {
        const freqs = vowelFrequencies[vowelSelect.value];
        f1.frequency.setValueAtTime(freqs.f1, audioCtx.currentTime);
        f2.frequency.setValueAtTime(freqs.f2, audioCtx.currentTime);
        displayBox.innerText = `Active Vowel /${vowelSelect.value}/ - F1: ${freqs.f1}Hz | F2: ${freqs.f2}Hz`;
      }
    });

    toggleBtn.addEventListener('click', () => {
      if (!isRunning) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(130, audioCtx.currentTime);

        f1 = audioCtx.createBiquadFilter();
        f1.type = 'bandpass';
        f1.Q.setValueAtTime(5.0, audioCtx.currentTime);

        f2 = audioCtx.createBiquadFilter();
        f2.type = 'bandpass';
        f2.Q.setValueAtTime(5.0, audioCtx.currentTime);

        const freqs = vowelFrequencies[vowelSelect.value];
        f1.frequency.setValueAtTime(freqs.f1, audioCtx.currentTime);
        f2.frequency.setValueAtTime(freqs.f2, audioCtx.currentTime);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;

        osc.connect(f1);
        osc.connect(f2);
        f1.connect(analyser);
        f2.connect(analyser);
        analyser.connect(audioCtx.destination);

        osc.start();
        isRunning = true;
        toggleBtn.innerText = 'Stop Resonator Engine v4500';
        toggleBtn.style.background = '#e11d48';
        displayBox.innerText = `Active Vowel /${vowelSelect.value}/ - F1: ${freqs.f1}Hz | F2: ${freqs.f2}Hz`;
        drawSpectrum();
      } else {
        if (osc) osc.stop();
        if (audioCtx) audioCtx.close();
        isRunning = false;
        toggleBtn.innerText = 'Start Resonator Audio Engine v4500';
        toggleBtn.style.background = '#0284c7';
        displayBox.innerText = 'Engine Offline';
      }
    });

    function drawSpectrum() {
      if (!isRunning) return;
      requestAnimationFrame(drawSpectrum);
      const buffer = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(buffer);
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const barWidth = (canvas.width / buffer.length) * 2.5;
      let x = 0;
      for (let i = 0; i < buffer.length; i++) {
        const barHeight = buffer[i] / 2;
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
        x += barWidth + 1;
      }
    }
  
</script>
</head>
<body>
  <div class="container">
    <h1>Realtime Web Audio Formant Vowel Filter v4500</h1>
    <p style="color: #94a3b8;">100% Client-Side Web Audio API Formant Vowel Filter v4500. Zero server latency.</p>
    <div class="panel">
      <label for="vowelSelect">Vowel Resonator Mode (v4500):</label>
      <select id="vowelSelect">
        <option value="A">Vowel /a/ (Father - F1: 730Hz, F2: 1090Hz)</option>
        <option value="E">Vowel /e/ (Bed - F1: 530Hz, F2: 1840Hz)</option>
        <option value="I">Vowel /i/ (See - F1: 270Hz, F2: 2290Hz)</option>
        <option value="O">Vowel /o/ (Thought - F1: 570Hz, F2: 840Hz)</option>
        <option value="U">Vowel /u/ (Boot - F1: 300Hz, F2: 870Hz)</option>
      </select>
    </div>
    <div class="panel">
      <button id="toggleBtn">Start Resonator Audio Engine v4500</button>
      <div id="displayBox" class="metric">Engine Offline</div>
    </div>
    <canvas id="spectrum"></canvas>
  </div>
  
</body>
</html>
