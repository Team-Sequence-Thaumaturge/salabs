<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Realtime Pitch Tracker - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Realtime Pitch Tracker","url":"https://salabs.quanxs.com/tools/audio-spectral-pitch-tracker.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}.pitch-display{font-size:2.5rem;font-weight:bold;color:#38bdf8;margin:1.5rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Realtime Pitch Tracker</h1></header><main class="container"><button id="track-btn" onclick="togglePitchTracker()">Start Pitch Tracking</button><div id="pitch-out" class="pitch-display">-- Hz</div></main><script>let audioCtx,analyser,dataArray,isTracking=false;async function togglePitchTracker(){let btn=document.getElementById('track-btn');if(!isTracking){try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=new(window.AudioContext||window.webkitAudioContext)();let src=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=2048;src.connect(analyser);dataArray=new Float32Array(analyser.fftSize);isTracking=true;btn.innerText='Stop Tracking';updatePitch();}catch(e){alert('Mic Error: '+e.message);}}else{isTracking=false;btn.innerText='Start Pitch Tracking';document.getElementById('pitch-out').innerText='-- Hz';}}function updatePitch(){if(!isTracking)return;requestAnimationFrame(updatePitch);analyser.getFloatTimeDomainData(dataArray);let pitch=autoCorrelate(dataArray,audioCtx.sampleRate);document.getElementById('pitch-out').innerText=pitch!==-1?Math.round(pitch)+' Hz':'Listening...';}function autoCorrelate(buf,sr){let SIZE=buf.length,rms=0;for(let i=0;i<SIZE;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/SIZE);if(rms<0.01)return -1;let r1=0,r2=SIZE-1,thres=0.2;for(let i=0;i<SIZE/2;i++)if(Math.abs(buf[i])<thres){r1=i;break;}for(let i=1;i<SIZE/2;i++)if(Math.abs(buf[SIZE-i])<thres){r2=SIZE-i;break;}buf=buf.slice(r1,r2);SIZE=buf.length;let c=new Array(SIZE).fill(0);for(let i=0;i<SIZE;i++)for(let j=0;j<SIZE-i;j++)c[i]+=buf[j]*buf[j+i];let d=0;while(c[d]>c[d+1])d++;let maxval=-1,maxpos=-1;for(let i=d;i<SIZE;i++)if(c[i]>maxval){maxval=c[i];maxpos=i;}return maxpos!==-1?sr/maxpos:-1;}</script></body></html>
