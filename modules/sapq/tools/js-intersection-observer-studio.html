<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JS IntersectionObserver Visualizer & Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JS IntersectionObserver Studio","url":"https://salabs.quanxs.com/tools/js-intersection-observer-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}.scroll-area{height:250px;overflow-y:scroll;background:#0f172a;border-radius:8px;padding:1rem;}.spacer{height:300px;}.target-box{background:#334155;color:#f8fafc;padding:2rem;text-align:center;border-radius:8px;}.target-box.visible{background:#0284c7;color:#fff;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JS IntersectionObserver Visualizer</h1></header><main class="container"><div class="scroll-area" id="scroll-box"><div class="spacer">Scroll Down...</div><div id="target-box" class="target-box">Target Element</div><div class="spacer">End</div></div><p id="obs-status">Intersection Ratio: 0.00</p></main><script>let target=document.getElementById('target-box'),status=document.getElementById('obs-status');let observer=new IntersectionObserver((entries)=>{entries.forEach(entry=>{let ratio=entry.intersectionRatio.toFixed(2);status.innerText=`Ratio: ${ratio} | Intersecting: ${entry.isIntersecting}`;if(entry.isIntersecting){target.classList.add('visible');}else{target.classList.remove('visible');}});},{root:document.getElementById('scroll-box'),threshold:[0,0.5,1.0]});observer.observe(target);</script></body></html>
