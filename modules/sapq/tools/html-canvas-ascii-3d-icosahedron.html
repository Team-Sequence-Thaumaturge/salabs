<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas ASCII 3D Icosahedron Renderer - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas ASCII 3D Icosahedron Renderer","url":"https://salabs.quanxs.com/tools/html-canvas-ascii-3d-icosahedron.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}textarea{width:100%;background:#0f172a;color:#38bdf8;border:1px solid #334155;border-radius:8px;padding:1rem;font-family:monospace;font-size:11px;line-height:11px;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">ASCII 3D Icosahedron Renderer</h1></header><main class="container"><textarea id="ascii-out" rows="20" readonly></textarea></main><script>let phi=(1+Math.sqrt(5))/2,nodes=[[-1,phi,0],[1,phi,0],[-1,-phi,0],[1,-phi,0],[0,-1,phi],[0,1,phi],[0,-1,-phi],[0,1,-phi],[phi,0,-1],[phi,0,1],[-phi,0,-1],[-phi,0,1]],angleX=0,angleY=0;function render3D(){angleX+=0.03;angleY+=0.02;let grid=Array.from({length:20},()=>Array(40).fill(' '));for(let node of nodes){let x=node[0],y=node[1],z=node[2];let x1=x*Math.cos(angleY)+z*Math.sin(angleY);let z1=-x*Math.sin(angleY)+z*Math.cos(angleY);let y2=y*Math.cos(angleX)-z1*Math.sin(angleX);let px=Math.floor(20+x1*8),py=Math.floor(10+y2*4);if(px>=0&&px<40&&py>=0&&py<20)grid[py][px]='*';}document.getElementById('ascii-out').value=grid.map(r=>r.join('')).join('\n');requestAnimationFrame(render3D);}render3D();</script></body></html>
