<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>IPv4 Subnet Calculator & CIDR Inspector - SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Subnet CIDR Calculator","url":"https://salabs.quanxs.com/tools/subnet-cidr-calculator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input,select{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}table{width:100%;border-collapse:collapse;margin-top:1rem;}th,td{border:1px solid #334155;padding:0.75rem;text-align:left;font-family:monospace;}th{background:#0f172a;color:#38bdf8;}.grid{display:grid;grid-template-columns:2fr 1fr;gap:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">IPv4 Subnet Calculator & CIDR Inspector</h1></header><main class="container"><h3>1. IP Address & CIDR Prefix</h3><div class="grid"><input type="text" id="ip-address" value="192.168.1.1" oninput="calculateSubnet()"><select id="cidr-prefix" onchange="calculateSubnet()"></select></div><h3>2. Subnet Details</h3><table><tbody><tr><th>Subnet Mask:</th><td id="res-mask">-</td></tr><tr><th>Network Address:</th><td id="res-net">-</td></tr><tr><th>Broadcast Address:</th><td id="res-bcast">-</td></tr><tr><th>First Usable IP:</th><td id="res-first">-</td></tr><tr><th>Last Usable IP:</th><td id="res-last">-</td></tr><tr><th>Total Hosts:</th><td id="res-hosts">-</td></tr></tbody></table></main><script>let select=document.getElementById('cidr-prefix');for(let i=0;i<=32;i++){let opt=document.createElement('option');opt.value=i;opt.innerText=`/${i}`;if(i===24)opt.selected=true;select.appendChild(opt);}function calculateSubnet(){let ipStr=document.getElementById('ip-address').value.trim(),prefix=parseInt(document.getElementById('cidr-prefix').value),ipParts=ipStr.split('.').map(Number);if(ipParts.length!==4||ipParts.some(p=>isNaN(p)||p<0||p>255))return;let ipNum=(ipParts[0]<<24)|(ipParts[1]<<16)|(ipParts[2]<<8)|ipParts[3],maskNum=prefix===0?0:(0xFFFFFFFF<<(32-prefix))>>>0,netNum=(ipNum&maskNum)>>>0,bcastNum=(netNum|(~maskNum>>>0))>>>0;document.getElementById('res-mask').innerText=numToIp(maskNum);document.getElementById('res-net').innerText=numToIp(netNum);document.getElementById('res-bcast').innerText=numToIp(bcastNum);document.getElementById('res-first').innerText=numToIp((netNum+1)>>>0);document.getElementById('res-last').innerText=numToIp((bcastNum-1)>>>0);document.getElementById('res-hosts').innerText=prefix>=31?0:(bcastNum-netNum-1);}function numToIp(num){return[(num>>>24)&255,(num>>>16)&255,(num>>>8)&255,num&255].join('.');}calculateSubnet();</script></body></html>
