<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas Image Threshold Binarizer - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas Image Threshold Binarizer","url":"https://salabs.quanxs.com/tools/html-canvas-threshold-binarizer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}canvas{max-width:100%;height:auto;border-radius:8px;border:1px solid #334155;background:#0f172a;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas Image Threshold Binarizer</h1></header><main class="container"><input type="file" id="img-in" accept="image/*" onchange="loadImg()"><label>Thresh: <span id="thresh-val">128</span></label><input type="range" id="thresh-slider" min="0" max="255" value="128" oninput="applyThreshold()"><canvas id="cvs"></canvas></main><script>let loadedImg=null;function loadImg(){let f=document.getElementById('img-in').files[0];if(!f)return;let r=new FileReader();r.onload=e=>{loadedImg=new Image();loadedImg.onload=()=>applyThreshold();loadedImg.src=e.target.result;};r.readAsDataURL(f);}function applyThreshold(){if(!loadedImg)return;let cvs=document.getElementById('cvs'),ctx=cvs.getContext('2d'),thresh=parseInt(document.getElementById('thresh-slider').value);document.getElementById('thresh-val').innerText=thresh;cvs.width=loadedImg.width;cvs.height=loadedImg.height;ctx.drawImage(loadedImg,0,0);let imgData=ctx.getImageData(0,0,cvs.width,cvs.height),d=imgData.data;for(let i=0;i<d.length;i+=4){let avg=(d[i]+d[i+1]+d[i+2])/3;let bw=avg>=thresh?255:0;d[i]=d[i+1]=d[i+2]=bw;}ctx.putImageData(imgData,0,0);}</script></body></html>
