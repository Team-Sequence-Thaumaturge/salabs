<html lang="en">
<head>
  <meta charset="UTF-8">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Audio Formant Vowel Filter Studio v10002",
    "url": "https://salabs.quanxs.com/tools/audio-formant-vowel-filter-v10002.html",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All"
  }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 32px; border-radius: 12px; border: 1px solid #334155; }
    h1 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 12px; margin-top: 0; }
    .panel { background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 20px; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0369a1; }
    .metric { font-family: monospace; font-size: 16px; color: #38bdf8; padding: 12px; background: #020617; border-radius: 6px; margin-top: 10px; text-align: center; }
  </style>
<script>

    let ctx, osc, f1, f2;
    let active = false;
    document.getElementById('playBtn').addEventListener('click', () => {
      if (!active) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        osc = ctx.createOscillator();
        f1 = ctx.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 730;
        f2 = ctx.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = 1090;
        osc.type = 'sawtooth'; osc.frequency.value = 130;
        osc.connect(f1); osc.connect(f2);
        f1.connect(ctx.destination); f2.connect(ctx.destination);
        osc.start(); active = true;
        document.getElementById('statusBox').innerText = 'Audio DSP Synthesizing Vowel /a/ [730Hz, 1090Hz]';
      } else {
        osc.stop(); ctx.close(); active = false;
        document.getElementById('statusBox').innerText = 'DSP Engine Offline';
      }
    });
  
</script>
</head>
<body>
  <div class="container">
    <h1>Audio Formant Vowel Filter Studio v10002</h1>
    <p style="color:#94a3b8;">100% Client-Side Web Audio API Formant Vowel Filter Synthesizer v10002</p>
    <div class="panel">
      <button id="playBtn">Toggle Formant Vowel Synthesizer</button>
      <div id="statusBox" class="metric">DSP Engine Ready</div>
    </div>
  </div>
  
</body>
</html>
