<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto SECP256k1 Signature Inspector - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto SECP256k1 Signature Inspector","url":"https://salabs.quanxs.com/tools/crypto-secp256k1-signature-inspector.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.result-box{padding:1rem;border-radius:8px;font-weight:bold;margin-top:1rem;background:#334155;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">SECP256k1 Signature Inspector</h1></header><main class="container"><input type="text" id="sig-hex" placeholder="64-byte hex signature..." oninput="inspectSig()"><div id="status-box" class="result-box">Enter Hex Signature to inspect R & S components</div></main><script>function inspectSig(){let hex=document.getElementById('sig-hex').value.trim(),box=document.getElementById('status-box');if(!hex||hex.length!==128){box.style.background='#334155';box.innerText='Signature must be exactly 128 hex characters (64 bytes)';return;}let r=hex.substring(0,64),s=hex.substring(64,128);box.style.background='#16a34a';box.innerText=`✓ SECP256k1 Signature Parsed:\n\nR: ${r}\nS: ${s}`;}inspectSig();</script></body></html>
