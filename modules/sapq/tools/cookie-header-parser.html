<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>HTTP Cookie & Header String Parser - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"HTTP Cookie Header Parser","url":"https://salabs.quanxs.com/tools/cookie-header-parser.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">HTTP Cookie & Header String Parser</h1></header><main class="container"><h3>1. Raw Cookie Header Input</h3><textarea id="cookie-input" rows="4" oninput="parseCookies()"></textarea><h3>2. Parsed Cookie JSON</h3><textarea id="cookie-output" rows="6" readonly></textarea></main><script>function parseCookies(){let raw=document.getElementById('cookie-input').value;let result={};if(raw){raw.split(';').forEach(part=>{let pair=part.trim().split('=');if(pair[0])result[decodeURIComponent(pair[0])]=pair[1]?decodeURIComponent(pair.slice(1).join('=')):'';});}document.getElementById('cookie-output').value=JSON.stringify(result,null,2);}</script></body></html>
