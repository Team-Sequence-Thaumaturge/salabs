<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas ASCII 3D Wireframe Pyramid - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas ASCII 3D Wireframe Pyramid","url":"https://salabs.quanxs.com/tools/html-canvas-ascii-3d-pyramid-wireframe.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}textarea{width:100%;background:#0f172a;color:#38bdf8;border:1px solid #334155;border-radius:8px;padding:1rem;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas ASCII 3D Wireframe Pyramid</h1></header><main class="container"><textarea id="pyramid-out" rows="16" readonly></textarea></main><script>let angle=0;function renderPyramid(){angle+=0.05;let w=50,h=20;let grid=Array.from({length:h},()=>Array(w).fill(' '));let nodes=[{x:0,y:1,z:0},{x:-1,y:-1,z:-1},{x:1,y:-1,z:-1},{x:1,y:-1,z:1},{x:-1,y:-1,z:1}];let cos=Math.cos(angle),sin=Math.sin(angle);let projected=nodes.map(n=>{let rx=n.x*cos-n.z*sin;let rz=n.x*sin+n.z*cos;let px=Math.floor(w/2+rx*12);let py=Math.floor(h/2+n.y*6);return{x:px,y:py};});for(let p of projected){if(p.x>=0&&p.x<w&&p.y>=0&&p.y<h)grid[p.y][p.x]='^';}document.getElementById('pyramid-out').value=grid.map(r=>r.join('')).join('\n');requestAnimationFrame(renderPyramid);}renderPyramid();</script></body></html>
