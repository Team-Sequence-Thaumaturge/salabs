<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>HTML Formatting Sanitizer & DOM Cleaner - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"HTML Formatting Sanitizer & DOM Cleaner","url":"https://salabs.quanxs.com/tools/html-formatting-sanitizer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">HTML Formatting Sanitizer</h1></header><main class="container"><h3>1. Raw HTML Input</h3><textarea id="html-in" rows="6" oninput="sanitizeHTML()"></textarea><h3>2. Sanitized HTML</h3><textarea id="html-out" rows="6" readonly></textarea></main><script>function sanitizeHTML(){let raw=document.getElementById('html-in').value;let parser=new DOMParser();let doc=parser.parseFromString(raw,'text/html');doc.querySelectorAll('script, style, iframe, object, embed').forEach(el=>el.remove());document.getElementById('html-out').value=doc.body.innerHTML.trim();}</script></body></html>
