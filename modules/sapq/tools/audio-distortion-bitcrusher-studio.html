<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Bitcrusher & Lo-Fi Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Bitcrusher & Lo-Fi Studio","url":"https://salabs.quanxs.com/tools/audio-distortion-bitcrusher-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:80%;margin:1rem 0;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Bitcrusher & Lo-Fi Studio</h1></header><main class="container"><button onclick="playBitcrushTone()">Play Bitcrushed Tone</button><p>Bit Depth (<span id="bits-val">4</span> bits)</p><input type="range" id="bits-slider" min="1" max="16" value="4" oninput="updateBits()"></main><script>let audioCtx,osc,shaper;function playBitcrushTone(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(osc)osc.stop();osc=audioCtx.createOscillator();shaper=audioCtx.createWaveShaper();let bits=parseInt(document.getElementById('bits-slider').value);let step=Math.pow(0.5,bits);let curve=new Float32Array(4096);for(let i=0;i<4096;i++){let x=(i/2048)-1;curve[i]=step*Math.floor(x/step+0.5);}shaper.curve=curve;osc.type='sawtooth';osc.frequency.value=220;osc.connect(shaper);shaper.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.2);}function updateBits(){let v=document.getElementById('bits-slider').value;document.getElementById('bits-val').innerText=v;}</script></body></html>
