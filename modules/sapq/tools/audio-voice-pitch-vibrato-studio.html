<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Voice Pitch Vibrato Studio | SA Labs Developer Utilities</title>
  <meta name="description" content="100% Client-Side Web Audio API Voice Pitch & Vibrato Modulation Studio for DSP developers and audio engineers.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Audio Voice Pitch Vibrato Studio",
    "url": "https://salabs.quanxs.com/tools/audio-voice-pitch-vibrato-studio.html",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript and Web Audio API support"
  }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 0; }
    .control-group { margin-bottom: 20px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; }
    input, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #f8fafc; font-size: 14px; box-sizing: border-box; }
    button { background: #0284c7; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .status { margin-top: 15px; padding: 12px; border-radius: 6px; background: #334155; color: #38bdf8; font-family: monospace; text-align: center; }
  </style>
<script>

    let audioCtx, osc, lfo, lfoGain, masterGain;
    let isPlaying = false;
    document.getElementById('vibratoRate').addEventListener('input', e => {
      document.getElementById('rateVal').innerText = e.target.value;
      if (lfo) lfo.frequency.setValueAtTime(e.target.value, audioCtx.currentTime);
    });
    document.getElementById('vibratoDepth').addEventListener('input', e => {
      document.getElementById('depthVal').innerText = e.target.value;
      if (lfoGain) lfoGain.gain.setValueAtTime(e.target.value, audioCtx.currentTime);
    });
    document.getElementById('startBtn').addEventListener('click', () => {
      if (isPlaying) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      osc = audioCtx.createOscillator();
      lfo = audioCtx.createOscillator();
      lfoGain = audioCtx.createGain();
      masterGain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 220;
      lfo.frequency.value = parseFloat(document.getElementById('vibratoRate').value);
      lfoGain.gain.value = parseFloat(document.getElementById('vibratoDepth').value);
      lfo.connect(lfoGain);
      lfoGain.connect(osc.detune);
      osc.connect(masterGain);
      masterGain.connect(audioCtx.destination);
      osc.start();
      lfo.start();
      isPlaying = true;
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'block';
      document.getElementById('statusBox').innerText = 'Audio Engine Active (Vibrato LFO Running)';
    });
    document.getElementById('stopBtn').addEventListener('click', () => {
      if (!isPlaying) return;
      osc.stop();
      lfo.stop();
      audioCtx.close();
      isPlaying = false;
      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'none';
      document.getElementById('statusBox').innerText = 'Engine Stopped';
    });
  
</script>
</head>
<body>
  <div class="container">
    <h1>Audio Voice Pitch Vibrato Studio</h1>
    <p style="color: #94a3b8;">Client-side Web Audio LFO Vibrato & Pitch Shifter Studio. Zero server required.</p>
    <div class="control-group">
      <label for="vibratoRate">Vibrato Rate (Hz): <span id="rateVal">5.5</span> Hz</label>
      <input type="range" id="vibratoRate" min="1" max="12" step="0.1" value="5.5">
    </div>
    <div class="control-group">
      <label for="vibratoDepth">Vibrato Depth (Cents): <span id="depthVal">35</span> Cents</label>
      <input type="range" id="vibratoDepth" min="5" max="100" step="1" value="35">
    </div>
    <div class="control-group">
      <button id="startBtn">Start Audio Engine</button>
      <button id="stopBtn" style="background: #e11d48; display: none;">Stop Engine</button>
    </div>
    <div id="statusBox" class="status">Engine Ready</div>
  </div>
  
</body>
</html>
