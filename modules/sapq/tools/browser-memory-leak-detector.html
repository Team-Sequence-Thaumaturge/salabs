<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Browser Memory Heap Inspector - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Browser Memory Heap Inspector","url":"https://salabs.quanxs.com/tools/browser-memory-leak-detector.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}.card{background:#0f172a;border:1px solid #334155;padding:1.5rem;border-radius:8px;margin-top:1rem;text-align:left;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Browser Memory Heap Inspector</h1></header><main class="container"><button onclick="checkMemory()">Sample JS Memory Heap</button><div id="heap-stats" class="card">Checking...</div></main><script>function checkMemory(){let s=document.getElementById('heap-stats');if(window.performance&&window.performance.memory){let m=window.performance.memory,u=(m.usedJSHeapSize/(1024*1024)).toFixed(2),t=(m.totalJSHeapSize/(1024*1024)).toFixed(2);s.innerHTML=`<p><strong>Used Heap:</strong> ${u} MB</p><p><strong>Total Heap:</strong> ${t} MB</p>`;}else{s.innerHTML=`<p><strong>Heap Inspector:</strong> Active in Chrome/Edge DevTools mode.</p>`;}}checkMemory();</script></body></html>
