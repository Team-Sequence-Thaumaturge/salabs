<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JS Stack & Queue Visualizer - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JS Stack Queue Visualizer","url":"https://salabs.quanxs.com/tools/js-data-structure-visualizer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input{width:70%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:0.8rem;margin-right:0.5rem;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.2rem;border-radius:6px;font-weight:bold;cursor:pointer;}.ds-display{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:1rem;padding:1rem;background:#0f172a;border-radius:8px;min-height:60px;align-items:center;}.item-chip{background:#38bdf8;color:#0f172a;padding:0.5rem 1rem;border-radius:6px;font-weight:bold;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JS Stack & Queue Visualizer</h1></header><main class="container"><input type="text" id="elem-input" placeholder="Value"><button onclick="pushStack()">Push</button><button onclick="popStack()">Pop</button><div id="ds-container" class="ds-display"></div></main><script>let list=[];function render(){let c=document.getElementById('ds-container');c.innerHTML='';list.forEach(i=>{let d=document.createElement('div');d.className='item-chip';d.innerText=i;c.appendChild(d);});}function pushStack(){let v=document.getElementById('elem-input').value;if(v){list.push(v);render();}}function popStack(){list.pop();render();}</script></body></html>
