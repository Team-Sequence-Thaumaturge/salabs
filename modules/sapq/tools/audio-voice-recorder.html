<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Voice Recorder & Visualizer - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Voice Recorder & Visualizer","url":"https://salabs.quanxs.com/tools/audio-voice-recorder.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}audio{width:100%;margin-top:1rem;}</style><script>
let mediaRecorder=null,audioChunks=[],isRecording=false;async function toggleRecord(){let btn=document.getElementById('rec-btn'),status=document.getElementById('rec-status'),player=document.getElementById('audio-playback');if(!isRecording){try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(stream);audioChunks=[];mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);mediaRecorder.onstop=()=>{let blob=new Blob(audioChunks,{type:'audio/webm'});player.src=URL.createObjectURL(blob);player.style.display='block';};mediaRecorder.start();isRecording=true;btn.innerText='Stop Recording';status.innerText='Status: Recording in progress...';}catch(e){alert('Microphone error: '+e.message);}}else{mediaRecorder.stop();isRecording=false;btn.innerText='Start Recording';status.innerText='Status: Recording completed.';}}
</script>
</head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Voice Recorder & Visualizer</h1></header><main class="container"><button id="rec-btn" onclick="toggleRecord()">Start Recording</button><p id="rec-status">Status: Ready</p><audio id="audio-playback" controls style="display:none;"></audio></main></body></html>
