<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto HMAC SHA-384 Authenticator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto HMAC SHA-384 Authenticator","url":"https://salabs.quanxs.com/tools/crypto-hmac-sha384-authenticator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">HMAC SHA-384 Token Authenticator</h1></header><main class="container"><input type="text" id="key-in" value="secret_key_384" oninput="computeHMAC384()"><textarea id="msg-in" rows="3" oninput="computeHMAC384()">Quanxs SA Labs HMAC SHA-384 Test Payload</textarea><textarea id="hmac-out" rows="2" readonly></textarea></main><script>async function computeHMAC384(){let kStr=document.getElementById('key-in').value,mStr=document.getElementById('msg-in').value;if(!kStr||!mStr)return;try{let enc=new TextEncoder();let key=await window.crypto.subtle.importKey("raw",enc.encode(kStr),{name:"HMAC",hash:"SHA-384"},false,["sign"]);let sigBuf=await window.crypto.subtle.sign("HMAC",key,enc.encode(mStr));document.getElementById('hmac-out').value=Array.from(new Uint8Array(sigBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');}catch(e){document.getElementById('hmac-out').value='Crypto Error: '+e.message;}}computeHMAC384();</script></body></html>
