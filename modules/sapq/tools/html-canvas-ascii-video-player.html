<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Canvas Stream ASCII Art Player - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Canvas Stream ASCII Art Player","url":"https://salabs.quanxs.com/tools/html-canvas-ascii-video-player.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}textarea{width:100%;background:#0f172a;color:#38bdf8;border:1px solid #334155;border-radius:8px;padding:1rem;font-family:monospace;font-size:10px;line-height:10px;}video{display:none;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Canvas Stream ASCII Art Player</h1></header><main class="container"><button onclick="startCam()">Start Webcam ASCII Stream</button><video id="webcam" autoplay playsinline></video><textarea id="ascii-stream" rows="20" readonly></textarea></main><script>async function startCam(){try{let stream=await navigator.mediaDevices.getUserMedia({video:{width:80,height:40}});let video=document.getElementById('webcam');video.srcObject=stream;video.onloadedmetadata=()=>{video.play();renderFrame();};}catch(e){alert('Webcam Error: '+e.message);}}function renderFrame(){let video=document.getElementById('webcam'),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=60;canvas.height=30;ctx.drawImage(video,0,0,60,30);let imgData=ctx.getImageData(0,0,60,30).data,chars=' .:-=+*#%@',ascii='';for(let y=0;y<30;y++){for(let x=0;x<60;x++){let idx=(y*60+x)*4,avg=(imgData[idx]+imgData[idx+1]+imgData[idx+2])/3,cIdx=Math.floor((avg/255)*(chars.length-1));ascii+=chars[cIdx];}ascii+='\n';}document.getElementById('ascii-stream').value=ascii;requestAnimationFrame(renderFrame);}</script></body></html>
