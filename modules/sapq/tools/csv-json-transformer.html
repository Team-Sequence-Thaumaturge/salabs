<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>CSV to JSON & JSON to CSV Converter - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"CSV JSON Transformer","url":"https://salabs.quanxs.com/tools/csv-json-transformer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-right:0.5rem;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">CSV <-> JSON Data Transformer</h1></header><main class="container"><div class="grid"><div><h3>CSV</h3><textarea id="csv-area" rows="12"></textarea><button onclick="csvToJson()">CSV -> JSON</button></div><div><h3>JSON</h3><textarea id="json-area" rows="12"></textarea><button onclick="jsonToCsv()">JSON -> CSV</button></div></div></main><script>function csvToJson(){let csv=document.getElementById('csv-area').value.trim();if(!csv)return;let lines=csv.split('\n');let headers=lines[0].split(',').map(h=>h.trim());let res=[];for(let i=1;i<lines.length;i++){if(!lines[i].trim())continue;let obj={};let cur=lines[i].split(',');for(let j=0;j<headers.length;j++)obj[headers[j]]=cur[j]?cur[j].trim():'';res.push(obj);}document.getElementById('json-area').value=JSON.stringify(res,null,2);}function jsonToCsv(){let str=document.getElementById('json-area').value.trim();if(!str)return;try{let arr=JSON.parse(str);if(!Array.isArray(arr)||arr.length===0)return;let headers=Object.keys(arr[0]);let lines=[headers.join(',')];for(let r of arr){lines.push(headers.map(h=>r[h]!==undefined?String(r[h]):'').join(','));}document.getElementById('csv-area').value=lines.join('\n');}catch(e){alert(e.message);}}</script></body></html>
