<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>OpenGraph & Meta Tag Generator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Meta Tag Generator","url":"https://salabs.quanxs.com/tools/meta-tag-generator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input,textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">OpenGraph & Meta Tag Generator</h1></header><main class="container"><label>Site Title</label><input type="text" id="m-title" oninput="genMeta()"><label>Description</label><textarea id="m-desc" rows="2" oninput="genMeta()"></textarea><label>Canonical URL</label><input type="text" id="m-url" oninput="genMeta()"><textarea id="meta-output" rows="8" readonly></textarea></main><script>function genMeta(){let title=document.getElementById('m-title').value||'Title';let desc=document.getElementById('m-desc').value||'Description';let url=document.getElementById('m-url').value||'https://example.com';let tags=`<title>${title}</title>\n<meta name="description" content="${desc}">\n<link rel="canonical" href="${url}">\n<meta property="og:title" content="${title}">`;document.getElementById('meta-output').value=tags;}genMeta();</script></body></html>
