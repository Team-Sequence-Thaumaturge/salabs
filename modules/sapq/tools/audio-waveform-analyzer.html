<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio Waveform Visualizer & Frequency Analyzer - SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio Visualizer","url":"https://salabs.quanxs.com/tools/audio-waveform-analyzer.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}canvas{width:100%;height:250px;background:#0f172a;border-radius:8px;border:1px solid #334155;margin-bottom:1rem;}input[type="file"]{background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:0.8rem;width:100%;margin-bottom:1rem;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-right:0.5rem;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio Waveform & Frequency Visualizer</h1></header><main class="container"><h3>1. Select Audio File</h3><input type="file" id="audio-file" accept="audio/*" onchange="loadAudio(event)"><div><button onclick="playAudio()">Play</button><button onclick="pauseAudio()">Pause</button></div><h3>2. Visualizer</h3><canvas id="visualizer-canvas"></canvas></main><script>let audioCtx,analyser,audioEle,source;function loadAudio(e){let file=e.target.files[0];if(!file)return;if(audioEle)audioEle.pause();audioEle=new Audio(URL.createObjectURL(file));if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=256;}source=audioCtx.createMediaElementSource(audioEle);source.connect(analyser);analyser.connect(audioCtx.destination);drawVisualizer();}function playAudio(){if(audioEle){if(audioCtx.state==='suspended')audioCtx.resume();audioEle.play();}}function pauseAudio(){if(audioEle)audioEle.pause();}function drawVisualizer(){let canvas=document.getElementById('visualizer-canvas'),ctx=canvas.getContext('2d'),bufferLength=analyser.frequencyBinCount,dataArray=new Uint8Array(bufferLength);function render(){requestAnimationFrame(render);analyser.getByteFrequencyData(dataArray);ctx.fillStyle='#0f172a';ctx.fillRect(0,0,canvas.width,canvas.height);let barWidth=(canvas.width/bufferLength)*2.5,x=0;for(let i=0;i<bufferLength;i++){let barHeight=dataArray[i];ctx.fillStyle=`rgb(${barHeight+100}, 189, 248)`;ctx.fillRect(x,canvas.height-barHeight/1.2,barWidth,barHeight/1.2);x+=barWidth+1;}}render();}</script></body></html>
