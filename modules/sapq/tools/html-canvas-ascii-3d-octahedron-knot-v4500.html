<script>

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let angleX = 0, angleY = 0;
    let animating = true;
    const toggleBtn = document.getElementById('toggleBtn');

    toggleBtn.addEventListener('click', () => {
      animating = !animating;
      toggleBtn.innerText = animating ? 'Pause Animation v4500' : 'Resume Animation v4500';
      if (animating) render();
    });

    function render() {
      if (!animating) return;
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = '12px monospace';
      ctx.fillStyle = '#38bdf8';
      ctx.textAlign = 'center';

      const scale = Math.min(canvas.width, canvas.height) / 3;
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      angleX += 0.02;
      angleY += 0.03;

      const nodes = [
        [0, 1, 0], [1, 0, 0], [0, -1, 0], [-1, 0, 0], [0, 0, 1], [0, 0, -1]
      ];

      nodes.forEach(node => {
        let x = node[0], y = node[1], z = node[2];
        let y1 = y * Math.cos(angleX) - z * Math.sin(angleX);
        let z1 = y * Math.sin(angleX) + z * Math.cos(angleX);
        let x1 = x * Math.cos(angleY) + z1 * Math.sin(angleY);
        let z2 = -x * Math.sin(angleY) + z1 * Math.cos(angleY);

        let px = cx + x1 * scale;
        let py = cy + y1 * scale;
        ctx.fillText('#', px, py);
      });

      requestAnimationFrame(render);
    }
    render();
  
</script>
