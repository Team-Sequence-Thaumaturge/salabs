<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>HTML Entity Encoder / Decoder & Text Diff Checker - SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"HTML Entity Diff Checker","url":"https://salabs.quanxs.com/tools/html-entity-diff-checker.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;margin-right:0.5rem;margin-bottom:1rem;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}#diff-output{background:#0f172a;padding:1rem;border-radius:8px;border:1px solid #334155;min-height:100px;white-space:pre-wrap;font-family:monospace;}ins{background:#166534;color:#f8fafc;text-decoration:none;padding:2px 4px;border-radius:2px;}del{background:#991b1b;color:#f8fafc;text-decoration:none;padding:2px 4px;border-radius:2px;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">HTML Entity Encoder & Text Diff Checker</h1></header><main class="container"><h3>1. HTML Entity Escaper</h3><textarea id="entity-input" rows="4" placeholder="Paste HTML text..."></textarea><div><button onclick="escapeEntities()">Encode</button><button onclick="unescapeEntities()">Decode</button></div><textarea id="entity-output" rows="4" readonly></textarea><h3>2. Text Diff Checker</h3><div class="grid"><div><textarea id="diff-text1" rows="5" placeholder="Original text..."></textarea></div><div><textarea id="diff-text2" rows="5" placeholder="Modified text..."></textarea></div></div><button onclick="compareTextDiff()">Compare Differences</button><h3>Diff Result</h3><div id="diff-output"></div></main><script>function escapeEntities(){let val=document.getElementById('entity-input').value;document.getElementById('entity-output').value=val.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}function unescapeEntities(){let val=document.getElementById('entity-input').value;document.getElementById('entity-output').value=new DOMParser().parseFromString(val,'text/html').documentElement.textContent;}function compareTextDiff(){let t1=document.getElementById('diff-text1').value.split('\n');let t2=document.getElementById('diff-text2').value.split('\n');let max=Math.max(t1.length,t2.length);let html='';for(let i=0;i<max;i++){let l1=t1[i]||'';let l2=t2[i]||'';if(l1===l2){html+='<div style="color:#94a3b8;">  '+escapeHtml(l1)+'</div>';}else{if(l1)html+='<div><del>- '+escapeHtml(l1)+'</del></div>';if(l2)html+='<div><ins>+ '+escapeHtml(l2)+'</ins></div>';}}document.getElementById('diff-output').innerHTML=html||'No differences detected.';}function escapeHtml(str){return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}</script></body></html>
