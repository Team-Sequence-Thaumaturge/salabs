<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>CSS Filter & Backdrop Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"CSS Filter Studio","url":"https://salabs.quanxs.com/tools/css-box-filter-generator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}input[type="range"]{width:100%;margin-bottom:1rem;}.preview-box{width:100%;height:160px;background:linear-gradient(135deg,#38bdf8,#818cf8);border-radius:8px;margin:2rem 0;display:flex;align-items:center;justify-content:center;font-weight:bold;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">CSS Filter & Backdrop Studio</h1></header><main class="container"><label>Blur: <span id="v-blur">0</span>px</label><input type="range" id="f-blur" min="0" max="20" value="0" oninput="updateFilter()"><label>Brightness: <span id="v-bright">100</span>%</label><input type="range" id="f-bright" min="0" max="200" value="100" oninput="updateFilter()"><label>Grayscale: <span id="v-gray">0</span>%</label><input type="range" id="f-gray" min="0" max="100" value="0" oninput="updateFilter()"><div id="filter-preview" class="preview-box">Filter Visual Preview</div><textarea id="css-out" rows="2" readonly></textarea></main><script>function updateFilter(){let b=document.getElementById('f-blur').value,br=document.getElementById('f-bright').value,g=document.getElementById('f-gray').value;document.getElementById('v-blur').innerText=b;document.getElementById('v-bright').innerText=br;document.getElementById('v-gray').innerText=g;let s=`blur(${b}px) brightness(${br}%) grayscale(${g}%)`;document.getElementById('filter-preview').style.filter=s;document.getElementById('css-out').value=`filter: ${s};`;}updateFilter();</script></body></html>
