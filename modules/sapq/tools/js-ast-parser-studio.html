<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>JS AST & Token Parser Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"JS AST Token Parser Studio","url":"https://salabs.quanxs.com/tools/js-ast-parser-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">JS AST & Token Parser Studio</h1></header><main class="container"><h3>JS Input</h3><textarea id="code-in" rows="5" oninput="parseCode()"></textarea><h3>AST Tokens</h3><textarea id="ast-out" rows="8" readonly></textarea></main><script>function parseCode(){let code=document.getElementById('code-in').value;if(!code.trim()){document.getElementById('ast-out').value='';return;}try{let tokens=code.match(/\b\w+\b|[^\w\s]/g)||\[\];let structured=tokens.map((t,i)=>({id:i+1,token:t,type:/^\d+$/.test(t)?'Number':/^[a-zA-Z_]\w*$/.test(t)?'Identifier/Keyword':'Operator'}));document.getElementById('ast-out').value=JSON.stringify({total_tokens:tokens.length,tokens:structured},null,2);}catch(e){document.getElementById('ast-out').value='Error: '+e.message;}}parseCode();</script></body></html>
