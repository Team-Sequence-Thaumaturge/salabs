<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Audio ADSR Envelope Generator Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Audio ADSR Envelope Generator Studio","url":"https://salabs.quanxs.com/tools/audio-envelope-generator-studio.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}input[type="range"]{width:100%;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Audio ADSR Envelope Generator Studio</h1></header><main class="container"><label>Attack: <span id="v-att">0.1</span>s</label><input type="range" id="att" min="0.01" max="1" step="0.01" value="0.1" oninput="updateVal()"><label>Decay: <span id="v-dec">0.2</span>s</label><input type="range" id="dec" min="0.01" max="1" step="0.01" value="0.2" oninput="updateVal()"><label>Sustain: <span id="v-sus">0.5</span></label><input type="range" id="sus" min="0" max="1" step="0.05" value="0.5" oninput="updateVal()"><label>Release: <span id="v-rel">0.3</span>s</label><input type="range" id="rel" min="0.05" max="2" step="0.05" value="0.3" oninput="updateVal()"><br><button onclick="playADSRTone()">Play ADSR Tone</button></main><script>let audioCtx;function updateVal(){document.getElementById('v-att').innerText=document.getElementById('att').value;document.getElementById('v-dec').innerText=document.getElementById('dec').value;document.getElementById('v-sus').innerText=document.getElementById('sus').value;document.getElementById('v-rel').innerText=document.getElementById('rel').value;}function playADSRTone(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();let osc=audioCtx.createOscillator(),gain=audioCtx.createGain();let att=parseFloat(document.getElementById('att').value),dec=parseFloat(document.getElementById('dec').value),sus=parseFloat(document.getElementById('sus').value),rel=parseFloat(document.getElementById('rel').value);let now=audioCtx.currentTime;gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(1,now+att);gain.gain.linearRampToValueAtTime(sus,now+att+dec);gain.gain.setValueAtTime(sus,now+att+dec+0.5);gain.gain.linearRampToValueAtTime(0,now+att+dec+0.5+rel);osc.type='sawtooth';osc.frequency.value=220;osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+att+dec+0.5+rel+0.1);}</script></body></html>
