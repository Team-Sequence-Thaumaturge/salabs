<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Canvas Image Color Palette & Dominant Color Extractor | SA Labs</title>
  <meta name="description" content="100% Client-side HTML5 Canvas pixel sampling engine for extracting dominant color palettes and HEX/RGB/HSL codes.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "HTML5 Canvas Color Palette Extractor",
    "url": "https://salabs.quanxs.com/tools/html-canvas-color-palette-extractor.html",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript and HTML5 Canvas API"
  }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    .container { max-width: 960px; margin: 0 auto; background: #1e293b; padding: 32px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 12px; margin-top: 0; }
    .panel { background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; }
    input[type="file"], button, textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #f8fafc; font-size: 14px; box-sizing: border-box; }
    button { background: #0284c7; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    button:hover { background: #0369a1; }
    .palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; margin-top: 20px; }
    .color-card { background: #020617; border-radius: 8px; overflow: hidden; border: 1px solid #334155; text-align: center; }
    .color-swatch { height: 80px; width: 100%; }
    .color-info { padding: 10px; font-family: monospace; font-size: 12px; color: #f8fafc; }
    canvas { max-width: 100%; max-height: 250px; display: block; margin: 15px auto; border-radius: 8px; border: 1px solid #334155; }
  </style>
<script>

    const imgUpload = document.getElementById('imgUpload');
    const canvas = document.getElementById('canvasPreview');
    const ctx = canvas.getContext('2d');
    const paletteContainer = document.getElementById('paletteContainer');
    const cssExport = document.getElementById('cssExport');

    imgUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          extractPalette();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    function extractPalette() {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      const colorCounts = {};
      const step = 16; // sampling rate for performance

      for (let i = 0; i < imgData.length; i += 4 * step) {
        const r = Math.round(imgData[i] / 16) * 16;
        const g = Math.round(imgData[i+1] / 16) * 16;
        const b = Math.round(imgData[i+2] / 16) * 16;
        const a = imgData[i+3];
        if (a < 128) continue; // skip transparent
        const hex = rgbToHex(Math.min(255, r), Math.min(255, g), Math.min(255, b));
        colorCounts[hex] = (colorCounts[hex] || 0) + 1;
      }

      const sorted = Object.keys(colorCounts).sort((a, b) => colorCounts[b] - colorCounts[a]).slice(0, 8);
      
      paletteContainer.innerHTML = '';
      let cssText = ':root {
';

      sorted.forEach((hex, idx) => {
        const card = document.createElement('div');
        card.className = 'color-card';
        card.innerHTML = `
          <div class="color-swatch" style="background: ${hex};"></div>
          <div class="color-info">
            <div>${hex}</div>
          </div>
        `;
        paletteContainer.appendChild(card);
        cssText += `  --palette-color-${idx + 1}: ${hex};
`;
      });

      cssText += '}';
      cssExport.value = cssText;
    }
  
</script>
</head>
<body>
  <div class="container">
    <h1>HTML5 Canvas Image Color Palette & Dominant Extractor</h1>
    <p style="color: #94a3b8;">100% Client-side HTML5 Canvas pixel sampler. Extracts dominant color palettes, HEX, RGB, and HSL codes directly in browser.</p>

    <div class="panel">
      <label for="imgUpload">Select or Drag & Drop Image File:</label>
      <input type="file" id="imgUpload" accept="image/*">
    </div>

    <div class="panel" style="text-align: center;">
      <canvas id="canvasPreview"></canvas>
    </div>

    <div class="panel">
      <label>Extracted Dominant Color Palette:</label>
      <div id="paletteContainer" class="palette-grid">
        <p style="color: #64748b;">Upload an image to extract dominant color palette...</p>
      </div>
    </div>

    <div class="panel">
      <label for="cssExport">Export Palette CSS Variables:</label>
      <textarea id="cssExport" readonly style="font-family: monospace; height: 120px;" placeholder=":root {
  --color-1: #...;
}"></textarea>
    </div>
  </div>

  
</body>
</html>
