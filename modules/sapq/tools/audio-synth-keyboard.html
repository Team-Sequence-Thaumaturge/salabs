<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Audio Synthesizer & Piano Keyboard - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Audio Synthesizer Keyboard","url":"https://salabs.quanxs.com/tools/audio-synth-keyboard.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;text-align:center;}.key-btn{background:#38bdf8;color:#0f172a;border:none;padding:1.5rem 1rem;border-radius:6px;font-weight:bold;cursor:pointer;margin:0.2rem;min-width:50px;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Web Audio Synthesizer & Keyboard</h1></header><main class="container"><button class="key-btn" onclick="playTone(261.63)">C4</button><button class="key-btn" onclick="playTone(293.66)">D4</button><button class="key-btn" onclick="playTone(329.63)">E4</button><button class="key-btn" onclick="playTone(349.23)">F4</button><button class="key-btn" onclick="playTone(392.00)">G4</button><button class="key-btn" onclick="playTone(440.00)">A4</button><button class="key-btn" onclick="playTone(493.88)">B4</button><button class="key-btn" onclick="playTone(523.25)">C5</button></main><script>let audioCtx=null;function playTone(freq){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();let osc=audioCtx.createOscillator();let gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,audioCtx.currentTime);gain.gain.setValueAtTime(0.3,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+1.2);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1.2);}</script></body></html>
