<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>CSS Flexbox Interactive Playground - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"CSS Flexbox Playground","url":"https://salabs.quanxs.com/tools/css-flexbox-playground.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}select{background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:0.8rem;margin-bottom:1rem;width:100%;}.flex-box{display:flex;background:#0f172a;border:1px solid #334155;border-radius:8px;min-height:200px;padding:1rem;margin:1.5rem 0;}.flex-item{background:#38bdf8;color:#0f172a;font-weight:bold;padding:1.5rem;margin:0.5rem;border-radius:6px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">CSS Flexbox Playground</h1></header><main class="container"><label>flex-direction</label><select id="f-dir" onchange="updateFlex()"><option value="row">row</option><option value="column">column</option></select><label>justify-content</label><select id="f-jc" onchange="updateFlex()"><option value="flex-start">flex-start</option><option value="center">center</option><option value="space-between">space-between</option></select><div id="flex-target" class="flex-box"><div class="flex-item">Item 1</div><div class="flex-item">Item 2</div></div><textarea id="css-out" rows="4" readonly></textarea></main><script>function updateFlex(){let dir=document.getElementById('f-dir').value;let jc=document.getElementById('f-jc').value;let target=document.getElementById('flex-target');target.style.flexDirection=dir;target.style.justifyContent=jc;document.getElementById('css-out').value=`.container {
  display: flex;
  flex-direction: ${dir};
  justify-content: ${jc};
}`;}updateFlex();</script></body></html>
