<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto SubtleCrypto PBKDF2 HMAC-SHA512 Studio - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto SubtleCrypto PBKDF2 HMAC-SHA512 Studio","url":"https://salabs.quanxs.com/tools/crypto-subtle-pbkdf2-hmac-sha512.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}button{background:#38bdf8;color:#0f172a;border:none;padding:0.8rem 1.5rem;border-radius:6px;font-weight:bold;cursor:pointer;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">SubtleCrypto PBKDF2 HMAC-SHA512 Studio</h1></header><main class="container"><input type="password" id="pass-in" value="MasterPassphrase512"><input type="text" id="salt-in" value="UniqueSaltSHA512"><input type="number" id="iter-in" value="200000"><button onclick="derivePBKDF2SHA512()">Derive Key (SHA-512)</button><textarea id="hex-out" rows="3" readonly></textarea></main><script>async function derivePBKDF2SHA512(){let pass=document.getElementById('pass-in').value,salt=document.getElementById('salt-in').value,iter=parseInt(document.getElementById('iter-in').value)||200000;if(!pass||!salt)return;try{let enc=new TextEncoder();let keyMaterial=await window.crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveBits"]);let derivedBuf=await window.crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:iter,hash:"SHA-512"},keyMaterial,512);let hex=Array.from(new Uint8Array(derivedBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');document.getElementById('hex-out').value=hex;}catch(e){alert('PBKDF2 Error: '+e.message);}}</script></body></html>
