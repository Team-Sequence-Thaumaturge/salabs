<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Web Crypto ECDSA P-256 Signature Verifier - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Web Crypto ECDSA P-256 Signature Verifier","url":"https://salabs.quanxs.com/tools/crypto-ecdsa-secp256k1-verifier.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea,input{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}.result-box{padding:1rem;border-radius:8px;font-weight:bold;margin-top:1rem;background:#334155;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">ECDSA P-256 Signature Verifier</h1></header><main class="container"><textarea id="jwk-in" rows="4" placeholder="JWK Public Key..."></textarea><textarea id="msg-in" rows="3" placeholder="Payload..."></textarea><input type="text" id="sig-in" placeholder="Base64URL Signature..."><button onclick="verifyECDSA()">Verify ECDSA Signature</button><div id="status-out" class="result-box">Enter JWK, Payload, and Signature to Verify</div></main><script>async function verifyECDSA(){let jwkStr=document.getElementById('jwk-in').value,msgStr=document.getElementById('msg-in').value,sigStr=document.getElementById('sig-in').value.trim(),box=document.getElementById('status-out');if(!jwkStr||!msgStr||!sigStr){box.innerText='Enter JWK, Payload, and Signature to Verify';return;}try{let jwk=JSON.parse(jwkStr);let key=await window.crypto.subtle.importKey("jwk",jwk,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);let rawSig=atob(sigStr.replace(/-/g,'+').replace(/_/g,'/'));let sigBuf=new Uint8Array(rawSig.length);for(let i=0;i<rawSig.length;i++)sigBuf[i]=rawSig.charCodeAt(i);let enc=new TextEncoder();let valid=await window.crypto.subtle.verify({name:"ECDSA",hash:{name:"SHA-256"}},key,sigBuf,enc.encode(msgStr));if(valid){box.style.background='#16a34a';box.innerText='✓ ECDSA P-256 SIGNATURE MATCHED (PASSED)';}else{box.style.background='#dc2626';box.innerText='✕ ECDSA SIGNATURE VERIFICATION FAILED';}}catch(e){box.style.background='#dc2626';box.innerText='Error: '+e.message;}}</script></body></html>
