<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Markdown Table Generator - Quanxs SA Labs</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Markdown Table Generator","url":"https://salabs.quanxs.com/tools/markdown-table-generator.html"}</script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9108438313531011" crossorigin="anonymous"></script><style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;}.container{max-width:1000px;margin:0 auto;background:#1e293b;padding:2rem;border-radius:12px;}textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:1rem;margin-bottom:1rem;box-sizing:border-box;font-family:monospace;}</style></head><body><header><h1 style="color:#38bdf8;text-align:center;">Markdown Table Generator</h1></header><main class="container"><textarea id="csv-input" rows="6" placeholder="Name, Role&#10;Alice, Lead" oninput="generateTable()"></textarea><textarea id="md-output" rows="6" readonly></textarea></main><script>function generateTable(){let t=document.getElementById('csv-input').value.trim();if(!t){document.getElementById('md-output').value='';return;}let lines=t.split('\n').map(l=>l.split(/,|\t/).map(c=>c.trim()));if(lines.length===0)return;let h=lines[0];let hRow='| '+h.join(' | ')+' |';let sRow='| '+h.map(()=>'---').join(' | ')+' |';let dRows=lines.slice(1).map(r=>'| '+r.join(' | ')+' |');document.getElementById('md-output').value=[hRow,sRow,...dRows].join('\n');}</script></body></html>
