<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SA-CP Co-Pilot Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0c10;
      --panel-bg: rgba(18, 22, 32, 0.95);
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: rgba(10, 12, 16, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 0.5rem; }
    .brand-logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #000; font-size: 0.8rem;
    }
    .brand-title { font-size: 0.95rem; font-weight: 700; }
    .badge {
      background: rgba(0, 242, 254, 0.15); color: var(--accent-cyan);
      border: 1px solid rgba(0, 242, 254, 0.3); padding: 0.2rem 0.5rem;
      border-radius: 10px; font-size: 0.7rem; font-weight: 600;
    }
    main {
      flex: 1; display: flex; flex-direction: column;
      width: 100%; padding: 0.75rem; overflow: hidden;
    }
    #chatContainer {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; padding-right: 0.25rem;
    }
    .chat-bubble {
      max-width: 88%; padding: 0.75rem 0.9rem; border-radius: 10px; line-height: 1.45; font-size: 0.88rem;
      border: 1px solid var(--border-color); box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }
    .chat-bubble.user {
      align-self: flex-end; background: linear-gradient(135deg, #1e293b, #0f172a);
      border-color: rgba(79, 172, 254, 0.4); color: #fff;
    }
    .chat-bubble.assistant {
      align-self: flex-start; background: var(--panel-bg); border-color: rgba(0, 242, 254, 0.25);
    }
    .sender-name { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.25rem; }
    .input-area {
      margin-top: 0.75rem; display: flex; gap: 0.5rem; background: var(--panel-bg);
      padding: 0.6rem; border-radius: 10px; border: 1px solid var(--border-color);
    }
    textarea {
      flex: 1; background: transparent; border: none; color: var(--text-main);
      font-size: 0.88rem; resize: none; outline: none; height: 40px;
    }
    button {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #000; border: none; padding: 0 1rem; border-radius: 6px; font-weight: 700;
      cursor: pointer; font-size: 0.85rem; transition: all 0.2s ease;
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-logo">CP</div>
      <div class="brand-title">SA-CP Co-Pilot</div>
    </div>
    <div class="badge">Chrome Side Panel</div>
  </header>

  <main>
    <div id="chatContainer"></div>

    <div class="input-area">
      <textarea id="msgInput" placeholder="시장님의 지침 또는 질문을 입력하세요..."></textarea>
      <button id="sendBtn">사출</button>
    </div>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
